name: 054 - ClosePaw RC11 Hybrid Stop Routing and In-Flight Primary Cancellation

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 053 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID='10339160758'
          EXPECTED_RUN='34821463838'
          EXPECTED_DIGEST='sha256:7ac812724971c083818eeb63e4c7ce3c9e75af6a3da389bb479939122305f274'
          EXPECTED_MANIFEST_SHA='3333a74bdf63517b00f06f88c192e5f49860bf6d9ffe7d5f0a6a723012ead218'
          rm -rf /tmp/053-source /tmp/053-artifact.zip /tmp/053-meta.json
          mkdir -p /tmp/053-source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            -o /tmp/053-meta.json
          python3 - <<'PYMETA'
          import json
          d=json.load(open('/tmp/053-meta.json'))
          if d.get('expired'): raise SystemExit('053 Source of Truth artifact expired')
          if d.get('name')!='053-ClosePaw-RC11-verified-full-source': raise SystemExit(f"wrong artifact name: {d.get('name')}")
          if d.get('digest')!='sha256:7ac812724971c083818eeb63e4c7ce3c9e75af6a3da389bb479939122305f274': raise SystemExit(f"wrong artifact digest: {d.get('digest')}")
          if str((d.get('workflow_run') or {}).get('id'))!='34821463838': raise SystemExit('wrong source run')
          print('053 artifact identity: PASS')
          PYMETA
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/053-artifact.zip
          unzip -q /tmp/053-artifact.zip -d /tmp/053-source
          MANIFEST="$(find /tmp/053-source -type f -name '053-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '053 manifest missing' >&2; exit 1; }
          [ "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA" ] || { echo '053 manifest identity mismatch' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/053-source' ]; then
            rm -rf /tmp/053-normalized && mkdir -p /tmp/053-normalized
            cp -a "$ROOT"/. /tmp/053-normalized/
            rm -rf /tmp/053-source
            mv /tmp/053-normalized /tmp/053-source
          fi
          echo 'Exact verified 053 Source of Truth restored: PASS'

      - name: Verify and activate exact 053 Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/053-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test "$(sha256sum /tmp/053-source/053-postpatch-source-manifest.json | awk '{print $1}')" = '3333a74bdf63517b00f06f88c192e5f49860bf6d9ffe7d5f0a6a723012ead218'
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/053-source/. ./
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads(Path('053-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sha(p)
          if current != expected:
              missing=sorted(set(expected)-set(current)); added=sorted(set(current)-set(expected)); changed=sorted(k for k in set(expected)&set(current) if expected[k]!=current[k])
              raise SystemExit(f'053 manifest mismatch missing={missing[:8]} added={added[:8]} changed={changed[:8]}')
          Path('054-verification-report.txt').write_text(
              'ClosePaw RC11 054 verification report\n'
              'Base: exact verified 053 full-source artifact id=10339160758 run=34821463838.\n'
              'Runtime evidence: the visible Stop control calls ChatViewModel.stopTask(), which only interrupted AgentSession; Hybrid tasks are service-owned and set AgentService.session=null, so Stop was a no-op.\n'
              'Additional cancellation gap: phone-local Primary used blocking OkHttp Call.execute(), which does not promptly observe coroutine Job cancellation.\n'
              'V54 scope: route UI Stop to the active Hybrid task first, retain legacy AgentSession interrupt fallback, and make only the Primary HTTP call cooperatively cancellable.\n'
              'Frozen: V43/V45/V46/V47/V50/V51/V52/V53 navigation and verification, RC8 restore, RC11 transaction safety, V32 timeout configuration, accessibility platform, Brain path, and all Memory files.\n', encoding='utf-8')
          print('053 exact baseline: PASS')
          PYBASE

      - name: Baseline 053 clean compile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 053 clean compile: PASS' >> 054-verification-report.txt

      - name: Freeze protected correctness and memory surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE'
          from pathlib import Path
          import hashlib,json
          def h(b): return hashlib.sha256(b).hexdigest()
          def sf(p): return h(Path(p).read_bytes())
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          def reg(a,b):
              s=eng.find(a); e=eng.find(b,s)
              if s<0 or e<0: raise SystemExit(f'protected region missing: {a} -> {b}')
              return h(eng[s:e].encode())
          protected={
            'rc8_restore':reg('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded('),
            'durable_transaction':reg('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9('),
            'v33_validation':reg('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest('),
            'brain_restore':reg('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings'),
            'brain_send':reg('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9('),
            'navigator_v43':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt'),
            'grammar_v43':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt'),
            'prereq_v45':sf('app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt'),
            'causal_v46':sf('app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt'),
            'work_surface_v47':sf('app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt'),
            'event_v50':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt'),
            'event_v51':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt'),
            'causal_title_v52':sf('app/src/main/kotlin/ai/closepaw/app/CausalWindowTitleV52.kt'),
            'overflow_v53':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53.kt'),
            'rc11':sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
            'transport_v32':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
            'accessibility_platform':sf('app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt'),
            'memory_recaller':sf('app/src/main/kotlin/ai/closepaw/memory/MemoryRecaller.kt'),
            'memory_schema':sf('app/src/main/kotlin/ai/closepaw/memory/MemorySchema.kt'),
            'memory_store':sf('app/src/main/kotlin/ai/closepaw/memory/MemoryStore.kt'),
            'remember_tool':sf('app/src/main/kotlin/ai/closepaw/tool/impl/RememberExperienceTool.kt'),
          }
          Path('054-baseline-critical-hashes.json').write_text(json.dumps(protected,indent=2,sort_keys=True)+'\n')
          print('054 frozen surfaces captured: PASS')
          PYFREEZE

