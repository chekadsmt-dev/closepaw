      - name: Audit 054 stop and cancellation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          vm=Path('app/src/main/kotlin/ai/closepaw/ui/chat/ChatViewModel.kt').read_text()
          svc=Path('app/src/main/kotlin/ai/closepaw/app/AgentService.kt').read_text()
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          call=Path('app/src/main/kotlin/ai/closepaw/app/CancellablePrimaryCallV54.kt').read_text()
          checks={
            'UI Stop routes Hybrid before AgentSession fallback': vm.find('stopActiveHybridTaskFromUi()') < vm.find('val session = sessionProvider()', vm.find('fun stopTask()')),
            'service bridge exists': 'stopActiveHybridTaskFromUi(): Boolean = hybridAgent.stopActiveTaskFromUi()' in svc,
            'Hybrid stop requires active task': 'val task = activeTask ?: return false' in eng,
            'Hybrid stop clears queue': 'stop(clearQueue = true)' in eng[eng.find('fun stopActiveTaskFromUi()'):eng.find('private fun setEnabled',eng.find('fun stopActiveTaskFromUi()'))],
            'Hybrid stop restarts idle worker only': 'if (enabled) ensureWorker()' in eng[eng.find('fun stopActiveTaskFromUi()'):eng.find('private fun setEnabled',eng.find('fun stopActiveTaskFromUi()'))],
            'stop diagnostic exists': 'USER_STOP_V54' in eng,
            'Primary uses cancellable bridge': '.awaitResponseCancellableV54().use' in eng and '.execute().use' not in eng[eng.find('private suspend fun callCustomPrimaryChatV9'):eng.find('private suspend fun',eng.find('private suspend fun callCustomPrimaryChatV9')+20)],
            'OkHttp call cancelled on coroutine cancellation': 'invokeOnCancellation { cancel() }' in call,
            'OkHttp async response path': 'enqueue(object : Callback' in call,
            'V32 timeout builder untouched': Path('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt').read_text().count('readTimeout(callTimeoutMs')==1,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('054 architecture audit failed: '+', '.join(failed))
          with Path('054-verification-report.txt').open('a') as f:
              for k in checks: f.write(k+': PASS\n')
          print('054 stop/cancellation audit: PASS')
          PYAUDIT

