          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT/aapt"
          test -x "$BT/apksigner"
          "$BT/aapt" dump badging "$APK" > 053-apk-badging.txt
          unzip -l "$APK" > 053-apk-contents.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > 053-apksigner-verification.txt 2>&1
          grep -q "package: name='ai.closepaw.rc11c053'" 053-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 053'" 053-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c053" 053-apk-badging.txt
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true' 053-apksigner-verification.txt
          # Preserve the verified native runtime set from 052 byte-for-path; V53 is Kotlin-only.
