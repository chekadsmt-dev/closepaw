      - name: Verify 053 exact source isolation and frozen regions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          base=json.loads(Path('052-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sha(p)
          changed={p for p in set(base)|set(current) if base.get(p)!=current.get(p)}
          expected={
            'app/build.gradle.kts',
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53.kt',
            'app/src/main/res/values/strings.xml',
            'app/src/test/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53Test.kt',
          }
          if changed!=expected:
              raise SystemExit(f'053 isolation failure changed={sorted(changed)}')
          expected_hashes={
            'app/build.gradle.kts':'4b6fca7f59c8f61e12c6c6234aa31487802be1d394bfa1512e0bde429908df81',
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'66d380aa59ff464796817a15b9d4417777d107c57429d030e0622a6a66642cac',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53.kt':'92fa34059e602da10fabf9fef511ae3f1971efa576346918ef172bdb52751f23',
            'app/src/main/res/values/strings.xml':'f5a42b44de2ba5ffc38c8e89439d5cc6ef91961b949ba3899012972969583b6c',
            'app/src/test/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53Test.kt':'74a6042cc16e8c571bf5f03e4aa49b0deb7e76896a7dd95f49394ed5dcedc4c4',
          }
          for p,want in expected_hashes.items():
              got=current.get(p)
              if got!=want: raise SystemExit(f'053 expected hash mismatch {p}: {got} != {want}')
          # Recheck every file/region frozen before the patch. Hybrid is allowed to change only
          # outside the protected RC8/RC11/V33/Brain regions.
          before=json.loads(Path('053-baseline-critical-hashes.json').read_text())
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          def h(b): return hashlib.sha256(b).hexdigest()
          def reg(a,b):
              s=eng.find(a); e=eng.find(b,s)
              if s<0 or e<0: raise SystemExit(f'protected region missing after patch: {a} -> {b}')
              return h(eng[s:e].encode())
          after={
            'rc8_restore':reg('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded('),
            'durable_transaction':reg('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9('),
            'v33_validation':reg('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest('),
            'brain_restore':reg('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings'),
            'brain_send':reg('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9('),
          }
          file_map={
            'navigator_v43':'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt',
            'grammar_v43':'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt',
            'prereq_v45':'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt',
            'causal_v46':'app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt',
            'work_surface_v47':'app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt',
            'event_v50':'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt',
            'event_v51':'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt',
            'causal_title_v52':'app/src/main/kotlin/ai/closepaw/app/CausalWindowTitleV52.kt',
            'agent_service':'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
            'rc11':'app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt',
            'transport':'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt',
            'accessibility_platform':'app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt',
            'memory_recaller':'app/src/main/kotlin/ai/closepaw/memory/MemoryRecaller.kt',
            'memory_schema':'app/src/main/kotlin/ai/closepaw/memory/MemorySchema.kt',
            'memory_store':'app/src/main/kotlin/ai/closepaw/memory/MemoryStore.kt',
            'remember_tool':'app/src/main/kotlin/ai/closepaw/tool/impl/RememberExperienceTool.kt',
          }
          for k,p in file_map.items(): after[k]=sha(p)
          bad=[k for k,v in before.items() if after.get(k)!=v]
          if bad: raise SystemExit(f'053 frozen surface changed: {bad}')
          Path('053-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          if hashlib.sha256(Path('053-postpatch-source-manifest.json').read_bytes()).hexdigest()!='3333a74bdf63517b00f06f88c192e5f49860bf6d9ffe7d5f0a6a723012ead218':
              raise SystemExit('053 final manifest digest mismatch')
          with Path('053-verification-report.txt').open('a') as f:
              f.write('053 exact source isolation + frozen correctness/memory surfaces: PASS\n')
          print('053 source isolation/freeze: PASS')
          PYVERIFY

      - name: Audit 053 overflow architecture contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          helper=Path('app/src/main/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53.kt').read_text()
          tests=Path('app/src/test/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53Test.kt').read_text()
          nav=Path('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt').read_text()
          checks={
            'V43 source remains frozen': Path('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt').read_bytes() and True,
            'overflow only after scan exhaustion': 'scanExhausted: Boolean' in helper and 'if (!scanExhausted' in helper,
            'exact More options semantics': 'More options' in helper and 'resolveDispatchTarget' in helper,
            'fresh V43 remains destination authority': ('deterministicScansV43.remove(key)' in eng and 'deterministicOverflowAttemptsV53.contains(deterministicDecision.key)' in eng and 'DETERMINISTIC_V53_OVERFLOW' in eng and 'TARGET_MISSING_AFTER_OVERFLOW' in eng),
            'one-shot target state': 'deterministicOverflowAttemptsV53' in eng and 'TARGET_MISSING_AFTER_OVERFLOW' in eng,
            'no direct Special access hardcoding': 'Special access' not in helper and 'Special access' not in eng,
            'no Settings-search shortcut': 'ACTION_SEARCH_SETTINGS' not in helper,
            'ambiguity fail closed': 'Decision.Ambiguous' in helper and 'AMBIGUOUS_OVERFLOW' in eng,
            'test unique description': 'opens unique More options by exact description' in tests,
            'test ambiguity': 'fails closed when two distinct overflow controls are present' in tests,
            'test one shot': 'one shot prevents reopening overflow' in tests,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('053 architecture audit failed: '+', '.join(failed))
          with Path('053-verification-report.txt').open('a') as f:
              for k in checks: f.write(k+': PASS\n')
          print('053 architecture audit: PASS')
          PYAUDIT

