name: 053 - ClosePaw RC11 Deterministic Overflow Discovery (Audit Fix)

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 052 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID='10322992194'
          EXPECTED_RUN='34773542462'
          EXPECTED_DIGEST='sha256:fe0a72ecc08ba9093670cdee516c64498aea2b564efd038fd430fdf03afc1d5b'
          EXPECTED_MANIFEST_SHA='836c4e3f5eb1e243f07788a9efcccdbd97ef6194199ca1cb0b4a78017cfd2a40'
          rm -rf /tmp/052-source /tmp/052-artifact.zip /tmp/052-meta.json
          mkdir -p /tmp/052-source
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"             -o /tmp/052-meta.json
          python3 - <<'PYMETA'
          import json,os
          d=json.load(open('/tmp/052-meta.json'))
          if d.get('expired'):
              raise SystemExit('052 Source of Truth artifact is expired')
          if d.get('name')!='052-ClosePaw-RC11-verified-full-source':
              raise SystemExit(f"wrong artifact name: {d.get('name')}")
          if d.get('digest')!=os.environ.get('EXPECTED_DIGEST','sha256:fe0a72ecc08ba9093670cdee516c64498aea2b564efd038fd430fdf03afc1d5b'):
              raise SystemExit(f"wrong artifact digest: {d.get('digest')}")
          run=(d.get('workflow_run') or {}).get('id')
          if str(run)!='34773542462':
              raise SystemExit(f'wrong source run: {run}')
          print('052 artifact metadata identity: PASS')
          PYMETA
          curl -fsSL -L             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             -o /tmp/052-artifact.zip
          unzip -q /tmp/052-artifact.zip -d /tmp/052-source
          MANIFEST="$(find /tmp/052-source -type f -name '052-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '052 manifest missing' >&2; exit 1; }
          [ "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA" ] || { echo '052 manifest identity mismatch' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/052-source' ]; then
            rm -rf /tmp/052-normalized && mkdir -p /tmp/052-normalized
            cp -a "$ROOT"/. /tmp/052-normalized/
            rm -rf /tmp/052-source
            mv /tmp/052-normalized /tmp/052-source
          fi
          echo 'Exact verified 052 Source of Truth restored: PASS'

      - name: Verify and activate exact 052 Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/052-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/052-source/052-postpatch-source-manifest.json
          test "$(sha256sum /tmp/052-source/052-postpatch-source-manifest.json | awk '{print $1}')" = '836c4e3f5eb1e243f07788a9efcccdbd97ef6194199ca1cb0b4a78017cfd2a40'
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/052-source/. ./
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads(Path('052-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sha(p)
          if current != expected:
              missing=sorted(set(expected)-set(current))
              added=sorted(set(current)-set(expected))
              changed=sorted(k for k in set(expected)&set(current) if expected[k]!=current[k])
              raise SystemExit(f'052 manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          critical={
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'179c2be90489a1540cbfdae4883df3684a5a5023303dedb4b7e1298ec4600419',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt':'945670dd4f8818b10933245a27298dfe0de4b9da590c54f06a9ba4657e11301f',
            'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt':'b1be3b8953bc0620a921d6e639e68ee1ae4a61952d20a52943da148a3edbee37',
            'app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt':'eed7423a080b1d8b8b8a40ac943f88a62db658c5eb12f9a638fc3974cc938e73',
            'app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt':'683a9f6d8b5c8a676ba00bb9cda4cf954314470afae4a9b2bf1ab3862f6ea47e',
            'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt':'a75c7ea133c1100e229debf071e0d4063a1c9cb1c3cee3191d2ca4f37f2a5894',
            'app/src/main/kotlin/ai/closepaw/app/CausalWindowTitleV52.kt':'31074f2744d71b78277d8fa08e95a460e0d4043c39fcc3a9ce93f1e33620485f',
            'app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt':'d9595d75a141c5c843195878fb13c0f32ab2121cabab65903026fd3b2a189a25',
            'app/src/main/kotlin/ai/closepaw/memory/MemoryRecaller.kt':'cf71beb7d1e6e0b8d4ab1117e1d4ebb5d3f891f3ee1ac0ae96a4ed66f8e59984',
            'app/src/main/kotlin/ai/closepaw/memory/MemorySchema.kt':'c05a45adeba8f2bb92054dd8cf9f26d364ece5a158823cb9919cea1e86819311',
            'app/src/main/kotlin/ai/closepaw/memory/MemoryStore.kt':'471bdb194e9802d9b210a8985ec6d980d1689407be2ac07c9af306939f718d5e',
            'app/src/main/kotlin/ai/closepaw/tool/impl/RememberExperienceTool.kt':'5bfc8dba5af81342e93f6c31d093c495a01416266ebf68eecd6e472a0e4b8425',
          }
          for p,want in critical.items():
              got=sha(p)
              if got!=want: raise SystemExit(f'052 critical mismatch {p}: {got} != {want}')
          Path('053-verification-report.txt').write_text(
              'ClosePaw RC11 053 verification report\n'
              'Base: exact verified 052 full-source artifact id=10322992194 run=34773542462.\n'
              'Runtime evidence: Settings -> Apps is healthy, while Samsung Special access lives behind the exact More options overflow control and V43 currently exhausts list scrolling before escalation.\n'
              'V53 scope: additive one-shot overflow discovery after frozen V43 bounded exact-target scan exhaustion; fresh V43 re-observation remains the sole authority for clicking the requested destination.\n'
              'Memory: existing User/Device/App memory files are intentionally frozen in V53; Hybrid memory integration remains a later gated workstream and is not part of correctness navigation.\n',
              encoding='utf-8')
          print('052 exact baseline verification: PASS')
          PYBASE

      - name: Baseline 052 clean compile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 052 clean compile: PASS' >> 053-verification-report.txt

      - name: Freeze protected correctness and memory surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE'
          from pathlib import Path
          import hashlib,json
          def h(b): return hashlib.sha256(b).hexdigest()
          def sf(p): return h(Path(p).read_bytes())
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          def reg(a,b):
              s=eng.find(a); e=eng.find(b,s)
              if s<0 or e<0: raise SystemExit(f'protected region missing: {a} -> {b}')
              return h(eng[s:e].encode())
          protected={
            'rc8_restore':reg('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded('),
            'durable_transaction':reg('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9('),
            'v33_validation':reg('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest('),
            'brain_restore':reg('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings'),
            'brain_send':reg('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9('),
            'navigator_v43':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt'),
            'grammar_v43':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt'),
            'prereq_v45':sf('app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt'),
            'causal_v46':sf('app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt'),
            'work_surface_v47':sf('app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt'),
            'event_v50':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt'),
            'event_v51':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt'),
            'causal_title_v52':sf('app/src/main/kotlin/ai/closepaw/app/CausalWindowTitleV52.kt'),
            'agent_service':sf('app/src/main/kotlin/ai/closepaw/app/AgentService.kt'),
            'rc11':sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
            'transport':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
            'accessibility_platform':sf('app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt'),
            'memory_recaller':sf('app/src/main/kotlin/ai/closepaw/memory/MemoryRecaller.kt'),
            'memory_schema':sf('app/src/main/kotlin/ai/closepaw/memory/MemorySchema.kt'),
            'memory_store':sf('app/src/main/kotlin/ai/closepaw/memory/MemoryStore.kt'),
            'remember_tool':sf('app/src/main/kotlin/ai/closepaw/tool/impl/RememberExperienceTool.kt'),
          }
          Path('053-baseline-critical-hashes.json').write_text(json.dumps(protected,indent=2,sort_keys=True)+'\n')
          print('053 protected surfaces frozen: PASS')
          PYFREEZE

