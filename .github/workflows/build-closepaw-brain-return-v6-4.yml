name: Build ClosePaw Brain Return v6.4

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Brain Return v6.3 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-closepaw-brain-return-v6-3.yml')
          if not workflow.exists():
              raise SystemExit('Missing required base workflow: build-closepaw-brain-return-v6-3.yml')

          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []

              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  body.append('' if not line.strip() else line[body_indent:])

              result = subprocess.run(
                  ['bash'],
                  input='\n'.join(body) + '\n',
                  text=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f'Base step failed: {step_name}')

          run_step('Apply Brain Return v6.1 source')
          run_step('Fix Kotlin compile regression robustly')
          print('V6.3 SOURCE: PASS')
          PY

      - name: Apply Brain Return v6.4 runtime fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_v64.py
          python3 -m py_compile /tmp/patch_v64.py
          python3 /tmp/patch_v64.py

      - name: Patch side-by-side identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          old = 'applicationIdSuffix = ".smt"'
          if old not in text:
              raise SystemExit('applicationIdSuffix anchor missing')
          text = text.replace(old, 'applicationIdSuffix = ".brainreturn64"', 1)

          if 'versionNameSuffix = "-smt"' in text:
              text = text.replace(
                  'versionNameSuffix = "-smt"',
                  'versionNameSuffix = "-brain-return-v6.4"',
                  1,
              )
          gradle.write_text(text, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s, n = re.subn(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">ClosePaw Brain Return v6.4</string>',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('app_name anchor missing')
          strings.write_text(s, encoding='utf-8')
          print('IDENTITY: PASS')
          PY

      - name: Gate 1 - runtime source invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          checks = [
              'selectedPathCandidates = selectedConversationCandidates(sidebar)',
              '"Find chat"',
              'automatic Brain return failed; ',
              'inferWorkChatTitleFromGoal(activeTask?.goal.orEmpty())',
              'MAX_BRAIN_TURNS = 80',
              'BRAIN_TIMEOUT_MS = 240_000L',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('Runtime invariant failure: ' + ', '.join(missing))

          if 'substringAfter(label, "", ignoreCase = true)' in s:
              raise SystemExit('Old Kotlin compile regression returned')

          print('GATE 1 runtime source invariants: PASS')
          PY

      - name: Gate 2 - compile Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Gate 3 - assemble APK
        run: ./gradlew assembleDebug

      - name: Gate 4 - APK integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not apk.exists():
              raise SystemExit('APK missing')
          if apk.stat().st_size < 1_000_000:
              raise SystemExit('APK unexpectedly small')

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for required in [
                  'AndroidManifest.xml',
                  'classes.dex',
                  'resources.arsc',
              ]:
                  if required not in names:
                      raise SystemExit('APK missing ' + required)
              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)

          print(f'GATE 4 APK integrity: PASS ({apk.stat().st_size} bytes)')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Brain-Return-v6.4-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
