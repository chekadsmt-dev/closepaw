      - name: Verify 072 scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('.')
          base=json.loads(Path('072-baseline-source-manifest.json').read_text())
          now={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  now[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed=sorted(k for k in set(base)&set(now) if base[k]!=now[k])
          added=sorted(set(now)-set(base)); removed=sorted(set(base)-set(now))
          expected_changed=sorted([
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
          ])
          expected_added=sorted([
              'app/src/main/kotlin/ai/closepaw/app/ControlPlaneLeaseV72.kt',
              'app/src/test/kotlin/ai/closepaw/app/ControlPlaneLeaseV72Test.kt',
          ])
          assert changed==expected_changed, (changed, expected_changed)
          assert added==expected_added, (added, expected_added)
          assert removed==[], removed
          orch=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          service=Path('app/src/main/kotlin/ai/closepaw/app/AgentService.kt').read_text()
          policy=Path('app/src/main/kotlin/ai/closepaw/app/ControlPlaneLeaseV72.kt').read_text()
          assert 'LOCAL_CONTROL_LEASE_HELD_V72' in orch
          assert 'LOCAL_CONTROL_LEASE_RELEASED_V72' in orch
          assert 'start(forceInitialUiAcquireV72 = true)' in orch
          assert 'isClosePawControlSurfaceForegroundV72' in service
          assert 'SMT' not in policy and '00 —' not in policy and 'Finance' not in policy
          assert 'versionNameSuffix = "-rc11-c072"' in Path('app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 072' in Path('app/src/main/res/values/strings.xml').read_text()
          print('072 scope/invariants: PASS')
          PYVERIFY
          echo '072 scope/invariants: PASS' >> 072-verification-report.txt

