      - name: Verify post-test source and package 072
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          manifest={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  manifest[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('072-postpatch-source-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '072 APK missing' >&2; exit 1; }
          mkdir -p /tmp/072-apk /tmp/072-source-out
          cp "$APK" /tmp/072-apk/ClosePaw-0.1.0-rc11-c072-debug.apk
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gradle' --exclude='app/build' --exclude='build' ./ /tmp/072-source-out/
          sha256sum /tmp/072-apk/ClosePaw-0.1.0-rc11-c072-debug.apk | tee 072-apk-sha256.txt
          cp 072-apk-sha256.txt /tmp/072-source-out/
          cp 072-verification-report.txt /tmp/072-source-out/

