        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '077 compile + unit tests + assemble: PASS' >> 077-verification-report.txt

      - name: Verify APK and source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          e=json.loads(Path('077-postpatch-source-manifest.json').read_text()); a={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  a[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert a==e
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK" > 077-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 077-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c077'" 077-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 077'" 077-apk-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > 077-apksigner.txt
          sha256sum "$APK" > 077-apk-sha256.txt
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo '077 APK/source identity: PASS' >> 077-verification-report.txt

      - name: Prepare verified full source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/077-source && mkdir /tmp/077-source
          rsync -a --exclude='.git' --exclude='.github' --exclude='app/build' ./ /tmp/077-source/
          test "$(sha256sum /tmp/077-source/077-postpatch-source-manifest.json | awk '{print $1}')" = '807796064aac089768089bdb2723d966ea57ef4b1b40fb9fafd8f5c829b8b335'

      - name: Upload verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 077-ClosePaw-RC11-verification-proof
          path: |
            077-verification-report.txt
            077-baseline-source-manifest.json
            077-postpatch-source-manifest.json
            077-apk-badging.txt
            077-apksigner.txt
            077-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified full source
        uses: actions/upload-artifact@v4
        with:
          name: 077-ClosePaw-RC11-verified-full-source
          path: /tmp/077-source/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 077-ClosePaw-RC11-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
