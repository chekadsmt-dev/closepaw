      - name: Verify isolation and 077 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import hashlib,json
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
              'app/src/main/kotlin/ai/closepaw/app/ControlPlaneLeaseV72.kt',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentUiEvent.kt',
              'app/src/main/kotlin/ai/closepaw/app/LocalControlSurfaceRegistryV75.kt',
              'app/src/main/kotlin/ai/closepaw/app/MainActivity.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/RouterControlPolicyV77.kt',
              'app/src/main/kotlin/ai/closepaw/ui/chat/ChatViewModel.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ControlPlaneLeaseV72Test.kt',
              'app/src/test/kotlin/ai/closepaw/app/LocalControlSurfaceRegistryV75Test.kt',
              'app/src/test/kotlin/ai/closepaw/app/RouterControlPolicyV77Test.kt',
          }
          base=json.loads(Path('077-baseline-source-manifest.json').read_text()); cur={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  cur[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed={k for k in set(base)|set(cur) if base.get(k)!=cur.get(k)}
          assert changed==allowed, (sorted(changed-allowed),sorted(allowed-changed))
          Path('077-postpatch-source-manifest.json').write_text(json.dumps(cur,indent=2,sort_keys=True)+'\n')
          got=hashlib.sha256(Path('077-postpatch-source-manifest.json').read_bytes()).hexdigest()
          assert got=='807796064aac089768089bdb2723d966ea57ef4b1b40fb9fafd8f5c829b8b335', got
          orch=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          store=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt').read_text()
          proto=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58.kt').read_text()
          policy=Path('app/src/main/kotlin/ai/closepaw/app/RouterControlPolicyV77.kt').read_text()
          agent=Path('app/src/main/kotlin/ai/closepaw/app/AgentService.kt').read_text()
          ev=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentUiEvent.kt').read_text()
          vm=Path('app/src/main/kotlin/ai/closepaw/ui/chat/ChatViewModel.kt').read_text()
          assert 'START_ALREADY_RUNNING_V77' in orch
          assert 'START_BASELINE_PRIMED_V77' in orch
          assert 'RECONCILE_LOOP_FAIL_CLOSED_V77' in orch
          assert 'STOP_CANCELLED_ROUTES_V77' in orch
          assert 'cancelNonTerminalRoutesV77' in store
          assert 'explicit_start_baseline_required_v77' in store
          assert 'RouteStateV58.CANCELLED' in proto
          assert 'MAX_RECONCILE_UNKNOWN_ATTEMPTS' in policy
          assert 'HybridUiEvent.ControlCommandSubmitted' in agent
          assert 'HybridUiEvent.StatusMessage' in agent
          assert 'HybridUiEvent.ControlCommandSubmitted' in vm
          assert 'StatusMessage' in ev
          assert 'versionNameSuffix = "-rc11-c077"' in Path('app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 077' in Path('app/src/main/res/values/strings.xml').read_text()
          PYAUDIT
          echo '077 isolation + stop/start/loop invariants: PASS' >> 077-verification-report.txt

