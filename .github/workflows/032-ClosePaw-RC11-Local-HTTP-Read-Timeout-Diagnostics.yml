          python3 - <<'PYAUDIT032'
          from pathlib import Path
          import hashlib, json

          baseline = json.loads(Path('032-baseline-source-manifest.json').read_text(encoding='utf-8'))
          allowed_changed = {
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
              'app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt',
              'app/build.gradle.kts',
