          +
          +private fun addDirectoryToZipV32(zip: ZipOutputStream, directory: File?, zipPrefix: String) {
          +    if (directory == null || !directory.exists()) return
          +    val root = directory.canonicalFile
          +    root.walkTopDown()
          +        .filter { it.isFile }
          +        .forEach { file ->
          +            val canonical = file.canonicalFile
          +            if (!canonical.path.startsWith(root.path + File.separator)) return@forEach
          +            val relative = canonical.relativeTo(root).invariantSeparatorsPath
          +            val entryName = "$zipPrefix/$relative"
          +            zip.putNextEntry(ZipEntry(entryName))
          +            canonical.inputStream().use { input -> input.copyTo(zip) }
          +            zip.closeEntry()
          +        }
          +}
