          with Path('032-verification-report.txt').open('a', encoding='utf-8') as f:
              f.write('Source isolation gate: PASS\n')
              f.write('Frozen RC8/RC11/routing/durable hashes: PASS\n')
              f.write('031 Fast Planner contract preserved: PASS\n')
              f.write('Explicit Local Server readTimeout = 180s: PASS\n')
              f.write('On-device Primary HTTP diagnostics: PASS\n')
              f.write('System & Debug diagnostics ZIP export: PASS\n')
          print('032 SOURCE ISOLATION + ROOT-CAUSE AUDIT: PASS')
          PYAUDIT032

      - name: 032 clean Kotlin compile gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo '032 clean Kotlin compile: PASS' >> 032-verification-report.txt

      - name: 032 unit tests and clean rebuild
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '032 unit tests: PASS' >> 032-verification-report.txt
          echo '032 debug APK rebuild: PASS' >> 032-verification-report.txt

      - name: 032 APK identity integrity native-runtime and signature gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK, found ${#APKS[@]}" >&2
            exit 1
          fi
          APK="${APKS[0]}"
          unzip -tq "$APK" >/dev/null
          SIZE="$(stat -c %s "$APK")"
          if [ "$SIZE" -lt 50000000 ]; then
            echo "APK unexpectedly small: $SIZE bytes" >&2
            exit 1
          fi

          CONTENTS="$(zipinfo -1 "$APK")"
          for ENTRY in \
            AndroidManifest.xml \
            classes.dex \
            lib/arm64-v8a/libllama.so \
            lib/arm64-v8a/libggml.so \
            lib/arm64-v8a/libinference_engine.so \
            lib/arm64-v8a/libinference_engine_jni.so \
            lib/arm64-v8a/libinference_engine_llamacpp_backend.so
          do
            if ! grep -Fxq "$ENTRY" <<<"$CONTENTS"; then
              echo "Required APK entry missing: $ENTRY" >&2
              exit 1
            fi
          done

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='ai.closepaw.rc11c032'" <<<"$BADGING"
          grep -Fq "application-label:'ClosePaw RC11 032'" <<<"$BADGING"
          grep -Fq "sdkVersion:'31'" <<<"$BADGING"
          grep -Fq "targetSdkVersion:'36'" <<<"$BADGING"

          "$APKSIGNER" verify --verbose "$APK" > 032-apksigner-verification.txt
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "APK path: $APK"
            echo "APK size bytes: $SIZE"
            echo "APK SHA256: $APK_SHA"
            echo 'APK ZIP integrity: PASS'
            echo 'APK package identity ai.closepaw.rc11c032: PASS'
            echo 'APK app label ClosePaw RC11 032: PASS'
            echo 'minSdk 31 / targetSdk 36: PASS'
            echo 'arm64 local-inference runtime libraries: PASS'
            echo 'APK signature verification: PASS'
          } >> 032-verification-report.txt
          echo "032 APK FULL INTEGRITY GATE: PASS | size=$SIZE | sha256=$APK_SHA"

      - name: Write 032 runtime diagnostic instructions
        if: success()
        shell: bash
        run: |
          cat > 032-runtime-diagnostic-instructions.txt <<'EOF032TEST'
          ClosePaw RC11 032 Local HTTP read-timeout diagnostic
          ====================================================

          Why 032 exists:
          031 gave the Local Server a 180s callTimeout but left OkHttp readTimeout at its
          short default. Phone-local inference observed in the real server log took about
          20s for 608 prompt tokens + 63 output tokens, so the client could time out while
          llama.cpp continued to completion.

          032 changes ONLY the custom Local Server transport/debug surface:
          - explicit readTimeout = 180s
          - callTimeout remains 180s
          - bounded Primary HTTP diagnostic log
          - System & Debug -> Export Diagnostics ZIP

          Keep your current LLM AI Server model/performance settings unchanged for this test.
          External Chat Brain: OFF.

          Test:
          Open Settings.
          Stop when Settings is visible.

          If it still fails:
          1. Open ClosePaw -> System & Debug.
          2. Tap Export Diagnostics ZIP.
          3. Save ClosePaw-032-diagnostics.zip.
          4. Send that ZIP together with the LLM AI Server log from the same run.

          Expected hybrid-primary-latest.log sequence on success:
          REQUEST_START
          RESPONSE_HEADERS
          RESPONSE_BODY_DONE
          RESPONSE_PARSED
          EOF032TEST

      - name: Upload 032 verification proof
        if: always()
