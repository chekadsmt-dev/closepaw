              'app/src/test/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32Test.kt',
          }

          current = {}
          for p in sorted(Path('app').rglob('*')):
              if not p.is_file() or p.as_posix().startswith('app/build/'):
                  continue
              current[p.as_posix()] = hashlib.sha256(p.read_bytes()).hexdigest()

          unexpected = []
          all_paths = set(baseline) | set(current)
          for rel in sorted(all_paths):
              before = baseline.get(rel)
              after = current.get(rel)
              if before == after:
                  continue
              if before is None and rel in allowed_added:
                  continue
              if before is not None and after is not None and rel in allowed_changed:
                  continue
              unexpected.append((rel, before, after))
          if unexpected:
              raise SystemExit('032 changed an unapproved source/config path: ' + repr(unexpected[:20]))

          for rel in allowed_changed:
              if baseline.get(rel) == current.get(rel):
                  raise SystemExit('032 expected changed path did not change: ' + rel)
          for rel in allowed_added:
              if rel not in current:
                  raise SystemExit('032 expected added path missing: ' + rel)

          engine_path = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt')
          engine = engine_path.read_text(encoding='utf-8')
          transport = Path('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt').read_text(encoding='utf-8')
          ui = Path('app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')

          # Root-cause contract: the 031 client set only callTimeout; 032 must explicitly
          # raise readTimeout above OkHttp's short default for phone-local inference.
          required_transport = [
              'PrimaryLocalHttpTransportV32.create(PRIMARY_CUSTOM_HTTP_TIMEOUT_MS)',
              'PRIMARY_LOCAL_RESPONSE_V32',
              'REQUEST_START|endpoint=',
              'RESPONSE_HEADERS|code=',
              'RESPONSE_BODY_DONE|code=',
              'HTTP_ERROR|elapsedMs=',
          ]
          missing = [x for x in required_transport if x not in engine]
          if missing:
              raise SystemExit('032 engine transport/diagnostic contract incomplete: ' + ', '.join(missing))
          helper_required = [
              '.readTimeout(callTimeoutMs, TimeUnit.MILLISECONDS)',
              '.callTimeout(callTimeoutMs, TimeUnit.MILLISECONDS)',
          ]
          missing = [x for x in helper_required if x not in transport]
          if missing:
              raise SystemExit('032 explicit HTTP timeout helper incomplete: ' + ', '.join(missing))
          if 'OkHttpClient.Builder()\n            .callTimeout(PRIMARY_CUSTOM_HTTP_TIMEOUT_MS' in engine:
              raise SystemExit('032 still uses 031 callTimeout-only custom Primary client')

          # 031 Fast Planner behavior must remain present and unchanged in contract.
          for token in [
              'MAX_PRIMARY_UI_NODES = 16',
              'MAX_PRIMARY_UI_CHARS = 2_000',
              'MAX_PRIMARY_HISTORY = 2',
              'PRIMARY_CUSTOM_HTTP_TIMEOUT_MS = 180_000L',
              'PRIMARY_CUSTOM_MAX_OUTPUT_TOKENS = 64L',
              'CP_PRIMARY_V29',
              'REQ|$requestId|<ACTION>',
              'PrimaryCompactPlanV29.parseOrNull',
          ]:
              if token not in engine:
                  raise SystemExit('032 lost verified 031 Fast Planner token: ' + token)

          # Export exists without changing task routing or execution semantics.
          for token in [
              'Export Diagnostics ZIP',
              'ActivityResultContracts.CreateDocument("application/zip")',
              'exportDiagnosticsZipV32',
              'closepaw-diagnostics',
              'inspection-trace',
          ]:
