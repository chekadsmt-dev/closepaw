            032-verification-report.txt
            032-baseline-source-manifest.json
            032-postpatch-source-manifest.json
            032-baseline-critical-hashes.json
          if-no-files-found: warn

      - name: Upload 032 verified FULL source snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
