              end = engine.find(end_token, start)
              if end < 0: raise SystemExit('032 critical end anchor missing: ' + end_token)
              return engine[start:end].encode()
          current_critical = {
              'routing_execution': shab(region('val planQueue = mutableListOf<HybridAction>()', 'finishFailure("Bounded recovery stopped after')),
              'rc8_restore': shab(region('// RC8: only strong identity evidence may authorize a restore-side navigation.', 'private suspend fun restoreSidebarShapeIfNeeded(')),
              'durable_transaction': shab(region('private suspend fun executeActionTransactionV9(', 'private fun receiptHistoryLineV9(')),
              'rc11_policy_file': hashlib.sha256(Path('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt').read_bytes()).hexdigest(),
          }
          if current_critical != expected_critical:
              raise SystemExit('032 modified frozen RC8/RC11/routing/durable regions')

          # Identity only advances 031 -> 032.
          if 'applicationIdSuffix = ".rc11c032"' not in gradle:
              raise SystemExit('032 application id suffix missing')
          if 'versionNameSuffix = "-rc11-c032"' not in gradle:
