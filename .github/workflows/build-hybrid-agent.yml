name: Build ClosePaw Hybrid Agent

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Hybrid Agent patch
        shell: bash
        run: |
          python3 - <<'PY'
          
          from pathlib import Path
          import base64
          
          ROOT = Path('.')
          APP = ROOT / 'app/src/main/kotlin/ai/closepaw/app'
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)
          
          protocol = base64.b64decode('').decode('utf-8')
          engine = base64.b64decode('').decode('utf-8')
          (APP / 'HybridAgentProtocol.kt').write_text(protocol, encoding='utf-8')
          (APP / 'HybridAgentEngine.kt').write_text(engine, encoding='utf-8')
          
          agent_path = APP / 'AgentService.kt'
          agent = agent_path.read_text(encoding='utf-8')
          
          if 'private val hybridAgent by lazy { HybridAgentEngine(this) }' not in agent:
              anchor = '    private val smtRouter by lazy { SmtRouter(this) }\n'
              insert = anchor + '''
              private val hybridAgent by lazy { HybridAgentEngine(this) }
          
              internal fun handleHybridInput(text: String): Boolean {
                  if (!isServiceActive) return false
                  return hybridAgent.handleInput(text)
              }
          
              internal fun publishHybridStatus(status: String) {
                  updateStatus(status)
              }
          '''
              agent = replace_once(agent, anchor, insert, 'AgentService hybrid field')
          
          if 'hybridAgent.stop(clearQueue = true)' not in agent:
              anchor = '        if (smtRouter.isRunning) smtRouter.stop()\n'
              agent = replace_once(
                  agent,
                  anchor,
                  anchor + '        hybridAgent.stop(clearQueue = true)\n',
                  'AgentService onDestroy stop',
              )
          
          stop_anchor = '''    fun stopAgent() {
                  smtRouter.stop()
          '''
          if stop_anchor in agent and '''    fun stopAgent() {
                  smtRouter.stop()
                  hybridAgent.stop(clearQueue = true)
          ''' not in agent:
              agent = replace_once(
                  agent,
                  stop_anchor,
                  stop_anchor + '        hybridAgent.stop(clearQueue = true)\n',
                  'AgentService stopAgent',
              )
          
          agent_path.write_text(agent, encoding='utf-8')
          
          main_path = APP / 'MainActivity.kt'
          main = main_path.read_text(encoding='utf-8')
          
          if 'HYBRID AGENT INTERCEPT' not in main:
              anchor = '        if (!validateCloudKeysForSelectedModels()) return\n'
              hybrid_block = '''        /*
                   * HYBRID AGENT INTERCEPT
                   *
                   * The custom build uses the deterministic Android executor by default.
                   * ClosePaw's configured LLM/API is bypassed for Hybrid Agent tasks.
                   */
                  val hybridShouldHandle =
                      HybridAgentEngine.isEnabled(this) ||
                      HybridAgentEngine.isControlCommand(text)
          
                  if (hybridShouldHandle) {
                      val hybridService = AgentService.instance
          
                      if (hybridService == null) {
                          pendingAutoStartGoal = text
                          Toast.makeText(
                              this,
                              "Please enable the Accessibility Service",
                              Toast.LENGTH_LONG
                          ).show()
                          openAccessibilitySettings(this)
                          return
                      }
          
                      if (hybridService.handleHybridInput(text)) return
                  }
          
          '''
              main = replace_once(main, anchor, hybrid_block + anchor, 'MainActivity hybrid intercept')
          
          if 'val hybridPending =' not in main:
              old_overlay = '''        if (
                      !Settings.canDrawOverlays(
                          this
                      )
                  ) {
                      return
                  }
          
                  /*
                   * SMT Router commands do not need cloud credentials.
                   */
          '''
              new_overlay = '''        val hybridPending =
                      HybridAgentEngine.isEnabled(this) ||
                      HybridAgentEngine.isControlCommand(pendingGoal)
          
                  if (
                      !hybridPending &&
                      !Settings.canDrawOverlays(
                          this
                      )
                  ) {
                      return
                  }
          
                  /*
                   * SMT Router and Hybrid Agent commands do not need cloud credentials.
                   */
          '''
              main = replace_once(main, old_overlay, new_overlay, 'MainActivity pending overlay gate')
          
          old_condition = '''        if (
                      !isSmtRouterCommand &&
                      findMissingCloudKeys(
          '''
          new_condition = '''        if (
                      !isSmtRouterCommand &&
                      !hybridPending &&
                      findMissingCloudKeys(
          '''
          if old_condition in main:
              main = replace_once(main, old_condition, new_condition, 'MainActivity pending credential gate')
          
          main_path.write_text(main, encoding='utf-8')
          
          print('Hybrid Agent patch applied successfully')
          PY

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Hybrid-Agent-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
