      - name: Verify 071 scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCOPE'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('071-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/GenericOrchestrationV70.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV70Test.kt',
              'app/src/test/kotlin/ai/closepaw/app/GenericOrchestrationV70Test.kt',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'071 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')
          a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          st=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt').read_text()
          g=Path('app/src/main/kotlin/ai/closepaw/app/GenericOrchestrationV70.kt').read_text()
          checks={
              'durable route lease': 'nonTerminalRoutesV70' in st and 'UI_TRANSACTION_LEASE_HELD_V70' in o,
              'cooldown does not release lease': 'CoolDown' not in o and 'hasNonTerminalRouteV70' in st,
              'post-send receipt': 'verifyPreparedSendV70' in a and 'SEND_VERIFIED_V70' in o,
              'response-correlated recovery': 'correlatedAssistantResponseAtBottomV70' in a and 'SEND_RECONCILED_BY_RESPONSE_V70' in o,
              'worker response fallback': 'assistant-geometry-v70' in a and 'RESULT_CAPTURED_V70' in o,
              'manager decision contract': 'UI_DECISION_REQUEST' in g and 'UI_DECISION' in g and 'OrchestrationAuthorityV70' in g,
              'generic core no SMT': 'SMT' not in g and '00 — SMT' not in g,
              'legacy marker safety retained': 'correlationMarkerMatchesV65' in a,
              'version 071': 'versionNameSuffix = "-rc11-c071"' in Path('app/build.gradle.kts').read_text(),
              'label 071': 'ClosePaw RC11 071' in Path('app/src/main/res/values/strings.xml').read_text(),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f'071 invariant audit failed: {bad}')
          Path('071-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('071-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('071-postpatch-manifest-sha256.txt').write_text(sha+'  071-postpatch-source-manifest.json\n')
          print('071 scope/invariant audit: PASS',sha)
          with Path('071-verification-report.txt').open('a') as f: f.write(f'071 postpatch source manifest SHA-256: {sha}\n')
          PYSCOPE

      - name: Full clean compile tests and assemble 071
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '071 clean compile + full unit tests + assemble: PASS' >> 071-verification-report.txt

      - name: Verify post-test source identity and APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('071-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected: raise SystemExit('071 production source changed during build/tests')
          print('071 post-test source identity: PASS')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '071 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 071-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 071-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c071'" 071-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 071'" 071-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 071-apksigner.txt
          sha256sum "$APK" > 071-apk-sha256.txt
          cp "$APK" ClosePaw-0.1.0-rc11-c071-debug.apk
          echo '071 APK identity/signature: PASS' >> 071-verification-report.txt

      - name: Package verified 071 full source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/071-full-source
          mkdir -p /tmp/071-full-source
          rsync -a --exclude='.git' --exclude='.github' --exclude='app/build' --exclude='*.apk' ./ /tmp/071-full-source/
          test -f /tmp/071-full-source/071-postpatch-source-manifest.json
          echo '071 full source package prepared: PASS' >> 071-verification-report.txt

      - name: Upload 071 verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 071-ClosePaw-RC11-verification-proof
          path: |
            071-verification-report.txt
            071-postpatch-source-manifest.json
            071-postpatch-manifest-sha256.txt
            071-apk-badging.txt
            071-apksigner.txt
            071-apk-sha256.txt
          if-no-files-found: error

      - name: Upload 071 verified full source
        uses: actions/upload-artifact@v4
        with:
          name: 071-ClosePaw-RC11-verified-full-source
          path: /tmp/071-full-source/
          if-no-files-found: error
          retention-days: 90

      - name: Upload 071 APK
        uses: actions/upload-artifact@v4
        with:
          name: 071-ClosePaw-RC11-APK
          path: ClosePaw-0.1.0-rc11-c071-debug.apk
          if-no-files-found: error
