          SIZE="$(stat -c %s "$APK")"; [ "$SIZE" -gt 50000000 ] || { echo 'APK too small' >&2; exit 1; }
          CONTENTS="$(zipinfo -1 "$APK")"
          for E in AndroidManifest.xml classes.dex lib/arm64-v8a/libllama.so lib/arm64-v8a/libggml.so lib/arm64-v8a/libinference_engine.so lib/arm64-v8a/libinference_engine_jni.so lib/arm64-v8a/libinference_engine_llamacpp_backend.so; do grep -Fxq "$E" <<<"$CONTENTS" || { echo "missing $E" >&2; exit 1; }; done
