name: 046 - ClosePaw RC11 Overlay-Safe Foreground + Semantic Page Completion + Brain Recovery

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 045 full source
        uses: actions/download-artifact@v5
        with:
          name: 045-ClosePaw-RC11-verified-full-source
          path: /tmp/045-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34706780151

      - name: Verify and activate exact 045 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/045-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/045-source/app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt
          test -f /tmp/045-source/app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/045-source/. ./
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib
          expected={
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'65f59cc09b3559362c2096b86a3b836716b45c05b209665fec2e77ae39ddd31e',
            'app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt':'42378756c3b51de1acadc0c00e4102541108436bb196c5991e111b3c1375dc53',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt':'945670dd4f8818b10933245a27298dfe0de4b9da590c54f06a9ba4657e11301f',
            'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt':'fdfdae46f9fd865336e2f57e65c6f62684fc1b7ffd909eba1d1b49ad8937dab3',
            'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt':'b1be3b8953bc0620a921d6e639e68ee1ae4a61952d20a52943da148a3edbee37',
            'app/build.gradle.kts':'bbda0ec1de77b7ff68e1d17543f3de2561e57fd6bd25c2f6bdf291c55a1d07dc',
            'app/src/main/res/values/strings.xml':'601f1b3eb2b75e4f91da3ec12111661be5175c9b441348eed0e4ac09726a1056',
            'tools/termux-bridge/closepaw_bridge.py':'707906f17acde07c0a86cb45c3c76b7a554f3ffcc39acc17f76f32e376749b2c',
          }
          for rel,w in expected.items():
            p=Path(rel); got=hashlib.sha256(p.read_bytes()).hexdigest()
            if got!=w: raise SystemExit(f'046 baseline mismatch {rel}: {got} != {w}')
          Path('046-verification-report.txt').write_text(
            'ClosePaw RC11 046 verification report\n'
            'Base: exact verified 045 full-source artifact, successful run 34706780151.\n'
            'Evidence fixes: overlay-safe foreground identity; PAGE_REACHED-only label alias; cross-task Brain recovery without same-task resend.\n',
            encoding='utf-8')
          print('046 EXACT VERIFIED 045 BASELINE: PASS')
          PYBASE

      - name: Baseline 045 clean compile before any 046 change
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 045 clean compile: PASS' >> 046-verification-report.txt

      - name: Freeze 045 source and protected correctness surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE'
          from pathlib import Path
          import hashlib,json
          def h(b): return hashlib.sha256(b).hexdigest()
          def sf(p): return h(Path(p).read_bytes())
          manifest={}
          for p in sorted(Path('app').rglob('*')):
            if p.is_file() and not p.as_posix().startswith('app/build/'):
              manifest[p.as_posix()]=sf(p)
          if len(manifest)<700: raise SystemExit(f'baseline app manifest too small: {len(manifest)}')
