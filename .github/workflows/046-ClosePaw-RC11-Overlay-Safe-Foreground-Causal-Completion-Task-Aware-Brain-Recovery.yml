          +++ b/app/src/main/kotlin/ai/closepaw/app/BrainExcursionRecoveryV46.kt
          @@ -0,0 +1,46 @@
          +package ai.closepaw.app
          +
          +/**
          + * Pure decision table for reconciling durable External-Brain excursion state before a NEW consult.
          + *
          + * The key safety distinction is task identity:
          + * - the same task must never resend a request that may already have been sent;
          + * - a different task may abandon the stale request because every Brain request has an exact new
          + *   TASK_ID/REQUEST_ID and late output from the abandoned request cannot validate for the new task.
          + */
          +internal object BrainExcursionRecoveryV46 {
          +    internal enum class Decision {
          +        PROCEED,
          +        CLEAR_AND_PROCEED,
          +        BLOCK_SAME_TASK,
          +        BLOCK_CORRUPT,
          +    }
          +
          +    fun decide(stateName: String?, staleTaskId: String?, currentTaskId: String): Decision {
          +        val state = stateName?.trim().orEmpty()
          +        if (state.isBlank() || state == "WORK") return Decision.PROCEED
          +        val staleTask = staleTaskId?.trim()?.takeIf { it.isNotBlank() }
          +            ?: return Decision.BLOCK_CORRUPT
          +
          +        return when (state) {
          +            // Send was not yet authorized/persisted; safe to abandon for either same or new task.
          +            "BRAIN_ENTERING" -> Decision.CLEAR_AND_PROCEED
          +
          +            // Send may already have happened. Never resend for the same task. A foreign/new task
          +            // uses a new exact TASK_ID/REQUEST_ID, so the stale response cannot validate for it.
          +            "BRAIN_AWAITING_RESPONSE", "RECOVERY_REQUIRED" -> {
          +                if (staleTask == currentTaskId) Decision.BLOCK_SAME_TASK
          +                else Decision.CLEAR_AND_PROCEED
          +            }
          +
          +            // A canonical plan may already be durable. Same-task caller must resume it rather than
          +            // overwrite it; a foreign task cannot consume it and may clear it.
          +            "BRAIN_RETURNING" -> {
          +                if (staleTask == currentTaskId) Decision.BLOCK_SAME_TASK
          +                else Decision.CLEAR_AND_PROCEED
          +            }
          +
          +            else -> Decision.BLOCK_CORRUPT
          +        }
          +    }
          +}
