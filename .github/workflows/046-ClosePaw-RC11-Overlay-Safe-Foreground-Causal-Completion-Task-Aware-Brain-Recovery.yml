          +++ b/app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt
          @@ -0,0 +1,139 @@
          +package ai.closepaw.app
          +
          +import java.text.Normalizer
          +import java.util.Locale
          +import kotlin.math.max
          +
          +/**
          + * Causal destination aliasing for one verified grounded navigation click.
          + *
          + * Some Android/Samsung rows intentionally use an action phrase while the destination title omits
          + * the leading verb (for example a row like "Choose default apps" opens a page titled
          + * "Default apps"). We must not globally loosen PAGE_REACHED matching, because that would recreate
          + * the V40 false-positive where a visible row was mistaken for an opened destination.
          + *
          + * Instead, an alias is authorized only after:
          + *   1) the exact semantic row was grounded and clicked,
          + *   2) the post-action UI contains exactly one non-clickable top-page header matching either the
          + *      exact row label or the row label with one conservative leading action verb removed, and
          + *   3) later completion is checked in the same package against that exact verified header.
          + */
          +internal object CausalDestinationV46 {
          +    internal data class Alias(
          +        val sourceTarget: String,
          +        val destinationHeader: String,
          +        val packageName: String,
          +    )
          +
          +    fun prove(
          +        sourceTarget: String,
          +        packageName: String?,
          +        nodes: List<DeterministicUiNavigatorV43.NodeEvidence>,
          +    ): Alias? {
          +        val pkg = packageName?.trim()?.takeIf { it.isNotBlank() } ?: return null
          +        val source = normalizeTarget(sourceTarget)
          +        if (source.isBlank()) return null
          +        val allowedHeaders = linkedSetOf(source)
          +        stripOneLeadingActionVerb(source)?.let(allowedHeaders::add)
          +
          +        val headers = topHeaders(nodes)
          +            .filter { normalizeTarget(it) in allowedHeaders }
          +            .distinctBy(::normalizeTarget)
          +        if (headers.size != 1) return null
          +        return Alias(
          +            sourceTarget = sourceTarget.trim(),
          +            destinationHeader = headers.single(),
          +            packageName = pkg,
          +        )
          +    }
          +
          +    fun provesStopTarget(
          +        stopTarget: String,
          +        currentPackage: String?,
          +        nodes: List<DeterministicUiNavigatorV43.NodeEvidence>,
          +        aliases: Collection<Alias>,
          +    ): Boolean {
          +        val pkg = currentPackage?.trim()?.takeIf { it.isNotBlank() } ?: return false
          +        val wantedSource = normalizeTarget(stopTarget)
          +        if (wantedSource.isBlank()) return false
          +        return aliases.any { alias ->
          +            alias.packageName == pkg &&
          +                normalizeTarget(alias.sourceTarget) == wantedSource &&
          +                topHeaders(nodes).any { header ->
          +                    normalizeTarget(header) == normalizeTarget(alias.destinationHeader)
          +                }
          +        }
          +    }
          +
          +    private fun topHeaders(nodes: List<DeterministicUiNavigatorV43.NodeEvidence>): List<String> {
          +        val screenBottom = nodes.maxOfOrNull { it.bottom }?.coerceAtLeast(1) ?: 1
          +        val headerLimit = max(280, (screenBottom * 22) / 100)
          +        return nodes.asSequence()
          +            .filter { node ->
          +                node.enabled && !node.clickable && node.width > 0 && node.height > 0 &&
          +                    node.top <= headerLimit && !insideClickableContainer(node, nodes)
          +            }
          +            .flatMap { node -> sequenceOf(node.text, node.description, node.hint) }
          +            .map(String::trim)
          +            .filter { it.isNotBlank() }
          +            .distinctBy(::normalizeTarget)
          +            .toList()
          +    }
          +
          +    private fun insideClickableContainer(
          +        candidate: DeterministicUiNavigatorV43.NodeEvidence,
          +        nodes: List<DeterministicUiNavigatorV43.NodeEvidence>,
          +    ): Boolean = nodes.any { parent ->
          +        parent.enabled && parent.clickable && parent.index != candidate.index &&
          +            parent.width > 0 && parent.height > 0 &&
          +            candidate.centerX in parent.left..parent.right &&
          +            candidate.centerY in parent.top..parent.bottom &&
          +            parent.width >= candidate.width && parent.height >= candidate.height
          +    }
          +
          +    private fun stripOneLeadingActionVerb(value: String): String? {
          +        val parts = value.split(' ').filter { it.isNotBlank() }
          +        if (parts.size < 2) return null
          +        if (parts.first() !in SAFE_LEADING_ACTION_VERBS) return null
          +        return parts.drop(1).joinToString(" ").takeIf { it.isNotBlank() }
          +    }
          +
          +    private fun normalizeTarget(raw: String): String {
          +        var value = normalize(raw)
          +        value = value.removePrefix("the ").trim()
          +        val suffixes = listOf(
          +            " settings page", " setting page", " settings screen", " setting screen",
          +            " page", " screen", " menu", " section",
          +            " صفحه", " تنظیمات", " منو", " بخش",
          +        ).map(::normalize)
          +        var changed = true
          +        while (changed) {
          +            changed = false
          +            for (suffix in suffixes) {
          +                if (value.endsWith(suffix) && value.length > suffix.length + 1) {
          +                    value = value.removeSuffix(suffix).trim()
          +                    changed = true
          +                    break
          +                }
          +            }
          +        }
          +        return value
          +    }
          +
          +    private fun normalize(value: String): String {
          +        val deaccented = Normalizer.normalize(value, Normalizer.Form.NFKD)
          +            .replace(Regex("\\p{M}+"), "")
          +            .lowercase(Locale.ROOT)
          +            .replace('ي', 'ی')
          +            .replace('ك', 'ک')
          +        return deaccented
          +            .replace(Regex("[^\\p{L}\\p{N}._-]+"), " ")
          +            .replace(Regex("\\s+"), " ")
          +            .trim()
          +    }
          +
          +    private val SAFE_LEADING_ACTION_VERBS = setOf(
          +        "choose", "select", "pick",
          +        "انتخاب", // supports short labels such as "انتخاب برنامه ..." without broad fuzzy matching.
          +    ).map(::normalize).toSet()
          +}
