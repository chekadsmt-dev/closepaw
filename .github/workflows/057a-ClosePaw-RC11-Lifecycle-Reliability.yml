            'app/build.gradle.kts',
            'app/src/main/kotlin/ai/closepaw/app/ActionLifecycleV57.kt',
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
            'app/src/main/res/values/strings.xml',
            'app/src/test/kotlin/ai/closepaw/app/ActionLifecycleV57Test.kt',
          }
