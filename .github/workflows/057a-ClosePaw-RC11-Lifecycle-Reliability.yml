          # kotlinx.coroutines ensureActive pattern and distinguishes child CE/timeouts.
          required_helper=[
              'currentCoroutineContext().ensureActive()',
              'runSuspendCatchingV57',
              'ACTION_HARD_DEADLINE_MS: Long = 45_000L',
              'MAX_SAFE_PRE_DISPATCH_REPLANS: Int = 2',
              'BEFORE_CAPTURED(false)',
              'ATTEMPTED(true)',
          ]
          for needle in required_helper:
              if needle not in helper: raise SystemExit(f'057a helper invariant missing: {needle}')

          forbidden=[
              'runCatching { platform.getInstalledApps()',
              'runCatching { requestPrimaryPlanV9(',
              'runCatching { callPrimaryModelRawV9(',
              'runCatching { consultBrain(',
              'runCatching { previous.client.cleanup()',
              'val restoreFailure = runCatching {',
          ]
          for needle in forbidden:
              if needle in eng: raise SystemExit(f'cancellation-swallowing pattern remains: {needle}')
          required_engine=[
              'runSuspendCatchingV57 { platform.getInstalledApps()',
              'val primaryDecision = runSuspendCatchingV57 {',
              'runSuspendCatchingV57 { callPrimaryModelRawV9(repair) }',
              'rethrowOwnerCancellationV57(error)',
              'rethrowOwnerCancellationV57(t)',
              'val restoreFailure = runSuspendCatchingV57 {',
              'ACTION_TIMELINE_V57|taskId=',
              'SAFE_PRE_DISPATCH_REPLAN_V57|taskId=',
              'event = "safe_abandon"',
              'event = "timeout"',
              'event = "cancelled"',
          ]
          for needle in required_engine:
              if needle not in eng: raise SystemExit(f'057a engine invariant missing: {needle}')

          # Exact transaction ordering. The first potentially hanging capture is now inside the
          # one hard deadline, PREPARED is revalidated before ATTEMPTED, and ATTEMPTED remains
          # adjacent to dispatch rather than weakening RC11 no-blind-replay semantics.
          start=eng.index('private suspend fun executeActionTransactionV9(')
          end=eng.index('private fun receiptHistoryLineV9(',start)
          tx=eng[start:end]
          order=[
              'val startedAtV57',
              'actionTimelineV57(task.id, sequenceV57, action, stageV57, startedAtV57)',
              'val initialBefore = withinActionDeadlineV57',
              'stageV57 = ActionStageV57.BEFORE_CAPTURED',
              'freshNodeRevalidationV9(platform, action, initialBefore, initialBeforePackage)',
              'persistPendingV9(task.id, sequence, action, V9DispatchState.PREPARED',
              'val dispatchBefore = withinActionDeadlineV57',
              'validateActionTargetV11(action, dispatchBefore)',
              'persistPendingV9(task.id, sequence, action, V9DispatchState.ATTEMPTED',
              'executeAction(platform, action)',
              'buildPostActionReceiptV9(',
              '.remove("v9_pending_action")',
              'stageV57 = ActionStageV57.RECEIPT_COMMITTED',
          ]
          positions=[]
          cursor=0
          for needle in order:
              pos=tx.find(needle,cursor)
              if pos<0: raise SystemExit(f'057a transaction stage/order missing: {needle}')
              positions.append(pos); cursor=pos+len(needle)
          if positions!=sorted(positions): raise SystemExit('057a transaction ordering invalid')
          if 'before: ScreenSnapshot' in tx or 'beforePackage: String?' in tx:
              raise SystemExit('057a first pre-dispatch capture still occurs outside transaction deadline')
          if 'rethrowOwnerCancellationV57(timeout)' not in eng[eng.index('private suspend fun <T> withinActionDeadlineV57'):start]:
