      - name: V54 in-flight HTTP cancellation integration gate
        shell: bash
        run: |
          set -euo pipefail
          TEST='app/src/test/kotlin/ai/closepaw/app/CancellablePrimaryV56CiTest.kt'
          cat > "$TEST" <<'KT'
          package ai.closepaw.app

          import com.google.common.truth.Truth.assertThat
          import java.net.ServerSocket
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import kotlin.concurrent.thread
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.cancelAndJoin
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.runBlocking
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.junit.Test

          class CancellablePrimaryV56CiTest {
              @Test
              fun cancellingCoroutineCancelsRealInFlightOkHttpSocketPromptly() = runBlocking {
                  val server = ServerSocket(0)
                  val requestSeen = CountDownLatch(1)
                  val releaseServer = CountDownLatch(1)
                  val serverThread = thread(start = true, isDaemon = true, name = "v56-stall-server") {
                      try {
                          server.accept().use { socket ->
                              // Consume HTTP request headers, then deliberately never send response
                              // headers. This leaves the real OkHttp Call in-flight until cancelled.
                              val input = socket.getInputStream()
                              val terminator = byteArrayOf(13, 10, 13, 10)
                              var matched = 0
                              while (matched < terminator.size) {
                                  val b = input.read()
                                  if (b < 0) break
                                  matched = if (b == terminator[matched].toInt()) {
                                      matched + 1
                                  } else if (b == terminator[0].toInt()) {
                                      1
                                  } else {
                                      0
                                  }
                              }
                              requestSeen.countDown()
                              releaseServer.await(30, TimeUnit.SECONDS)
                          }
                      } finally {
                          requestSeen.countDown()
                      }
                  }

                  try {
                      val client = OkHttpClient.Builder()
                          .connectTimeout(5, TimeUnit.SECONDS)
                          .readTimeout(60, TimeUnit.SECONDS)
                          .build()
                      val call = client.newCall(
                          Request.Builder()
                              .url("http://127.0.0.1:${server.localPort}/v1/chat/completions")
                              .build()
                      )
                      val job = launch(Dispatchers.IO) {
                          call.awaitResponseCancellableV54().use { }
                      }

                      assertThat(requestSeen.await(5, TimeUnit.SECONDS)).isTrue()
                      assertThat(job.isActive).isTrue()
                      val started = System.nanoTime()
                      job.cancelAndJoin()
                      val elapsedMs = TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - started)

                      assertThat(call.isCanceled()).isTrue()
                      assertThat(job.isCancelled).isTrue()
                      assertThat(elapsedMs).isLessThan(2_000L)
                  } finally {
                      releaseServer.countDown()
                      runCatching { server.close() }
                      serverThread.join(2_000L)
                  }
              }
          }
          KT
          ./gradlew :app:testDebugUnitTest --tests 'ai.closepaw.app.CancellablePrimaryV56CiTest' --stacktrace --no-daemon --no-configuration-cache
          rm -f "$TEST"
          echo 'V54 real-socket in-flight HTTP cancellation integration: PASS' >> 057a-verification-report.txt

