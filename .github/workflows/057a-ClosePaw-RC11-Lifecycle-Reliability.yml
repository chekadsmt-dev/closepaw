          if 'ActionLifecycleV57.exactPreparedPending' not in tx:
              raise SystemExit('PREPARED safe abandon is not exact-task/sequence bound')
          if 'if (!stageV57.attemptedOrLater' not in tx:
              raise SystemExit('cancellation cleanup does not preserve ATTEMPTED boundary')
          if 'if (!timeout.stage.attemptedOrLater' not in tx:
              raise SystemExit('timeout cleanup does not preserve ATTEMPTED boundary')

          # Permanent tests cover owner cancellation, child timeout/cancellation, exact PREPARED
          # matching and the explicit attempted boundary.
          for needle in [
              'ownerCancellationIsNeverConvertedToResultFailure',
              'ownerCancellationWinsEvenWhenLowerLayerWrapsCancellationAsFailure',
              'childTimeoutWhileOwnerActiveRemainsOperationFailure',
              'childCancellationWhileOwnerActiveRemainsOperationFailure',
              'exactPreparedPendingRejectsAttemptedOrForeignRecords',
              'attemptedBoundaryIsExplicit',
          ]:
              if needle not in tests: raise SystemExit(f'057a lifecycle test missing: {needle}')

          Path('057a-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          got=sha('057a-postpatch-source-manifest.json')
          if got!='ca82f407f33f9954a6f6ce69fa61c9efbec68305a892b4751b6df4b3bb1d5f69': raise SystemExit(f'057a final manifest digest mismatch: {got}')
          with Path('057a-verification-report.txt').open('a') as f:
              f.write('057a exact isolation + cancellation/lifecycle/static transaction invariants: PASS\n')
          print('057a source isolation/lifecycle audit: PASS')
          PY057A

