          overlay_stop=ov[ov.find('this.onStop = {'):ov.find('this.onTakeover =',ov.find('this.onStop = {'))]
          overlay_dismiss=ov[ov.find('this.onDismissError = {'):ov.find('// Navigation callbacks',ov.find('this.onDismissError = {'))]
          stop_fn=eng[eng.find('fun stopActiveTaskFromUi(source: String)'):eng.find('private fun setEnabled',eng.find('fun stopActiveTaskFromUi(source: String)'))]
          worker_fn=eng[eng.find('private fun ensureWorker()'):eng.find('private fun resumePendingConfirmation',eng.find('private fun ensureWorker()'))]
          process=eng[eng.find('private suspend fun processTask(task: HybridTask)'):eng.find('private fun brainConsultSeenV9',eng.find('private suspend fun processTask(task: HybridTask)'))]

          checks={
            'Main Stop feedback never gates route': 'viewModel.stopTask()' in main_block and 'if (capsuleBinding.onStopRequested())' not in main_block,
            'Main Stop routes Hybrid first with source': 'stopActiveHybridTaskFromUi("main_ui_stop")' in stop_task and stop_task.find('stopActiveHybridTaskFromUi("main_ui_stop")') < stop_task.find('sessionProvider()'),
            'Overlay Stop feedback never gates route': 'stateHolder.onStopRequested()' in overlay_stop and 'if (stateHolder.onStopRequested())' not in overlay_stop and 'this@ServiceOverlayController.onStop()' in overlay_stop,
            'Service overlay Stop is Hybrid-first with legacy fallback': 'onStop = { if (!stopActiveHybridTaskFromUi("overlay_stop")) submitOp(Op.Shutdown) }' in svc,
            'Service exposes source-aware Hybrid bridge': 'stopActiveHybridTaskFromUi(source: String): Boolean = hybridAgent.stopActiveTaskFromUi(source)' in svc,
            'Error Close visual really bypasses onStop': 'is CapsuleMode.Error -> onDismissError()' in control and 'stop = ButtonSpec("Close")' in render,
            'Main Error Close becomes Hybrid-first': 'stopActiveHybridTaskFromUi("main_ui_error_close")' in dismiss and dismiss.find('stopActiveHybridTaskFromUi("main_ui_error_close")') < dismiss.find('service.dismissError()'),
            'Overlay Error Close becomes Hybrid-first': 'onHybridStop("overlay_error_close")' in overlay_dismiss and overlay_dismiss.find('onHybridStop("overlay_error_close")') < overlay_dismiss.find('dismissError()'),
            'Overlay has dedicated Hybrid-only Error-Close bridge': 'private val onHybridStop: (String) -> Boolean = { false }' in ov and 'onHybridStop = { source -> stopActiveHybridTaskFromUi(source) }' in svc,
            'No-active route is diagnosable': 'phase=no_active_task' in stop_fn and 'USER_STOP_V56' in stop_fn,
            'Duplicate Stop is idempotent': 'phase=duplicate' in stop_fn and 'userStopTaskIdV56 == task.id' in stop_fn,
            'Execution epoch invalidates before owner cancel': stop_fn.find('executionEpochV11.incrementAndGet()') >= 0 and stop_fn.find('executionEpochV11.incrementAndGet()') < stop_fn.find('owner.cancel('),
            'Queued work drains before owner cancel': 'while (tasks.tryReceive().isSuccess) drained += 1' in stop_fn and stop_fn.find('while (tasks.tryReceive().isSuccess) drained += 1') < stop_fn.find('owner.cancel('),
            'UI stop does not reuse eager stop(clearQueue)': 'stop(clearQueue = true)' not in stop_fn,
            'Cancelling owner is retained until completed': 'owner.invokeOnCompletion' in stop_fn and 'workerJob = null' not in stop_fn,
            'Replacement worker is completion-barriered': 'if (existing != null && !existing.isCompleted) return' in worker_fn,
            'Worker restart occurs only from completion path': stop_fn.count('ensureWorker()') == 1 and stop_fn.find('owner.invokeOnCompletion') < stop_fn.find('ensureWorker()'),
            'Processing marker distinguishes suspended task': 'processingTaskIdV56 = task.id' in process and 'if (processingTaskIdV56 == task.id) processingTaskIdV56 = null' in process,
            'Suspended task stop records terminal USER_STOPPED': 'processingTaskIdV56 != task.id' in stop_fn and 'completeTaskLifecycle(task, TaskOutcome.USER_STOPPED, "Task stopped by user")' in stop_fn,
            'In-flight task cancellation is lifecycle-recorded and rethrown': 'phase=task_cancelled' in process and 'TaskOutcome.USER_STOPPED' in process and 'throw e' in process,
            'V54 HTTP cancellation bridge remains active': 'invokeOnCancellation { cancel() }' in call and 'enqueue(object : Callback' in call and '.awaitResponseCancellableV54().use' in eng,
            'No V54 visible-stop route remains': 'USER_STOP_V54' not in stop_fn,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('056 architecture audit failed: '+', '.join(failed))
          with Path('057a-verification-report.txt').open('a') as f:
              for k in checks: f.write(k+': PASS\n')
          print('056 authoritative stop audit: PASS')
          PYAUDIT

