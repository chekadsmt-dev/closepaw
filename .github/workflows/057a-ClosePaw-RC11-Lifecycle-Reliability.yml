          expected_hashes={
            'app/build.gradle.kts':'54a7c155dd847a0a41772ff17cad6e8aaed445793c3adfeaafc6107d02069ffd',
            'app/src/main/kotlin/ai/closepaw/app/ActionLifecycleV57.kt':'4373e23721e54a0cd25063e63347eecf6c00f1ee7d744e4a8593bfc72e882750',
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'3fae51971a630b795eb61ef3d64d07c7b385bbe139492453853ffb60878e1b8d',
            'app/src/main/res/values/strings.xml':'c8c13eed77e40bfb571a954304fa4e868a2d3e88471af1239f19164d23f3ef92',
            'app/src/test/kotlin/ai/closepaw/app/ActionLifecycleV57Test.kt':'5c61535defaa5d8fa0b4db717a1238e8dd4129eeb1fa67494a7b52e12852f90a',
          }
          for p,want in expected_hashes.items():
              got=current.get(p)
              if got!=want: raise SystemExit(f'057a expected hash mismatch {p}: {got} != {want}')

          helper=Path('app/src/main/kotlin/ai/closepaw/app/ActionLifecycleV57.kt').read_text()
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          tests=Path('app/src/test/kotlin/ai/closepaw/app/ActionLifecycleV57Test.kt').read_text()

