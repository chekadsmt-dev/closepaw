          +            DeterministicUiNavigatorV43.SemanticChannel.TEXT,
          +            nodes,
          +        ) as DeterministicUiNavigatorV43.Decision.Click
          +        assertEquals(10, resolved.index)
          +        assertEquals("Apps", resolved.target)
          +        assertEquals(DeterministicUiNavigatorV43.SemanticChannel.TEXT, resolved.channel)
          +    }
          +
          +    @Test fun dispatchGroundingFailsClosedAcrossSeparateRows() {
          +        val resolved = DeterministicUiNavigatorV43.resolveDispatchTarget(
