name: 043 - ClosePaw RC11 Grounding-First Deterministic Search + Verified Navigation

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 042 full source
        uses: actions/download-artifact@v5
        with:
          name: 042-ClosePaw-RC11-verified-full-source
          path: /tmp/042-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34689937717

      - name: Verify and activate exact 042 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/042-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/042-source/app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt
          test -f /tmp/042-source/app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV41.kt
          test -f /tmp/042-source/app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt
          test -f /tmp/042-source/app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt
          test -f /tmp/042-source/app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt
          test -f /tmp/042-source/app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt
          test -f /tmp/042-source/tools/termux-bridge/closepaw_bridge.py
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/042-source/. ./

          python3 - <<'PYBASE043'
          from pathlib import Path
          import hashlib
          expected = {
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt': '26466286eb83ccd2bf17d8a3831e7abcc284bee585e3e8c495f960cf68d56dc3',
              'app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt': '42378756c3b51de1acadc0c00e4102541108436bb196c5991e111b3c1375dc53',
              'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV41.kt': 'ec2dcebae54b663bee3ba3e0f5d2cc50c58b6531076cc085c471d8c612a18e43',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt': '6c386d7e712c1f19f1d106f324d500b2fead4fc4b30a1b043cb368db16ebc03e',
              'app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt': '6d2069354b970927dc4729a00355a74e8139f60efadb866e3f9e9b2c020e67b6',
              'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt': '1e9e9dc2e4625277eb8eecd08792d4ed1e7c2952e374f20745808ba1bbfb7739',
              'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt': '50fec2dfd085e29fd56efc7d9317cc4e8f6b2ed8a242e4b1d9189090a0e97ab2',
              'app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt': 'ecd85c4d77335f2fa289ebf8ae4e804b7dfebe5a24e918d2d6e8413be20e9a42',
              'app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt': '063f89a0d7b4dd08f16642ee7454a5a871e7d3b4d8318f1373808be307350f41',
              'app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt': '6404241048b37ccf0cdb835fc8be406401c568926f8751fbff3ccaef35bb15c9',
              'app/build.gradle.kts': '4408bbaf9895c9407965286b8c6e81958dcfe5dc3e11bbc5b2aa42f4c2d5eb44',
              'app/src/main/res/values/strings.xml': '54ea33ee1cba71c67951ee5c11251cfbe86f121516ee5b9fa0326eef42d1f680',
              'tools/termux-bridge/closepaw_bridge.py': '707906f17acde07c0a86cb45c3c76b7a554f3ffcc39acc17f76f32e376749b2c',
          }
          for rel, wanted in expected.items():
              p = Path(rel)
              if not p.is_file(): raise SystemExit('043 baseline missing: ' + rel)
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != wanted: raise SystemExit(f'043 baseline hash mismatch {rel}: {got} != {wanted}')
          Path('043-verification-report.txt').write_text(
              'ClosePaw RC11 043 verification report\n'
              '=====================================\n'
              'Base: exact verified 042 full-source artifact from successful run 34689937717.\n'
              'Design review: grounding-first exact target resolution, bounded scroll-until-visible, no-progress boundary detection, and verify-after-act.\n'
              'Frozen: RC8 restore, durable PREPARED->ATTEMPTED transaction, V33 validation, V32 transport, V37 regression grammar, typed V41 goal completion, configured Brain binding/locator/send/restore, trace, bridge.\n',
              encoding='utf-8',
          )
          print('043 EXACT VERIFIED 042 BASELINE HASH GATE: PASS')
          PYBASE043

      - name: Baseline 042 clean compile before any 043 change
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 042 clean Kotlin compile BEFORE 043 patch: PASS' >> 043-verification-report.txt

      - name: Freeze exact 042 source and correctness regions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE043'
          from pathlib import Path
          import hashlib, json
          def sha(data: bytes): return hashlib.sha256(data).hexdigest()
          def sf(path): return sha(Path(path).read_bytes())
          manifest = {}
          for p in sorted(Path('app').rglob('*')):
              if not p.is_file(): continue
              rel = p.as_posix()
              if rel.startswith('app/build/'): continue
              manifest[rel] = sf(rel)
          if len(manifest) < 700: raise SystemExit(f'043 baseline app manifest unexpectedly small: {len(manifest)}')
          Path('043-baseline-source-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(a, b):
              s = engine.find(a)
              if s < 0: raise SystemExit('043 critical start missing: ' + a)
              e = engine.find(b, s)
              if e < 0: raise SystemExit('043 critical end missing: ' + b)
              return engine[s:e].encode()
          critical = {
              'rc8_restore': sha(region('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded(')),
              'durable_transaction': sha(region('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9(')),
              'v33_primary_plan_validation': sha(region('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest(')),
              'brain_request_builder': sha(region('private fun buildBrainRequest(','private fun buildRepairRequest(')),
              'brain_excursion_capture': sha(region('private suspend fun captureBrainExcursionFrame(','private suspend fun restoreAfterBrainExcursion(')),
              'brain_restore': sha(region('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings')),
              'configured_brain_route': sha(region('private fun configuredBrainV9(): ChatBrainSettings','private suspend fun sendConfiguredBrainMessageV9(')),
              'brain_send': sha(region('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9(')),
              'goal_postcondition_v41_file': sf('app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt'),
              'primary_grammar_v41_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV41.kt'),
              'hybrid_protocol_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt'),
              'rc11_policy_file': sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
              'http_transport_v32_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
              'v37_grammar_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt'),
              'v37_trace_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt'),
              'brain_settings_store_file': sf('app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt'),
              'brain_target_resolver_v40_file': sf('app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt'),
              'bridge_source': sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          Path('043-baseline-critical-hashes.json').write_text(json.dumps(critical, indent=2, sort_keys=True) + '\n')
          print('043 BASELINE FREEZE: PASS')
          PYFREEZE043

      - name: Apply isolated 043 grounding-first deterministic navigation patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/043.patch <<'PATCH043'
          diff --git a/app/build.gradle.kts b/app/build.gradle.kts
          index 9bf6321..d6fa6ef 100644
          --- a/app/build.gradle.kts
          +++ b/app/build.gradle.kts
          @@ -46,8 +46,8 @@ android {
           
               buildTypes {
                   debug {
          -    applicationIdSuffix = ".rc11c042"
          -    versionNameSuffix = "-rc11-c042"
          +    applicationIdSuffix = ".rc11c043"
          +    versionNameSuffix = "-rc11-c043"
           
               val evalSsl = project.findProperty("insecureSslForEval")?.toString()?.toBoolean() ?: false
               buildConfigField("boolean", "INSECURE_SSL_FOR_EVAL", evalSsl.toString())
          diff --git a/app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt b/app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt
          new file mode 100644
          index 0000000..dbcf9ec
          --- /dev/null
          +++ b/app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt
          @@ -0,0 +1,403 @@
          +package ai.closepaw.app
          +
          +import java.text.Normalizer
          +import java.util.Locale
          +import kotlin.math.abs
          +import kotlin.math.max
          +import kotlin.math.min
          +
          +/**
          + * Grounding-first deterministic navigation for explicit user-directed UI targets.
          + *
          + * V43 intentionally does not try to "understand the whole app". It handles the part that
          + * should not require a model at all:
          + *   1) exact explicit target already visible -> ground to one real actionable row and click it;
          + *   2) explicit target not visible -> bounded scroll/search, re-observe, repeat;
          + *   3) visible-only target -> search but never click;
          + *   4) genuine ambiguity -> fail closed and let the normal Primary/External route decide.
          + *
          + * This mirrors the reliable automation pattern used by mature mobile harnesses: find -> act on
          + * the grounded element -> re-observe, with a bounded scroll-until-visible loop and viewport
          + * no-progress detection owned by the controller rather than by the language model.
          + */
          +internal object DeterministicUiNavigatorV43 {
          +    enum class Direction { UP, DOWN }
          +    enum class SemanticChannel { TEXT, DESCRIPTION }
          +
          +    internal data class NodeEvidence(
          +        val index: Int,
          +        val text: String,
          +        val description: String,
          +        val hint: String,
          +        val resourceId: String,
          +        val className: String,
          +        val clickable: Boolean,
          +        val scrollable: Boolean,
          +        val enabled: Boolean,
          +        val left: Int,
          +        val top: Int,
          +        val right: Int,
          +        val bottom: Int,
          +    ) {
          +        val width: Int get() = (right - left).coerceAtLeast(0)
          +        val height: Int get() = (bottom - top).coerceAtLeast(0)
          +        val centerX: Int get() = (left + right) / 2
          +        val centerY: Int get() = (top + bottom) / 2
          +        val area: Long get() = width.toLong() * height.toLong()
          +    }
          +
          +    internal sealed interface Decision {
          +        data object None : Decision
          +        data class Click(
          +            val index: Int,
          +            val target: String,
          +            val channel: SemanticChannel,
          +        ) : Decision
          +        data class Scan(
          +            val target: String,
          +            val key: String,
          +            val preferredDirection: Direction,
          +        ) : Decision
          +        data class Ambiguous(val target: String, val matches: Int) : Decision
          +    }
          +
          +    internal data class ScanProgress(
          +        var downMoves: Int = 0,
          +        var upMoves: Int = 0,
          +        var downBoundary: Boolean = false,
          +        var upBoundary: Boolean = false,
          +    )
          +
          +    private sealed interface TargetResolution {
          +        data class Unique(
          +            val node: NodeEvidence,
          +            val semanticTarget: String,
          +            val channel: SemanticChannel,
          +        ) : TargetResolution
          +        data class Ambiguous(val count: Int) : TargetResolution
          +        data object Missing : TargetResolution
          +    }
          +
          +    private const val MAX_SWIPES_PER_DIRECTION = 8
          +
          +    fun decide(goal: String, nodes: List<NodeEvidence>): Decision {
          +        if (goal.isBlank() || nodes.isEmpty()) return Decision.None
          +
          +        val navigationTargets = explicitNavigationTargets(goal)
          +        if (navigationTargets.isNotEmpty()) {
          +            for (target in navigationTargets) {
          +                // Ordered progress is inferred from the fresh UI, not from a model claim. If the
          +                // earlier target is the current non-clickable page header, that step is complete.
          +                if (pageReached(target, nodes)) continue
          +
          +                when (val resolved = resolveActionableTarget(target, nodes)) {
          +                    is TargetResolution.Unique -> return Decision.Click(
          +                        index = resolved.node.index,
          +                        target = resolved.semanticTarget,
          +                        channel = resolved.channel,
          +                    )
          +                    is TargetResolution.Ambiguous -> return Decision.Ambiguous(target, resolved.count)
          +                    TargetResolution.Missing -> return Decision.Scan(
          +                        target = target,
          +                        key = "nav:${normalizeTargetPhrase(target)}",
          +                        preferredDirection = preferredDirectionFor(goal, target),
          +                    )
          +                }
          +            }
          +            return Decision.None
          +        }
          +
          +        val visibleOnlyTarget = explicitScrollUntilTarget(goal)
          +        if (!visibleOnlyTarget.isNullOrBlank()) {
          +            // For "scroll until X is visible / do not open X", visibility itself is the goal.
          +            if (exactVisible(visibleOnlyTarget, nodes)) return Decision.None
          +            return Decision.Scan(
          +                target = visibleOnlyTarget,
          +                key = "visible:${normalizeTargetPhrase(visibleOnlyTarget)}",
          +                preferredDirection = preferredDirectionFor(goal, visibleOnlyTarget),
          +            )
          +        }
          +
          +        return Decision.None
          +    }
          +
          +    fun nextDirection(progress: ScanProgress, preferred: Direction): Direction? {
          +        val first = preferred
          +        val second = if (preferred == Direction.DOWN) Direction.UP else Direction.DOWN
          +        return when {
          +            canMove(progress, first) -> first
          +            canMove(progress, second) -> second
          +            else -> null
          +        }
          +    }
          +
          +    fun recordScroll(progress: ScanProgress, direction: Direction, viewportMoved: Boolean) {
          +        when (direction) {
          +            Direction.DOWN -> {
          +                if (viewportMoved) progress.downMoves++ else progress.downBoundary = true
          +                if (progress.downMoves >= MAX_SWIPES_PER_DIRECTION) progress.downBoundary = true
          +            }
          +            Direction.UP -> {
          +                if (viewportMoved) progress.upMoves++ else progress.upBoundary = true
          +                if (progress.upMoves >= MAX_SWIPES_PER_DIRECTION) progress.upBoundary = true
          +            }
          +        }
          +    }
          +
          +    fun exhausted(progress: ScanProgress): Boolean =
          +        !canMove(progress, Direction.DOWN) && !canMove(progress, Direction.UP)
          +
          +    private fun canMove(progress: ScanProgress, direction: Direction): Boolean = when (direction) {
          +        Direction.DOWN -> !progress.downBoundary && progress.downMoves < MAX_SWIPES_PER_DIRECTION
          +        Direction.UP -> !progress.upBoundary && progress.upMoves < MAX_SWIPES_PER_DIRECTION
          +    }
          +
          +    private fun resolveActionableTarget(
          +        target: String,
          +        nodes: List<NodeEvidence>,
          +        requiredChannel: SemanticChannel? = null,
          +    ): TargetResolution {
          +        val variants = targetVariants(target)
          +        if (variants.isEmpty()) return TargetResolution.Missing
          +
          +        fun channelMatch(node: NodeEvidence): Boolean = when (requiredChannel) {
          +            SemanticChannel.TEXT -> normalize(node.text) in variants
          +            SemanticChannel.DESCRIPTION -> normalize(node.description) in variants
          +            null -> normalize(node.text) in variants || normalize(node.description) in variants
          +        }
          +
          +        val semanticMatches = nodes.filter { node ->
          +            node.enabled && node.width > 0 && node.height > 0 && channelMatch(node)
          +        }
          +        if (semanticMatches.isEmpty()) return TargetResolution.Missing
          +
          +        val actionable = mutableListOf<NodeEvidence>()
          +        for (match in semanticMatches) {
          +            if (match.clickable) actionable += match
          +
          +            // Samsung/Android Settings often exposes the visible label as a non-clickable child
          +            // and the whole row as its clickable parent. We do not need parent ids: the smallest
          +            // clickable container that geometrically contains the exact semantic child is enough.
          +            nodes.asSequence()
          +                .filter { parent ->
          +                    parent.enabled && parent.clickable && parent.width > 0 && parent.height > 0 &&
          +                        parent.index != match.index && containsCenter(parent, match) &&
          +                        parent.width >= match.width && parent.height >= match.height &&
          +                        parent.height <= max(320, match.height * 5)
          +                }
          +                .minByOrNull { it.area }
          +                ?.let(actionable::add)
          +        }
          +
          +        if (actionable.isEmpty()) return TargetResolution.Missing
          +        val clusters = clusterSameVisualRows(actionable.distinctBy { it.index })
          +        if (clusters.size != 1) return TargetResolution.Ambiguous(clusters.size)
          +
          +        // Within one visual row prefer the smallest precise clickable target. The executor still
          +        // performs fresh semantic re-resolution before the side effect.
          +        val winner = clusters.single().minWithOrNull(
          +            compareBy<NodeEvidence> { it.area }.thenBy { it.index }
          +        ) ?: return TargetResolution.Missing
          +
          +        // Keep the explicit semantic identity that grounded this clickable container. The runtime
          +        // executes by that text/description on a fresh tree, rather than trusting a blank parent
          +        // container's bounds as the primary identity.
          +        val associated = semanticMatches.filter { match ->
          +            match.index == winner.index || containsCenter(winner, match)
          +        }
          +        val textEvidence = associated.firstOrNull { normalize(it.text) in variants && it.text.isNotBlank() }
          +        val descEvidence = associated.firstOrNull { normalize(it.description) in variants && it.description.isNotBlank() }
          +        val semanticTarget: String
          +        val channel: SemanticChannel
          +        when {
          +            requiredChannel == SemanticChannel.TEXT && textEvidence != null -> {
          +                semanticTarget = textEvidence.text
          +                channel = SemanticChannel.TEXT
          +            }
          +            requiredChannel == SemanticChannel.DESCRIPTION && descEvidence != null -> {
          +                semanticTarget = descEvidence.description
          +                channel = SemanticChannel.DESCRIPTION
          +            }
          +            textEvidence != null -> {
          +                semanticTarget = textEvidence.text
          +                channel = SemanticChannel.TEXT
          +            }
          +            descEvidence != null -> {
          +                semanticTarget = descEvidence.description
          +                channel = SemanticChannel.DESCRIPTION
          +            }
          +            else -> return TargetResolution.Missing
          +        }
          +        return TargetResolution.Unique(winner, semanticTarget, channel)
          +    }
          +
          +    /**
          +     * Fresh-dispatch grounding for semantic click actions. This is also used by the executor so
          +     * a non-clickable label child can safely resolve to its unique clickable row parent.
          +     */
          +    fun resolveDispatchTarget(
          +        target: String,
          +        channel: SemanticChannel,
          +        nodes: List<NodeEvidence>,
          +    ): Decision = when (val resolved = resolveActionableTarget(target, nodes, channel)) {
          +        is TargetResolution.Unique -> Decision.Click(
          +            index = resolved.node.index,
          +            target = resolved.semanticTarget,
          +            channel = resolved.channel,
          +        )
          +        is TargetResolution.Ambiguous -> Decision.Ambiguous(target, resolved.count)
          +        TargetResolution.Missing -> Decision.None
          +    }
          +
          +    private fun clusterSameVisualRows(nodes: List<NodeEvidence>): List<List<NodeEvidence>> {
          +        val clusters = mutableListOf<MutableList<NodeEvidence>>()
          +        for (node in nodes.sortedBy { it.top }) {
          +            val cluster = clusters.firstOrNull { existing -> existing.any { sameVisualRow(it, node) } }
          +            if (cluster != null) cluster += node else clusters += mutableListOf(node)
          +        }
          +        return clusters
          +    }
          +
          +    private fun sameVisualRow(a: NodeEvidence, b: NodeEvidence): Boolean {
          +        if (containsCenter(a, b) || containsCenter(b, a)) {
          +            val verticalDistance = abs(a.centerY - b.centerY)
          +            if (verticalDistance <= max(36, min(a.height, b.height))) return true
          +        }
          +        val overlapTop = max(a.top, b.top)
          +        val overlapBottom = min(a.bottom, b.bottom)
          +        val overlap = (overlapBottom - overlapTop).coerceAtLeast(0)
          +        val minHeight = min(a.height, b.height).coerceAtLeast(1)
          +        val verticalRatio = overlap.toDouble() / minHeight.toDouble()
          +        val horizontalOverlap = min(a.right, b.right) - max(a.left, b.left)
          +        return verticalRatio >= 0.55 && horizontalOverlap > 0
          +    }
          +
          +    private fun pageReached(target: String, nodes: List<NodeEvidence>): Boolean {
          +        val variants = targetVariants(target)
          +        if (variants.isEmpty()) return false
          +        val screenBottom = nodes.maxOfOrNull { it.bottom }?.coerceAtLeast(1) ?: 1
          +        val headerLimit = max(280, (screenBottom * 22) / 100)
          +        return nodes.any { candidate ->
          +            candidate.enabled && !candidate.clickable && candidate.top <= headerLimit &&
          +                candidate.width > 0 && candidate.height > 0 &&
          +                nodeValues(candidate).any { normalize(it) in variants } &&
          +                !insideClickableContainer(candidate, nodes)
          +        }
          +    }
          +
          +    private fun insideClickableContainer(candidate: NodeEvidence, nodes: List<NodeEvidence>): Boolean =
          +        nodes.any { parent ->
          +            parent.enabled && parent.clickable && parent.index != candidate.index &&
          +                parent.width > 0 && parent.height > 0 && containsCenter(parent, candidate) &&
          +                parent.width >= candidate.width && parent.height >= candidate.height
          +        }
          +
          +    fun isDestinationHeader(target: String, nodes: List<NodeEvidence>): Boolean =
          +        pageReached(target, nodes)
          +
          +    private fun exactVisible(target: String, nodes: List<NodeEvidence>): Boolean {
          +        val variants = targetVariants(target)
          +        if (variants.isEmpty()) return false
          +        return nodes.any { node ->
          +            node.enabled && node.width > 0 && node.height > 0 &&
          +                nodeValues(node).any { normalize(it) in variants }
          +        }
          +    }
          +
          +    private fun explicitNavigationTargets(goal: String): List<String> {
          +        val hits = mutableListOf<Pair<Int, String>>()
          +        val patterns = listOf(
          +            Regex("(?i)\\bgo\\s+to\\s+(?:the\\s+)?([^\\n.!?؛;]+)"),
          +            Regex("(?i)\\b(?:tap|click|select|choose)\\s+(?:on\\s+)?(?:the\\s+)?([^\\n.!?؛;]+)"),
          +            Regex("برو\\s+به\\s+([^\\n.!?؟؛;]+)"),
          +            Regex("روی\\s+([^\\n.!?؟؛;]+?)\\s+(?:بزن|کلیک کن)"),
          +            Regex("([^\\n.!?؟؛;]+?)\\s+(?:را|رو)\\s+انتخاب\\s+کن"),
          +        )
          +        patterns.forEach { regex ->
          +            regex.findAll(goal).forEach { match ->
          +                val raw = match.groupValues.getOrNull(1).orEmpty().trim()
          +                val normalized = normalizeTargetPhrase(raw)
          +                if (normalized.isNotBlank()) hits += match.range.first to raw
          +            }
          +        }
          +        return hits.sortedBy { it.first }
          +            .map { it.second.trim() }
