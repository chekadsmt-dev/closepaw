      - name: 043 source isolation and frozen correctness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYISO043'
          from pathlib import Path
          import hashlib, json
          def sha(data: bytes): return hashlib.sha256(data).hexdigest()
          def sf(path): return sha(Path(path).read_bytes())
          baseline = json.loads(Path('043-baseline-source-manifest.json').read_text())
          current = {}
          for p in sorted(Path('app').rglob('*')):
              if not p.is_file(): continue
              rel = p.as_posix()
              if rel.startswith('app/build/'): continue
              current[rel] = sf(rel)
          changed = {p for p in baseline.keys() & current.keys() if baseline[p] != current[p]}
          added = set(current) - set(baseline)
          removed = set(baseline) - set(current)
          allowed_changed = {
              'app/build.gradle.kts',
              'app/src/main/res/values/strings.xml',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
          }
          allowed_added = {
              'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt',
              'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt',
              'app/src/test/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43Test.kt',
              'app/src/test/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43Test.kt',
          }
          if changed != allowed_changed:
              raise SystemExit(f'043 unexpected changed files: {sorted(changed)} expected {sorted(allowed_changed)}')
          if added != allowed_added:
              raise SystemExit(f'043 unexpected added files: {sorted(added)} expected {sorted(allowed_added)}')
          if removed:
              raise SystemExit(f'043 unexpectedly removed files: {sorted(removed)}')

          frozen = json.loads(Path('043-baseline-critical-hashes.json').read_text())
          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(a, b):
              s = engine.find(a)
              if s < 0: raise SystemExit('043 critical start missing after patch: ' + a)
              e = engine.find(b, s)
              if e < 0: raise SystemExit('043 critical end missing after patch: ' + b)
              return engine[s:e].encode()
          now = {
              'rc8_restore': sha(region('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded(')),
              'durable_transaction': sha(region('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9(')),
              'v33_primary_plan_validation': sha(region('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest(')),
              'brain_request_builder': sha(region('private fun buildBrainRequest(','private fun buildRepairRequest(')),
              'brain_excursion_capture': sha(region('private suspend fun captureBrainExcursionFrame(','private suspend fun restoreAfterBrainExcursion(')),
              'brain_restore': sha(region('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings')),
              'configured_brain_route': sha(region('private fun configuredBrainV9(): ChatBrainSettings','private suspend fun sendConfiguredBrainMessageV9(')),
              'brain_send': sha(region('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9(')),
              'goal_postcondition_v41_file': sf('app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt'),
              'primary_grammar_v41_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV41.kt'),
              'hybrid_protocol_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt'),
              'rc11_policy_file': sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
              'http_transport_v32_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
              'v37_grammar_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt'),
              'v37_trace_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt'),
              'brain_settings_store_file': sf('app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt'),
              'brain_target_resolver_v40_file': sf('app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt'),
              'bridge_source': sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          if now != frozen:
              bad = [k for k in frozen if now.get(k) != frozen[k]]
              raise SystemExit('043 modified frozen correctness regions/files: ' + ', '.join(bad))
          Path('043-postpatch-source-manifest.json').write_text(json.dumps(current, indent=2, sort_keys=True) + '\n')
          with Path('043-verification-report.txt').open('a') as f:
              f.write('Source isolation exact allowlist: PASS\n')
              f.write('RC8/durable/V33/V32/V37/V41-goal/Brain binding+locator+send+restore/trace/bridge frozen: PASS\n')
          print('043 SOURCE ISOLATION + FROZEN CORRECTNESS: PASS')
          PYISO043

      - name: 043 grounding-first architecture and regression audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT043'
          from pathlib import Path
          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          nav = Path('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt').read_text(encoding='utf-8')
          grammar = Path('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt').read_text(encoding='utf-8')
          store = Path('app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')

          # Controller wiring: explicit targets are grounded/scan-searched before planner freedom,
          # but every side effect still enters the existing HybridPlan -> RC11 transaction path.
          for token in [
              'DeterministicUiNavigatorV43.decide(',
              'DETERMINISTIC_V43|CLICK|',
              'DETERMINISTIC_V43|SCAN|',
              'DETERMINISTIC_V43|EXHAUSTED|',
              'selectedPlanSource = "DETERMINISTIC_V43"',
              'MAX_DETERMINISTIC_NAV_ACTIONS_V43 = 24',
              'DeterministicUiNavigatorV43.recordScroll(',
              'viewportMoved = receipt.accepted',
              'PrimaryLocalGrammarV43.build(lease, request, installedApps)',
              'clickGroundedSemanticTargetV43(',
              'resolveDispatchTarget(',
              'clickedTargetBecameHeaderV43',
              'isDestinationHeader(',
          ]:
              if token not in engine: raise SystemExit('043 missing engine contract: ' + token)
          if 'PrimaryLocalGrammarV41.build(lease, request, installedApps)' in engine:
              raise SystemExit('043 engine still invokes V41 Primary grammar')

          # Ensure deterministic click plans preserve semantic identity (TEXT/DESCRIPTION) instead
          # of executing a blank parent container as a free CLICK_NODE.
          if 'HybridAction.ClickNode(deterministicDecision.index)' in engine:
              raise SystemExit('043 deterministic route still emits raw CLICK_NODE parent handles')
          for token in [
              'HybridAction.ClickText(deterministicDecision.target)',
              'HybridAction.ClickDesc(deterministicDecision.target)',
          ]:
              if token not in engine: raise SystemExit('043 semantic deterministic click missing: ' + token)

          # The deterministic block must occur after persisted Brain-plan recovery and before Primary.
          p_resume = engine.find('if (resumableBrainPlan != null)')
          p_nav = engine.find('DeterministicUiNavigatorV43.decide(')
          p_primary = engine.find('requestPrimaryPlanV9(task.id, primaryRequestId, primaryRequest)', p_nav)
          if min(p_resume, p_nav, p_primary) < 0 or not (p_resume < p_nav < p_primary):
              raise SystemExit('043 deterministic route ordering is not recovery -> grounding -> Primary')

          # Existing durable transaction is still used downstream; no direct platform side effects
          # are allowed inside the pure navigator.
          for forbidden in ['platform.performAction', 'launchApp(', 'AccessibilityService', 'UIAction.']:
              if forbidden in nav: raise SystemExit('043 pure navigator contains direct side effect: ' + forbidden)

          # Bounded scroll-until-visible: exact target, re-observe per turn, no-progress boundary,
          # reverse direction, finite swipe budget, and visible-only target never clicks.
          for token in [
              'MAX_SWIPES_PER_DIRECTION = 8',
              'viewportMoved: Boolean',
              'downBoundary = true',
              'upBoundary = true',
              'nextDirection(',
              'explicitScrollUntilTarget(',
              'if (exactVisible(visibleOnlyTarget, nodes)) return Decision.None',
              'resolveActionableTarget(',
              'clusterSameVisualRows(',
              'insideClickableContainer(',
              'SemanticChannel.TEXT',
              'SemanticChannel.DESCRIPTION',
              'resolveDispatchTarget(',
          ]:
              if token not in nav: raise SystemExit('043 navigator contract missing: ' + token)

          # Primary can no longer select every clickable row merely because it exists. Only
          # goal-grounded candidates, scroll/wait, and fail-closed escalation are exposed.
          for token in [
              'goal_grounded_fallback',
              'nodeRelevantToGoal(goal, it)',
              'PRIMARY_ESCALATE|',
          ]:
              if token not in grammar: raise SystemExit('043 grammar contract missing: ' + token)
          for forbidden in ['arg ::=', 'SET_TEXT_NODE|" arg', 'CLICK_TEXT|" arg', 'DONE|']:
              if forbidden in grammar: raise SystemExit('043 free-form executable semantic argument reintroduced: ' + forbidden)
          if 'nodes.filter { it.clickable }.map { it.index }' in grammar:
              raise SystemExit('043 arbitrary all-clickable fallback reintroduced')

          # Verify-after-act remains strict. A same-package intermediate click can only count when
          # an actionable target becomes the same semantic non-clickable destination header.
          s_receipt = engine.find('private suspend fun buildPostActionReceiptV9(')
          e_receipt = engine.find('private fun receiptHistoryLineV9(', s_receipt)
          receipt = engine[s_receipt:e_receipt]
          for token in [
              'clickTargetWasGroundedBeforeV43',
              'clickedTargetBecameHeaderV43',
              'beforePackage == afterObs.packageName',
              'executorSuccess && !interrupted && changed',
              'DeterministicUiNavigatorV43.isDestinationHeader(',
          ]:
              if token not in receipt: raise SystemExit('043 verified-click receipt contract missing: ' + token)

          # Existing local completion / Samsung authoritative foreground / transport stay wired.
          for token in [
              'GoalPostconditionV41.parse(goal, apps)',
              'GoalPostconditionV41.evaluate(',
              'observedPackage(platform)',
              'PRIMARY_CUSTOM_HTTP_TIMEOUT_MS = 180_000L',
              'PRIMARY_CUSTOM_MAX_OUTPUT_TOKENS = 64L',
              'appendLine(task.goal)',
          ]:
              if token not in engine: raise SystemExit('043 frozen runtime wiring missing: ' + token)

          # One-time external Brain binding/locator stays deterministic and consumes zero model calls.
          for token in ['KEY_APP_PACKAGE', 'KEY_CHAT_TITLE', 'getSharedPreferences', 'saveAppPackage', 'saveChatTitle']:
              if token not in store: raise SystemExit('043 persistent Brain binding contract missing: ' + token)
          s = engine.find('private suspend fun ensureConfiguredBrainConversationV9(')
          e = engine.find('private suspend fun sendConfiguredBrainMessageV9(', s)
          if s < 0 or e < 0: raise SystemExit('043 configured Brain conversation region missing')
          locator = engine[s:e]
          for token in ['requestPrimaryPlanV9(', 'ChatCompletionClient', 'LLMClient', 'buildPrimaryModelRequest(']:
              if token in locator: raise SystemExit('043 Brain locator unexpectedly consumes model path: ' + token)

          if 'take(600)' in engine: raise SystemExit('043 reintroduced user-goal tail truncation')
          if 'applicationIdSuffix = ".rc11c043"' not in gradle: raise SystemExit('043 application id missing')
          if 'versionNameSuffix = "-rc11-c043"' not in gradle: raise SystemExit('043 version suffix missing')
          if '<string name="app_name">ClosePaw RC11 043</string>' not in strings: raise SystemExit('043 label missing')

          with Path('043-verification-report.txt').open('a') as f:
              f.write('Grounding-first exact target controller with bounded verified scan: PASS\n')
              f.write('No arbitrary all-clickable model fallback for unresolved targets: PASS\n')
              f.write('Semantic child label -> unique clickable row grounding with fresh dispatch re-grounding: PASS\n')
              f.write('Intermediate clickable-row -> non-clickable-page-header postcondition: PASS\n')
              f.write('Visible-only scroll goal never clicks target: PASS\n')
              f.write('Configured External Brain persistent binding and zero-token locator preserved: PASS\n')
          print('043 GROUNDING-FIRST ARCHITECTURE AUDIT: PASS')
          PYAUDIT043

