          +    @Test fun missingExplicitTargetScansInsteadOfPickingArbitraryRow() {
          +        val decision = DeterministicUiNavigatorV43.decide(
          +            "Open Settings.\nGo to Display.\nStop when Display settings is visible.",
          +            listOf(
          +                n(1, "Settings", 60, 150),
          +                n(2, "Connections", 500, 620, clickable = true),
          +                n(3, "Galaxy AI", 650, 770, clickable = true),
          +                n(4, "", 300, 1700, scrollable = true),
          +            ),
          +        )
          +        assertTrue(decision is DeterministicUiNavigatorV43.Decision.Scan)
          +        assertEquals(DeterministicUiNavigatorV43.Direction.DOWN, (decision as DeterministicUiNavigatorV43.Decision.Scan).preferredDirection)
          +        assertEquals("Display", decision.target)
          +    }
          +
          +    @Test fun exactChildLabelGroundsToSingleClickableParentRow() {
          +        val decision = DeterministicUiNavigatorV43.decide(
          +            "Open Settings.\nGo to Apps.\nStop when Apps settings page is visible.",
          +            listOf(
          +                n(1, "Settings", 60, 150),
          +                n(10, "", 700, 840, left = 20, right = 700, clickable = true),
          +                n(11, "Apps", 725, 795, left = 120, right = 350),
          +            ),
          +        )
          +        assertEquals(10, (decision as DeterministicUiNavigatorV43.Decision.Click).index)
          +    }
          +
          +    @Test fun nestedClickableDuplicatesOnSameVisualRowCollapse() {
          +        val decision = DeterministicUiNavigatorV43.decide(
          +            "Go to Apps.",
          +            listOf(
          +                n(10, "Apps", 700, 840, left = 20, right = 700, clickable = true),
          +                n(11, "Apps", 725, 795, left = 120, right = 350, clickable = true),
          +            ),
          +        )
          +        assertTrue(decision is DeterministicUiNavigatorV43.Decision.Click)
          +    }
          +
          +    @Test fun trueDuplicateRowsRemainAmbiguous() {
          +        val decision = DeterministicUiNavigatorV43.decide(
          +            "Go to Apps.",
          +            listOf(
          +                n(10, "Apps", 500, 620, clickable = true),
          +                n(20, "Apps", 1000, 1120, clickable = true),
