          +        assertEquals(DeterministicUiNavigatorV43.Decision.None, visible)
          +
          +        val missing = DeterministicUiNavigatorV43.decide(
          +            "Open Settings.\nScroll until About phone is visible.\nDo not open About phone.\nStop when About phone is visible.",
          +            listOf(n(4, "Software update", 1200, 1320, clickable = true)),
          +        )
          +        assertTrue(missing is DeterministicUiNavigatorV43.Decision.Scan)
          +        assertFalse(missing is DeterministicUiNavigatorV43.Decision.Click)
          +    }
          +
          +    @Test fun boundedScanReversesAfterDownBoundaryAndThenExhausts() {
          +        val p = DeterministicUiNavigatorV43.ScanProgress()
          +        assertEquals(DeterministicUiNavigatorV43.Direction.DOWN, DeterministicUiNavigatorV43.nextDirection(p, DeterministicUiNavigatorV43.Direction.DOWN))
          +        DeterministicUiNavigatorV43.recordScroll(p, DeterministicUiNavigatorV43.Direction.DOWN, viewportMoved = false)
          +        assertEquals(DeterministicUiNavigatorV43.Direction.UP, DeterministicUiNavigatorV43.nextDirection(p, DeterministicUiNavigatorV43.Direction.DOWN))
          +        DeterministicUiNavigatorV43.recordScroll(p, DeterministicUiNavigatorV43.Direction.UP, viewportMoved = false)
          +        assertTrue(DeterministicUiNavigatorV43.exhausted(p))
          +    }
          +    @Test fun dispatchGroundingPreservesTextIdentityWhileClickingParentRow() {
