          +                "[3] TextView t=\"Display\" C\n[4] TextView t=\"Connections\" C",
          +            ),
          +            apps,
          +        )
          +        assertEquals("CLICK_NODE|3", spec.forcedAction)
          +    }
          +
          +    @Test fun fallbackCannotClickCompletelyUnrelatedRows() {
          +        val spec = PrimaryLocalGrammarV43.build(
          +            "R2",
          +            request(
          +                "Find install unknown apps without using search.",
          +                "com.android.settings",
          +                "[2] TextView t=\"Connections\" C\n[3] TextView t=\"Galaxy AI\" C\n[9] RecyclerView S",
          +            ),
          +            apps,
          +        )
          +        assertNull(spec.forcedAction)
          +        assertFalse(spec.grammar.contains("CLICK_NODE|"))
          +        assertTrue(spec.grammar.contains("PRIMARY_ESCALATE|"))
          +    }
          +
          +    @Test fun goalRelevantAppsRowCanRemainAPlannerChoice() {
          +        val spec = PrimaryLocalGrammarV43.build(
          +            "R3",
          +            request(
          +                "Find which apps are allowed to install unknown apps.",
          +                "com.android.settings",
          +                "[2] TextView t=\"Connections\" C\n[7] TextView t=\"Apps\" C\n[9] RecyclerView S",
          +            ),
          +            apps,
          +        )
          +        assertNull(spec.forcedAction)
          +        assertTrue(spec.grammar.contains("\"7\""))
          +        assertFalse(spec.grammar.contains("\"2\""))
          +        assertEquals("goal_grounded_fallback", spec.mode)
          +    }
