          +            Regex("(?im)^\\s*scroll\\s+(?:down\\s+|up\\s+)?until\\s+(.+?)\\s+is\\s+visible\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*scroll\\s+(?:down\\s+|up\\s+)?until\\s+(.+?)\\s+appears\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*scroll\\s+(?:down\\s+|up\\s+)?to\\s+(.+?)\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*اسکرول\\s+کن\\s+تا\\s+(.+?)\\s+(?:دیده|نمایان)\\s+(?:شود|بشود)\\s*[.!؟]?\\s*$"),
