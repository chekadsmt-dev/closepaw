          +        assertTrue(decision is DeterministicUiNavigatorV43.Decision.Ambiguous)
          +    }
          +
          +    @Test fun pageHeaderMarksEarlierStepCompleteAndAdvances() {
          +        val decision = DeterministicUiNavigatorV43.decide(
          +            "Open Settings.\nGo to Apps.\nGo to Choose default apps.\nStop when Choose default apps page is visible.",
          +            listOf(
