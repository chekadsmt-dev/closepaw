          +    private fun preferredDirectionFor(goal: String, target: String): Direction {
          +        val n = normalize(goal)
          +        val t = normalize(target)
          +        val targetPos = if (t.isBlank()) -1 else n.indexOf(t)
          +        val prefix = if (targetPos > 0) n.substring(max(0, targetPos - 80), targetPos) else n
          +        return if (containsPhrase(prefix, "scroll up") || prefix.contains("بالا")) Direction.UP else Direction.DOWN
          +    }
          +
          +    private fun targetVariants(target: String): Set<String> {
          +        val base = normalize(target)
          +        if (base.isBlank()) return emptySet()
          +        val out = linkedSetOf(base)
          +        val suffixes = listOf(
          +            " settings page", " setting page", " settings screen", " setting screen",
          +            " settings", " setting", " screen", " page", " menu", " option", " section",
          +            " صفحه", " تنظیمات", " منو", " گزینه", " بخش",
          +        ).map(::normalize)
          +        var current = base
          +        var changed = true
          +        while (changed) {
          +            changed = false
          +            for (suffix in suffixes) {
          +                if (current.endsWith(suffix) && current.length > suffix.length + 1) {
          +                    current = current.removeSuffix(suffix).trim()
          +                    if (current.isNotBlank() && out.add(current)) changed = true
          +                    break
          +                }
          +            }
          +        }
          +        return out
          +    }
          +
          +    private fun normalizeTargetPhrase(raw: String): String =
          +        targetVariants(raw).lastOrNull().orEmpty()
          +
          +    private fun nodeValues(node: NodeEvidence): List<String> =
          +        listOf(node.text, node.description, node.hint).filter { it.isNotBlank() }
          +
          +    private fun containsCenter(container: NodeEvidence, child: NodeEvidence): Boolean =
          +        child.centerX in container.left..container.right && child.centerY in container.top..container.bottom
          +
          +    private fun normalize(value: String): String {
          +        val deaccented = Normalizer.normalize(value, Normalizer.Form.NFKD)
          +            .replace(Regex("\\p{M}+"), "")
          +            .lowercase(Locale.ROOT)
          +            .replace('ي', 'ی')
          +            .replace('ك', 'ک')
          +        return deaccented
          +            .replace(Regex("[^\\p{L}\\p{N}._-]+"), " ")
          +            .replace(Regex("\\s+"), " ")
          +            .trim()
          +    }
          +
          +    private fun containsPhrase(haystack: String, needle: String): Boolean {
          +        if (needle.isBlank()) return false
          +        if (haystack == needle) return true
          +        return (" $haystack ").contains(" $needle ")
          +    }
          +}
