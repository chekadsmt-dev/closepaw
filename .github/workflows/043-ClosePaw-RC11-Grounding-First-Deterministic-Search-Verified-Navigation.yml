          +            n(2, "Choose default apps", 420, 540, clickable = true),
          +        )
          +        assertTrue(DeterministicUiNavigatorV43.isDestinationHeader("Apps", page))
          +
          +        val mainList = listOf(
          +            n(10, "Apps", 700, 840, clickable = true),
          +            n(11, "Apps", 725, 795, left = 120, right = 350),
          +        )
          +        assertFalse(DeterministicUiNavigatorV43.isDestinationHeader("Apps", mainList))
          +    }
          +
          +    @Test fun visibleOnlyGoalNeverClicksTarget() {
          +        val visible = DeterministicUiNavigatorV43.decide(
