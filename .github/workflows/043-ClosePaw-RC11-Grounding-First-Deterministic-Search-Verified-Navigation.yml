          +package ai.closepaw.app
          +
          +import ai.closepaw.platform.AppInfo
          +import java.text.Normalizer
          +import java.util.Locale
          +
          +/**
          + * RC11 request-scoped semantic GBNF for the phone-local llama.cpp-compatible Primary.
          + *
          + * V36 constrained only syntax and still allowed arbitrary semantic arguments. V37 removes
          + * arbitrary side-effect arguments entirely. The model can only emit actions whose targets
          + * are grounded in the current request: an explicitly requested installed app, a node index
          + * present in the current snapshot, a bounded scroll/wait/system action, or escalation.
          + *
          + * The existing V33 parser + RC11 runtime validation remain authoritative after generation.
          + */
          +internal object PrimaryLocalGrammarV43 {
          +    internal data class Spec(
          +        val grammar: String,
          +        val forcedAction: String? = null,
          +        val mode: String,
          +    )
          +
          +    private data class NodeChoice(
          +        val index: Int,
          +        val text: String,
          +        val description: String,
          +        val clickable: Boolean,
          +        val scrollable: Boolean,
          +    )
          +
          +    fun build(
          +        requestId: String,
          +        request: String,
          +        installedApps: List<AppInfo>,
          +    ): Spec {
          +        require(requestId.isNotBlank()) { "Primary grammar requires a request lease" }
          +        val lease = "REQ|$requestId|"
          +        val goal = block(request, "GOAL_BEGIN", "GOAL_END")
          +        val currentPackage = request.lineSequence()
          +            .firstOrNull { it.startsWith("CURRENT_APP:") }
          +            ?.substringAfter("CURRENT_APP:")
          +            ?.trim()
          +            .orEmpty()
          +        val nodes = parseNodes(request)
          +
          +        val explicitlyRequestedApp = explicitOpenTarget(goal, installedApps)
          +        if (explicitlyRequestedApp != null && explicitlyRequestedApp.packageName != currentPackage) {
          +            val action = "OPEN_APP|${protocolEscape(explicitlyRequestedApp.packageName)}"
          +            return forced(lease, action, "forced_explicit_open_app")
          +        }
          +
          +        val explicitVisibleNode = explicitVisibleTarget(goal, nodes)
          +        if (explicitVisibleNode != null) {
          +            val action = "CLICK_NODE|${explicitVisibleNode.index}"
          +            return forced(lease, action, "forced_explicit_visible_target")
          +        }
          +
          +        val rules = linkedMapOf<String, String>()
          +
          +        // V43: never let the small local planner pick an arbitrary clickable node merely
          +        // because it is present on screen. Directly named targets were already forced above.
          +        // Fallback clicks are limited to nodes with meaningful lexical overlap with USER_GOAL;
          +        // otherwise Primary must scroll/wait/escalate and External Brain remains the reasoning
          +        // fallback. This keeps grounding authoritative and removes the CLICK_NODE|<random row>
          +        // failure mode seen on Samsung Settings.
          +        val clickableIndices = nodes
          +            .filter { it.clickable && nodeRelevantToGoal(goal, it) }
          +            .map { it.index }
          +            .distinct()
          +            .sorted()
          +        if (clickableIndices.isNotEmpty()) {
          +            rules["click-node"] = "\"CLICK_NODE|\" (${alternatives(clickableIndices.map(Int::toString))})"
          +        }
          +
          +        val scrollableIndices = nodes.filter { it.scrollable }.map { it.index }.distinct().sorted()
          +        if (scrollableIndices.isNotEmpty()) {
          +            rules["scroll-node"] = "\"SCROLL_NODE|\" (${alternatives(scrollableIndices.map(Int::toString))}) \"|\" direction"
          +        }
          +
          +        // Generic scroll and short wait are reversible/observation-safe. Free-form text, app
          +        // names, DONE, VERIFY_TEXT, and text entry are intentionally absent in fallback mode.
          +        rules["scroll"] = "\"SCROLL|\" direction"
          +        rules["wait"] = "\"WAIT|\" (\"250\" | \"500\" | \"1000\" | \"1500\" | \"2000\")"
          +
          +        if (explicitSystemAction(goal, "back", listOf("back", "go back", "برگرد", "عقب"))) {
          +            rules["back"] = "\"BACK\""
          +        }
          +        if (explicitSystemAction(goal, "home", listOf("home", "go home", "هوم", "خانه"))) {
          +            rules["home"] = "\"HOME\""
          +        }
          +        if (explicitSystemAction(goal, "recents", listOf("recents", "recent apps", "برنامه های اخیر", "برنامه‌های اخیر"))) {
          +            rules["recents"] = "\"RECENTS\""
          +        }
          +
          +        val actionNames = rules.keys.toList()
          +        val actionAlternatives = actionNames.joinToString(" | ")
          +        val grammar = buildString {
          +            appendLine("root ::= ${gbnfLiteral(lease)} action | escalate")
          +            appendLine("action ::= $actionAlternatives")
          +            rules.forEach { (name, rhs) -> appendLine("$name ::= $rhs") }
          +            appendLine("direction ::= \"UP\" | \"DOWN\"")
          +            appendLine("escalate ::= \"PRIMARY_ESCALATE|\" escalation-reason")
          +            appendLine("escalation-reason ::= \"insufficient_context\" | \"ambiguous_target\" | \"unsupported_action\"")
          +        }.trimEnd()
          +        return Spec(grammar = grammar, forcedAction = null, mode = "goal_grounded_fallback")
          +    }
          +
          +    private fun forced(lease: String, action: String, mode: String): Spec {
          +        val grammar = "root ::= ${gbnfLiteral(lease + action)}"
          +        return Spec(grammar = grammar, forcedAction = action, mode = mode)
          +    }
          +
          +    private fun parseNodes(request: String): List<NodeChoice> {
          +        val nodesBlock = block(request, "NODES_BEGIN", "NODES_END")
          +        val nodePattern = Regex("""^\[(\d+)]\s+.*$""")
          +        val textPattern = Regex("""\st=\"([^\"]*)\"""")
          +        val descPattern = Regex("""\sd=\"([^\"]*)\"""")
          +        return nodesBlock.lineSequence().mapNotNull { raw ->
          +            val line = raw.trim()
          +            val match = nodePattern.matchEntire(line) ?: return@mapNotNull null
          +            val index = match.groupValues[1].toIntOrNull() ?: return@mapNotNull null
          +            NodeChoice(
          +                index = index,
          +                text = textPattern.find(line)?.groupValues?.getOrNull(1).orEmpty(),
          +                description = descPattern.find(line)?.groupValues?.getOrNull(1).orEmpty(),
          +                clickable = Regex("(?:^|\\s)C(?:\\s|$)").containsMatchIn(line),
          +                scrollable = Regex("(?:^|\\s)S(?:\\s|$)").containsMatchIn(line),
          +            )
          +        }.toList()
          +    }
          +
          +    private fun explicitOpenTarget(goal: String, installedApps: List<AppInfo>): AppInfo? {
          +        if (goal.isBlank()) return null
          +        val sentences = goal.split(Regex("[\\n.!?؟]+"))
          +            .map(::normalize)
          +            .filter { it.isNotBlank() }
          +
          +        val matches = installedApps.filter { app ->
          +            val label = normalize(app.label)
          +            val pkg = normalize(app.packageName)
          +            if (label.length < 2 && pkg.length < 2) return@filter false
          +            sentences.any { sentence ->
          +                val mentionsApp = containsPhrase(sentence, label) || containsPhrase(sentence, pkg)
          +                val affirmativeOpen = listOf("open", "launch", "start", "باز کن", "بازش کن").any { containsPhrase(sentence, normalize(it)) }
          +                val negativeOpen = listOf(
          +                    "do not open", "dont open", "don't open", "never open",
          +                    "باز نکن", "بازش نکن",
          +                ).any { containsPhrase(sentence, normalize(it)) }
          +                mentionsApp && affirmativeOpen && !negativeOpen
          +            }
          +        }.distinctBy { it.packageName }
          +
          +        return matches.singleOrNull()
          +    }
          +
          +    private fun explicitVisibleTarget(goal: String, nodes: List<NodeChoice>): NodeChoice? {
          +        val phrases = explicitNavigationPhrases(goal)
          +        if (phrases.isEmpty()) return null
          +
          +        // V43 preserves ordered navigation matching when a directly named target is already visible. A completed earlier step normally
          +        // becomes a non-clickable page title, so the first still-clickable exact target is the
          +        // current step. Ambiguity within one step remains fail-closed.
          +        for (phrase in phrases) {
          +            val candidates = nodes.filter { node ->
          +                if (!node.clickable) return@filter false
          +                val values = listOf(node.text, node.description)
          +                    .map(::normalize)
          +                    .filter { it.length >= 2 && it !in GENERIC_NODE_WORDS }
          +                values.any { value -> phrase == value || containsPhrase(phrase, value) }
          +            }.distinctBy { it.index }
          +            if (candidates.size == 1) return candidates.single()
          +            if (candidates.size > 1) return null
          +        }
          +        return null
          +    }
          +
          +    private fun explicitNavigationPhrases(goal: String): List<String> {
          +        val out = mutableListOf<String>()
          +        val patterns = listOf(
          +            Regex("(?i)\\bgo\\s+to\\s+(?:the\\s+)?([^\\n.!?؛;]+)"),
          +            Regex("(?i)\\b(?:tap|click|select|choose)\\s+(?:on\\s+)?(?:the\\s+)?([^\\n.!?؛;]+)"),
          +            Regex("برو\\s+به\\s+([^\\n.!?؟؛;]+)"),
          +            Regex("روی\\s+([^\\n.!?؟؛;]+?)\\s+(?:بزن|کلیک کن)"),
          +            Regex("([^\\n.!?؟؛;]+?)\\s+(?:را|رو)\\s+انتخاب\\s+کن"),
          +        )
          +        patterns.forEach { regex ->
          +            regex.findAll(goal).forEach { match ->
          +                val raw = match.groupValues.getOrNull(1).orEmpty()
          +                normalizeTargetPhrase(raw).takeIf { it.isNotBlank() }?.let(out::add)
          +            }
          +        }
          +        return out.distinct()
          +    }
          +
          +    private fun normalizeTargetPhrase(raw: String): String {
          +        var value = normalize(raw)
          +        val removableSuffixes = listOf(
          +            " screen", " settings", " setting", " menu", " option", " section", " page",
          +            " صفحه", " تنظیمات", " منو", " گزینه", " بخش",
          +        ).map(::normalize)
          +        for (suffix in removableSuffixes) {
          +            if (value.endsWith(suffix) && value.length > suffix.length + 1) {
          +                value = value.removeSuffix(suffix).trim()
          +            }
          +        }
          +        return value
          +    }
          +
          +    private fun nodeRelevantToGoal(goal: String, node: NodeChoice): Boolean {
          +        val goalTokens = normalize(goal)
          +            .split(' ')
          +            .filter { it.length >= 3 && it !in GOAL_STOP_WORDS }
          +            .toSet()
          +        if (goalTokens.isEmpty()) return false
          +        val nodeText = normalize(listOf(node.text, node.description).joinToString(" "))
          +        if (nodeText.isBlank()) return false
          +        val nodeTokens = nodeText.split(' ').filter { it.length >= 2 }.toSet()
          +        if (nodeTokens.any { it in goalTokens }) return true
          +        return goalTokens.any { token -> containsPhrase(nodeText, token) }
          +    }
          +
          +    private fun explicitSystemAction(goal: String, canonical: String, phrases: List<String>): Boolean {
          +        val normalizedGoal = normalize(goal)
          +        if (normalizedGoal.isBlank()) return false
          +        return phrases.map(::normalize).any { phrase ->
          +            containsPhrase(normalizedGoal, phrase) && !containsPhrase(normalizedGoal, "do not $canonical")
          +        }
          +    }
          +
          +    private fun block(value: String, begin: String, end: String): String {
          +        val after = value.substringAfter("$begin\n", missingDelimiterValue = "")
          +        if (after.isBlank()) return ""
          +        return after.substringBefore("\n$end", missingDelimiterValue = after)
          +    }
          +
          +    private fun normalize(value: String): String {
          +        val deaccented = Normalizer.normalize(value, Normalizer.Form.NFKD)
          +            .replace(Regex("\\p{M}+"), "")
          +            .lowercase(Locale.ROOT)
          +            .replace('ي', 'ی')
          +            .replace('ك', 'ک')
          +        return deaccented
          +            .replace(Regex("[^\\p{L}\\p{N}._-]+"), " ")
          +            .replace(Regex("\\s+"), " ")
          +            .trim()
          +    }
          +
          +    private fun containsPhrase(haystack: String, needle: String): Boolean {
          +        if (needle.isBlank()) return false
          +        if (haystack == needle) return true
          +        return (" $haystack ").contains(" $needle ")
          +    }
          +
          +    private fun alternatives(values: List<String>): String =
          +        values.distinct().joinToString(" | ") { gbnfLiteral(it) }
          +
          +    private fun protocolEscape(value: String): String = buildString {
          +        value.forEach { ch ->
          +            when (ch) {
          +                '\\' -> append("\\\\")
          +                '|' -> append("\\|")
          +                '\n' -> append("\\n")
          +                '\r' -> append("\\r")
          +                '\t' -> append("\\t")
          +                else -> append(ch)
          +            }
          +        }
          +    }
          +
          +    private fun gbnfLiteral(value: String): String = buildString {
          +        append('"')
          +        value.forEach { ch ->
          +            when (ch) {
          +                '\\' -> append("\\\\")
          +                '"' -> append("\\\"")
          +                '\n' -> append("\\n")
          +                '\r' -> append("\\r")
          +                '\t' -> append("\\t")
          +                else -> append(ch)
          +            }
          +        }
          +        append('"')
          +    }
          +
          +    private val GENERIC_NODE_WORDS = setOf(
          +        "settings", "setting", "menu", "button", "back", "home", "close", "open",
          +        "تنظیمات", "منو", "دکمه", "بستن", "باز",
          +    )
          +
          +
          +    private val GOAL_STOP_WORDS = setOf(
          +        "open", "launch", "start", "stop", "when", "once", "visible", "shown", "appears",
          +        "settings", "setting", "screen", "page", "menu", "option", "section", "current",
          +        "go", "to", "the", "and", "then", "do", "not", "change", "any", "until", "scroll",
          +        "click", "tap", "select", "choose", "with", "this", "that", "from", "into", "inside",
          +    )
          +}
