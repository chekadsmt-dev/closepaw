      - name: Verify 066 scope and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCOPE'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('066-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV66Test.kt',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'066 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')

          a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          s=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt').read_text()
          p=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58.kt').read_text()
          checks={
              'whole manager surface detector': 'managerSurfaceFingerprintV66' in a and 'managerSurfaceHashV66' in a,
              'uncertainty scans instead of false unchanged': 'MANAGER_SURFACE_UNCERTAIN' in o and 'surfaceHash = if (surfaceStable)' in o,
              'periodic structural audit': 'MANAGER_EXACT_AUDIT_INTERVAL_MS = 120_000L' in o,
              'assistant toolbar grounding': 'assistantContainerForChromeV66' in a and 'RESPONSE_CHROME_EVIDENCE_LABELS' in a,
              'canonical response identity': 'canonicalAssistantResponseV66' in a and 'assistantResponseHashV66' in a,
              'cursor migration metadata': 'manager_cursor_format:' in s and 'isManagerCursorV66' in s,
              'stale replay safe migration': 'MANAGER_CURSOR_MIGRATED_V66' in o,
              'route UI transaction priority retained': 'A durable non-terminal route is one physical UI transaction' in o,
              'marker whitespace recovery retained': 'correlationMarkerMatchesV65' in a,
              'bounded manager fail closed retained': 'MAX_CONSECUTIVE_MANAGER_SCAN_FAILURES = 3' in o and 'MANAGER_SCAN_FAIL_CLOSED' in o,
              'whole-response route parser retained': 'compactBlocks(controlView, "ROUTE_TASK", "END_ROUTE_TASK")' in p,
              'version 066': 'versionNameSuffix = "-rc11-c066"' in Path('app/build.gradle.kts').read_text(),
              'label 066': 'ClosePaw RC11 066' in Path('app/src/main/res/values/strings.xml').read_text(),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f'066 invariant audit failed: {bad}')

          Path('066-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('066-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('066-postpatch-manifest-sha256.txt').write_text(sha+'  066-postpatch-source-manifest.json\n')
          with Path('066-verification-report.txt').open('a') as f:
              f.write(f'066 postpatch source manifest SHA-256: {sha}\n')
          print('066 scope/invariant audit: PASS', sha)
          PYSCOPE

