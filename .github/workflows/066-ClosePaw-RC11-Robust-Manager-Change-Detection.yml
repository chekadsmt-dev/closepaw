name: 066 - ClosePaw RC11 Robust Manager Change Detection
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 065 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='065-ClosePaw-RC11-verified-full-source'
          EXPECTED_ARTIFACT_DIGEST='sha256:024f226e820954f3129a57f80ebe5d6f8e63368300917a9d1408f15cff2c02d4'
          EXPECTED_MANIFEST_SHA='0a118901dace0dcaac61325fd9834f997a795590ccf0b19b7d1e4541c194558e'
          export ARTIFACT_NAME EXPECTED_ARTIFACT_DIGEST EXPECTED_MANIFEST_SHA
          rm -rf /tmp/065-source /tmp/065-normalized /tmp/065-artifact.zip /tmp/065-list.json
          mkdir -p /tmp/065-source
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/065-list.json
          python3 - <<'PYMETA'
          import json,os
          d=json.load(open('/tmp/065-list.json'))
          name=os.environ.get('ARTIFACT_NAME','065-ClosePaw-RC11-verified-full-source')
          expected=os.environ.get('EXPECTED_ARTIFACT_DIGEST','sha256:024f226e820954f3129a57f80ebe5d6f8e63368300917a9d1408f15cff2c02d4')
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches: raise SystemExit('verified 065 full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          if chosen.get('digest') != expected:
              raise SystemExit(f'065 artifact digest mismatch: {chosen.get("digest")} != {expected}')
          open('/tmp/065-artifact-id','w').write(str(chosen['id']))
          open('/tmp/065-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('065 artifact identity PASS', chosen['id'], chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/065-artifact-id)"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/065-artifact.zip
          unzip -q /tmp/065-artifact.zip -d /tmp/065-source
          MANIFEST="$(find /tmp/065-source -type f -name '065-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '065 source manifest missing' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/065-source' ]; then
            mkdir -p /tmp/065-normalized
            cp -a "$ROOT"/. /tmp/065-normalized/
            rm -rf /tmp/065-source
            mv /tmp/065-normalized /tmp/065-source
          fi
          ACTUAL_MANIFEST_SHA="$(sha256sum /tmp/065-source/065-postpatch-source-manifest.json | awk '{print $1}')"
          [ "$ACTUAL_MANIFEST_SHA" = "$EXPECTED_MANIFEST_SHA" ] || { echo "065 manifest SHA mismatch: $ACTUAL_MANIFEST_SHA" >&2; exit 1; }
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/065-source')
          manifest=json.loads((root/'065-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'065 source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          build=(root/'app/build.gradle.kts').read_text(); strings=(root/'app/src/main/res/values/strings.xml').read_text()
          assert 'versionNameSuffix = "-rc11-c065"' in build
          assert 'ClosePaw RC11 065' in strings
          print('verified 065 source identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/065-source/ ./
          cp 065-postpatch-source-manifest.json 066-baseline-source-manifest.json
          cat > 066-verification-report.txt <<'REPORT'
          ClosePaw RC11 066 verification report
          Baseline: exact verified 065 full-source artifact, pinned by GitHub artifact digest and source-manifest SHA-256.
          Device evidence from c065: the manager visibly produced CP065-E2E-04-001, but the router repeatedly emitted MANAGER_SCAN_UNCHANGED|surface=true and never emitted MANAGER_RESPONSE_PARSED or ROUTE_DISCOVERED. The c065 quiet detector hashed only the last structurally recognized assistant response; a newly rendered assistant turn could therefore be invisible to the optimization gate.
          066 scope: whole-visible-conversation surface fingerprint; uncertainty falls through to structural scanning; periodic 120s structural audit; response-toolbar-grounded assistant-turn discovery in addition to Copy-grounding; whitespace-canonical cursor hashes; one-time stale-replay-safe migration of pre-066 manager cursors; route transaction priority and marker recovery from 065 preserved.
          REPORT
          cat /tmp/065-artifact-meta.txt >> 066-verification-report.txt

      - name: Baseline 065 clean compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 065 clean compile: PASS' >> 066-verification-report.txt

