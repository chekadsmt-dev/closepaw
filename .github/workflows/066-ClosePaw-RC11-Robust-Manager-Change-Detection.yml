          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('066-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected: raise SystemExit('066 production source changed during build/tests')
          print('066 post-test source identity: PASS')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '066 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 066-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 066-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c066'" 066-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 066'" 066-apk-badging.txt
          sha256sum "$APK" > 066-apk-sha256.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 066-apksigner.txt
          echo "066 APK identity: PASS ($APK)" >> 066-verification-report.txt
