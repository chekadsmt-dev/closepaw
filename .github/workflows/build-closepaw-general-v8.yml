name: Build ClosePaw General Execution Engine v8

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Adaptive v7.3 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-closepaw-adaptive-v7-3.yml')
          if not workflow.exists():
              raise SystemExit(
                  'Missing required base workflow: build-closepaw-adaptive-v7-3.yml'
              )

          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == marker
              )
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []
              for line in lines[run_idx + 1:]:
                  if line.strip() and (
                      len(line) - len(line.lstrip())
                  ) < body_indent:
                      break
                  body.append(
                      '' if not line.strip()
                      else line[body_indent:]
                  )

              result = subprocess.run(
                  ['bash'],
                  input='\n'.join(body) + '\n',
                  text=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f'Base step failed: {step_name}'
                  )

          run_step('Apply Adaptive v7.2 source')
          run_step('Apply v7.3 search-field runtime fix')
          print('ADAPTIVE V7.3 SOURCE: PASS')
          PY

      - name: Apply General Execution Engine v8
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/general_v8_patch.py
          python3 -m py_compile /tmp/general_v8_patch.py
          python3 /tmp/general_v8_patch.py

      - name: Patch side-by-side identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text(encoding='utf-8')
          old = 'applicationIdSuffix = ".smt"'
          if old not in s:
              raise SystemExit('applicationIdSuffix anchor missing')
          s = s.replace(
              old,
              'applicationIdSuffix = ".generalv8"',
              1,
          )
          if 'versionNameSuffix = "-smt"' in s:
              s = s.replace(
                  'versionNameSuffix = "-smt"',
                  'versionNameSuffix = "-general-v8"',
                  1,
              )
          gradle.write_text(s, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s, count = re.subn(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">ClosePaw General v8</string>',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('app_name anchor missing')
          strings.write_text(s, encoding='utf-8')
          print('IDENTITY: PASS')
          PY

      - name: Gate 1 - receipt architecture invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          checks = [
              'private data class V8ActionReceipt',
              'buildPostActionReceiptV8',
              'transition-receipt',
              'input-receipt',
              'persistReceiptV8',
              'receiptHistoryLineV8',
              'receiptCompletesNavigationGoalV8',
              'Navigation completed by post-action receipt',
              'NEVER repeat a receipt-confirmed action',
              'planQueue.addAll(plan.actions)',
              'V7_MAX_BRAIN_PER_STATE = 1',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(
                  'Receipt architecture missing: ' + ', '.join(missing)
              )

          start = s.index('    private suspend fun processTask(')
          end = s.index('    private fun semanticLabelFromActionV8', start)
          process = s[start:end]
          if 'if (!outcome.success) {' in process:
              raise SystemExit('Old outcome-only failure branch remains')

          print('GATE 1 receipt architecture: PASS')
          PY

      - name: Gate 2 - modeled receipt acceptance tests
        shell: bash
        run: |
          python3 - <<'PY'
          def accept(executor_success, transition_capable, changed, input_capable=False, input_visible=False):
              return (
                  executor_success or
                  (transition_capable and changed) or
                  (input_capable and input_visible)
              )

          cases = {
              'click destination, source text disappears':
                  accept(False, True, True),
              'open app changes package/screen':
                  accept(False, True, True),
              'set-text node disappears but typed value visible':
                  accept(False, False, False, True, True),
              'no UI change is not accepted':
                  not accept(False, True, False),
              'executor success remains success':
                  accept(True, False, False),
          }

          failed = [name for name, ok in cases.items() if not ok]
          if failed:
              raise SystemExit('Modeled receipt tests failed: ' + ', '.join(failed))

          print('GATE 2 modeled receipt acceptance: PASS')
          PY

      - name: Gate 3 - Kotlin compile
        run: ./gradlew :app:compileDebugKotlin

      - name: Gate 4 - unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Gate 5 - assemble APK
        run: ./gradlew assembleDebug

      - name: Gate 6 - APK integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not apk.exists():
              raise SystemExit('APK missing')
          if apk.stat().st_size < 1_000_000:
              raise SystemExit('APK unexpectedly small')

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for required in [
                  'AndroidManifest.xml',
                  'classes.dex',
                  'resources.arsc',
              ]:
                  if required not in names:
                      raise SystemExit('APK missing ' + required)
              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)

          print(
              f'GATE 6 APK integrity: PASS ({apk.stat().st_size} bytes)'
          )
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-General-v8-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
