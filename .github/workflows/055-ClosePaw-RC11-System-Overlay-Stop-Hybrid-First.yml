          got=hashlib.sha256(Path('055-postpatch-source-manifest.json').read_bytes()).hexdigest()
          if got!='f4a0a8e180f0e154f490a41692db339738a3bea7438f645fad438f0f599dc75d': raise SystemExit(f'055 manifest digest mismatch {got}')
