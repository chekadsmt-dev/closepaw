          git apply --check 055-isolated.patch
          git apply 055-isolated.patch
          echo '055 isolated patch applied: PASS' >> 055-verification-report.txt

      - name: Verify 055 exact isolation and stop-routing contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          base=json.loads(Path('054-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sha(p)
          changed={p for p in set(base)|set(current) if base.get(p)!=current.get(p)}
          expected={
            'app/build.gradle.kts',
            'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
            'app/src/main/res/values/strings.xml',
          }
          if changed!=expected: raise SystemExit(f'055 isolation failure changed={sorted(changed)}')
          expected_hashes={
            'app/build.gradle.kts':'212cfa4fca5f1993f23a61ff556fc11754e6500921dc42493a0db50b9f2cc664',
            'app/src/main/kotlin/ai/closepaw/app/AgentService.kt':'b9259586a723ee244928b48ebe41c801d3a143a32a408c988cebf4785601aa81',
            'app/src/main/res/values/strings.xml':'160b955bf1d295d7f1d8041154dfbeb469b207c159b62995fc2052c92d5718d8',
          }
          for p,want in expected_hashes.items():
              got=current[p]
              if got!=want: raise SystemExit(f'055 expected hash mismatch {p}: {got} != {want}')

          service=Path('app/src/main/kotlin/ai/closepaw/app/AgentService.kt').read_text()
          start=service.index('onStop = {')
          end=service.index('onTakeover =', start)
          stop_block=service[start:end]
          if 'if (!stopActiveHybridTaskFromUi())' not in stop_block: raise SystemExit('Hybrid-first overlay Stop missing')
          if 'submitOp(Op.Shutdown)' not in stop_block: raise SystemExit('legacy overlay Stop fallback missing')
          if stop_block.index('stopActiveHybridTaskFromUi()') > stop_block.index('submitOp(Op.Shutdown)'): raise SystemExit('legacy stop occurs before Hybrid stop')

          frozen={
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'48afff8c0b8f7e58f3dea2e72e8adcffc1fa9d2ad97e8d4db480555f3eb38027',
            'app/src/main/kotlin/ai/closepaw/ui/chat/ChatViewModel.kt':'0efb57a30d09c10758fe2b97caefac7d3e31d40e1130eb7fae7243e186aec474',
            'app/src/main/kotlin/ai/closepaw/app/CancellablePrimaryCallV54.kt':'92d463ff0a8214a2bbb598c7db5c5c04279d0404ba99941a802b160f2fa182f3',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt':'945670dd4f8818b10933245a27298dfe0de4b9da590c54f06a9ba4657e11301f',
            'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt':'b1be3b8953bc0620a921d6e639e68ee1ae4a61952d20a52943da148a3edbee37',
            'app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt':'eed7423a080b1d8b8b8a40ac943f88a62db658c5eb12f9a638fc3974cc938e73',
            'app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt':'683a9f6d8b5c8a676ba00bb9cda4cf954314470afae4a9b2bf1ab3862f6ea47e',
            'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt':'a75c7ea133c1100e229debf071e0d4063a1c9cb1c3cee3191d2ca4f37f2a5894',
            'app/src/main/kotlin/ai/closepaw/app/CausalWindowTitleV52.kt':'31074f2744d71b78277d8fa08e95a460e0d4043c39fcc3a9ce93f1e33620485f',
