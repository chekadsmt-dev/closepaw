name: 055 - ClosePaw RC11 Overlay Stop Routes Hybrid First

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 054 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID='10344837628'
          EXPECTED_RUN='34836436419'
          EXPECTED_DIGEST='sha256:00e6c0241b5ac3a8623eebaf5cd352901b9f43edc073f9b8fa80df8c0b15a7b2'
          EXPECTED_MANIFEST_SHA='9790dc574c1c7c9ee7fd9276559f3d8e8275ad04080051819252e5c9505c9508'
          rm -rf /tmp/054-source /tmp/054-artifact.zip /tmp/054-meta.json
          mkdir -p /tmp/054-source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            -o /tmp/054-meta.json
          python3 - <<'PYMETA'
          import json
          d=json.load(open('/tmp/054-meta.json'))
          if d.get('expired'): raise SystemExit('054 Source of Truth artifact expired')
          if d.get('name')!='054-ClosePaw-RC11-verified-full-source': raise SystemExit(f"wrong artifact name: {d.get('name')}")
          if d.get('digest')!='sha256:00e6c0241b5ac3a8623eebaf5cd352901b9f43edc073f9b8fa80df8c0b15a7b2': raise SystemExit(f"wrong artifact digest: {d.get('digest')}")
          if str((d.get('workflow_run') or {}).get('id'))!='34836436419': raise SystemExit('wrong source run')
          print('054 artifact identity: PASS')
          PYMETA
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/054-artifact.zip
          unzip -q /tmp/054-artifact.zip -d /tmp/054-source
          MANIFEST="$(find /tmp/054-source -type f -name '054-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '054 manifest missing' >&2; exit 1; }
          [ "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA" ] || { echo '054 manifest identity mismatch' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/054-source' ]; then
            rm -rf /tmp/054-normalized && mkdir -p /tmp/054-normalized
            cp -a "$ROOT"/. /tmp/054-normalized/
            rm -rf /tmp/054-source
            mv /tmp/054-normalized /tmp/054-source
          fi
          echo 'Exact verified 054 Source of Truth restored: PASS'

      - name: Verify and activate exact 054 Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/054-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test "$(sha256sum /tmp/054-source/054-postpatch-source-manifest.json | awk '{print $1}')" = '9790dc574c1c7c9ee7fd9276559f3d8e8275ad04080051819252e5c9505c9508'
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/054-source/. ./
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads(Path('054-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sha(p)
          if current != expected:
              missing=sorted(set(expected)-set(current)); added=sorted(set(current)-set(expected)); changed=sorted(k for k in set(expected)&set(current) if expected[k]!=current[k])
              raise SystemExit(f'054 manifest mismatch missing={missing[:8]} added={added[:8]} changed={changed[:8]}')
          critical={
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'48afff8c0b8f7e58f3dea2e72e8adcffc1fa9d2ad97e8d4db480555f3eb38027',
            'app/src/main/kotlin/ai/closepaw/ui/chat/ChatViewModel.kt':'0efb57a30d09c10758fe2b97caefac7d3e31d40e1130eb7fae7243e186aec474',
            'app/src/main/kotlin/ai/closepaw/app/CancellablePrimaryCallV54.kt':'92d463ff0a8214a2bbb598c7db5c5c04279d0404ba99941a802b160f2fa182f3',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt':'945670dd4f8818b10933245a27298dfe0de4b9da590c54f06a9ba4657e11301f',
            'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt':'b1be3b8953bc0620a921d6e639e68ee1ae4a61952d20a52943da148a3edbee37',
            'app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt':'eed7423a080b1d8b8b8a40ac943f88a62db658c5eb12f9a638fc3974cc938e73',
            'app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt':'683a9f6d8b5c8a676ba00bb9cda4cf954314470afae4a9b2bf1ab3862f6ea47e',
            'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt':'a75c7ea133c1100e229debf071e0d4063a1c9cb1c3cee3191d2ca4f37f2a5894',
            'app/src/main/kotlin/ai/closepaw/app/CausalWindowTitleV52.kt':'31074f2744d71b78277d8fa08e95a460e0d4043c39fcc3a9ce93f1e33620485f',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53.kt':'92fa34059e602da10fabf9fef511ae3f1971efa576346918ef172bdb52751f23',
            'app/src/main/kotlin/ai/closepaw/memory/MemoryRecaller.kt':'cf71beb7d1e6e0b8d4ab1117e1d4ebb5d3f891f3ee1ac0ae96a4ed66f8e59984',
            'app/src/main/kotlin/ai/closepaw/memory/MemorySchema.kt':'c05a45adeba8f2bb92054dd8cf9f26d364ece5a158823cb9919cea1e86819311',
            'app/src/main/kotlin/ai/closepaw/memory/MemoryStore.kt':'471bdb194e9802d9b210a8985ec6d980d1689407be2ac07c9af306939f718d5e',
            'app/src/main/kotlin/ai/closepaw/tool/impl/RememberExperienceTool.kt':'5bfc8dba5af81342e93f6c31d093c495a01416266ebf68eecd6e472a0e4b8425',
          }
          for p,want in critical.items():
              got=sha(p)
              if got!=want: raise SystemExit(f'054 critical mismatch {p}: {got} != {want}')
          Path('055-verification-report.txt').write_text(
              'ClosePaw RC11 055 verification report\n'
              'Base: exact verified 054 full-source artifact id=10344837628 run=34836436419.\n'
              'Runtime evidence: c054 Diagnostics contains no USER_STOP_V54 event after Stop was pressed while Settings was foreground. The system overlay callback still called submitOp(Op.Shutdown), which targets only the legacy AgentSession path.\n'
              'V55 scope: route the system-overlay Stop callback to stopActiveHybridTaskFromUi() first, preserving the previous legacy Op.Shutdown fallback when no Hybrid task is active.\n'
              'Frozen: V43-V54 navigation/verification/cancellable Primary behavior, RC8/RC11 correctness, Brain path, AccessibilityPlatform, and all Memory files.\n', encoding='utf-8')
          print('054 exact baseline: PASS')
          PYBASE

      - name: Baseline 054 clean compile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 054 clean compile: PASS' >> 055-verification-report.txt

