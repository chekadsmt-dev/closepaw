      - name: 055 clean Kotlin compile gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo '055 clean Kotlin compile: PASS' >> 055-verification-report.txt

      - name: 055 full unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon --no-configuration-cache
          echo '055 full unit tests: PASS' >> 055-verification-report.txt

      - name: 055 clean assemble and APK identity gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo 'APK missing' >&2; exit 1; }
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BT/aapt"
          [ -x "$AAPT" ] || AAPT="$BT/aapt2"
          APKSIGNER="$BT/apksigner"
          "$AAPT" dump badging "$APK" > 055-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c055'" 055-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c055'" 055-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 055'" 055-apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > 055-apksigner-verification.txt
          sha256sum "$APK" > 055-apk-sha256.txt
          cp "$APK" ClosePaw-RC11-055.apk
          echo '055 APK identity/signature: PASS' >> 055-verification-report.txt

      - name: Prepare 055 verified full source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/055-verified-source
          mkdir -p /tmp/055-verified-source
          cp -a . /tmp/055-verified-source/root
          rm -rf /tmp/055-verified-source/root/.git /tmp/055-verified-source/root/.github /tmp/055-verified-source/root/app/build
          test "$(sha256sum /tmp/055-verified-source/root/055-postpatch-source-manifest.json | awk '{print $1}')" = 'f4a0a8e180f0e154f490a41692db339738a3bea7438f645fad438f0f599dc75d'

      - name: Upload 055 verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 055-ClosePaw-RC11-verification-proof
