        run: |
          set -euo pipefail
          cat > /tmp/055.patch.b64 <<'PATCH055_B64'
          ZGlmZiAtLWdpdCBhL2FwcC9idWlsZC5ncmFkbGUua3RzIGIvYXBwL2J1aWxkLmdyYWRsZS5rdHMK
