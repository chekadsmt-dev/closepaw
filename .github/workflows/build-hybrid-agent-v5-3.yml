name: Build ClosePaw Hybrid Agent v5.3

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply v5.2 base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-hybrid-agent-v5-2.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name: str):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []

              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  if not line.strip():
                      body.append('')
                  else:
                      body.append(line[body_indent:])

              script = '\n'.join(body) + '\n'
              subprocess.run(['bash'], input=script, text=True, check=True)

          run_step('Apply Hybrid Agent v5 patch')
          run_step('Fix HybridUiEvent visibility')
          run_step('Fix dedicated Brain discovery')
          print('v5.2 base applied: PASS')
          PY

      - name: Fix pinned Brain selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt')
          text = path.read_text(encoding='utf-8')

          start_marker = '    private suspend fun ensureBrainConversation(platform: AndroidPlatform) {'
          end_marker = '    private fun containsNoResults(text: String): Boolean {'

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Brain navigation anchors not found')

          replacement = base64.b64decode('').decode('utf-8')
          patched = text[:start] + replacement + text[end:]
          path.write_text(patched, encoding='utf-8')

          checks = [
              ('private suspend fun selectPinnedBrainCandidate(' in patched, 'pinned Brain helper'),
              ('n.contains("closepaw") && n.contains("brain")' in patched, 'truncated title matcher'),
              ('pinned.bounds.bottom' in patched and 'recentsTop' in patched, 'Pinned section geometry'),
              ('"CLOSEPAW_BRAIN"' in patched, 'short search fallback'),
              ('NO_UI_CHANGE' in patched, 'loop guard retained'),
          ]
          failed = [name for ok, name in checks if not ok]
          if failed:
              raise SystemExit('v5.3 self-check failed: ' + ', '.join(failed))

          print('Pinned Brain selection fix: PASS')
          PY

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Hybrid-Agent-v5.3-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
