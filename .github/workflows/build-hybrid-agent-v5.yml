name: Build ClosePaw Hybrid Agent v5

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Hybrid Agent v5 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          ROOT = Path('.')
          APP = ROOT / 'app/src/main/kotlin/ai/closepaw/app'

          def dec(value):
              return base64.b64decode(value).decode('utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          protocol = dec('')
          engine = dec('')
          ui_event = dec('')
          (APP / 'HybridAgentProtocol.kt').write_text(protocol, encoding='utf-8')
          (APP / 'HybridAgentEngine.kt').write_text(engine, encoding='utf-8')
          (APP / 'HybridAgentUiEvent.kt').write_text(ui_event, encoding='utf-8')

          STATUS_ANCHOR = dec('ICAgICAgICBwcml2YXRlIHZhbCBfc3RhdHVzRmxvdyA9IE11dGFibGVTdGF0ZUZsb3c8U3RyaW5nPigiIikKICAgICAgICB2YWwgc3RhdHVzRmxvdzogU3RhdGVGbG93PFN0cmluZz4gPSBfc3RhdHVzRmxvdy5hc1N0YXRlRmxvdygpCg==')
          STATUS_EXTRA = dec('')
          AGENT_ANCHOR = dec('ICAgIHByaXZhdGUgdmFsIHNtdFJvdXRlciBieSBsYXp5IHsgU210Um91dGVyKHRoaXMpIH0K')
          AGENT_EXTRA = dec('')
          ONDESTROY_ANCHOR = dec('ICAgICAgICBpZiAoc210Um91dGVyLmlzUnVubmluZykgc210Um91dGVyLnN0b3AoKQo=')
          STOP_ANCHOR = dec('ICAgIGZ1biBzdG9wQWdlbnQoKSB7CiAgICAgICAgc210Um91dGVyLnN0b3AoKQo=')
          STOP_REPL = dec('ICAgIGZ1biBzdG9wQWdlbnQoKSB7CiAgICAgICAgc210Um91dGVyLnN0b3AoKQogICAgICAgIGh5YnJpZEFnZW50LnN0b3AoY2xlYXJRdWV1ZSA9IHRydWUpCg==')
          agent_path = APP / 'AgentService.kt'
          agent = agent_path.read_text(encoding='utf-8')
          if 'val hybridUiEvents: SharedFlow<HybridUiEvent>' not in agent:
              agent = replace_once(agent, STATUS_ANCHOR, STATUS_ANCHOR + STATUS_EXTRA, 'AgentService hybrid UI flow')
          if 'private val hybridAgent by lazy { HybridAgentEngine(this) }' not in agent:
              agent = replace_once(agent, AGENT_ANCHOR, AGENT_ANCHOR + AGENT_EXTRA, 'AgentService hybrid integration')
          if 'hybridAgent.stop(clearQueue = true)' not in agent.split('override fun onDestroy()',1)[1].split('override fun onCreate()',1)[0]:
              agent = replace_once(agent, ONDESTROY_ANCHOR, ONDESTROY_ANCHOR + '        hybridAgent.stop(clearQueue = true)\n', 'AgentService onDestroy stop')
          if STOP_REPL not in agent:
              agent = replace_once(agent, STOP_ANCHOR, STOP_REPL, 'AgentService stopAgent')
          agent_path.write_text(agent, encoding='utf-8')

          OVERLAY_ANCHOR = dec('ICAgIGZ1biBvblRhc2tTdGFydGVkKHRhc2tJZDogU3RyaW5nLCBpbnB1dDogU3RyaW5nKSB7CiAgICAgICAgc3RhdGVIb2xkZXIub25UYXNrU3RhcnRlZCh0YXNrSWQsIGlucHV0KQogICAgICAgIHNob3dQcmVmZXJlbmNlID0gU2hvd1ByZWZlcmVuY2UuQ0FQU1VMRQogICAgICAgIGFwcGx5VmlzaWJpbGl0eSgpCiAgICB9Cg==')
          OVERLAY_EXTRA = dec('')
          overlay_path = APP / 'ServiceOverlayController.kt'
          overlay = overlay_path.read_text(encoding='utf-8')
          if 'fun onHybridTaskStarted(taskId: String, input: String)' not in overlay:
              overlay = replace_once(overlay, OVERLAY_ANCHOR, OVERLAY_ANCHOR + OVERLAY_EXTRA, 'ServiceOverlayController hybrid start')
          overlay_path.write_text(overlay, encoding='utf-8')

          VM_ANCHOR = dec('')
          VM_EXTRA = dec('CgogICAgICAgIGxpZmVjeWNsZVNjb3BlLmxhdW5jaCB7CiAgICAgICAgICAgIEFnZW50U2VydmljZS5oeWJyaWRVaUV2ZW50cy5jb2xsZWN0IHsgZXZlbnQgLT4KICAgICAgICAgICAgICAgIHZpZXdNb2RlbC5hcHBseUh5YnJpZFVpRXZlbnQoZXZlbnQpCiAgICAgICAgICAgIH0KICAgICAgICB9Cg==')
          MAIN_IMPORT_ANCHOR = dec('aW1wb3J0IGtvdGxpbnguY29yb3V0aW5lcy5kZWxheQo=')
          MAIN_IMPORT_EXTRA = dec('aW1wb3J0IGtvdGxpbnguY29yb3V0aW5lcy5mbG93LmNvbGxlY3QK')
          CLOUD_ANCHOR = dec('ICAgICAgICBpZiAoIXZhbGlkYXRlQ2xvdWRLZXlzRm9yU2VsZWN0ZWRNb2RlbHMoKSkgcmV0dXJuCg==')
          MAIN_HYBRID = dec('')
          PENDING_OLD = dec('ICAgICAgICBpZiAoCiAgICAgICAgICAgICFTZXR0aW5ncy5jYW5EcmF3T3ZlcmxheXMoCiAgICAgICAgICAgICAgICB0aGlzCiAgICAgICAgICAgICkKICAgICAgICApIHsKICAgICAgICAgICAgcmV0dXJuCiAgICAgICAgfQoKICAgICAgICAvKgogICAgICAgICAqIFNNVCBSb3V0ZXIgY29tbWFuZHMgZG8gbm90IG5lZWQgY2xvdWQgY3JlZGVudGlhbHMuCiAgICAgICAgICovCg==')
          PENDING_NEW = dec('')
          COND_OLD = dec('ICAgICAgICBpZiAoCiAgICAgICAgICAgICFpc1NtdFJvdXRlckNvbW1hbmQgJiYKICAgICAgICAgICAgZmluZE1pc3NpbmdDbG91ZEtleXMoCg==')
          COND_NEW = dec('ICAgICAgICBpZiAoCiAgICAgICAgICAgICFpc1NtdFJvdXRlckNvbW1hbmQgJiYKICAgICAgICAgICAgIWh5YnJpZFBlbmRpbmcgJiYKICAgICAgICAgICAgZmluZE1pc3NpbmdDbG91ZEtleXMoCg==')
          main_path = APP / 'MainActivity.kt'
          main = main_path.read_text(encoding='utf-8')
          if 'import kotlinx.coroutines.flow.collect' not in main:
              main = replace_once(main, MAIN_IMPORT_ANCHOR, MAIN_IMPORT_ANCHOR + MAIN_IMPORT_EXTRA, 'MainActivity Flow collect import')
          if 'AgentService.hybridUiEvents.collect' not in main:
              main = replace_once(main, VM_ANCHOR, VM_ANCHOR + VM_EXTRA, 'MainActivity hybrid UI bridge')
          if 'HYBRID AGENT V5 INTERCEPT' not in main:
              main = replace_once(main, CLOUD_ANCHOR, MAIN_HYBRID + CLOUD_ANCHOR, 'MainActivity hybrid intercept')
          if 'val hybridPending =' not in main:
              main = replace_once(main, PENDING_OLD, PENDING_NEW, 'MainActivity pending overlay gate')
          if '!hybridPending &&' not in main.split('private fun retryPendingAutoStartGoalIfReady()',1)[1].split('private fun scheduleGoalDispatch',1)[0]:
              main = replace_once(main, COND_OLD, COND_NEW, 'MainActivity pending credential gate')
          main_path.write_text(main, encoding='utf-8')

          CHAT_COMMENT = dec('ICAgIC8qKgogICAgICogU2VuZCBhIHVzZXIgbWVzc2FnZS4KICAgICAqCiAgICAgKiBJZiBubyBzZXNzaW9uIGV4aXN0cywgY2FsbHMgb25TZXNzaW9uTmVlZGVkIGNhbGxiYWNrIHRvIGNyZWF0ZSBvbmUuCiAgICAgKi8K')
          CHAT_METHODS = dec('')
          SEND_ANCHOR = dec('ICAgIGZ1biBzZW5kTWVzc2FnZSh0ZXh0OiBTdHJpbmcpIHsKICAgICAgICB2YWwgc2Vzc2lvbiA9IHNlc3Npb25Qcm92aWRlcigpCg==')
          SEND_REPL = dec('ICAgIGZ1biBzZW5kTWVzc2FnZSh0ZXh0OiBTdHJpbmcpIHsKICAgICAgICB2YWwgc2VydmljZSA9IEFnZW50U2VydmljZS5pbnN0YW5jZQogICAgICAgIGlmIChzZXJ2aWNlICE9IG51bGwgJiYgc2VydmljZS5oYW5kbGVIeWJyaWRJbnB1dCh0ZXh0KSkgcmV0dXJuCgogICAgICAgIHZhbCBzZXNzaW9uID0gc2Vzc2lvblByb3ZpZGVyKCkK')
          chat_path = ROOT / 'app/src/main/kotlin/ai/closepaw/ui/chat/ChatViewModel.kt'
          chat = chat_path.read_text(encoding='utf-8')
          if 'fun applyHybridUiEvent(event: ai.closepaw.app.HybridUiEvent)' not in chat:
              chat = replace_once(chat, CHAT_COMMENT, CHAT_METHODS + CHAT_COMMENT, 'ChatViewModel hybrid UI bridge')
          if 'service.handleHybridInput(text)' not in chat:
              chat = replace_once(chat, SEND_ANCHOR, SEND_REPL, 'ChatViewModel global hybrid intercept')
          chat_path.write_text(chat, encoding='utf-8')

          MANIFEST_ANCHOR = dec('ICAgIDx1c2VzLXBlcm1pc3Npb24gYW5kcm9pZDpuYW1lPSJhbmRyb2lkLnBlcm1pc3Npb24uUkVRVUVTVF9JR05PUkVfQkFUVEVSWV9PUFRJTUlaQVRJT05TIiAvPgo=')
          MANIFEST_EXTRA = dec('ICAgIDx1c2VzLXBlcm1pc3Npb24gYW5kcm9pZDpuYW1lPSJhbmRyb2lkLnBlcm1pc3Npb24uV0FLRV9MT0NLIiAvPgo=')
          manifest_path = ROOT / 'app/src/main/AndroidManifest.xml'
          manifest = manifest_path.read_text(encoding='utf-8')
          if 'android.permission.WAKE_LOCK' not in manifest:
              manifest = replace_once(manifest, MANIFEST_ANCHOR, MANIFEST_ANCHOR + MANIFEST_EXTRA, 'AndroidManifest WAKE_LOCK')
          manifest_path.write_text(manifest, encoding='utf-8')

          agent_check = agent_path.read_text(encoding='utf-8')
          overlay_check = overlay_path.read_text(encoding='utf-8')
          main_check = main_path.read_text(encoding='utf-8')
          chat_check = chat_path.read_text(encoding='utf-8')
          manifest_check = manifest_path.read_text(encoding='utf-8')
          engine_check = (APP / 'HybridAgentEngine.kt').read_text(encoding='utf-8')
          protocol_check = (APP / 'HybridAgentProtocol.kt').read_text(encoding='utf-8')
          checks = [
              (agent_check.count('private val hybridAgent by lazy { HybridAgentEngine(this) }') == 1, 'hybridAgent field'),
              ('val hybridUiEvents: SharedFlow<HybridUiEvent>' in agent_check, 'hybrid UI event flow'),
              ('notifyHybridTaskStarted' in agent_check, 'overlay lifecycle bridge'),
              ('onHybridTaskStarted' in overlay_check, 'background island integration'),
              ('applyHybridUiEvent' in chat_check, 'conversation UI bridge'),
              ('service.handleHybridInput(text)' in chat_check, 'global send intercept'),
              ('AgentService.hybridUiEvents.collect' in main_check, 'MainActivity event collector'),
              ('import kotlinx.coroutines.flow.collect' in main_check, 'Flow collect import'),
              (main_check.count('HYBRID AGENT V5 INTERCEPT') == 1, 'MainActivity intercept'),
              (manifest_check.count('android.permission.WAKE_LOCK') == 1, 'WAKE_LOCK permission'),
              ('CLOSEPAW_BRAIN_ANCHOR_71D4' in engine_check, 'Brain anchor'),
              ('clickTextExact' in engine_check, 'exact Brain selection'),
              ('NO_UI_CHANGE' in engine_check, 'no-change loop guard'),
              ('SessionRecordingService' in engine_check, 'session persistence'),
              ('VirtualDisplayPlatform' in engine_check, 'Virtual Display executor'),
              ('HybridPlanParser' in protocol_check, 'Brain parser'),
          ]
          failed = [name for ok, name in checks if not ok]
          if failed:
              raise SystemExit('Hybrid v5 self-check failed: ' + ', '.join(failed))
          print('Hybrid Agent v5 patch self-check: PASS')
          PY

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Hybrid-Agent-v5-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
