        \ and a.get('digest')==expected]\nif not matches:\n    available=[(a.get('id'),a.get('name'),a.get('expired'),a.get('digest')) for a in d.get('artifacts',[])[:20]]\n    raise SystemExit(f'exact 057a artifact not found; candidates={available}')\nmatches.sort(key=lambda a:a.get('created_at',''), reverse=True)\nchosen=matches[0]\nopen('/tmp/057a-artifact-id','w').write(str(chosen['id']))\nopen('/tmp/057a-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\\n')\nprint('057a artifact',chosen['id'],chosen.get('digest'))\nPYMETA\nARTIFACT_ID=\"$(cat /tmp/057a-artifact-id)\"\ncurl -fsSL -L \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H 'Accept: application/vnd.github+json' \\\n  \"https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip\" \\\n  -o /tmp/057a-artifact.zip\ntest \"$(sha256sum /tmp/057a-artifact.zip | awk '{print $1}')\" = \"$EXPECTED_ZIP_SHA\"\nunzip -q /tmp/057a-artifact.zip -d /tmp/057a-source\nMANIFEST=\"$(find\
        \ /tmp/057a-source -type f -name '057a-postpatch-source-manifest.json' -print -quit)\"\n[ -n \"$MANIFEST\" ] || { echo '057a source manifest missing' >&2; exit 1; }\ntest \"$(sha256sum \"$MANIFEST\" | awk '{print $1}')\" = \"$EXPECTED_MANIFEST_SHA\"\nROOT=\"$(dirname \"$MANIFEST\")\"\nif [ \"$ROOT\" != '/tmp/057a-source' ]; then\n  mkdir -p /tmp/057a-normalized\n  cp -a \"$ROOT\"/. /tmp/057a-normalized/\n  rm -rf /tmp/057a-source\n  mv /tmp/057a-normalized /tmp/057a-source\nfi\npython3 - <<'PYBASE'\nfrom pathlib import Path\nimport hashlib,json\nroot=Path('/tmp/057a-source')\nmanifest=json.loads((root/'057a-postpatch-source-manifest.json').read_text())\ncurrent={}\nfor p in sorted((root/'app').rglob('*')):\n    if p.is_file() and '/build/' not in p.as_posix():\n        current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()\nif current != manifest:\n    missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k\
        \ for k in set(manifest)&set(current) if manifest[k]!=current[k])\n    raise SystemExit(f'057a source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')\nprint('exact verified 057a source manifest: PASS')\nPYBASE\nfind . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +\nrsync -a --exclude='.git' --exclude='.github' /tmp/057a-source/ ./\ncp 057a-postpatch-source-manifest.json 057a-baseline-source-manifest.json\ncat > 058a-verification-report.txt <<'REPORT'\nClosePaw RC11 058a verification report\nBaseline: exact verified 057a GitHub artifact.\n058 Generic Runtime Project Orchestrator retained.\n058a scope: inline Stop-clause parsing, terminal-before-dispatch guard, bounded post-PLAN_ACCEPT gate.\nPackage id intentionally remains ai.closepaw.rc11c058 for in-place upgrade and permission/settings continuity.\nREPORT\ncat /tmp/057a-artifact-meta.txt >> 058a-verification-report.txt\n"
