name: Build ClosePaw Brain Return v6

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply stable Hybrid Agent v5.5
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-hybrid-agent-v5-5.yml')
          if not workflow.exists():
              raise SystemExit('Missing required base: build-hybrid-agent-v5-5.yml')

          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []
              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  body.append('' if not line.strip() else line[body_indent:])

              result = subprocess.run(
                  ['bash'],
                  input='\n'.join(body) + '\n',
                  text=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f'Base step failed: {step_name}')

          run_step('Apply v5.4 base')
          run_step('Fix Brain verification regression')
          print('BASE v5.5: PASS')
          PY

      - name: Apply Brain Excursion Manager v6
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_brain_excursion_v6.py
          python3 -m py_compile /tmp/patch_brain_excursion_v6.py
          python3 /tmp/patch_brain_excursion_v6.py

      - name: Patch side-by-side identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          old = 'applicationIdSuffix = ".smt"'
          new = 'applicationIdSuffix = ".brainreturn"'
          if old not in text:
              raise SystemExit('applicationIdSuffix anchor missing')
          text = text.replace(old, new, 1)

          old_version = 'versionNameSuffix = "-smt"'
          if old_version in text:
              text = text.replace(
                  old_version,
                  'versionNameSuffix = "-brain-return-v6"',
                  1,
              )
          gradle.write_text(text, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          text, count = re.subn(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">ClosePaw Brain Return v6</string>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('app_name anchor missing')
          strings.write_text(text, encoding='utf-8')
          print('IDENTITY: PASS')
          PY

      - name: Gate 1 - source invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          checks = {
              '80 Brain turns': 'MAX_BRAIN_TURNS = 80',
              '240s Brain timeout': 'BRAIN_TIMEOUT_MS = 240_000L',
              '48k UI context': 'MAX_UI_CHARS = 48_000',
              '2h task wakelock': 'TASK_WAKELOCK_TIMEOUT_MS = 2 * 60 * 60 * 1000L',
              'execution frame': 'private data class BrainExcursionFrame',
              'save frame': 'captureBrainExcursionFrame',
              'automatic restore': 'restoreAfterBrainExcursion',
              'selected-chat capture': 'selectedConversationCandidates',
              'deterministic reopen': 'openConversationDeterministically',
              'short-term motor memory': 'recentSemanticAnchors',
              'movement learning': 'rememberSuccessfulAction',
              'stale response guard': 'extractLatestPlanForTask',
              'per-turn token guard': 'plan.taskId != brainRequestId',
              'NO_UI_CHANGE loop guard': 'NO_UI_CHANGE',
              'Brain-return instruction': 'NEVER include steps for leaving the Brain chat',
          }

          failed = [name for name, needle in checks.items() if needle not in engine]
          if failed:
              raise SystemExit('Source invariant failure: ' + ', '.join(failed))

          multiplicity = {
              'consultBrain': engine.count('private suspend fun consultBrain('),
              'BrainExcursionFrame': engine.count('private data class BrainExcursionFrame('),
              'restoreAfterBrainExcursion': engine.count(
                  'private suspend fun restoreAfterBrainExcursion('
              ),
          }
          bad = [f'{k}={v}' for k, v in multiplicity.items() if v != 1]
          if bad:
              raise SystemExit('Multiplicity failure: ' + ', '.join(bad))

          print('GATE 1 source invariants: PASS')
          PY

      - name: Gate 2 - Kotlin lexical structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          state = 'code'
          escape = False
          stack = []
          pairs = {'}':'{', ')':'(', ']':'['}
          i = 0

          while i < len(s):
              c = s[i]
              n = s[i + 1] if i + 1 < len(s) else ''

              if state == 'code':
                  if s[i:i+3] == '"""':
                      state = 'triple'
                      i += 2
                  elif c == '"':
                      state = 'string'
                  elif c == "'":
                      state = 'char'
                  elif c == '/' and n == '/':
                      state = 'line'
                      i += 1
                  elif c == '/' and n == '*':
                      state = 'block'
                      i += 1
                  elif c in '{([':
                      stack.append(c)
                  elif c in '})]':
                      if not stack or stack[-1] != pairs[c]:
                          raise SystemExit(f'Bracket mismatch at offset {i}')
                      stack.pop()

              elif state == 'triple':
                  if s[i:i+3] == '"""':
                      state = 'code'
                      i += 2

              elif state == 'string':
                  if escape:
                      escape = False
                  elif c == '\\':
                      escape = True
                  elif c == '"':
                      state = 'code'

              elif state == 'char':
                  if escape:
                      escape = False
                  elif c == '\\':
                      escape = True
                  elif c == "'":
                      state = 'code'

              elif state == 'line':
                  if c == '\n':
                      state = 'code'

              elif state == 'block':
                  if c == '*' and n == '/':
                      state = 'code'
                      i += 1

              i += 1

          if state != 'code' or stack:
              raise SystemExit(f'Lexical structure invalid: state={state} stack={stack[-8:]}')

          print('GATE 2 Kotlin lexical structure: PASS')
          PY

      - name: Gate 3 - compile Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Gate 4 - assemble APK
        run: ./gradlew assembleDebug

      - name: Gate 5 - APK integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not apk.exists() or apk.stat().st_size < 1_000_000:
              raise SystemExit('APK missing or unexpectedly small')

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = ['AndroidManifest.xml', 'classes.dex', 'resources.arsc']
              missing = [x for x in required if x not in names]
              if missing:
                  raise SystemExit('APK integrity missing: ' + ', '.join(missing))
              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)

          print(f'GATE 5 APK integrity: PASS ({apk.stat().st_size} bytes)')
          PY

      - name: Gate 6 - final identity check
        shell: bash
        run: |
          grep -q 'applicationIdSuffix = ".brainreturn"' app/build.gradle.kts
          grep -q '<string name="app_name">ClosePaw Brain Return v6</string>'             app/src/main/res/values/strings.xml
          echo 'GATE 6 identity: PASS'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Brain-Return-v6-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
