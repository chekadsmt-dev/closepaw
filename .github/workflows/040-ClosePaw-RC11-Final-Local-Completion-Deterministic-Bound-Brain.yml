      - name: 040 source isolation and frozen correctness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYISO040'
          from pathlib import Path
          import hashlib, json
          def sha(data: bytes): return hashlib.sha256(data).hexdigest()
          def sf(path): return sha(Path(path).read_bytes())
          baseline=json.loads(Path('040-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if not p.is_file(): continue
              rel=p.as_posix()
              if rel.startswith('app/build/'): continue
              current[rel]=sf(rel)
          changed={p for p in baseline.keys() & current.keys() if baseline[p] != current[p]}
          added=set(current)-set(baseline)
          removed=set(baseline)-set(current)
          allowed_changed={
              'app/build.gradle.kts',
              'app/src/main/res/values/strings.xml',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
          }
          allowed_added={
              'app/src/main/kotlin/ai/closepaw/app/LocalGoalCompletionV40.kt',
              'app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt',
              'app/src/test/kotlin/ai/closepaw/app/LocalGoalCompletionV40Test.kt',
              'app/src/test/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40Test.kt',
          }
          if changed != allowed_changed:
              raise SystemExit(f'040 unexpected changed files: {sorted(changed)} expected {sorted(allowed_changed)}')
          if added != allowed_added:
              raise SystemExit(f'040 unexpected added files: {sorted(added)} expected {sorted(allowed_added)}')
          if removed:
              raise SystemExit(f'040 removed baseline files: {sorted(removed)}')

          engine=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(a,b):
              s=engine.find(a); e=engine.find(b,s)
              if s < 0 or e < 0: raise SystemExit('040 frozen region anchor missing')
              return engine[s:e].encode()
          frozen=json.loads(Path('040-baseline-critical-hashes.json').read_text())
          now={
              'rc8_restore': sha(region('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded(')),
              'durable_transaction': sha(region('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9(')),
              'v33_primary_plan_validation': sha(region('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest(')),
              'brain_request_builder': sha(region('private fun buildBrainRequest(','private fun buildRepairRequest(')),
              'brain_excursion_capture': sha(region('private suspend fun captureBrainExcursionFrame(','private suspend fun restoreAfterBrainExcursion(')),
              'brain_restore': sha(region('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings')),
              'configured_brain_store_route': sha(region('private fun configuredBrainV9(): ChatBrainSettings','private suspend fun clickConfiguredBrainTitleV9(')),
              'brain_send': sha(region('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9(')),
              'hybrid_protocol_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt'),
              'rc11_policy_file': sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
              'http_transport_v32_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
              'v37_grammar_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt'),
              'v37_trace_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt'),
              'brain_settings_store_file': sf('app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt'),
              'bridge_source': sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          if now != frozen:
              bad=[k for k in frozen if now.get(k) != frozen[k]]
              raise SystemExit('040 modified frozen correctness regions/files: '+', '.join(bad))
          Path('040-postpatch-source-manifest.json').write_text(json.dumps(current, indent=2, sort_keys=True)+'\n')
          with Path('040-verification-report.txt').open('a') as f:
              f.write('Source isolation exact allowlist: PASS\n')
              f.write('RC8/durable/V33/Primary transport+grammar/Brain send+restore/settings store/bridge frozen: PASS\n')
          print('040 SOURCE ISOLATION + FROZEN CORRECTNESS: PASS')
          PYISO040

      - name: 040 behavioral contract audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT040'
          from pathlib import Path
          engine=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          goal=Path('app/src/main/kotlin/ai/closepaw/app/LocalGoalCompletionV40.kt').read_text(encoding='utf-8')
          brain=Path('app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt').read_text(encoding='utf-8')
          store=Path('app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt').read_text(encoding='utf-8')
          gradle=Path('app/build.gradle.kts').read_text(encoding='utf-8')
          strings=Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')

          required_engine=[
              'LOCAL_GOAL_COMPLETE_V40|fresh_observation_before_model',
              'MODEL_RETURN_LOCAL_COMPLETION_V40|$selectedPlanSource',
              'LocalGoalCompletionV40.explicitVisibleStopTarget(goal)',
              'LocalGoalCompletionV40.exactTargetVisible(visibleStopTarget, visibleValues)',
              'LocalGoalCompletionV40.packageCompatible(',
              'LocalGoalCompletionV40.isInstallUnknownAppsListCondition(goal, visibleStopTarget)',
              'LocalGoalCompletionV40.installUnknownAppsListVisible(currentPackage, visibleValues)',
              'ConfiguredBrainTargetResolverV40.choose(',
              'Configured Brain title is missing or genuinely ambiguous',
              'PrimaryLocalGrammarV37.build(lease, request, installedApps)',
              'PRIMARY_CUSTOM_HTTP_TIMEOUT_MS = 180_000L',
              'PRIMARY_CUSTOM_MAX_OUTPUT_TOKENS = 64L',
              'appendLine(task.goal)',
          ]
          for token in required_engine:
              if token not in engine: raise SystemExit('040 missing engine contract: '+token)

          required_goal=[
              'explicitVisibleStopTarget',
              'exactTargetVisible',
              'packageCompatible',
              'isInstallUnknownAppsListCondition',
              'installUnknownAppsListVisible',
              'targetVariants',
          ]
          for token in required_goal:
              if token not in goal: raise SystemExit('040 missing local goal contract: '+token)

          required_brain=[
              'clickable.size != 1',
              'sameSemanticRow(anchor, it)',
              'return anchor.index',
          ]
          for token in required_brain:
              if token not in brain: raise SystemExit('040 missing deterministic Brain dedupe contract: '+token)

          # One-time Brain binding remains SharedPreferences-backed and deterministic. Navigation
          # to the configured app/chat must not invoke Primary or any LLM just to locate the Brain.
          for token in ['KEY_APP_PACKAGE', 'KEY_CHAT_TITLE', 'getSharedPreferences', 'saveAppPackage', 'saveChatTitle']:
              if token not in store: raise SystemExit('040 persistent Brain binding contract missing: '+token)
          s=engine.find('private suspend fun ensureConfiguredBrainConversationV9(')
          e=engine.find('private suspend fun sendConfiguredBrainMessageV9(', s)
          if s < 0 or e < 0: raise SystemExit('040 configured Brain conversation region missing')
          locator=engine[s:e]
          forbidden_locator=['requestPrimaryPlanV9(', 'ChatCompletionClient', 'LLMClient', 'buildPrimaryModelRequest(']
          for token in forbidden_locator:
              if token in locator: raise SystemExit('040 Brain locator unexpectedly consumes model path: '+token)

          if 'take(600)' in engine: raise SystemExit('040 reintroduced user-goal tail truncation')
          if 'applicationIdSuffix = ".rc11c040"' not in gradle: raise SystemExit('040 application id missing')
          if 'versionNameSuffix = "-rc11-c040"' not in gradle: raise SystemExit('040 version suffix missing')
          if '<string name="app_name">ClosePaw RC11 040</string>' not in strings: raise SystemExit('040 label missing')

          with Path('040-verification-report.txt').open('a') as f:
              f.write('Explicit stop condition evaluated locally before another model turn: PASS\n')
              f.write('Exact visible-label proof + app package corroboration + unknown-apps list semantic proof: PASS\n')
              f.write('Configured Brain parent/child duplicate dedupe with real ambiguity fail-closed: PASS\n')
              f.write('Configured Brain app/title binding remains persistent and locator consumes zero LLM calls: PASS\n')
          print('040 BEHAVIORAL CONTRACT AUDIT: PASS')
          PYAUDIT040

