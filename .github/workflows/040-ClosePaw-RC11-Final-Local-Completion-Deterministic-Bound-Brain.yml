          +package ai.closepaw.app
          +
          +import kotlin.math.max
          +import kotlin.math.min
          +
          +/**
          + * Resolves duplicate accessibility nodes that represent one configured Brain row.
          + * It never guesses between distinct rows: exact-title ambiguity remains fail-closed.
          + */
          +internal object ConfiguredBrainTargetResolverV40 {
          +    internal data class Candidate(
          +        val index: Int,
          +        val clickable: Boolean,
          +        val left: Int,
          +        val top: Int,
          +        val right: Int,
          +        val bottom: Int,
          +    ) {
          +        val width: Int get() = (right - left).coerceAtLeast(0)
          +        val height: Int get() = (bottom - top).coerceAtLeast(0)
          +        val centerX: Int get() = (left + right) / 2
          +        val centerY: Int get() = (top + bottom) / 2
          +    }
          +
          +    fun choose(candidates: List<Candidate>): Int? {
          +        val distinct = candidates.distinctBy { it.index }
          +        if (distinct.size == 1) return distinct.single().index
          +        if (distinct.isEmpty()) return null
          +
          +        val clickable = distinct.filter { it.clickable }
          +        if (clickable.size != 1) return null
          +        val anchor = clickable.single()
          +
          +        // Safe dedupe only when every same-title duplicate geometrically belongs to the one
          +        // clickable row (typical parent View + child TextView accessibility duplication).
          +        if (!distinct.all { sameSemanticRow(anchor, it) }) return null
          +        return anchor.index
          +    }
          +
          +    private fun sameSemanticRow(a: Candidate, b: Candidate): Boolean {
          +        if (a.index == b.index) return true
          +        if (a.width <= 0 || a.height <= 0 || b.width <= 0 || b.height <= 0) return false
          +        if (contains(a, b.centerX, b.centerY) || contains(b, a.centerX, a.centerY)) return true
          +
          +        val overlapX = (min(a.right, b.right) - max(a.left, b.left)).coerceAtLeast(0)
          +        val overlapY = (min(a.bottom, b.bottom) - max(a.top, b.top)).coerceAtLeast(0)
          +        val minHeight = min(a.height, b.height).coerceAtLeast(1)
          +        return overlapX > 0 && overlapY * 100 >= minHeight * 70
          +    }
          +
          +    private fun contains(c: Candidate, x: Int, y: Int): Boolean =
          +        x in c.left..c.right && y in c.top..c.bottom
          +}
