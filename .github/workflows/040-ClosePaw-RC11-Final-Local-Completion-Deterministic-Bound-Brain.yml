          @@ -0,0 +1,112 @@
          +package ai.closepaw.app
          +
          +import java.text.Normalizer
          +import java.util.Locale
          +
          +/**
          + * Deterministic local completion predicates for explicit user stop conditions.
          + * No model call is involved. A stop target must be exactly visible; substring matches are rejected.
          + */
          +internal object LocalGoalCompletionV40 {
          +    internal data class AppIdentity(val packageName: String, val label: String)
          +
          +    fun explicitVisibleStopTarget(goal: String): String? {
          +        if (goal.isBlank()) return null
          +        val patterns = listOf(
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+is\\s+visible\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+is\\s+shown\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+appears\\s*[.!]?\\s*$"),
          +        )
          +        val raw = patterns.asSequence()
          +            .mapNotNull { it.find(goal)?.groupValues?.getOrNull(1) }
          +            .map(String::trim)
          +            .firstOrNull { it.isNotBlank() }
          +            ?: return null
          +        return raw.trim().trim('"', '\'', '`').trim().takeIf { it.length in 1..160 }
          +    }
          +
          +    fun exactTargetVisible(target: String, visibleValues: Iterable<String>): Boolean {
          +        val wanted = targetVariants(target)
          +        if (wanted.isEmpty()) return false
          +        return visibleValues.any { normalize(it) in wanted }
          +    }
          +
          +    /** Known deterministic semantic terminal for the baseline Android permission-list task. */
          +    fun isInstallUnknownAppsListCondition(goal: String, stopTarget: String): Boolean {
          +        val g = normalize(goal)
          +        val t = normalize(stopTarget)
          +        val unknownAppsIntent = g.contains("install unknown apps") ||
          +            (g.contains("unknown apps") && g.contains("install"))
          +        val listIntent = t.contains("list") && t.contains("apps") &&
          +            (t.contains("permission") || t.contains("allowed"))
          +        return unknownAppsIntent && listIntent
          +    }
          +
          +    fun installUnknownAppsListVisible(
          +        currentPackage: String?,
          +        visibleValues: Iterable<String>,
          +    ): Boolean {
          +        if (currentPackage.isNullOrBlank() || !normalize(currentPackage).contains("settings")) return false
          +        val values = visibleValues.map(::normalize).filter { it.isNotBlank() }.distinct()
          +        val hasDestinationTitle = values.any {
          +            it == "install unknown apps" || it.contains("install unknown apps")
          +        }
          +        if (!hasDestinationTitle) return false
          +        val nonGeneric = values.filterNot { value ->
          +            value in setOf(
          +                "install unknown apps", "search", "back", "more options", "navigate up",
          +                "settings", "special access",
          +            ) || value.contains("install unknown apps")
          +        }
          +        // Destination title + multiple distinct row labels is local evidence that the app list,
          +        // not merely a transient page shell, is visible.
          +        return nonGeneric.count { it.length >= 2 } >= 2
          +    }
          +
          +    /**
          +     * If the stop target is also an installed-app label, the foreground package must be one of
          +     * those exact-label apps. If it is not an app label (for example "Display"), package does not
          +     * participate in the proof and the exact visible label remains authoritative.
          +     */
          +    fun packageCompatible(
          +        target: String,
          +        currentPackage: String?,
          +        installedApps: List<AppIdentity>,
          +    ): Boolean {
          +        val wanted = targetVariants(target)
          +        if (wanted.isEmpty()) return false
          +        val matchingPackages = installedApps
          +            .filter { normalize(it.label) in wanted }
          +            .map { it.packageName }
          +            .filter { it.isNotBlank() }
          +            .distinct()
          +        if (matchingPackages.isEmpty()) return true
          +        return !currentPackage.isNullOrBlank() && currentPackage in matchingPackages
          +    }
          +
          +
          +    private fun targetVariants(value: String): Set<String> {
          +        val base = normalize(value)
          +        if (base.isBlank()) return emptySet()
          +        val out = linkedSetOf(base)
          +        val suffixes = listOf(" settings", " setting", " screen", " page", " menu", " section")
          +        for (suffix in suffixes) {
          +            if (base.endsWith(suffix) && base.length > suffix.length + 1) {
          +                out += base.removeSuffix(suffix).trim()
          +            }
          +        }
          +        return out.filter { it.isNotBlank() }.toSet()
          +    }
          +
          +    private fun normalize(value: String): String {
          +        val deaccented = Normalizer.normalize(value, Normalizer.Form.NFKD)
          +            .replace(Regex("\\p{M}+"), "")
          +            .lowercase(Locale.ROOT)
          +            .replace('ي', 'ی')
          +            .replace('ك', 'ک')
          +        return deaccented
          +            .replace(Regex("[^\\p{L}\\p{N}._-]+"), " ")
          +            .replace(Regex("\\s+"), " ")
          +            .trim()
          +    }
          +}
