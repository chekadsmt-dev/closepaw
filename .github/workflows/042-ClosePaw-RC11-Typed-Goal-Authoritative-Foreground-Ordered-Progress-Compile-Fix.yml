          added = set(current) - set(baseline)
          removed = set(baseline) - set(current)
          allowed_changed = {
              'app/build.gradle.kts',
              'app/src/main/res/values/strings.xml',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
          }
