              'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV41.kt',
              'app/src/test/kotlin/ai/closepaw/app/GoalPostconditionV41Test.kt',
              'app/src/test/kotlin/ai/closepaw/app/PrimaryLocalGrammarV41Test.kt',
          }
          if changed != allowed_changed:
              raise SystemExit(f'042 unexpected changed files: {sorted(changed)} expected {sorted(allowed_changed)}')
          if added != allowed_added:
              raise SystemExit(f'042 unexpected added files: {sorted(added)} expected {sorted(allowed_added)}')
          if removed:
              raise SystemExit(f'042 unexpectedly removed files: {sorted(removed)}')

          frozen = json.loads(Path('042-baseline-critical-hashes.json').read_text())
          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(a, b):
              s = engine.find(a)
              if s < 0: raise SystemExit('042 critical start missing after patch: ' + a)
              e = engine.find(b, s)
              if e < 0: raise SystemExit('042 critical end missing after patch: ' + b)
              return engine[s:e].encode()
          now = {
              'rc8_restore': sha(region('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded(')),
              'durable_transaction': sha(region('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9(')),
