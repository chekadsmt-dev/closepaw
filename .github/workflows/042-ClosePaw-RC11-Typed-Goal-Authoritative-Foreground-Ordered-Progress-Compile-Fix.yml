          +        val spec = GoalPostconditionV41.parse(goal, apps)!!
          +        val mainSettings = listOf(
          +            n(5, "Apps", 500, 620, clickable = true, left = 20, right = 700),
          +            n(6, "Apps", 520, 580, clickable = false, left = 120, right = 300),
          +            n(7, "Other", 1400, 1500),
