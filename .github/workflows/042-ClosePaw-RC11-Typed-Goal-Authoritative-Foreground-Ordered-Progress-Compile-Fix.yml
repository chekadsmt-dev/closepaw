          +            n(2, "Brightness", 420, 500, clickable = true),
          +            n(3, "Dark mode", 540, 620, clickable = true),
          +        )
          +        assertTrue(GoalPostconditionV41.evaluate(spec, "com.android.settings", displayPage, apps, goal))
          +    }
