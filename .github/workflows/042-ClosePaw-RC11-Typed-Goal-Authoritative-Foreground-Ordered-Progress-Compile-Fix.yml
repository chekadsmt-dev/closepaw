          +        val nodes = listOf(n(1, "Settings", 80, 160))
          +        assertFalse(GoalPostconditionV41.evaluate(spec, "ai.closepaw.rc11c042", nodes, apps, goal))
          +        assertTrue(GoalPostconditionV41.evaluate(spec, "com.android.settings", nodes, apps, goal))
          +    }
          +
          +    @Test fun clickableDisplayRowDoesNotProveDisplayPage() {
          +        val goal = "Open Settings.\nGo to Display.\nStop when Display settings is visible."
