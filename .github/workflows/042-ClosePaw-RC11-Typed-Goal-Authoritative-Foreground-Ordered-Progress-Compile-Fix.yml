name: 042 - ClosePaw RC11 Typed Goal Semantics + Authoritative Foreground + Ordered Progress

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 040 full source
        uses: actions/download-artifact@v5
        with:
          name: 040-ClosePaw-RC11-verified-full-source
          path: /tmp/040-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34674423671

      - name: Verify and activate exact 040 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/040-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/040-source/app/src/main/kotlin/ai/closepaw/app/LocalGoalCompletionV40.kt
          test -f /tmp/040-source/app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt
          test -f /tmp/040-source/app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt
          test -f /tmp/040-source/app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt
          test -f /tmp/040-source/app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt
          test -f /tmp/040-source/tools/termux-bridge/closepaw_bridge.py
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/040-source/. ./

          python3 - <<'PYBASE042'
          from pathlib import Path
          import hashlib
          expected = {
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt': '6bca28698a4b3a547fdd8b28fad4d1d9dba22bd4c2ca18419da1e2593d2a6887',
              'app/src/main/kotlin/ai/closepaw/app/LocalGoalCompletionV40.kt': '600663ffe9b7b9aef1bf12996b6add19f526ed5e2101babde29ea92f49cc6214',
              'app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt': '6404241048b37ccf0cdb835fc8be406401c568926f8751fbff3ccaef35bb15c9',
              'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt': '50fec2dfd085e29fd56efc7d9317cc4e8f6b2ed8a242e4b1d9189090a0e97ab2',
              'app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt': 'ecd85c4d77335f2fa289ebf8ae4e804b7dfebe5a24e918d2d6e8413be20e9a42',
              'app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt': '063f89a0d7b4dd08f16642ee7454a5a871e7d3b4d8318f1373808be307350f41',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt': '6c386d7e712c1f19f1d106f324d500b2fead4fc4b30a1b043cb368db16ebc03e',
              'app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt': '6d2069354b970927dc4729a00355a74e8139f60efadb866e3f9e9b2c020e67b6',
              'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt': '1e9e9dc2e4625277eb8eecd08792d4ed1e7c2952e374f20745808ba1bbfb7739',
              'app/build.gradle.kts': '6334879dfbfe1a5d6210054f743b2f1ebad97dc610f5d98358161fd3632be3e2',
              'app/src/main/res/values/strings.xml': '128a90fbe4b7c5614a229d144ee1e744cc233d3283de61168096299accdd1f19',
              'tools/termux-bridge/closepaw_bridge.py': '707906f17acde07c0a86cb45c3c76b7a554f3ffcc39acc17f76f32e376749b2c',
          }
          for rel, wanted in expected.items():
              p = Path(rel)
              if not p.is_file(): raise SystemExit('042 baseline missing: ' + rel)
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != wanted: raise SystemExit(f'042 baseline hash mismatch {rel}: {got} != {wanted}')
          Path('042-verification-report.txt').write_text(
              'ClosePaw RC11 042 verification report\n'
              '=====================================\n'
              'Base: exact verified 040 full-source artifact from successful run 34674423671.\n'
              'Runtime evidence addressed: stale foreground identity in model snapshots, false-positive page completion, and multi-step navigation ordering.\n'
              'Frozen: RC8 restore, durable PREPARED->ATTEMPTED transaction, V33 validation, V32 transport, V37 regression grammar, configured Brain binding/locator/send/restore, trace, bridge.\n',
              encoding='utf-8',
          )
          print('042 EXACT VERIFIED 040 BASELINE HASH GATE: PASS')
          PYBASE042

      - name: Baseline 040 clean compile before any 042 change
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 040 clean Kotlin compile BEFORE 042 patch: PASS' >> 042-verification-report.txt

      - name: Freeze exact 040 source and correctness regions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE042'
          from pathlib import Path
          import hashlib, json
          def sha(data: bytes): return hashlib.sha256(data).hexdigest()
          def sf(path): return sha(Path(path).read_bytes())
          manifest = {}
          for p in sorted(Path('app').rglob('*')):
              if not p.is_file(): continue
              rel = p.as_posix()
              if rel.startswith('app/build/'): continue
              manifest[rel] = sf(rel)
          if len(manifest) < 700: raise SystemExit(f'042 baseline app manifest unexpectedly small: {len(manifest)}')
          Path('042-baseline-source-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(a, b):
              s = engine.find(a)
              if s < 0: raise SystemExit('042 critical start missing: ' + a)
              e = engine.find(b, s)
              if e < 0: raise SystemExit('042 critical end missing: ' + b)
              return engine[s:e].encode()
          critical = {
              'rc8_restore': sha(region('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded(')),
              'durable_transaction': sha(region('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9(')),
              'v33_primary_plan_validation': sha(region('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest(')),
              'brain_request_builder': sha(region('private fun buildBrainRequest(','private fun buildRepairRequest(')),
              'brain_excursion_capture': sha(region('private suspend fun captureBrainExcursionFrame(','private suspend fun restoreAfterBrainExcursion(')),
              'brain_restore': sha(region('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings')),
              'configured_brain_route': sha(region('private fun configuredBrainV9(): ChatBrainSettings','private suspend fun sendConfiguredBrainMessageV9(')),
              'brain_send': sha(region('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9(')),
              'hybrid_protocol_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt'),
              'rc11_policy_file': sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
              'http_transport_v32_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
              'v37_grammar_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt'),
              'v37_trace_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt'),
              'brain_settings_store_file': sf('app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt'),
              'brain_target_resolver_v40_file': sf('app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt'),
              'bridge_source': sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          Path('042-baseline-critical-hashes.json').write_text(json.dumps(critical, indent=2, sort_keys=True) + '\n')
          print('042 BASELINE FREEZE: PASS')
          PYFREEZE042

      - name: Apply isolated 042 typed-goal foreground and progress patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/042.patch <<'PATCH042'
          diff --git a/app/build.gradle.kts b/app/build.gradle.kts
          index cee9147..9bf6321 100644
          --- a/app/build.gradle.kts
          +++ b/app/build.gradle.kts
          @@ -46,8 +46,8 @@ android {
           
               buildTypes {
                   debug {
          -    applicationIdSuffix = ".rc11c040"
          -    versionNameSuffix = "-rc11-c040"
          +    applicationIdSuffix = ".rc11c042"
          +    versionNameSuffix = "-rc11-c042"
           
               val evalSsl = project.findProperty("insecureSslForEval")?.toString()?.toBoolean() ?: false
               buildConfigField("boolean", "INSECURE_SSL_FOR_EVAL", evalSsl.toString())
          diff --git a/app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt b/app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt
          new file mode 100644
          index 0000000..0b54000
          --- /dev/null
          +++ b/app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt
          @@ -0,0 +1,349 @@
          +package ai.closepaw.app
          +
          +import java.text.Normalizer
          +import java.util.Locale
          +import kotlin.math.max
          +
          +/**
          + * Typed deterministic postconditions for explicit user stop clauses.
          + *
          + * The evaluator deliberately separates "a row is visible" from "a destination page is reached".
          + * It never treats model output as authority and it never consumes model tokens.
          + */
          +internal object GoalPostconditionV41 {
          +    internal enum class Kind {
          +        APP_FOREGROUND,
          +        PAGE_REACHED,
          +        ELEMENT_VISIBLE,
          +        LIST_VISIBLE,
          +        TEXT_ENTERED,
          +    }
          +
          +    internal data class AppIdentity(val packageName: String, val label: String)
          +
          +    internal data class NodeEvidence(
          +        val index: Int,
          +        val text: String,
          +        val description: String,
          +        val hint: String,
          +        val className: String,
          +        val clickable: Boolean,
          +        val editable: Boolean,
          +        val enabled: Boolean,
          +        val left: Int,
          +        val top: Int,
          +        val right: Int,
          +        val bottom: Int,
          +    ) {
          +        val width: Int get() = (right - left).coerceAtLeast(0)
          +        val height: Int get() = (bottom - top).coerceAtLeast(0)
          +        val centerX: Int get() = (left + right) / 2
          +        val centerY: Int get() = (top + bottom) / 2
          +    }
          +
          +    internal data class Spec(
          +        val kind: Kind,
          +        val target: String,
          +        val requiredPackage: String?,
          +        val expectedValue: String? = null,
          +        val anchor: String? = null,
          +    )
          +
          +    fun parse(goal: String, installedApps: List<AppIdentity>): Spec? {
          +        if (goal.isBlank()) return null
          +        val requiredPackage = explicitOpenPackage(goal, installedApps)
          +
          +        val enteredSubject = enteredStopSubject(goal)
          +        if (enteredSubject != null) {
          +            val expected = expectedEnteredValue(goal)
          +            return Spec(
          +                kind = Kind.TEXT_ENTERED,
          +                target = enteredSubject,
          +                requiredPackage = requiredPackage,
          +                expectedValue = expected,
          +            )
          +        }
          +
          +        val visibleTarget = visibleStopTarget(goal) ?: return null
          +        val variants = targetVariants(visibleTarget)
          +        val appMatches = installedApps.filter { normalize(it.label) in variants }.distinctBy { it.packageName }
          +        if (appMatches.size == 1) {
          +            return Spec(
          +                kind = Kind.APP_FOREGROUND,
          +                target = visibleTarget,
          +                requiredPackage = appMatches.single().packageName,
          +            )
          +        }
          +
          +        val normalizedTarget = normalize(visibleTarget)
          +        val navigationTargets = explicitNavigationTargets(goal)
          +        val navigationMatch = navigationTargets.any { nav ->
          +            val n = normalizeTargetPhrase(nav)
          +            n in variants || variants.any { it == n || containsPhrase(it, n) || containsPhrase(n, it) }
          +        }
          +
          +        if (looksLikeListTarget(normalizedTarget)) {
          +            return Spec(
          +                kind = Kind.LIST_VISIBLE,
          +                target = visibleTarget,
          +                requiredPackage = requiredPackage,
          +                anchor = inferListAnchor(goal, navigationTargets),
          +            )
          +        }
          +
          +        if (navigationMatch || looksLikePageTarget(normalizedTarget)) {
          +            return Spec(
          +                kind = Kind.PAGE_REACHED,
          +                target = visibleTarget,
          +                requiredPackage = requiredPackage,
          +            )
          +        }
          +
          +        return Spec(
          +            kind = Kind.ELEMENT_VISIBLE,
          +            target = visibleTarget,
          +            requiredPackage = requiredPackage,
          +        )
          +    }
          +
          +    fun evaluate(
          +        spec: Spec,
          +        currentPackage: String?,
          +        nodes: List<NodeEvidence>,
          +        installedApps: List<AppIdentity>,
          +        goal: String,
          +    ): Boolean {
          +        if (spec.requiredPackage != null && currentPackage != spec.requiredPackage) return false
          +        return when (spec.kind) {
          +            Kind.APP_FOREGROUND -> {
          +                currentPackage == spec.requiredPackage && exactVisible(spec.target, nodes)
          +            }
          +            Kind.PAGE_REACHED -> pageReached(spec.target, nodes)
          +            Kind.ELEMENT_VISIBLE -> exactVisible(spec.target, nodes)
          +            Kind.LIST_VISIBLE -> listVisible(spec, nodes, goal)
          +            Kind.TEXT_ENTERED -> textEntered(spec.expectedValue, nodes)
          +        }
          +    }
          +
          +    fun visibleStopTarget(goal: String): String? {
          +        val patterns = listOf(
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+is\\s+visible\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+is\\s+shown\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+appears\\s*[.!]?\\s*$"),
          +        )
          +        return patterns.asSequence()
          +            .mapNotNull { it.find(goal)?.groupValues?.getOrNull(1) }
          +            .map(String::trim)
          +            .firstOrNull { it.isNotBlank() }
          +            ?.trim('"', '\'', '`')
          +            ?.trim()
          +            ?.takeIf { it.length in 1..180 }
          +    }
          +
          +    private fun enteredStopSubject(goal: String): String? {
          +        val patterns = listOf(
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+has\\s+been\\s+entered\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+is\\s+entered\\s*[.!]?\\s*$"),
          +            Regex("(?im)^\\s*stop\\s+(?:here\\s+)?(?:when|once)\\s+(.+?)\\s+has\\s+been\\s+typed\\s*[.!]?\\s*$"),
          +        )
          +        return patterns.asSequence()
          +            .mapNotNull { it.find(goal)?.groupValues?.getOrNull(1) }
          +            .map(String::trim)
          +            .firstOrNull { it.isNotBlank() }
          +            ?.trim('"', '\'', '`')
          +            ?.trim()
          +            ?.takeIf { it.length in 1..180 }
          +    }
          +
          +    private fun expectedEnteredValue(goal: String): String? {
          +        val patterns = listOf(
          +            Regex("(?im)^\\s*search\\s+for\\s*:\\s*(.+?)\\s*$"),
          +            Regex("(?im)^\\s*(?:enter|type)\\s*:\\s*(.+?)\\s*$"),
          +            Regex("(?im)^\\s*(?:enter|type)\\s+(.+?)\\s*$"),
          +        )
          +        return patterns.asSequence()
          +            .mapNotNull { it.find(goal)?.groupValues?.getOrNull(1) }
          +            .map(String::trim)
          +            .firstOrNull { it.isNotBlank() }
          +            ?.trim('"', '\'', '`')
          +            ?.trim()
          +            ?.takeIf { it.length in 1..240 }
          +    }
          +
          +    private fun exactVisible(target: String, nodes: List<NodeEvidence>): Boolean {
          +        val variants = targetVariants(target)
          +        if (variants.isEmpty()) return false
          +        return nodes.any { node ->
          +            node.enabled && nodeValues(node).any { normalize(it) in variants }
          +        }
          +    }
          +
          +    private fun pageReached(target: String, nodes: List<NodeEvidence>): Boolean {
          +        val variants = targetVariants(target)
          +        if (variants.isEmpty()) return false
          +        val screenBottom = nodes.maxOfOrNull { it.bottom }?.coerceAtLeast(1) ?: 1
          +        val headerLimit = max(280, (screenBottom * 22) / 100)
          +
          +        return nodes.any { candidate ->
          +            if (!candidate.enabled || candidate.editable || candidate.clickable) return@any false
          +            if (candidate.top > headerLimit) return@any false
          +            if (!nodeValues(candidate).any { normalize(it) in variants }) return@any false
          +            !isInsideClickableContainer(candidate, nodes)
          +        }
          +    }
          +
          +    private fun isInsideClickableContainer(candidate: NodeEvidence, nodes: List<NodeEvidence>): Boolean {
          +        return nodes.any { parent ->
          +            if (!parent.enabled || !parent.clickable || parent.index == candidate.index) return@any false
          +            if (parent.width <= 0 || parent.height <= 0) return@any false
          +            val centerContained = candidate.centerX in parent.left..parent.right &&
          +                candidate.centerY in parent.top..parent.bottom
          +            val parentLarger = parent.width >= candidate.width && parent.height >= candidate.height
          +            centerContained && parentLarger
          +        }
          +    }
          +
          +    private fun textEntered(expectedValue: String?, nodes: List<NodeEvidence>): Boolean {
          +        val wanted = normalize(expectedValue.orEmpty())
          +        if (wanted.isBlank()) return false
          +        return nodes.any { node ->
          +            node.enabled && node.editable && normalize(node.text) == wanted
          +        }
          +    }
          +
          +    private fun listVisible(spec: Spec, nodes: List<NodeEvidence>, goal: String): Boolean {
          +        val screenBottom = nodes.maxOfOrNull { it.bottom }?.coerceAtLeast(1) ?: 1
          +        val headerLimit = max(280, (screenBottom * 22) / 100)
          +        val anchor = spec.anchor?.takeIf { it.isNotBlank() }
          +        val anchorVisible = when {
          +            anchor != null -> pageReached(anchor, nodes) || exactVisible(anchor, nodes)
          +            normalize(goal).contains("install unknown apps") ->
          +                pageReached("Install unknown apps", nodes) || exactVisible("Install unknown apps", nodes)
          +            else -> exactVisible(spec.target, nodes)
          +        }
          +        if (!anchorVisible) return false
          +
          +        val generic = setOf(
          +            "settings", "search", "back", "more options", "navigate up", "menu", "close",
          +            "special access", "install unknown apps",
          +        )
          +        val rowValues = nodes.asSequence()
          +            .filter { it.enabled && it.bottom > headerLimit }
          +            .flatMap { nodeValues(it).asSequence() }
          +            .map(::normalize)
          +            .filter { it.length >= 2 && it !in generic }
          +            .filterNot { it.contains("install unknown apps") }
          +            .distinct()
          +            .toList()
          +        return rowValues.size >= 2
          +    }
          +
          +    private fun inferListAnchor(goal: String, navigationTargets: List<String>): String? {
          +        navigationTargets.lastOrNull()?.let { return it }
          +        val n = normalize(goal)
          +        if (n.contains("install unknown apps")) return "Install unknown apps"
          +        return null
          +    }
          +
          +    private fun explicitOpenPackage(goal: String, installedApps: List<AppIdentity>): String? {
          +        val sentences = goal.split(Regex("[\\n.!?؟]+"))
          +            .map(::normalize)
          +            .filter { it.isNotBlank() }
          +        val matches = installedApps.filter { app ->
          +            val label = normalize(app.label)
          +            val pkg = normalize(app.packageName)
          +            sentences.any { sentence ->
          +                val mentions = containsPhrase(sentence, label) || containsPhrase(sentence, pkg)
          +                val affirmative = listOf("open", "launch", "start", "باز کن", "بازش کن")
          +                    .map(::normalize)
          +                    .any { containsPhrase(sentence, it) }
          +                val negative = listOf(
          +                    "do not open", "dont open", "don't open", "never open", "باز نکن", "بازش نکن",
          +                ).map(::normalize).any { containsPhrase(sentence, it) }
          +                mentions && affirmative && !negative
          +            }
          +        }.distinctBy { it.packageName }
          +        return matches.singleOrNull()?.packageName
          +    }
          +
          +    private fun explicitNavigationTargets(goal: String): List<String> {
          +        val out = mutableListOf<String>()
          +        val patterns = listOf(
          +            Regex("(?i)\\bgo\\s+to\\s+(?:the\\s+)?([^\\n.!?؛;]+)"),
          +            Regex("(?i)\\b(?:tap|click|select|choose)\\s+(?:on\\s+)?(?:the\\s+)?([^\\n.!?؛;]+)"),
          +            Regex("برو\\s+به\\s+([^\\n.!?؟؛;]+)"),
          +            Regex("روی\\s+([^\\n.!?؟؛;]+?)\\s+(?:بزن|کلیک کن)"),
          +            Regex("([^\\n.!?؟؛;]+?)\\s+(?:را|رو)\\s+انتخاب\\s+کن"),
          +        )
          +        patterns.forEach { regex ->
          +            regex.findAll(goal).forEach { match ->
          +                match.groupValues.getOrNull(1)?.trim()?.takeIf { it.isNotBlank() }?.let(out::add)
          +            }
          +        }
          +        return out.distinct()
          +    }
          +
          +    private fun looksLikePageTarget(target: String): Boolean {
          +        val pageWords = listOf(" page", " screen", " menu", " section", " settings", " setting")
          +        return pageWords.any { target.endsWith(it) }
          +    }
          +
          +    private fun looksLikeListTarget(target: String): Boolean =
          +        containsPhrase(target, "list") || target.startsWith("list ") || target.contains(" list ")
          +
          +    private fun targetVariants(value: String): Set<String> {
          +        var base = normalize(value)
          +        if (base.isBlank()) return emptySet()
          +        base = base.removePrefix("the ").trim()
          +        val out = linkedSetOf(base)
          +        val suffixes = listOf(
          +            " settings page", " setting page", " settings screen", " setting screen",
          +            " settings", " setting", " screen", " page", " menu", " section",
          +        )
          +        var changed = true
          +        var current = base
          +        while (changed) {
          +            changed = false
          +            for (suffix in suffixes) {
          +                if (current.endsWith(suffix) && current.length > suffix.length + 1) {
          +                    current = current.removeSuffix(suffix).trim()
          +                    if (current.isNotBlank() && out.add(current)) changed = true
          +                    break
          +                }
          +            }
          +        }
          +        return out
          +    }
          +
          +    private fun normalizeTargetPhrase(raw: String): String {
          +        var value = normalize(raw)
          +        val suffixes = listOf(" settings", " setting", " screen", " page", " menu", " section")
          +        for (suffix in suffixes) {
          +            if (value.endsWith(suffix) && value.length > suffix.length + 1) {
          +                value = value.removeSuffix(suffix).trim()
          +            }
          +        }
          +        return value
          +    }
          +
          +    private fun nodeValues(node: NodeEvidence): List<String> =
          +        listOf(node.text, node.description, node.hint).filter { it.isNotBlank() }
          +
          +    private fun normalize(value: String): String {
          +        val deaccented = Normalizer.normalize(value, Normalizer.Form.NFKD)
          +            .replace(Regex("\\p{M}+"), "")
          +            .lowercase(Locale.ROOT)
