      - name: 042 behavioral architecture audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT042'
          from pathlib import Path
          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          goal = Path('app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt').read_text(encoding='utf-8')
          grammar = Path('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV41.kt').read_text(encoding='utf-8')
          store = Path('app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')

          for token in [
              'GoalPostconditionV41.parse(goal, apps)',
              'GoalPostconditionV41.evaluate(',
              'PrimaryLocalGrammarV41.build(lease, request, installedApps)',
              'LOCAL_GOAL_COMPLETE_V41|typed_fresh_observation_before_model',
              'MODEL_RETURN_LOCAL_COMPLETION_V41|$selectedPlanSource',
              'PRIMARY_CUSTOM_HTTP_TIMEOUT_MS = 180_000L',
              'PRIMARY_CUSTOM_MAX_OUTPUT_TOKENS = 64L',
              'appendLine(task.goal)',
          ]:
              if token not in engine: raise SystemExit('042 missing engine contract: ' + token)

          # Regression gate for 041 compile failure: evaluateGoalLocallyV11 must capture one fresh
          # snapshot and reuse it for typed and legacy fallback checks; duplicate local declarations fail.
          s_eval = engine.find('private suspend fun evaluateGoalLocallyV11(')
          e_eval = engine.find('private fun riskForAction(', s_eval)
          if s_eval < 0 or e_eval < 0: raise SystemExit('042 local evaluator region missing')
          evaluator = engine[s_eval:e_eval]
          if evaluator.count('val snapshot = platform.captureScreen()') != 1:
              raise SystemExit('042 local evaluator must contain exactly one fresh snapshot declaration')

          # Both model snapshots must use the authoritative Samsung-safe foreground observation.
          for start, end in [
              ('private fun buildPrimaryUiSnapshotV9(', 'private fun buildUiSnapshot('),
              ('private fun buildUiSnapshot(', 'private fun safeNodeText('),
          ]:
              s = engine.find(start); e = engine.find(end, s)
              if s < 0 or e < 0: raise SystemExit('042 snapshot builder region missing: ' + start)
              block = engine[s:e]
              if 'observedPackage(platform).orEmpty()' not in block:
                  raise SystemExit('042 snapshot builder does not use authoritative observedPackage: ' + start)
              if 'platform.getCurrentPackageName().orEmpty()' in block:
                  raise SystemExit('042 stale foreground source remains in snapshot builder: ' + start)

          for token in [
              'APP_FOREGROUND', 'PAGE_REACHED', 'ELEMENT_VISIBLE', 'LIST_VISIBLE', 'TEXT_ENTERED',
              'isInsideClickableContainer', 'requiredPackage', 'textEntered', 'listVisible',
          ]:
              if token not in goal: raise SystemExit('042 typed postcondition contract missing: ' + token)
          if 'candidate.clickable' not in goal:
              raise SystemExit('042 page-reached proof does not reject clickable row targets')

          for token in [
              'for (phrase in phrases)',
              'if (candidates.size == 1) return candidates.single()',
              'if (candidates.size > 1) return null',
              'snapshot_bound_fallback',
          ]:
              if token not in grammar: raise SystemExit('042 ordered progress grammar contract missing: ' + token)
          for forbidden in ['arg ::=', 'SET_TEXT_NODE|" arg', 'CLICK_TEXT|" arg', 'DONE|']:
              if forbidden in grammar: raise SystemExit('042 free-form executable semantic argument reintroduced: ' + forbidden)

          # One-time external Brain binding/locator remains deterministic and consumes zero model calls.
          for token in ['KEY_APP_PACKAGE', 'KEY_CHAT_TITLE', 'getSharedPreferences', 'saveAppPackage', 'saveChatTitle']:
              if token not in store: raise SystemExit('042 persistent Brain binding contract missing: ' + token)
          s = engine.find('private suspend fun ensureConfiguredBrainConversationV9(')
          e = engine.find('private suspend fun sendConfiguredBrainMessageV9(', s)
          if s < 0 or e < 0: raise SystemExit('042 configured Brain conversation region missing')
          locator = engine[s:e]
          for token in ['requestPrimaryPlanV9(', 'ChatCompletionClient', 'LLMClient', 'buildPrimaryModelRequest(']:
              if token in locator: raise SystemExit('042 Brain locator unexpectedly consumes model path: ' + token)

          if 'take(600)' in engine: raise SystemExit('042 reintroduced user-goal tail truncation')
          if 'applicationIdSuffix = ".rc11c042"' not in gradle: raise SystemExit('042 application id missing')
          if 'versionNameSuffix = "-rc11-c042"' not in gradle: raise SystemExit('042 version suffix missing')
          if '<string name="app_name">ClosePaw RC11 042</string>' not in strings: raise SystemExit('042 label missing')

          with Path('042-verification-report.txt').open('a') as f:
              f.write('Authoritative observedPackage wired into Primary and External Brain snapshots: PASS\n')
              f.write('Typed postconditions distinguish app/page/element/list/text-entry completion: PASS\n')
              f.write('PAGE_REACHED rejects visible clickable rows and requires header-like destination evidence: PASS\n')
              f.write('Ordered multi-step navigation targets first still-clickable user instruction; same-step ambiguity fail-closed: PASS\n')
              f.write('Configured External Brain persistent binding and zero-token locator preserved: PASS\n')
          print('042 BEHAVIORAL ARCHITECTURE AUDIT: PASS')
