          grep -Fq "application-label:'ClosePaw RC11 042'" <<<"$BADGING" || { echo '042 APK label mismatch' >&2; exit 1; }
          grep -Fq "sdkVersion:'31'" <<<"$BADGING" || { echo '042 APK minSdk mismatch' >&2; exit 1; }
