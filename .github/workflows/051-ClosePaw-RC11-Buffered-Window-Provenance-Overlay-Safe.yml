      - name: Verify 051 source isolation, exact postpatch tree, and frozen regions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYISO'
          from pathlib import Path
          import hashlib,json
          def h(b): return hashlib.sha256(b).hexdigest()
          def sf(p): return h(Path(p).read_bytes())
          baseline=json.loads(Path('051-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sf(p)
          changed=sorted(k for k in set(baseline)&set(current) if baseline[k]!=current[k])
          added=sorted(set(current)-set(baseline))
          removed=sorted(set(baseline)-set(current))
          allowed_changed=sorted([
            'app/build.gradle.kts',
            'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
            'app/src/main/res/values/strings.xml',
          ])
          allowed_added=sorted([
            'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt',
            'app/src/test/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51Test.kt',
          ])
          if changed != allowed_changed or added != allowed_added or removed:
              raise SystemExit(f'051 source isolation failed changed={changed} added={added} removed={removed}')

          Path('051-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          manifest_sha=sf('051-postpatch-source-manifest.json')
          if manifest_sha != '69a81756b6b239caad3dafd8e35226beafb7b2ce9f64d2d00550144825ed1842':
              raise SystemExit(f'051 exact postpatch tree mismatch: {manifest_sha}')

          expected_changed_hashes={
            'app/build.gradle.kts':'93c92423e092b6e4eb1d0075eb439fe269a5ec1a3145d7f65724a76ba62bfd41',
            'app/src/main/kotlin/ai/closepaw/app/AgentService.kt':'db757da5567dd2ccde200291ce7a7c5f0b116a20c75b455a22afcecedea3691d',
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'6426c09db272280180bcf4e5d4a794dfa2ea7dacdcae6ee17f2eb3ea23b15c2c',
            'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt':'a75c7ea133c1100e229debf071e0d4063a1c9cb1c3cee3191d2ca4f37f2a5894',
            'app/src/test/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51Test.kt':'e57ff854df18f19457ce9a16980e58431a4948c16ce88709a022b23f1d78593d',
            'app/src/main/res/values/strings.xml':'c423abede9f510a53d46ec5582cfeb406b9456ede599ba2c37613a4a9a32d5a2',
          }
          for p,w in expected_changed_hashes.items():
              got=sf(p)
              if got!=w: raise SystemExit(f'051 changed-file hash mismatch {p}: {got} != {w}')

          frozen=json.loads(Path('051-baseline-critical-hashes.json').read_text())
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          def reg(a,b):
              s=eng.find(a); e=eng.find(b,s)
              if s<0 or e<0: raise SystemExit(f'protected region missing postpatch: {a} -> {b}')
              return h(eng[s:e].encode())
          now={
            'rc8_restore':reg('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded('),
            'durable_transaction':reg('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9('),
            'v33_validation':reg('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest('),
            'brain_restore':reg('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings'),
            'brain_send':reg('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9('),
            'open_app_exact':reg('private suspend fun openApp(platform: AndroidPlatform, name: String): ActionOutcome {','private suspend fun clickByText('),
            'stable_observation':reg('private suspend fun stableObservationV9(','private fun scopeVerifiedV9('),
            'navigator_v43':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt'),
            'grammar_v43':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt'),
            'prereq_v45':sf('app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt'),
            'goal_v41':sf('app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt'),
            'causal_v46':sf('app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt'),
            'brain_recovery_v46':sf('app/src/main/kotlin/ai/closepaw/app/BrainExcursionRecoveryV46.kt'),
            'foreground_v46':sf('app/src/main/kotlin/ai/closepaw/app/ForegroundPackageV46.kt'),
            'work_surface_v47':sf('app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt'),
            'provenance_v50':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt'),
            'protocol':sf('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt'),
            'rc11':sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
            'transport':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
            'brain_target':sf('app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt'),
            'accessibility_platform':sf('app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt'),
            'diagnostics_page':sf('app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt'),
            'bridge':sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          bad={k:(frozen[k],now[k]) for k in frozen if frozen[k]!=now[k]}
          if bad: raise SystemExit(f'051 frozen correctness regression: {bad}')
          print('051 SOURCE ISOLATION + EXACT TREE + FROZEN REGIONS: PASS')
          PYISO

      - name: Audit 051 architecture contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import re
          agent=Path('app/src/main/kotlin/ai/closepaw/app/AgentService.kt').read_text()
          engine=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          history=Path('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt').read_text()
          tests=Path('app/src/test/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51Test.kt').read_text()
          gradle=Path('app/build.gradle.kts').read_text()
          strings=Path('app/src/main/res/values/strings.xml').read_text()
          diag=Path('app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt').read_text()

          required_agent=[
            'AccessibilityEventHistoryV51.Buffer()',
            'hybridUiWindowEventsV51Snapshot()',
            'recordHybridUiWindowEventV51(eventEvidenceV51)',
            'clearHybridUiWindowEventsV51()',
          ]
          for token in required_agent:
              if token not in agent: raise SystemExit('V51 AgentService integration missing '+token)

          if 'AgentService.hybridUiLastWindowEventV50' in engine:
              raise SystemExit('V51 correctness path still reads overwrite-prone single last-event slot')
          if engine.count('AccessibilityEventHistoryV51.recover(') < 2:
              raise SystemExit('V51 buffered recovery not wired into both package/work-surface paths')
          receipt=engine[engine.find('private suspend fun buildPostActionReceiptV9('):engine.find('private suspend fun executeActionTransactionV9(')]
          if not re.search(r'eventPackageMatchV51\s*\([\s\S]*?minRevisionExclusive\s*=\s*startEventRevision', receipt):
              raise SystemExit('V51 post-action evidence is not revision-gated to the current action')
          if 'return eventPackageMatchV51()?.packageName' not in engine:
              raise SystemExit('V51 observedPackage fallback is not buffered')
          if 'WORK_SURFACE_V51|expected=' not in engine or 'events=[' not in engine:
              raise SystemExit('V51 exportable work-surface history diagnostics missing')

          required_history=[
            'LinkedHashMap<Int, ArrayDeque<AccessibilityEventProvenanceV50.EventEvidence>>',
            'maxEventsPerWindow',
            'minRevisionExclusive',
            'newerSameWindowConflict',
            'candidateWindowIds.size != 1',
            'MAX_AGGREGATED_TEXT_CANDIDATES',
          ]
          for token in required_history:
              if token not in history: raise SystemExit('V51 fail-closed history contract missing '+token)
          required_tests=[
            'later unrelated overlay event does not erase settings provenance',
            'newer different package on same window invalidates stale provenance',
            'pre action evidence cannot prove post action state',
            'per window buffer prevents overlay storm from evicting app provenance',
          ]
          for token in required_tests:
              if token not in tests: raise SystemExit('V51 regression coverage missing '+token)

          if 'applicationIdSuffix = ".rc11c051"' not in gradle or 'versionNameSuffix = "-rc11-c051"' not in gradle:
              raise SystemExit('051 package/version identity missing')
          if 'ClosePaw RC11 051' not in strings:
              raise SystemExit('051 app label missing')
          if 'ClosePaw-${BuildConfig.VERSION_NAME}-diagnostics.zip' not in diag:
              raise SystemExit('dynamic diagnostics filename regressed')

          with Path('051-verification-report.txt').open('a') as out:
              out.write('V51 per-window bounded provenance buffer integration: PASS\n')
              out.write('V51 single-last-event correctness dependency removed: PASS\n')
              out.write('V51 active-window/package/revision/age/conflict fail-closed recovery: PASS\n')
              out.write('V51 post-action event evidence is action-revision bounded: PASS\n')
              out.write('V51 overlay-storm + stale/same-window-conflict regression coverage: PASS\n')
              out.write('Dynamic diagnostics filename preserved: PASS\n')
          print('051 ARCHITECTURE CONTRACT AUDIT: PASS')
          PYAUDIT

