name: 051 - ClosePaw RC11 Buffered Window Provenance (Overlay-Safe)

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 050 Source of Truth by artifact and manifest identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_NAME='050-ClosePaw-RC11-verified-full-source'
          EXPECTED_ARTIFACT_DIGEST='sha256:98e053323fec7bd4a70333a95c5993d4036d3030e10ac570ec298dad95f03377'
          EXPECTED_MANIFEST_SHA='fc9de9315177b68e4913358fbfa3bc23b92c18d2d90775d8009992546efd3cb0'
          rm -rf /tmp/050-source /tmp/050-candidate /tmp/050-artifacts.json /tmp/050-candidate.zip
          mkdir -p /tmp/050-source

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${EXPECTED_NAME}&per_page=100" \
            -o /tmp/050-artifacts.json

          python3 - <<'PYIDS' > /tmp/050-artifact-ids.txt
          import json
          d=json.load(open('/tmp/050-artifacts.json'))
          expected_digest='sha256:98e053323fec7bd4a70333a95c5993d4036d3030e10ac570ec298dad95f03377'
          rows=[a for a in d.get('artifacts',[]) if
                not a.get('expired',False) and
                a.get('name')=='050-ClosePaw-RC11-verified-full-source' and
                a.get('digest')==expected_digest]
          rows.sort(key=lambda a:a.get('created_at',''), reverse=True)
          for a in rows:
              print(f"{a['id']}|{(a.get('workflow_run') or {}).get('id','')}|{a.get('digest','')}")
          PYIDS

          FOUND=''
          FOUND_RUN=''
          while IFS='|' read -r ARTIFACT_ID RUN_ID DIGEST; do
            [ -n "$ARTIFACT_ID" ] || continue
            [ "$DIGEST" = "$EXPECTED_ARTIFACT_DIGEST" ] || continue
            rm -rf /tmp/050-candidate /tmp/050-candidate.zip
            mkdir -p /tmp/050-candidate
            curl -fsSL -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o /tmp/050-candidate.zip
            unzip -q /tmp/050-candidate.zip -d /tmp/050-candidate
            MANIFEST="$(find /tmp/050-candidate -type f -name '050-postpatch-source-manifest.json' -print -quit)"
            [ -n "$MANIFEST" ] || continue
            SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
            if [ "$SHA" = "$EXPECTED_MANIFEST_SHA" ]; then
              ROOT="$(dirname "$MANIFEST")"
              cp -a "$ROOT"/. /tmp/050-source/
              FOUND="$ARTIFACT_ID"
              FOUND_RUN="$RUN_ID"
              break
            fi
          done < /tmp/050-artifact-ids.txt

          [ -n "$FOUND" ] || { echo 'Exact verified 050 artifact not found by digest + manifest identity' >&2; exit 1; }
          echo "BASELINE_ARTIFACT_ID=$FOUND" >> "$GITHUB_ENV"
          echo "BASELINE_RUN_ID=$FOUND_RUN" >> "$GITHUB_ENV"
          echo "Exact verified 050 artifact id=$FOUND run=$FOUND_RUN"

      - name: Verify and activate exact 050 Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/050-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/050-source/app/src/main/kotlin/ai/closepaw/app/AgentService.kt
          test -f /tmp/050-source/app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt
          test -f /tmp/050-source/050-postpatch-source-manifest.json
          test "$(sha256sum /tmp/050-source/050-postpatch-source-manifest.json | awk '{print $1}')" = "fc9de9315177b68e4913358fbfa3bc23b92c18d2d90775d8009992546efd3cb0"

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/050-source/. ./

          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json,os
          def sf(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads(Path('050-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sf(p)
          if current != expected:
              missing=sorted(set(expected)-set(current))
              added=sorted(set(current)-set(expected))
              changed=sorted(k for k in set(expected)&set(current) if expected[k]!=current[k])
              raise SystemExit(f'050 full-source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          critical={
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'b05d55593b065be85fdb953823d383a553c8da28971241b1798b6d6de535f02c',
            'app/src/main/kotlin/ai/closepaw/app/AgentService.kt':'ba736d1ab325130c5e0b9c33be86bf6b49efa8c4c3141da2644753a1eaa3151c',
            'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt':'a8dc0afb76daa59ba6c80c3b29bef1a84559e2638795b523ada8fef2d4637b36',
            'app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt':'683a9f6d8b5c8a676ba00bb9cda4cf954314470afae4a9b2bf1ab3862f6ea47e',
            'app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt':'eed7423a080b1d8b8b8a40ac943f88a62db658c5eb12f9a638fc3974cc938e73',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt':'945670dd4f8818b10933245a27298dfe0de4b9da590c54f06a9ba4657e11301f',
            'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt':'fdfdae46f9fd865336e2f57e65c6f62684fc1b7ffd909eba1d1b49ad8937dab3',
            'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt':'b1be3b8953bc0620a921d6e639e68ee1ae4a61952d20a52943da148a3edbee37',
            'app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt':'d9595d75a141c5c843195878fb13c0f32ab2121cabab65903026fd3b2a189a25',
            'app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt':'2261c0c3d15a5fa1bf36591e4006c1628ef68d0dd065b1886684b274d79f8090',
            'app/build.gradle.kts':'0303bcbd2a9777fd9daf3fa88c547db8da6f8793f34634e47b419743697cee91',
            'app/src/main/res/values/strings.xml':'80a08ce108e1bf7dbf954886fb47bfa088bde8c7205aba085f2162a85266b87c',
          }
          for p,w in critical.items():
              got=sf(p)
              if got!=w: raise SystemExit(f'050 critical baseline mismatch {p}: {got} != {w}')
          Path('051-verification-report.txt').write_text(
              'ClosePaw RC11 051 verification report\n'
              f'Base: exact verified 050 full-source artifact id={os.getenv("BASELINE_ARTIFACT_ID","")} run={os.getenv("BASELINE_RUN_ID","")} selected by GitHub artifact digest + 050 manifest identity.\n'
              'Runtime defect addressed: V50 kept only one last AccessibilityEvent; ClosePaw overlay/SystemUI/notification events could overwrite valid Settings provenance before the package gate consumed it.\n'
              'V51 scope: bounded per-window event history; active-window/package/revision/age correlation; same-window newer-package invalidation; post-action revision gate; aggregated same-window title evidence; dynamic diagnostics preserved.\n'
              'Explicitly frozen: V43 navigator, V45 sequencing, V37/V43 grammar, WorkSurfaceV47 selector, V46 causal mapping, RC11 transaction safety, RC8 restore, V32 transport, AccessibilityPlatform and exact OPEN_APP implementation.\n',
              encoding='utf-8')
          print('051 EXACT VERIFIED 050 BASELINE: PASS')
          PYBASE

      - name: Baseline 050 clean compile before 051 patch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 050 clean compile: PASS' >> 051-verification-report.txt

      - name: Freeze protected correctness surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE'
          from pathlib import Path
          import hashlib,json
          def h(b): return hashlib.sha256(b).hexdigest()
          def sf(p): return h(Path(p).read_bytes())
          base={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  base[p.as_posix()]=sf(p)
          Path('051-baseline-source-manifest.json').write_text(json.dumps(base,indent=2,sort_keys=True)+'\n')
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          def reg(a,b):
              s=eng.find(a); e=eng.find(b,s)
              if s<0 or e<0: raise SystemExit(f'protected region missing: {a} -> {b}')
              return h(eng[s:e].encode())
          frozen={
            'rc8_restore':reg('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded('),
            'durable_transaction':reg('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9('),
            'v33_validation':reg('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest('),
            'brain_restore':reg('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings'),
            'brain_send':reg('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9('),
            'open_app_exact':reg('private suspend fun openApp(platform: AndroidPlatform, name: String): ActionOutcome {','private suspend fun clickByText('),
            'stable_observation':reg('private suspend fun stableObservationV9(','private fun scopeVerifiedV9('),
            'navigator_v43':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt'),
            'grammar_v43':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt'),
            'prereq_v45':sf('app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt'),
            'goal_v41':sf('app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt'),
            'causal_v46':sf('app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt'),
            'brain_recovery_v46':sf('app/src/main/kotlin/ai/closepaw/app/BrainExcursionRecoveryV46.kt'),
            'foreground_v46':sf('app/src/main/kotlin/ai/closepaw/app/ForegroundPackageV46.kt'),
            'work_surface_v47':sf('app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt'),
            'provenance_v50':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt'),
            'protocol':sf('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt'),
            'rc11':sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
            'transport':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
            'brain_target':sf('app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt'),
            'accessibility_platform':sf('app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt'),
            'diagnostics_page':sf('app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt'),
            'bridge':sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          Path('051-baseline-critical-hashes.json').write_text(json.dumps(frozen,indent=2,sort_keys=True)+'\n')
          print('051 FREEZE: PASS')
          PYFREEZE

