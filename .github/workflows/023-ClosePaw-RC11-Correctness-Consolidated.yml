          e = replace_once(e, old_tx, new_tx, 'PREPARED second revalidation')
          
          # 11) Stronger action-specific receipt acceptance.
          accepted_pattern = re.compile(
              r'        val accepted = when \(action\) \{\n'
              r'            is HybridAction\.VerifyText -> verifyPassed\n'
              r'            is HybridAction\.TypeText, is HybridAction\.SetTextNode -> inputVerified \|\| \(executorSuccess && contentChanged\)\n'
              r'            is HybridAction\.Wait -> executorSuccess\n'
              r'            is HybridAction\.OpenApp -> executorSuccess && !interrupted\n'
              r'            else -> executorSuccess && changed && !interrupted\n'
              r'        \}\n'
          )
          replacement_accepted = '''        val clickPostcondition =
                      executorSuccess && !interrupted && changed &&
                          (beforePackage != afterObs.packageName || destinationVerified || !semanticTargetPresentV11(target, after))
          
                  val accepted = when (action) {
                      is HybridAction.VerifyText -> verifyPassed
                      is HybridAction.TypeText, is HybridAction.SetTextNode -> inputVerified
                      is HybridAction.Wait -> executorSuccess
                      is HybridAction.OpenApp -> openAppTransition
                      is HybridAction.ClickText, is HybridAction.ClickDesc, is HybridAction.ClickNode -> clickPostcondition
                      is HybridAction.Scroll, is HybridAction.ScrollNode -> executorSuccess && changed && !interrupted
                      HybridAction.Back, HybridAction.Home, HybridAction.Recents -> executorSuccess && changed && !interrupted
                      is HybridAction.Tap, is HybridAction.LongPress, is HybridAction.Swipe -> false
                      HybridAction.Notifications -> executorSuccess && changed && !interrupted
                      is HybridAction.Confirm, is HybridAction.Done, is HybridAction.Fail -> false
                  }
          '''
          e, count = accepted_pattern.subn(replacement_accepted, e, count=1)
          if count != 1:
              raise SystemExit('RC11 action-specific accepted block anchor missing')
          
          # 12) Syntax repair only; provenance mismatch is not repairable.
          e = replace_function(e, 'parseWithSingleRepair', r'''    private suspend fun parseWithSingleRepair(
                  platform: AndroidPlatform,
                  taskId: String,
                  requestId: String,
                  rawPlan: String,
                  returnPackage: String?,
              ): HybridPlan? {
                  val first = runCatching { HybridPlanParser.parse(rawPlan) }
                  val parsed = first.getOrNull()
                  if (parsed != null) {
                      if (parsed.taskId != taskId || parsed.requestId != requestId) {
                          Log.w(TAG, "RC11 provenance mismatch is non-repairable; response rejected")
                          return null
                      }
                      return parsed
                  }
                  val error = first.exceptionOrNull()?.message.orEmpty()
                  Log.w(TAG, "Brain plan syntax parse failed; one syntax-only repair is permitted: $error")
                  val repairRequestId = newBrainRequestIdV9(taskId, 99)
                  val repaired = runCatching {
                      consultBrain(
                          platform,
                          buildRepairRequest(taskId, repairRequestId, rawPlan, error),
                          returnPackage,
                          taskId,
                          repairRequestId,
                      )
                  }.getOrElse {
                      Log.w(TAG, "Brain syntax repair request failed", it)
                      return null
                  }
                  return runCatching { HybridPlanParser.parse(repaired) }
                      .onFailure { Log.w(TAG, "Brain syntax repair remained invalid", it) }
                      .getOrNull()
                      ?.takeIf { it.taskId == taskId && it.requestId == repairRequestId }
              }''')
          
          # 13) Preserve ambiguous Brain-send state.
          old_brain_failure = '''        if (primaryFailure != null) {
                      clearBrainExcursionV9()
                      if (restoreFailure != null) Log.e(TAG, "Brain call failed and automatic return also failed", restoreFailure)
                      throw primaryFailure
                  }
          '''
          new_brain_failure = '''        if (primaryFailure != null) {
                      val currentExcursion = prefs.getString("v9_excursion_state", null)
                      if (currentExcursion == V9ExcursionState.BRAIN_AWAITING_RESPONSE.name) {
                          val persisted = prefs.edit()
                              .putString("v9_excursion_state", V9ExcursionState.RECOVERY_REQUIRED.name)
                              .commit()
                          if (!persisted) error("RECOVERY_REQUIRED: could not preserve ambiguous Brain-send state")
                      } else {
                          clearBrainExcursionV9()
                      }
                      if (restoreFailure != null) Log.e(TAG, "Brain call failed and automatic return also failed", restoreFailure)
                      throw primaryFailure
                  }
          '''
          e = replace_once(e, old_brain_failure, new_brain_failure, 'durable ambiguous Brain send')
          
          # 14) Exact unique Brain chat + uninterrupted conversation lease.
          e = replace_function(e, 'clickConfiguredBrainTitleV9', r'''    private suspend fun clickConfiguredBrainTitleV9(platform: AndroidPlatform): Boolean {
                  val cfg = configuredBrainV9()
                  val title = cfg.chatTitle
                  val snapshot = platform.captureScreen()
                  val wanted = normalizeForMatch(title)
                  val candidates = snapshot.elements.filter { element ->
                      !element.isEditable && element.isEnabled &&
                          listOf(element.text, element.description).any { normalizeForMatch(it) == wanted }
                  }.distinctBy { it.index }
                  if (candidates.size != 1) {
                      Log.w(TAG, "Configured Brain title is missing or ambiguous: '$title' matches=${candidates.size}")
                      return false
                  }
                  if (!clickElement(platform, candidates.single())) return false
                  delay(650)
                  if (!configuredBrainChatVerifiedV9(platform, requireTitle = false)) return false
                  val after = platform.captureScreen()
                  if (observedPackage(platform) != cfg.appPackage) return false
                  brainConversationLeaseV11 = skeletonFingerprintV9(after, cfg.appPackage)
                  return true
              }''')
          
          send_start, send_end, send_region = function_region(e, 'sendConfiguredBrainMessageV9')
          needle = '        if (!setEditableText(platform, text, preferSearch = false)) error("Could not set Brain composer text")\n'
          if needle not in send_region:
              raise SystemExit('RC11 Brain send input anchor missing')
          send_region = send_region.replace(needle, '''        val leaseBeforeInput = brainConversationLeaseV11
                      ?: error("Configured Brain conversation lease missing before input")
                  val beforeInputSnapshot = platform.captureScreen()
                  val beforeInputPackage = observedPackage(platform)
                  if (beforeInputPackage != configuredBrainV9().appPackage ||
                      skeletonFingerprintV9(beforeInputSnapshot, beforeInputPackage) != leaseBeforeInput
                  ) {
                      error("Configured Brain conversation lease changed before input")
                  }
                  if (!setEditableText(platform, text, preferSearch = false)) error("Could not set Brain composer text")
          ''', 1)
          send_label = '        if (clickByLabels(platform, listOf("Send message", "Send", "Submit", "ارسال"))) {\n'
          if send_label not in send_region:
              raise SystemExit('RC11 Brain send control anchor missing')
          send_region = send_region.replace(send_label, '''        val beforeSendSnapshot = platform.captureScreen()
                  val beforeSendPackage = observedPackage(platform)
                  if (beforeSendPackage != configuredBrainV9().appPackage ||
                      skeletonFingerprintV9(beforeSendSnapshot, beforeSendPackage) != leaseBeforeInput
                  ) {
                      error("Configured Brain conversation lease changed before Send")
                  }
                  if (clickByLabels(platform, listOf("Send message", "Send", "Submit", "ارسال"))) {
          ''', 1)
          e = e[:send_start] + send_region + e[send_end:]
          
          # 15) Sensitive-field redaction expansion.
          e = replace_function(e, 'isSensitiveElement', r'''    private fun isSensitiveElement(element: PerceptionElement): Boolean {
                  val all = listOf(
                      element.className,
                      element.resourceId,
                      element.hintText,
                      element.description,
                  ).joinToString(" ").lowercase(Locale.ROOT)
                  val markers = listOf(
                      "password", "passcode", "pin", "otp", "one-time", "verification code",
                      "api key", "token", "secret", "credential", "cvv", "cvc",
                      "card number", "credit card", "رمز", "رمز عبور", "کد تایید", "کد تأیید",
                      "شماره کارت", "کد یکبار"
                  )
                  return markers.any { all.contains(it) }
              }''')
          
          # 16) Epoch check immediately before both direct and model transactions.
          e = replace_once(e,
          '''                val execution = executeActionTransactionV9(
                              task = task,
          ''',
          '''                ensureExecutionEpochV11(runEpochV11)
                          val execution = executeActionTransactionV9(
                              task = task,
          ''', 'direct pre-dispatch epoch check')
          
          model_tx_anchor = '''                            val execution = executeActionTransactionV9(
                                          task = task,
          '''
          if model_tx_anchor not in e:
              raise SystemExit('RC11 model transaction call anchor missing')
          e = e.replace(model_tx_anchor,
          '''                            ensureExecutionEpochV11(runEpochV11)
                                      val execution = executeActionTransactionV9(
                                          task = task,
          ''', 1)
          
          engine_path.write_text(e, encoding='utf-8')
          
          # 17) Behavioral policy tests.
          test_path = Path('app/src/test/kotlin/ai/closepaw/app/RC11CorrectnessPolicyTest.kt')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(r'''package ai.closepaw.app
          
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test
          
          class RC11CorrectnessPolicyTest {
              @Test fun admitsOnlyOneActionFromOneObservation() {
                  val actions = listOf(
                      HybridAction.ClickText("A"),
                      HybridAction.ClickText("B"),
                      HybridAction.Done("done"),
                  )
                  val admitted = RC11CorrectnessPolicy.admitSingleObservationAction(actions)
                  assertEquals(1, admitted.size)
                  assertEquals(HybridAction.ClickText("A"), admitted.single())
              }
          
              @Test fun rawCoordinateAndImplicitTypingAreNotModelAdmissible() {
                  assertFalse(RC11CorrectnessPolicy.modelActionAllowed(HybridAction.Tap(1, 1)))
                  assertFalse(RC11CorrectnessPolicy.modelActionAllowed(HybridAction.LongPress(1, 1, 300)))
                  assertFalse(RC11CorrectnessPolicy.modelActionAllowed(HybridAction.Swipe(1, 1, 2, 2, 300)))
                  assertFalse(RC11CorrectnessPolicy.modelActionAllowed(HybridAction.TypeText("secret")))
                  assertFalse(RC11CorrectnessPolicy.modelActionAllowed(HybridAction.Confirm("send")))
                  assertTrue(RC11CorrectnessPolicy.modelActionAllowed(HybridAction.ClickText("Settings")))
              }
          
              @Test fun confirmationGrantIsExactNotCategoryOrSubstring() {
                  val grants = setOf("exact-state-bound-key")
                  assertTrue(RC11CorrectnessPolicy.exactConfirmationMatch(grants, "exact-state-bound-key"))
                  assertFalse(RC11CorrectnessPolicy.exactConfirmationMatch(grants, "exact-state"))
                  assertFalse(RC11CorrectnessPolicy.exactConfirmationMatch(grants, "SEND"))
              }
          }
          ''', encoding='utf-8')
          
          print('RC11 CORRECTNESS CONSOLIDATION: PASS')
          PYRC11
          python3 -m py_compile /tmp/rc11_patch.py
          python3 /tmp/rc11_patch.py

      - name: RC11 frozen correctness gates
        shell: bash
        run: |
          cat > /tmp/rc11_gate.py <<'PYGATE'
          from pathlib import Path
          import re
          
          e = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          p = Path('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt').read_text(encoding='utf-8')
          t = Path('app/src/test/kotlin/ai/closepaw/app/RC11CorrectnessPolicyTest.kt').read_text(encoding='utf-8')
          
          required_engine = [
              'val runEpochV11 = executionEpochV11.incrementAndGet()',
              'executionEpochV11.incrementAndGet()',
              'Plan lease expired because work UI changed during model call',
              'RC11CorrectnessPolicy.admitSingleObservationAction(plan.actions)',
              'RC11CorrectnessPolicy.modelActionAllowed(action)',
              'MODEL_DONE_NOT_AUTHORITY',
              'MODEL_FAIL_NOT_AUTHORITY',
              'confirmationKeyV11',
              'exact app not found',
              'ambiguous exact click text',
              'return native is ActionResult.Success',
              'STALE_ACTION_REVALIDATION_FAILED',
              'is HybridAction.TypeText, is HybridAction.SetTextNode -> inputVerified',
              'RC11 provenance mismatch is non-repairable',
              'RECOVERY_REQUIRED: could not preserve ambiguous Brain-send state',
              'Configured Brain conversation lease changed before Send',
              'primaryContextScoreV11',
          ]
          missing = [x for x in required_engine if x not in e]
          if missing:
              raise SystemExit('RC11 engine invariant missing: ' + ', '.join(missing))
          
          forbidden_engine = [
              'task.goal.take(600)',
              'planQueue.addAll(plan.actions)',
              'return performTap(platform, element.center.x, element.center.y)',
              'categoryMatch || c == wanted',
              'finishFailure(action.reason, impossible = true)',
              'inputVerified || (executorSuccess && contentChanged)',
          ]
          present = [x for x in forbidden_engine if x in e]
          if present:
              raise SystemExit('RC11 forbidden legacy behavior remains: ' + ', '.join(present))
          
          m = re.search(r'(?s)private suspend fun parseWithSingleRepair\(.*?\n    private ', e)
          if not m:
              raise SystemExit('RC11 parseWithSingleRepair region not found')
          region = m.group(0)
          mismatch = region.find('provenance mismatch is non-repairable')
          repair_id = region.find('repairRequestId')
          if mismatch < 0 or repair_id < 0 or mismatch > repair_id:
              raise SystemExit('RC11 provenance mismatch can still flow into repair')
          
          required_policy = [
              'actions.firstOrNull()?.let(::listOf).orEmpty()',
              'is HybridAction.Tap',
              'is HybridAction.TypeText',
              'exactConfirmationMatch',
          ]
          if any(x not in p for x in required_policy):
              raise SystemExit('RC11 policy object incomplete')
          
          if t.count('@Test') < 3:
              raise SystemExit('RC11 behavioral policy tests incomplete')
          
          print('RC11 FROZEN CORRECTNESS GATES: PASS')
          PYGATE
          python3 -m py_compile /tmp/rc11_gate.py
          python3 /tmp/rc11_gate.py

