          +package ai.closepaw.app
          +
          +/**
          + * Pure expected-package work-surface selection.
          + *
          + * Android's global "foreground package" can be transient or OEM-fragile while an accessibility
          + * overlay is visible or an activity transition is settling.  For a task that already has an exact
          + * app prerequisite, execution should instead ask whether that exact application's interactive
          + * accessibility window is present.  This mirrors UiAutomator's waitForAppToBeVisible concept
          + * (package evidence in the accessibility hierarchy) while remaining fail-closed if another active
          + * or focused application window is above it.
          + */
          +internal object WorkSurfaceV47 {
          +    internal data class WindowEvidence(
          +        val packageName: String?,
          +        val applicationWindow: Boolean,
          +        val layer: Int,
          +        val active: Boolean,
          +        val focused: Boolean,
          +    )
          +
          +    fun expectedPackageIsInteractable(
          +        expectedPackage: String,
          +        windows: List<WindowEvidence>,
          +        activeRootPackage: String? = null,
          +    ): Boolean {
          +        val expected = expectedPackage.trim()
          +        if (expected.isBlank()) return false
          +
          +        // rootInActiveWindow is strong positive evidence when it names the expected package.
          +        if (activeRootPackage?.trim() == expected) return true
          +
          +        val eligible = windows.filter { !it.packageName.isNullOrBlank() }
          +        val apps = eligible.filter { it.applicationWindow }
          +        val matches = apps.filter { it.packageName == expected }
          +        if (matches.isEmpty()) return false
          +
          +        val bestExpectedLayer = matches.maxOf { it.layer }
          +        // A different active/focused interactive window above the target is a blocker even when
          +        // it is TYPE_SYSTEM (for example a modal permission surface).  Accessibility/IME windows
          +        // are removed by the runtime adapter before this pure selector is called.
          +        val blocker = eligible.any { other ->
          +            other.packageName != expected && other.layer > bestExpectedLayer && (other.active || other.focused)
          +        }
          +        if (blocker) return false
          +
          +        // Active/focused exact app is authoritative once no higher blocker exists.
          +        if (matches.any { it.active || it.focused }) return true
          +
          +        // OEMs can briefly leave active/focused flags stale. Accept only when expected is the
          +        // highest application window and there is no higher active/focused blocker (checked above).
          +        val topAppLayer = apps.maxOfOrNull { it.layer } ?: return false
          +        return bestExpectedLayer == topAppLayer
          +    }
          +
          +    fun effectivePackage(
          +        observedPackage: String?,
          +        expectedPackage: String?,
          +        expectedSurfaceInteractable: Boolean,
          +    ): String? = if (!expectedPackage.isNullOrBlank() && expectedSurfaceInteractable) {
          +        expectedPackage
          +    } else {
          +        observedPackage
          +    }
          +}
