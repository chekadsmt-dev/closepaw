          repository: ${{ github.repository }}
          run-id: 34701607130

      - name: Verify and activate exact 043 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/043-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/043-source/app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt
