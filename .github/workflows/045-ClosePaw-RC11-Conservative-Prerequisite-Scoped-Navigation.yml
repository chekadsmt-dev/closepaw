      - name: 045 prerequisite sequencing architecture regression audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT045'
          from pathlib import Path
          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          gate = Path('app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt').read_text(encoding='utf-8')
          nav = Path('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt').read_text(encoding='utf-8')
          grammar = Path('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')

          for token in [
              'installedAppsForTaskV45 = runCatching { platform.getInstalledApps() }',
              'appPrerequisiteV45 = GoalAppPrerequisiteV45.resolve(task.goal, installedAppsForTaskV45)',
              'GoalAppPrerequisiteV45.allowsDeterministic(',
              'currentPackage = currentPackage',
              'keyboardVisible = ui.keyboardVisible',
              'DETERMINISTIC_V45|SCOPE_WAIT|required=',
              'targetChat == null && deterministicScopeAllowedV45',
              'DeterministicUiNavigatorV43.decide(',
              'requestPrimaryPlanV9(task.id, primaryRequestId, primaryRequest)',
          ]:
              if token not in engine: raise SystemExit('045 engine scope contract missing: ' + token)

          p_current = engine.find('val currentPackage = observedPackage(platform)')
          p_gate = engine.find('val deterministicScopeAllowedV45 =', p_current)
          p_nav = engine.find('DeterministicUiNavigatorV43.decide(', p_gate)
          p_primary = engine.find('requestPrimaryPlanV9(task.id, primaryRequestId, primaryRequest)', p_nav)
          if min(p_current, p_gate, p_nav, p_primary) < 0 or not (p_current < p_gate < p_nav < p_primary):
              raise SystemExit('045 ordering must be fresh foreground -> conservative scope gate -> navigator -> Primary')

          mismatch_start = engine.find('if (!deterministicScopeAllowedV45) {', p_gate)
          mismatch_end = engine.find('if (targetChat == null && deterministicScopeAllowedV45', mismatch_start)
          if mismatch_start < 0 or mismatch_end < 0: raise SystemExit('045 mismatch branch not found')
          mismatch = engine[mismatch_start:mismatch_end]
          for forbidden in ['selectedPlan =', 'platform.performAction', 'HybridAction.Scroll(', 'HybridAction.Click']:
              if forbidden in mismatch: raise SystemExit('045 blocked scope branch can act: ' + forbidden)
          if 'deterministicEscalationV43 =' in mismatch:
              raise SystemExit('045 blocked scope branch terminal-escalates instead of deferring to Primary')

          for token in [
              'Resolution.None -> false',
              'is Resolution.Unique -> currentPackage == resolution.packageName',
              'Resolution.Unresolved -> false',
              'if (keyboardVisible) return false',
              'NEGATIVE_OPEN_PHRASES',
          ]:
              if token not in gate: raise SystemExit('045 conservative gate contract missing: ' + token)

          # V43 behavior is intentionally frozen; scope gating is the only runtime navigation change.
          for token in ['MAX_SWIPES_PER_DIRECTION = 8', 'resolveDispatchTarget(', 'isDestinationHeader(']:
              if token not in nav: raise SystemExit('045 frozen V43 navigator contract missing: ' + token)
          for token in ['forced_explicit_open_app', 'goal_grounded_fallback', 'explicitOpenTarget(']:
              if token not in grammar: raise SystemExit('045 frozen V43 grammar contract missing: ' + token)

          if 'applicationIdSuffix = ".rc11c045"' not in gradle: raise SystemExit('045 application id missing')
          if 'versionNameSuffix = "-rc11-c045"' not in gradle: raise SystemExit('045 version suffix missing')
          if '<string name="app_name">ClosePaw RC11 045</string>' not in strings: raise SystemExit('045 app label missing')
          if 'take(600)' in engine: raise SystemExit('045 reintroduced user-goal truncation')

          with Path('045-verification-report.txt').open('a') as f:
              f.write('Exact app prerequisite + fresh foreground proof required before deterministic navigation: PASS\n')
              f.write('No explicit app scope and visible keyboard both fail closed to Primary/External path: PASS\n')
              f.write('V43 exact grounding/search and Primary grammar preserved byte-for-byte: PASS\n')
          print('045 CONSERVATIVE SCOPE/SEQUENCING ARCHITECTURE AUDIT: PASS')
          PYAUDIT045

