              'app/src/test/kotlin/ai/closepaw/app/V45SequencingContractTest.kt',
          }
          if changed != allowed_changed:
              raise SystemExit(f'045 unexpected changed files: {sorted(changed)} expected {sorted(allowed_changed)}')
          if added != allowed_added:
              raise SystemExit(f'045 unexpected added files: {sorted(added)} expected {sorted(allowed_added)}')
          if removed:
              raise SystemExit(f'045 unexpectedly removed files: {sorted(removed)}')

          expected_post = {
              'app/build.gradle.kts': 'bbda0ec1de77b7ff68e1d17543f3de2561e57fd6bd25c2f6bdf291c55a1d07dc',
              'app/src/main/res/values/strings.xml': '601f1b3eb2b75e4f91da3ec12111661be5175c9b441348eed0e4ac09726a1056',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt': '65f59cc09b3559362c2096b86a3b836716b45c05b209665fec2e77ae39ddd31e',
              'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt': 'b1be3b8953bc0620a921d6e639e68ee1ae4a61952d20a52943da148a3edbee37',
              'app/src/test/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45Test.kt': '85aaae0bac7ffdc99ac08e561b7d4a6f4744d4a2fcb34557021cefa192faf629',
              'app/src/test/kotlin/ai/closepaw/app/V45SequencingContractTest.kt': '4f83c621d3daa65e90530b9b27772d5da0510090cbc8680b6d36540e61184f73',
          }
          for rel, wanted in expected_post.items():
              got = sf(rel)
              if got != wanted: raise SystemExit(f'045 exact post-patch hash mismatch {rel}: {got} != {wanted}')

          frozen = json.loads(Path('045-baseline-critical-hashes.json').read_text())
          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(a, b):
              s = engine.find(a)
              if s < 0: raise SystemExit('045 critical start missing after patch: ' + a)
              e = engine.find(b, s)
              if e < 0: raise SystemExit('045 critical end missing after patch: ' + b)
              return engine[s:e].encode()
          now = {
              'rc8_restore': sha(region('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded(')),
              'durable_transaction': sha(region('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9(')),
              'v33_primary_plan_validation': sha(region('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest(')),
              'brain_request_builder': sha(region('private fun buildBrainRequest(','private fun buildRepairRequest(')),
              'brain_excursion_capture': sha(region('private suspend fun captureBrainExcursionFrame(','private suspend fun restoreAfterBrainExcursion(')),
              'brain_restore': sha(region('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings')),
              'configured_brain_route': sha(region('private fun configuredBrainV9(): ChatBrainSettings','private suspend fun sendConfiguredBrainMessageV9(')),
              'brain_send': sha(region('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9(')),
              'navigator_v43_file': sf('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt'),
              'primary_grammar_v43_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt'),
