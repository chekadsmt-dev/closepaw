          +package ai.closepaw.app
          +
          +import ai.closepaw.platform.AppInfo
          +import org.junit.Assert.assertEquals
          +import org.junit.Assert.assertFalse
          +import org.junit.Assert.assertTrue
          +import org.junit.Test
          +
          +class GoalAppPrerequisiteV45Test {
          +    private val apps = listOf(
          +        AppInfo("com.android.settings", "Settings", true),
          +        AppInfo("com.openai.chatgpt", "ChatGPT", false),
          +    )
          +
          +    @Test
          +    fun `open Settings gates deterministic navigation until exact foreground proof`() {
          +        val r = GoalAppPrerequisiteV45.resolve(
          +            "Open Settings.\nGo to Apps.\nStop when Apps settings page is visible.", apps,
          +        )
          +        assertEquals("com.android.settings", GoalAppPrerequisiteV45.requiredPackage(r))
          +        assertFalse(GoalAppPrerequisiteV45.allowsDeterministic(r, "ai.closepaw.rc11c045", false))
          +        assertFalse(GoalAppPrerequisiteV45.allowsDeterministic(r, "com.samsung.android.honeyboard", false))
          +        assertTrue(GoalAppPrerequisiteV45.allowsDeterministic(r, "com.android.settings", false))
          +    }
          +
          +    @Test
          +    fun `keyboard blocks deterministic navigation even inside correct app`() {
          +        val r = GoalAppPrerequisiteV45.resolve("Open Settings. Go to Apps.", apps)
          +        assertFalse(GoalAppPrerequisiteV45.allowsDeterministic(r, "com.android.settings", true))
          +    }
          +
          +    @Test
          +    fun `goal without explicit app-open boundary never authorizes blind deterministic scan`() {
          +        val r = GoalAppPrerequisiteV45.resolve(
          +            "Scroll until About phone is visible. Do not open About phone.", apps,
          +        )
          +        assertTrue(r is GoalAppPrerequisiteV45.Resolution.None)
          +        assertFalse(GoalAppPrerequisiteV45.allowsDeterministic(r, "ai.closepaw.rc11c045", false))
          +        assertFalse(GoalAppPrerequisiteV45.allowsDeterministic(r, "com.android.settings", false))
          +    }
          +
          +    @Test
          +    fun `original unknown-apps goal binds Settings`() {
          +        val r = GoalAppPrerequisiteV45.resolve(
          +            "I need to find which apps are allowed to install unknown apps.\n" +
          +                "Open the correct Android Settings screen.\n" +
          +                "Do not use Settings search.\nDo not change any setting.", apps,
          +        )
          +        assertEquals("com.android.settings", GoalAppPrerequisiteV45.requiredPackage(r))
          +    }
          +
          +    @Test
          +    fun `unresolvable explicit app-open does not authorize scan`() {
          +        val r = GoalAppPrerequisiteV45.resolve("Open MysteryApp. Go to Display.", apps)
          +        assertTrue(r is GoalAppPrerequisiteV45.Resolution.Unresolved)
          +        assertFalse(GoalAppPrerequisiteV45.allowsDeterministic(r, "ai.closepaw.rc11c045", false))
          +    }
          +}
