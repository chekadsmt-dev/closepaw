          +class V45SequencingContractTest {
          +    private val apps = listOf(
          +        AppInfo("com.android.settings", "Settings", true),
          +        AppInfo("com.openai.chatgpt", "ChatGPT", false),
          +    )
          +    private val goal = "Open Settings.\nGo to Apps.\nStop when Apps settings page is visible."
          +
          +    @Test
          +    fun `wrong foreground blocks navigator while Primary grammar forces exact prerequisite app`() {
          +        val scope = GoalAppPrerequisiteV45.resolve(goal, apps)
          +        assertFalse(GoalAppPrerequisiteV45.allowsDeterministic(scope, "ai.closepaw.rc11c045", false))
          +        val spec = PrimaryLocalGrammarV43.build(
          +            "R45", request(goal, "ai.closepaw.rc11c045", "[1] TextView t=\"What can I help you with?\" C"), apps,
          +        )
          +        assertEquals("OPEN_APP|com.android.settings", spec.forcedAction)
          +        assertEquals("forced_explicit_open_app", spec.mode)
          +    }
          +
          +    @Test
          +    fun `exact Settings foreground unlocks existing V43 exact grounding`() {
          +        val scope = GoalAppPrerequisiteV45.resolve(goal, apps)
          +        assertTrue(GoalAppPrerequisiteV45.allowsDeterministic(scope, "com.android.settings", false))
          +        val decision = DeterministicUiNavigatorV43.decide(
          +            goal,
          +            listOf(
