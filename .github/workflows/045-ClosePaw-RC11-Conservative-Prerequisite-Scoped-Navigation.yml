          @@ -0,0 +1,103 @@
          +package ai.closepaw.app
          +
          +import ai.closepaw.platform.AppInfo
          +import java.text.Normalizer
          +import java.util.Locale
          +
          +/**
          + * Conservative task-local app-scope gate for deterministic in-app navigation.
          + *
          + * Deterministic navigation is authorized only when the user's goal contains one uniquely-resolved
          + * affirmative app-open prerequisite AND a fresh foreground observation proves that exact package
          + * is active. Tasks without such an explicit app boundary stay on the normal Primary/External path
          + * rather than allowing a blind scan of whichever app happens to be foreground.
          + *
          + * A visible IME/keyboard also blocks deterministic navigation for that turn. This prevents the
          + * bounded scanner from acting through transient input/clipboard UI; the normal reasoning route can
          + * first restore a stable app surface.
          + */
          +internal object GoalAppPrerequisiteV45 {
          +    internal sealed interface Resolution {
          +        data object None : Resolution
          +        data class Unique(val packageName: String, val label: String) : Resolution
          +        data object Unresolved : Resolution
          +    }
          +
          +    fun resolve(goal: String, installedApps: List<AppInfo>): Resolution {
          +        if (goal.isBlank()) return Resolution.None
          +        val sentences = goal.split(Regex("[\\n.!?؟]+"))
          +            .map(::normalize)
          +            .filter { it.isNotBlank() }
          +
          +        val affirmativeOpenSentences = sentences.filter { sentence ->
          +            val affirmative = OPEN_VERBS.any { containsPhrase(sentence, it) }
          +            val negative = NEGATIVE_OPEN_PHRASES.any { containsPhrase(sentence, it) }
          +            affirmative && !negative
          +        }
          +        if (affirmativeOpenSentences.isEmpty()) return Resolution.None
          +
          +        val matches = installedApps.filter { app ->
          +            val label = normalize(app.label)
          +            val pkg = normalize(app.packageName)
          +            if (label.length < 2 && pkg.length < 2) return@filter false
          +            affirmativeOpenSentences.any { sentence ->
          +                (label.isNotBlank() && containsPhrase(sentence, label)) ||
          +                    (pkg.isNotBlank() && containsPhrase(sentence, pkg))
          +            }
          +        }.distinctBy { it.packageName }
          +
          +        return when (matches.size) {
          +            1 -> matches.single().let { Resolution.Unique(it.packageName, it.label) }
          +            else -> Resolution.Unresolved
          +        }
          +    }
          +
          +    fun allowsDeterministic(
          +        resolution: Resolution,
          +        currentPackage: String?,
          +        keyboardVisible: Boolean,
          +    ): Boolean {
          +        if (keyboardVisible) return false
          +        return when (resolution) {
          +            Resolution.None -> false
          +            is Resolution.Unique -> currentPackage == resolution.packageName
          +            Resolution.Unresolved -> false
          +        }
          +    }
          +
          +    fun requiredPackage(resolution: Resolution): String? =
          +        (resolution as? Resolution.Unique)?.packageName
          +
          +    fun historyLabel(resolution: Resolution): String = when (resolution) {
          +        Resolution.None -> "no_explicit_app_scope"
          +        is Resolution.Unique -> resolution.packageName
          +        Resolution.Unresolved -> "unresolved_explicit_open"
          +    }
          +
          +    private fun normalize(value: String): String {
          +        val deaccented = Normalizer.normalize(value, Normalizer.Form.NFKD)
          +            .replace(Regex("\\p{M}+"), "")
          +            .lowercase(Locale.ROOT)
          +            .replace('ي', 'ی')
          +            .replace('ك', 'ک')
          +        return deaccented
          +            .replace(Regex("[^\\p{L}\\p{N}._-]+"), " ")
          +            .replace(Regex("\\s+"), " ")
          +            .trim()
          +    }
          +
          +    private fun containsPhrase(haystack: String, needle: String): Boolean {
          +        if (needle.isBlank()) return false
          +        if (haystack == needle) return true
          +        return (" $haystack ").contains(" $needle ")
          +    }
          +
          +    private val OPEN_VERBS = listOf(
          +        "open", "launch", "start", "باز کن", "بازش کن",
          +    ).map(::normalize)
          +
          +    private val NEGATIVE_OPEN_PHRASES = listOf(
          +        "do not open", "dont open", "don't open", "never open",
          +        "باز نکن", "بازش نکن",
          +    ).map(::normalize)
          +}
