          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34618437492

      - name: Verify and activate exact 032 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/032-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/032-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/032-source/. ./
          python3 - <<'PYBASE033'
          from pathlib import Path
          import hashlib

          expected = {
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt': 'f4d262ba2c01c513c9a9e4c8026da0be64001a6d14cc99036731fac2c52a92eb',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt': '03db49d0923b55935531c9944099710f43e7c3a029afb2d407ca18ee6ba663a9',
              'app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt': '6d2069354b970927dc4729a00355a74e8139f60efadb866e3f9e9b2c020e67b6',
              'app/build.gradle.kts': 'c7b7bb167cda180f947820da73559de74c305956518e29396a5bf5abf25d9876',
              'app/src/main/res/values/strings.xml': 'b43ebf03f58bd615ad8c1d184423b36aaf4691ba3b8d67301d75d4287b972a85',
              'app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt': 'a560d7b24f4d139edadadd2aee5668fe9efe85668cea9d55e6c9c0b12e23643a',
          }
          for rel, wanted in expected.items():
              p = Path(rel)
              if not p.exists():
                  raise SystemExit('033 baseline missing: ' + rel)
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'033 baseline hash mismatch {rel}: {actual} != {wanted}')

          report = Path('033-verification-report.txt')
          report.write_text(
              'ClosePaw RC11 033 verification report\n'
              '=====================================\n'
              'Base: exact verified 032 full-source artifact from successful run 34618437492\n'
              '032 key-file hashes: VERIFIED\n'
              'No 033 patch applied yet.\n',
              encoding='utf-8',
          )
          print('033 EXACT 032 BASELINE HASH GATE: PASS')
          PYBASE033

      - name: Baseline 032 clean compile before any 033 change
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 032 clean Kotlin compile BEFORE patch: PASS' >> 033-verification-report.txt

      - name: Freeze full 032 app manifest and critical RC11 regions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE033'
          from pathlib import Path
          import hashlib, json

          def sha_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()
          def sha_file(path: Path) -> str:
              return sha_bytes(path.read_bytes())
          def collect_app():
              out = {}
              for p in sorted(Path('app').rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.as_posix()
                  if rel.startswith('app/build/'):
                      continue
                  out[rel] = sha_file(p)
              return out

          manifest = collect_app()
          if len(manifest) < 600:
              raise SystemExit(f'033 baseline manifest unexpectedly small: {len(manifest)}')
          Path('033-baseline-source-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(start_token: str, end_token: str) -> str:
              start = engine.find(start_token)
              if start < 0: raise SystemExit('033 critical start anchor missing: ' + start_token)
              end = engine.find(end_token, start)
              if end < 0: raise SystemExit('033 critical end anchor missing: ' + end_token)
              return engine[start:end]

          critical = {
              'routing_execution': sha_bytes(region(
                  'val planQueue = mutableListOf<HybridAction>()',
                  'finishFailure("Bounded recovery stopped after',
              ).encode()),
              'rc8_restore': sha_bytes(region(
                  '// RC8: only strong identity evidence may authorize a restore-side navigation.',
                  'private suspend fun restoreSidebarShapeIfNeeded(',
              ).encode()),
              'durable_transaction': sha_bytes(region(
                  'private suspend fun executeActionTransactionV9(',
                  'private fun receiptHistoryLineV9(',
              ).encode()),
              'create_task_platform': sha_bytes(region(
                  'private suspend fun createTaskPlatform(): AndroidPlatform {',
                  'private fun acquireTaskWakeLock()',
              ).encode()),
              'rc11_policy_file': sha_file(Path('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt')),
          }
          Path('033-baseline-critical-hashes.json').write_text(json.dumps(critical, indent=2, sort_keys=True) + '\n')
          with Path('033-verification-report.txt').open('a') as f:
              f.write(f'Baseline app source/config manifest files: {len(manifest)}\n')
              f.write('Frozen RC8/RC11/routing/durable/platform regions captured: PASS\n')
          print('033 BASELINE MANIFEST + CRITICAL FREEZE: PASS')
          PYFREEZE033

