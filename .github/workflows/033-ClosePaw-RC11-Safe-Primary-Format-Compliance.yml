      - name: 033 source isolation and frozen correctness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYISO033'
          from pathlib import Path
          import hashlib, json

          def sha_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()
          def sha_file(path: Path) -> str:
              return sha_bytes(path.read_bytes())
          def collect_app():
              out = {}
              for p in sorted(Path('app').rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.as_posix()
                  if rel.startswith('app/build/'):
                      continue
                  out[rel] = sha_file(p)
              return out

          before = json.loads(Path('033-baseline-source-manifest.json').read_text())
          after = collect_app()
          allowed = {
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt',
              'app/src/test/kotlin/ai/closepaw/app/PrimaryFormatComplianceV33Test.kt',
              'app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt',
              'app/build.gradle.kts',
              'app/src/main/res/values/strings.xml',
          }
          all_paths = set(before) | set(after)
          changed = {p for p in all_paths if before.get(p) != after.get(p)}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit('033 unexpected source changes: ' + ', '.join(sorted(unexpected)))
          required = allowed
          missing_changes = {p for p in required if before.get(p) == after.get(p)}
          if missing_changes:
              raise SystemExit('033 expected patch file did not change: ' + ', '.join(sorted(missing_changes)))

          baseline_critical = json.loads(Path('033-baseline-critical-hashes.json').read_text())
          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(start_token: str, end_token: str) -> str:
              start = engine.find(start_token)
              if start < 0: raise SystemExit('033 postpatch critical start missing: ' + start_token)
              end = engine.find(end_token, start)
              if end < 0: raise SystemExit('033 postpatch critical end missing: ' + end_token)
              return engine[start:end]
          current_critical = {
              'routing_execution': sha_bytes(region(
                  'val planQueue = mutableListOf<HybridAction>()',
                  'finishFailure("Bounded recovery stopped after',
              ).encode()),
              'rc8_restore': sha_bytes(region(
                  '// RC8: only strong identity evidence may authorize a restore-side navigation.',
                  'private suspend fun restoreSidebarShapeIfNeeded(',
              ).encode()),
              'durable_transaction': sha_bytes(region(
                  'private suspend fun executeActionTransactionV9(',
                  'private fun receiptHistoryLineV9(',
              ).encode()),
              'create_task_platform': sha_bytes(region(
                  'private suspend fun createTaskPlatform(): AndroidPlatform {',
                  'private fun acquireTaskWakeLock()',
              ).encode()),
              'rc11_policy_file': sha_file(Path('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt')),
          }
          if current_critical != baseline_critical:
              for key in sorted(baseline_critical):
                  if current_critical.get(key) != baseline_critical.get(key):
                      print('CHANGED CRITICAL REGION:', key)
              raise SystemExit('033 frozen RC8/RC11/routing/durable/platform gate failed')

          Path('033-postpatch-source-manifest.json').write_text(json.dumps(after, indent=2, sort_keys=True) + '\n')
          with Path('033-verification-report.txt').open('a') as f:
              f.write('Source isolation gate: PASS\n')
              f.write('Frozen RC8/RC11/routing/durable/platform hashes: PASS\n')
              f.write('Changed app files: ' + ', '.join(sorted(changed)) + '\n')
          print('033 SOURCE ISOLATION + FROZEN CORRECTNESS: PASS')
          PYISO033

