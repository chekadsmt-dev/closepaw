          protocol = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt').read_text(encoding='utf-8')
          test = Path('app/src/test/kotlin/ai/closepaw/app/PrimaryFormatComplianceV33Test.kt').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')
          settings = Path('app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt').read_text(encoding='utf-8')

          required_engine = [
              'PrimaryCompactPlanV33.parseOrNull(raw, taskId, requestId)',
              'val repairRequestId = requestId',
              'CP_PRIMARY_FORMAT_REPAIR_V33',
              'PLAN_RAW_V33',
              'PLAN_ACCEPT_V33',
              'PLAN_REJECT_V33',
              'exact lease REQ|$exactLease|<ACTION>',
              'PrimaryLocalHttpTransportV32.create(PRIMARY_CUSTOM_HTTP_TIMEOUT_MS)',
          ]
          for token in required_engine:
              if token not in engine:
                  raise SystemExit('033 engine contract missing: ' + token)

          request_fn = engine[engine.index('private suspend fun requestPrimaryPlanV9('):engine.index('private fun buildBrainRequest(', engine.index('private suspend fun requestPrimaryPlanV9('))]
          if 'newPrimaryRequestIdV9(taskId, 99)' in request_fn:
              raise SystemExit('033 format repair must not mint a new observation lease')
          if 'BAD_OUTPUT:' in request_fn:
              raise SystemExit('033 format repair must not echo stale BAD_OUTPUT lease text')

          required_protocol = [
              'internal object PrimaryCompactPlanV33',
              'if (leaseLines.size != 1) return null',
              'val leasePrefix = "REQ|$requestId|"',
              'if (!line.startsWith(leasePrefix)) return null',
          ]
          for token in required_protocol:
              if token not in protocol:
                  raise SystemExit('033 protocol contract missing: ' + token)
          v33 = protocol[protocol.index('internal object PrimaryCompactPlanV33'):protocol.index('internal object HybridDirectCommandParser')]
          for forbidden in ['"TAP"', '"TYPE"', '"SWIPE"', '"LONG_PRESS"', '"CONFIRM"', '"FAIL"']:
              if forbidden in v33:
                  raise SystemExit('033 unsafe Primary op admitted in V33: ' + forbidden)

          for token in ['rejectsAnySecondReqLineEvenIfOneIsCurrent', 'rejectsStaleLeaseAndBareAction', 'rejectsUnsafeModelActions']:
              if token not in test:
                  raise SystemExit('033 safety regression test missing: ' + token)

          # Preserve 031/032 performance + transport fix.
          for token in [
              'MAX_PRIMARY_UI_NODES = 16',
              'MAX_PRIMARY_UI_CHARS = 2_000',
              'MAX_PRIMARY_HISTORY = 2',
              'PRIMARY_CUSTOM_HTTP_TIMEOUT_MS = 180_000L',
              'PRIMARY_CUSTOM_MAX_OUTPUT_TOKENS = 64L',
          ]:
              if token not in engine:
                  raise SystemExit('033 lost previous fast-planner/timeout contract: ' + token)

          if 'applicationIdSuffix = ".rc11c033"' not in gradle or 'versionNameSuffix = "-rc11-c033"' not in gradle:
              raise SystemExit('033 package/version identity missing')
          if 'ClosePaw RC11 033' not in strings:
              raise SystemExit('033 app label missing')
          if 'ClosePaw-033-diagnostics.zip' not in settings:
              raise SystemExit('033 diagnostics export filename missing')

          with Path('033-verification-report.txt').open('a') as f:
              f.write('Exact current-lease V33 parser: PASS\n')
              f.write('Unique REQ-line / stale-lease fail-closed: PASS\n')
              f.write('Same-observation format repair lease: PASS\n')
              f.write('No BAD_OUTPUT lease echo in repair: PASS\n')
              f.write('Raw Primary output diagnostics: PASS\n')
              f.write('031/032 performance and HTTP transport preserved: PASS\n')
          print('033 FORMAT CONTRACT AUDIT: PASS')
          PYAUDIT033

      - name: 033 clean Kotlin compile gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo '033 clean Kotlin compile: PASS' >> 033-verification-report.txt

      - name: 033 unit tests and clean rebuild
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '033 unit tests: PASS' >> 033-verification-report.txt
          echo '033 debug APK rebuild: PASS' >> 033-verification-report.txt

      - name: 033 APK identity integrity runtime and signature gate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT2"
          test -x "$APKSIGNER"
          BADGING="$($AAPT2 dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='ai.closepaw.rc11c033'" >/dev/null
          echo "$BADGING" | grep -F "application-label:'ClosePaw RC11 033'" >/dev/null
          echo "$BADGING" | grep -F "sdkVersion:'31'" >/dev/null
          echo "$BADGING" | grep -F "targetSdkVersion:'36'" >/dev/null
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' >/dev/null
          "$APKSIGNER" verify --verbose "$APK" >/dev/null
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c %s "$APK")"
          {
            echo "APK path: $APK"
            echo "APK size bytes: $SIZE"
            echo "APK SHA256: $SHA"
            echo 'APK ZIP integrity: PASS'
            echo 'APK package identity ai.closepaw.rc11c033: PASS'
            echo 'APK app label ClosePaw RC11 033: PASS'
            echo 'minSdk 31 / targetSdk 36: PASS'
            echo 'arm64 runtime libraries: PASS'
            echo 'APK signature verification: PASS'
          } >> 033-verification-report.txt

      - name: Prepare 033 full verified source snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 033-full-source
          mkdir -p 033-full-source
          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='.gradle/'             --exclude='app/build/'             --exclude='033-full-source/'             ./ 033-full-source/
          test -f 033-full-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f 033-full-source/app/src/test/kotlin/ai/closepaw/app/PrimaryFormatComplianceV33Test.kt

      - name: Upload 033 verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 033-ClosePaw-RC11-verification-proof
          if-no-files-found: warn
          path: |
            033-verification-report.txt
            033-baseline-source-manifest.json
            033-postpatch-source-manifest.json
            033-baseline-critical-hashes.json

      - name: Upload 033 full verified source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 033-ClosePaw-RC11-verified-full-source
          if-no-files-found: error
          path: 033-full-source/

      - name: Upload 033 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 033-ClosePaw-RC11-APK
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload 033 failure sources
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 033-ClosePaw-RC11-failure-sources
          if-no-files-found: warn
          path: |
            app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
            app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt
            app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt
            app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt
            app/src/test/kotlin/ai/closepaw/app/PrimaryFormatComplianceV33Test.kt
            app/build.gradle.kts
            app/src/main/res/values/strings.xml
            033-verification-report.txt
