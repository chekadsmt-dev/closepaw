          +
          +/** Minimal Hybrid-engine timeline events for the existing inspection trace recorder. */
          +internal object HybridTraceEventsV37 {
          +    fun emit(recorder: TraceRecorder, taskId: String, type: String, detail: String = "") {
          +        if (!recorder.enabled) return
          +        val data = detail.takeIf { it.isNotBlank() }
