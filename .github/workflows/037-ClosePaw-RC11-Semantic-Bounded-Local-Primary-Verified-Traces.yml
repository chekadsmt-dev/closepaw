      - name: 037 source isolation and frozen correctness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYISO037'
          from pathlib import Path
          import hashlib, json
          def sha(data: bytes): return hashlib.sha256(data).hexdigest()
          def sf(path): return sha(Path(path).read_bytes())
          baseline=json.loads(Path('037-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if not p.is_file(): continue
              rel=p.as_posix()
              if rel.startswith('app/build/'): continue
              current[rel]=sf(rel)
          changed={p for p in baseline.keys() & current.keys() if baseline[p] != current[p]}
          added=set(current)-set(baseline)
          removed=set(baseline)-set(current)
          allowed_changed={
              'app/build.gradle.kts',
              'app/src/main/res/values/strings.xml',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
          }
          allowed_added={
              'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt',
              'app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt',
              'app/src/test/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37Test.kt',
              'app/src/test/kotlin/ai/closepaw/app/HybridTraceEventsV37Test.kt',
          }
          if changed != allowed_changed:
              raise SystemExit(f'037 unexpected changed files: {sorted(changed)} expected {sorted(allowed_changed)}')
          if added != allowed_added:
              raise SystemExit(f'037 unexpected added files: {sorted(added)} expected {sorted(allowed_added)}')
          if removed:
              raise SystemExit(f'037 removed baseline files: {sorted(removed)}')

          engine=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          def region(a,b):
              s=engine.find(a); e=engine.find(b,s)
              if s < 0 or e < 0: raise SystemExit('037 frozen region anchor missing')
              return engine[s:e].encode()
          frozen=json.loads(Path('037-baseline-critical-hashes.json').read_text())
          now={
              'routing_execution': sha(region('val planQueue = mutableListOf<HybridAction>()','finishFailure("Bounded recovery stopped after')),
              'rc8_restore': sha(region('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded(')),
              'durable_transaction': sha(region('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9(')),
              'v33_primary_plan_validation': sha(region('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest(')),
              'hybrid_protocol_file': sf('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt'),
              'rc11_policy_file': sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
              'http_transport_v32_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
              'v36_grammar_file': sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV36.kt'),
              'bridge_source': sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          if now != frozen:
              bad=[k for k in frozen if now.get(k) != frozen[k]]
              raise SystemExit('037 modified frozen correctness regions/files: '+', '.join(bad))
          Path('037-postpatch-source-manifest.json').write_text(json.dumps(current, indent=2, sort_keys=True)+'\n')
          with Path('037-verification-report.txt').open('a') as f:
              f.write('Source isolation exact allowlist: PASS\n')
              f.write('Frozen routing/RC8/durable/V33/protocol/RC11/HTTP/V36/bridge hashes: PASS\n')
          print('037 SOURCE ISOLATION + FROZEN CORRECTNESS: PASS')
          PYISO037

      - name: 037 semantic-bound grammar trace and identity contract audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT037'
          from pathlib import Path
          engine=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          grammar=Path('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV37.kt').read_text(encoding='utf-8')
          trace=Path('app/src/main/kotlin/ai/closepaw/app/HybridTraceEventsV37.kt').read_text(encoding='utf-8')
          gradle=Path('app/build.gradle.kts').read_text(encoding='utf-8')
          strings=Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')

          required_engine=[
              'PrimaryLocalGrammarV37.build(lease, request, installedApps)',
              'AppManager.getInstalledApps(service.packageManager)',
              'grammarMode=${grammarSpec?.mode.orEmpty()}',
              'HybridTraceEventsV37.emit(traceRecorder, task.id, "hybrid_task_started")',
              'HybridTraceEventsV37.emit(traceRecorder, task.id, "hybrid_task_success", message)',
              'HybridTraceEventsV37.emit(traceRecorder, task.id, "hybrid_task_failure", message)',
              'PRIMARY_CUSTOM_HTTP_TIMEOUT_MS = 180_000L',
              'PRIMARY_CUSTOM_MAX_OUTPUT_TOKENS = 64L',
              'appendLine(task.goal)',
          ]
          for token in required_engine:
              if token not in engine: raise SystemExit('037 missing engine contract: '+token)
          if 'PrimaryLocalGrammarV36::build' in engine:
              raise SystemExit('037 engine still invokes V36 free-argument grammar')

          required_grammar=[
              'forced_explicit_open_app',
              'forced_explicit_visible_target',
              'OPEN_APP|${protocolEscape(explicitlyRequestedApp.packageName)}',
              'CLICK_NODE|${explicitVisibleNode.index}',
              'snapshot_bound_fallback',
              'PRIMARY_ESCALATE|',
              'insufficient_context',
              'ambiguous_target',
              'unsupported_action',
          ]
          for token in required_grammar:
              if token not in grammar: raise SystemExit('037 missing semantic grammar contract: '+token)
          forbidden_active=['arg ::= [^|\r\n]+','SET_TEXT_NODE|" arg','CLICK_TEXT|" arg','CLICK_DESC|" arg']
          for token in forbidden_active:
              if token in grammar: raise SystemExit('037 retained free side-effect grammar: '+token)

          if 'recorder.emit(sessionId = taskId, type = type, data = data)' not in trace:
              raise SystemExit('037 trace helper does not emit timeline records')
          if 'applicationIdSuffix = ".rc11c037"' not in gradle: raise SystemExit('037 application id missing')
          if 'versionNameSuffix = "-rc11-c037"' not in gradle: raise SystemExit('037 version suffix missing')
          if '<string name="app_name">ClosePaw RC11 037</string>' not in strings: raise SystemExit('037 label missing')

          with Path('037-verification-report.txt').open('a') as f:
              f.write('V37 explicit installed-app package forcing: PASS\n')
              f.write('V37 explicit visible-node forcing: PASS\n')
              f.write('V37 fallback has no arbitrary side-effect argument rule: PASS\n')
              f.write('V37 trace timeline task start/success/failure events: PASS\n')
              f.write('V32 HTTP and full user goal preservation: PASS\n')
          print('037 SEMANTIC-BOUND + TRACE CONTRACT AUDIT: PASS')
          PYAUDIT037

