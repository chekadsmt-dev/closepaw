          +        assertEquals("forced_explicit_open_app", spec.mode)
          +        assertEquals("root ::= \"REQ|R1|OPEN_APP|com.android.settings\"", spec.grammar)
          +        assertFalse(spec.grammar.contains("arg ::="))
          +    }
          +
          +    @Test fun originalUnknownAppsGoalStillForcesSettingsFirst() {
          +        val spec = PrimaryLocalGrammarV37.build(
          +            requestId = "R2",
          +            request = request(
          +                goal = """I need to find which apps are allowed to install unknown apps.
          +Open the correct Android Settings screen.
          +Do not use Settings search.
          +Do not change any setting.
          +Stop when the list of apps with this permission is visible.""",
          +                currentApp = "ai.closepaw.rc11c037",
          +                nodes = "[1] TextView t=\"ClosePaw\"",
          +            ),
          +            installedApps = apps,
          +        )
          +        assertEquals("OPEN_APP|com.android.settings", spec.forcedAction)
          +    }
          +
          +    @Test fun explicitVisibleDestinationIsForcedToCurrentSnapshotNode() {
          +        val spec = PrimaryLocalGrammarV37.build(
          +            requestId = "R3",
          +            request = request(
          +                goal = "Open Settings.\nGo to Display.\nDo not change any setting.",
          +                currentApp = "com.android.settings",
          +                nodes = """[10] TextView t=\"Display\" C
          +[11] TextView t=\"Connections\" C
          +[12] RecyclerView S""",
          +            ),
          +            installedApps = apps,
          +        )
          +        assertEquals("CLICK_NODE|10", spec.forcedAction)
          +        assertEquals("forced_explicit_visible_target", spec.mode)
          +        assertEquals("root ::= \"REQ|R3|CLICK_NODE|10\"", spec.grammar)
          +    }
          +
          +    @Test fun negativeOpenInstructionNeverForcesAppLaunch() {
          +        val spec = PrimaryLocalGrammarV37.build(
          +            requestId = "R4",
          +            request = request(
          +                goal = "Do not open Settings. Wait here.",
          +                currentApp = "ai.closepaw.rc11c037",
          +                nodes = "[4] Button t=\"Continue\" C",
          +            ),
          +            installedApps = apps,
          +        )
          +        assertNull(spec.forcedAction)
          +        assertFalse(spec.grammar.contains("OPEN_APP|"))
          +    }
          +
          +    @Test fun fallbackTargetsOnlyCurrentSnapshotIndicesAndHasNoFreeSemanticArg() {
          +        val spec = PrimaryLocalGrammarV37.build(
          +            requestId = "R5",
          +            request = request(
          +                goal = "Continue safely.",
          +                currentApp = "com.example",
          +                nodes = """[4] Button t=\"Continue\" C
          +[9] RecyclerView S
          +[15] TextView t=\"Context\"""",
          +            ),
          +            installedApps = apps,
          +        )
          +        assertNull(spec.forcedAction)
          +        assertTrue(spec.grammar.contains("CLICK_NODE|"))
          +        assertTrue(spec.grammar.contains("\"4\""))
          +        assertFalse(spec.grammar.contains("\"15\""))
          +        assertTrue(spec.grammar.contains("SCROLL_NODE|"))
          +        assertTrue(spec.grammar.contains("\"9\""))
          +        assertFalse(spec.grammar.contains("SET_TEXT_NODE"))
          +        assertFalse(spec.grammar.contains("CLICK_TEXT"))
          +        assertFalse(spec.grammar.contains("CLICK_DESC"))
          +        assertFalse(spec.grammar.contains("DONE"))
          +        assertFalse(spec.grammar.contains("VERIFY_TEXT"))
          +        assertFalse(spec.grammar.contains("arg ::="))
          +        assertFalse(spec.grammar.contains("<ACTION>"))
