          +    private fun request(goal: String, currentApp: String, nodes: String): String = """
          +        CP_PRIMARY_V29
          +        TASK=T
          +        REQ=unused
          +        TURN=1
          +        GOAL_BEGIN
          +        $goal
          +        GOAL_END
          +        CURRENT_APP: $currentApp
          +        NODES_BEGIN
          +        $nodes
          +        NODES_END
