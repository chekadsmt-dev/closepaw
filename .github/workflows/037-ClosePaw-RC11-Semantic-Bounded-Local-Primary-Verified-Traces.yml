          +class HybridTraceEventsV37Test {
          +    @Test fun emitsTimelineEventWhenTracingIsEnabled() {
          +        val recorder = FakeRecorder()
          +        HybridTraceEventsV37.emit(recorder, "TASK-1", "hybrid_task_started", "hello")
          +        assertEquals(1, recorder.events.size)
          +        val event = recorder.events.single()
          +        assertEquals("TASK-1", event.sessionId)
          +        assertEquals("hybrid_task_started", event.type)
          +        assertEquals("hello", (event.data as JsonPrimitive).content)
          +    }
          +
          +    @Test fun emitsNothingWhenTracingIsDisabled() {
          +        val recorder = FakeRecorder(enabledFlag = false)
          +        HybridTraceEventsV37.emit(recorder, "TASK-1", "hybrid_task_started")
          +        assertTrue(recorder.events.isEmpty())
          +    }
          +
          +    private class FakeRecorder(private val enabledFlag: Boolean = true) : TraceRecorder {
          +        val events = mutableListOf<TraceEventRecord>()
          +        private var seq = 0L
          +        override val enabled: Boolean get() = enabledFlag
          +        override val runId: String = "run-1"
          +        override fun nextSeq(): Long = ++seq
          +        override fun record(event: TraceEventRecord) { events += event }
          +        override fun storeText(kind: String, filenameHint: String, content: String, mimeType: String?, description: String?): TraceArtifactRef? = null
          +        override fun storeBytes(kind: String, filenameHint: String, bytes: ByteArray, mimeType: String?, description: String?): TraceArtifactRef? = null
          +        override suspend fun flush() = Unit
          +        override suspend fun close() = Unit
          +    }
          +}
