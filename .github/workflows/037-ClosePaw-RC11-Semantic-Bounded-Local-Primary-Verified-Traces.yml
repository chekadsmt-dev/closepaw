      - name: 037 APK identity integrity native-runtime and signature gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ]; then echo "Expected exactly one debug APK, found ${#APKS[@]}" >&2; exit 1; fi
          APK="${APKS[0]}"
          unzip -tq "$APK" >/dev/null
          SIZE="$(stat -c %s "$APK")"
          if [ "$SIZE" -lt 50000000 ]; then echo "APK unexpectedly small: $SIZE bytes" >&2; exit 1; fi
          CONTENTS="$(zipinfo -1 "$APK")"
          for ENTRY in AndroidManifest.xml classes.dex lib/arm64-v8a/libllama.so lib/arm64-v8a/libggml.so lib/arm64-v8a/libinference_engine.so lib/arm64-v8a/libinference_engine_jni.so lib/arm64-v8a/libinference_engine_llamacpp_backend.so; do
            if ! grep -Fxq "$ENTRY" <<<"$CONTENTS"; then echo "Required APK entry missing: $ENTRY" >&2; exit 1; fi
          done
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$AAPT"; test -x "$APKSIGNER"
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='ai.closepaw.rc11c037'" <<<"$BADGING" || { echo '037 APK package identity mismatch' >&2; exit 1; }
          grep -Fq "application-label:'ClosePaw RC11 037'" <<<"$BADGING" || { echo '037 APK label mismatch' >&2; exit 1; }
          grep -Fq "sdkVersion:'31'" <<<"$BADGING" || { echo '037 APK minSdk mismatch' >&2; exit 1; }
          grep -Fq "targetSdkVersion:'36'" <<<"$BADGING" || { echo '037 APK targetSdk mismatch' >&2; exit 1; }
          "$APKSIGNER" verify --verbose "$APK" > 037-apksigner-verification.txt
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "APK path: $APK"
            echo "APK size bytes: $SIZE"
            echo "APK SHA256: $APK_SHA"
            echo 'APK ZIP integrity: PASS'
            echo 'APK package identity ai.closepaw.rc11c037: PASS'
            echo 'APK app label ClosePaw RC11 037: PASS'
            echo 'minSdk 31 / targetSdk 36: PASS'
            echo 'arm64 local-inference runtime libraries: PASS'
            echo 'APK signature verification: PASS'
          } >> 037-verification-report.txt
          echo "037 APK FULL INTEGRITY GATE: PASS | size=$SIZE | sha256=$APK_SHA"

