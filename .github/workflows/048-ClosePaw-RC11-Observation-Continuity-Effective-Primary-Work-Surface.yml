                   } finally {
                       windows.forEach { window -> runCatching { window.recycle() } }
                   }
          @@ -4647,8 +4669,8 @@ internal class HybridAgentEngine(private val service: AgentService) {
               }
           
               private fun buildPrimaryUiSnapshotV9(
          -        platform: AndroidPlatform,
