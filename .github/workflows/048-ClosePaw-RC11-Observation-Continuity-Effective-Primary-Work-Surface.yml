      - name: 048 architecture contract audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          e=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          gradle=Path('app/build.gradle.kts').read_text()
          strings=Path('app/src/main/res/values/strings.xml').read_text()

          # Defect 1: Primary CURRENT_APP must consume the already-computed effective work surface.
          call='snapshot = buildPrimaryUiSnapshotV9(\n                                        snapshot = ui,\n                                        currentPackage = currentPackage,'
          if call not in e: raise SystemExit('V48 effective package is not propagated into Primary snapshot')
          ps=e[e.find('private fun buildPrimaryUiSnapshotV9('):e.find('private fun buildUiSnapshot(', e.find('private fun buildPrimaryUiSnapshotV9('))]
          if 'currentPackage: String?' not in ps: raise SystemExit('V48 Primary snapshot package parameter missing')
          if 'val currentPkg = currentPackage.orEmpty()' not in ps: raise SystemExit('V48 Primary snapshot does not use propagated package')
          if 'observedPackage(platform)' in ps: raise SystemExit('V48 Primary snapshot still re-reads raw foreground package')

          # Defect 2: causal terminal proof must use the exact stable receipt observation.
          if 'val afterSnapshot: ScreenSnapshot' not in e: raise SystemExit('V48 receipt snapshot field missing')
          receipt=e[e.find('private suspend fun buildPostActionReceiptV9('):e.find('private suspend fun executeActionTransactionV9(', e.find('private suspend fun buildPostActionReceiptV9('))]
          if 'afterSnapshot = after' not in receipt: raise SystemExit('V48 stable post-action snapshot not stored in receipt')
          post_receipt=e.find('if (selectedPlanSource == "DETERMINISTIC_V43")')
          click_start=e.find('is DeterministicUiNavigatorV43.Decision.Click -> {', post_receipt)
          click_end=e.find('pendingDeterministicDecisionV43 = null', click_start)
          if post_receipt < 0 or click_start < 0 or click_end < 0: raise SystemExit('V48 post-receipt deterministic click block missing')
          click=e[click_start:click_end]
          for token in [
              'if (receipt.accepted)',
              'val postClickSnapshotV48 = receipt.afterSnapshot',
              'CausalDestinationV46.prove(',
              'deterministicNavigatorNodesV43(postClickSnapshotV48)',
              'LOCAL_GOAL_COMPLETE_V48|receipt_snapshot_causal_destination',
          ]:
