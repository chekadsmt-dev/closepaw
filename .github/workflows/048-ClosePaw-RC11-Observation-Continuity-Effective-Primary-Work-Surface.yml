      - name: 048 APK identity integrity native-runtime and signature gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          [ "${#APKS[@]}" -eq 1 ] || { echo 'expected one APK' >&2; exit 1; }
          APK="${APKS[0]}"
          unzip -tq "$APK" >/dev/null
          SIZE="$(stat -c %s "$APK")"
          [ "$SIZE" -gt 50000000 ] || { echo 'APK too small' >&2; exit 1; }
          CONTENTS="$(zipinfo -1 "$APK")"
          for E in AndroidManifest.xml classes.dex lib/arm64-v8a/libllama.so lib/arm64-v8a/libggml.so lib/arm64-v8a/libinference_engine.so lib/arm64-v8a/libinference_engine_jni.so lib/arm64-v8a/libinference_engine_llamacpp_backend.so; do
            grep -Fxq "$E" <<<"$CONTENTS" || { echo "missing $E" >&2; exit 1; }
          done
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='ai.closepaw.rc11c048'" <<<"$BADGING"
          grep -Fq "application-label:'ClosePaw RC11 048'" <<<"$BADGING"
          grep -Fq "sdkVersion:'31'" <<<"$BADGING"
          grep -Fq "targetSdkVersion:'36'" <<<"$BADGING"
          "$APKSIGNER" verify --verbose "$APK" > 048-apksigner-verification.txt
          echo "048 APK gate PASS sha256=$(sha256sum "$APK" | awk '{print $1}') size=$SIZE" | tee -a 048-verification-report.txt

