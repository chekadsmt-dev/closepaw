          -        val currentPkg = observedPackage(platform).orEmpty()
          +        // V48: CURRENT_APP must be the controller's already-proved effective work surface.
          +        // Re-reading raw foreground package here can make grammar force a stale OPEN_APP.
          +        val currentPkg = currentPackage.orEmpty()
                   val sb = StringBuilder()
                   sb.appendLine("CURRENT_APP: $currentPkg")
           
          diff --git a/app/src/main/res/values/strings.xml b/app/src/main/res/values/strings.xml
