          +                                        snapshot = ui,
          +                                        currentPackage = currentPackage,
          +                                    ),
                                               history = history.takeLast(MAX_HISTORY),
                                               lastError = lastError,
                                           )
          @@ -1051,7 +1057,10 @@ internal class HybridAgentEngine(private val service: AgentService) {
                                                       // V46 causal page alias: never globally loosen PAGE_REACHED.
                                                       // Only a grounded, receipt-accepted click may authorize a
                                                       // row-label -> destination-header alias in the same foreground app.
          -                                            val postClickSnapshotV46 = platform.captureScreen()
          +                                            // V48 observation continuity: this is the exact stable snapshot
