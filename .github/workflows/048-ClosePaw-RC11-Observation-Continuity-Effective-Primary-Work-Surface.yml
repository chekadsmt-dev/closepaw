      - name: 048 source isolation frozen-region and exact-post-tree gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYISO'
          from pathlib import Path
          import hashlib,json
          def sf(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          base=json.loads(Path('048-baseline-source-manifest.json').read_text())
