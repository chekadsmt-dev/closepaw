                                                           }
                                                           verifiedPageAliasesV46 += alias
                                                           history +=
          -                                                    "CAUSAL_DESTINATION_V47|${alias.sourceTarget}|${alias.destinationHeader}|${alias.packageName}"
          +                                                    "CAUSAL_DESTINATION_V48|${alias.sourceTarget}|${alias.destinationHeader}|${alias.packageName}"
           
                                                           // Use THIS exact post-click snapshot for terminal proof. Do not take a
                                                           // second package/window observation that could flicker during Samsung
          @@ -1090,12 +1099,12 @@ internal class HybridAgentEngine(private val service: AgentService) {
                                                                   CausalDestinationV46.provesStopTarget(
                                                                       stopTarget = stopSpecV47.target,
                                                                       currentPackage = alias.packageName,
