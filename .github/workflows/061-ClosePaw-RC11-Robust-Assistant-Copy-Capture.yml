      - name: Verify 061 isolated scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('061-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'061 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')
          adapter=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          orch=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          build=Path('app/build.gradle.kts').read_text(); strings=Path('app/src/main/res/values/strings.xml').read_text()
          checks={
              'explicit localized copy labels': 'setOf("Copy response", "کپی پاسخ")' in adapter,
              'generic copy labels': 'GENERIC_COPY_LABELS = setOf("Copy", "کپی")' in adapter,
              'response chrome evidence': 'RESPONSE_CHROME_EVIDENCE_LABELS' in adapter,
              'generic copy discriminator': 'isResponseCopyControl' in adapter and 'copyCount == 1 && chromeCount >= 1' in adapter,
              'all response scans use robust collector': adapter.count('collectResponseCopyControls()') >= 6,
              'copy counting uses discriminator': 'if (isResponseCopyControl(node)) count++' in adapter,
              '060 baseline logic retained': 'probeManagerBaseline(maxBackwardScrolls: Int = 8)' in adapter,
              '060 bounded manager failure retained': 'MAX_CONSECUTIVE_MANAGER_SCAN_FAILURES = 3' in orch and 'MANAGER_SCAN_FAIL_CLOSED' in orch,
              'copy diagnostics persisted': 'responseCopyDiagnosticsV61()' in adapter and 'copy=${ui.responseCopyDiagnosticsV61()}' in orch,
              'package continuity': 'applicationIdSuffix = ".rc11c058"' in build,
              'version 061': 'versionNameSuffix = "-rc11-c061"' in build,
              'label 061': 'ClosePaw RC11 061' in strings,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f'061 invariant audit failed: {bad}')
          Path('061-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('061-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('061-postpatch-manifest-sha256.txt').write_text(sha+'  061-postpatch-source-manifest.json\n')
          print('061 isolated scope/invariants: PASS', sha)
          PYAUDIT
          echo '061 isolated scope/invariants: PASS' >> 061-verification-report.txt

