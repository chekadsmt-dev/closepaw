name: 061 - ClosePaw RC11 Robust Assistant Copy Capture
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 060 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='060-ClosePaw-RC11-verified-full-source'
          rm -rf /tmp/060-source /tmp/060-normalized /tmp/060-artifact.zip /tmp/060-list.json
          mkdir -p /tmp/060-source
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{GITHUB_REPOSITORY}}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/060-list.json
          python3 - <<'PYMETA'
          import json
          d=json.load(open('/tmp/060-list.json'))
          name='060-ClosePaw-RC11-verified-full-source'
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches:
              raise SystemExit('verified 060 full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          open('/tmp/060-artifact-id','w').write(str(chosen['id']))
          open('/tmp/060-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('060 artifact', chosen['id'], chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/060-artifact-id)"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{GITHUB_REPOSITORY}}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/060-artifact.zip
          unzip -q /tmp/060-artifact.zip -d /tmp/060-source
          MANIFEST="$(find /tmp/060-source -type f -name '060-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '060 source manifest missing' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/060-source' ]; then
            mkdir -p /tmp/060-normalized
            cp -a "$ROOT"/. /tmp/060-normalized/
            rm -rf /tmp/060-source
            mv /tmp/060-normalized /tmp/060-source
          fi
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/060-source')
          manifest=json.loads((root/'060-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'060 source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          build=(root/'app/build.gradle.kts').read_text()
          strings=(root/'app/src/main/res/values/strings.xml').read_text()
          assert 'versionNameSuffix = "-rc11-c060"' in build
          assert 'ClosePaw RC11 060' in strings
          print('verified 060 source identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/060-source/ ./
          cp 060-postpatch-source-manifest.json 061-baseline-source-manifest.json
          cat > 061-verification-report.txt <<'REPORT'
          ClosePaw RC11 061 verification report
          Baseline: verified 060 full-source artifact.
          Device evidence from c060: manager navigation PASS; baseline exact cursor capture failed after 8 bounded backward scans; fail-closed after 3 consecutive failures PASS.
          061 scope: robust assistant-response Copy control capture across ChatGPT label/localization variants, preserving code-block Copy discrimination.
          REPORT
          cat /tmp/060-artifact-meta.txt >> 061-verification-report.txt

      - name: Baseline 060 clean compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 060 clean compile: PASS' >> 061-verification-report.txt

