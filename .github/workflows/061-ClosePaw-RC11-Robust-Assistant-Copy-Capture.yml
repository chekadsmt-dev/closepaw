            --tests 'ai.closepaw.app.GoalPostconditionV41Test' \
            --tests 'ai.closepaw.app.PostPlanGuardV58ATest' \
            --tests 'ai.closepaw.app.ActionLifecycleV57Test' \
            --stacktrace --no-daemon --no-configuration-cache
          echo '061 frozen unit gates: PASS' >> 061-verification-report.txt

      - name: Full clean compile tests and assemble 061
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '061 clean compile + full unit tests + assemble: PASS' >> 061-verification-report.txt

      - name: Verify post-test source and APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('061-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected: raise SystemExit('061 production source changed during build/tests')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '061 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 061-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 061-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c061'" 061-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 061'" 061-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 061-apksigner.txt
          sha256sum "$APK" > 061-apk-sha256.txt
          cat >> 061-verification-report.txt <<'REPORT'
          061 CI build/test/source/APK gates: PASS.
          Runtime acceptance: test 1 only first — ROUTER START must open 00, prime a non-empty exact manager cursor, then remain running/quiet.
          If test 1 passes, continue existing tests 2-5 without changing their payloads.
          REPORT

