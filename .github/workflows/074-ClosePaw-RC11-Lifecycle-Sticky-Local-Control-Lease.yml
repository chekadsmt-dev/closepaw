      - name: Verify 074 scope and architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('074-baseline-source-manifest.json').read_text())
          cur={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  cur[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed={k for k in set(base)|set(cur) if base.get(k)!=cur.get(k)}
          expected={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
              'app/src/main/kotlin/ai/closepaw/app/ControlPlaneLeaseV72.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ControlPlaneLeaseV72Test.kt',
          }
          assert changed==expected, (sorted(changed-expected), sorted(expected-changed))
          out=json.dumps(cur,indent=2,sort_keys=True)+'\n'
          Path('074-postpatch-source-manifest.json').write_text(out)
          assert hashlib.sha256(out.encode()).hexdigest()=='9d7ed48da52f85c7fff3f2c02fae5953332cfabc4012a0e93625f17c3e953d34'
          service=Path('app/src/main/kotlin/ai/closepaw/app/AgentService.kt').read_text()
          orch=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          policy=Path('app/src/main/kotlin/ai/closepaw/app/ControlPlaneLeaseV72.kt').read_text()
          test=Path('app/src/test/kotlin/ai/closepaw/app/ControlPlaneLeaseV72Test.kt').read_text()
          assert '@Volatile private var mainAppLifecycleVisibleV74: Boolean = false' in service
          assert 'mainAppLifecycleVisibleV74 = true' in service
          assert 'mainAppLifecycleVisibleV74 = false' in service
          assert 'isClosePawControlSurfaceForegroundV74' in service and 'ownControlSurfaceForegroundV74' in service
          assert 'LOCAL_CONTROL_LEASE_HELD_V74' in orch and 'LOCAL_CONTROL_LEASE_RELEASED_V74' in orch
          assert 'lifecycleVisibleHoldsLeaseEvenWhenImeOwnsAccessibilityFocus' in test
          assert 'com.samsung.android.honeyboard' in test
          assert 'SMT' not in policy and '00 —' not in policy and 'Finance' not in policy
          assert 'versionNameSuffix = "-rc11-c074"' in Path('app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 074' in Path('app/src/main/res/values/strings.xml').read_text()
