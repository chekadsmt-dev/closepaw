name: 074 - ClosePaw RC11 Lifecycle Sticky Local Control Lease
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 071 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='071-ClosePaw-RC11-verified-full-source'
          EXPECTED_ARTIFACT_DIGEST='sha256:23b398438cb26f57169c5442d2ffcbbfd37408ed6d7bb732e90ce9eb47fa5c12'
          EXPECTED_MANIFEST_SHA='a20d7991518748f38b45e7dc8f3fbc42feb958f1cb7446e97603a67a1ea495b0'
          export ARTIFACT_NAME EXPECTED_ARTIFACT_DIGEST EXPECTED_MANIFEST_SHA
          rm -rf /tmp/071-source /tmp/071-stage1 /tmp/071-stage2 /tmp/071-artifact.zip /tmp/071-list.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/071-list.json
          python3 - <<'PYMETA'
          import json,os
          d=json.load(open('/tmp/071-list.json'))
          name=os.environ['ARTIFACT_NAME']; expected=os.environ['EXPECTED_ARTIFACT_DIGEST']
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches: raise SystemExit('verified 071 full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          if chosen.get('digest') != expected:
              raise SystemExit(f'071 artifact digest mismatch: {chosen.get("digest")} != {expected}')
          open('/tmp/071-artifact-id','w').write(str(chosen['id']))
          open('/tmp/071-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('071 artifact identity PASS', chosen['id'], chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/071-artifact-id)"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/071-artifact.zip
          mkdir -p /tmp/071-stage1
          unzip -q /tmp/071-artifact.zip -d /tmp/071-stage1
          MANIFEST="$(find /tmp/071-stage1 -type f -name '071-postpatch-source-manifest.json' -print -quit)"
          if [ -z "$MANIFEST" ]; then
            mapfile -t NESTED_ZIPS < <(find /tmp/071-stage1 -type f -name '*.zip' -print)
            [ "${#NESTED_ZIPS[@]}" -eq 1 ] || { echo '071 source manifest missing' >&2; exit 1; }
            mkdir -p /tmp/071-stage2
            unzip -q "${NESTED_ZIPS[0]}" -d /tmp/071-stage2
            MANIFEST="$(find /tmp/071-stage2 -type f -name '071-postpatch-source-manifest.json' -print -quit)"
          fi
          [ -n "$MANIFEST" ] || { echo '071 source manifest missing after trusted unwrap' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          mkdir -p /tmp/071-source
          cp -a "$ROOT"/. /tmp/071-source/
          ACTUAL_MANIFEST_SHA="$(sha256sum /tmp/071-source/071-postpatch-source-manifest.json | awk '{print $1}')"
          [ "$ACTUAL_MANIFEST_SHA" = "$EXPECTED_MANIFEST_SHA" ] || { echo "071 manifest SHA mismatch" >&2; exit 1; }
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/071-source')
          manifest=json.loads((root/'071-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert current == manifest
          assert 'versionNameSuffix = "-rc11-c071"' in (root/'app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 071' in (root/'app/src/main/res/values/strings.xml').read_text()
          print('verified 071 source identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/071-source/ ./
          cp 071-postpatch-source-manifest.json 074-baseline-source-manifest.json
          cat > 074-verification-report.txt <<'REPORT'
          ClosePaw RC11 074 verification report
          Baseline: exact verified 071 source.
          First apply: exact previously delivered 072 local-control lease patch.
          Device evidence from c072: the lease was detected and held, but later released while the user was still using ClosePaw. Accessibility focus/root evidence is not lifecycle-stable; an IME/keyboard or transient accessibility root can own focus while MainActivity remains visibly resumed.
          074 fix: MainActivity's existing onStart/onResume/onStop callbacks become the primary sticky authority through AgentService. Accessibility package/window evidence remains fallback only. An IME must not release the human/local-control lease.
          073 numbering is intentionally skipped in this lineage because a separate prior 073 experiment exists; 074 is derived only from the verified 071 baseline + exact 072 patch + this isolated lifecycle fix.
          REPORT
          cat /tmp/071-artifact-meta.txt >> 074-verification-report.txt

