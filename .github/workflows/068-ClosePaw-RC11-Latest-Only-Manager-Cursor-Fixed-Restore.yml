      - name: Verify 068 scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCOPE'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('068-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'068 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')

          adapter=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          orch=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          checks={
              'bottom-grounded latest helper': 'latestAssistantResponseAtBottomV68' in adapter and 'scrollToBottom(maxForwardScrolls)' in adapter,
              'latest-only changed gate': 'MANAGER_LATEST_CHANGED_V68' in orch,
              'latest-only parse': 'ProjectOrchestratorProtocolV58.routes(latest)' in orch,
              'no historical cursor scan in manager path': 'copyAssistantResponsesAfter(cursorHash = cursor)' not in orch,
              'no cursor-gap fail path': 'trace(\n                        "MANAGER_CURSOR_GAP"' not in orch,
              'route transaction priority retained': 'val runnable = store.runnableRoutes(limit = 12)' in orch and 'Only an idle router may observe a manager' in orch,
              'marker recovery retained': 'correlationMarkerMatchesV65' in adapter and 'correlationMarkerMatchesV65(text, route.outboundMarker)' in orch,
              'whole-response parser retained': 'ProjectOrchestratorProtocolV58.routes(latest)' in orch,
              'version 068': 'versionNameSuffix = "-rc11-c068"' in Path('app/build.gradle.kts').read_text(),
              'label 068': 'ClosePaw RC11 068' in Path('app/src/main/res/values/strings.xml').read_text(),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f'068 invariant audit failed: {bad}')

          Path('068-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('068-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('068-postpatch-manifest-sha256.txt').write_text(sha+'  068-postpatch-source-manifest.json\n')
          with Path('068-verification-report.txt').open('a') as f:
              f.write(f'068 postpatch source manifest SHA-256: {sha}\n')
              for k in checks: f.write(f'PASS: {k}\n')
          print('068 scope/invariant audit: PASS',sha)
          PYSCOPE

      - name: Full clean compile tests and assemble 068
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '068 clean compile + full unit tests + assemble: PASS' >> 068-verification-report.txt

      - name: Verify post-test source identity and APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('068-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected: raise SystemExit('068 production source changed during build/tests')
          print('068 post-test source identity: PASS')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '068 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 068-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 068-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c068'" 068-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 068'" 068-apk-badging.txt
          sha256sum "$APK" > 068-apk-sha256.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 068-apksigner.txt
          cp "$APK" ClosePaw-0.1.0-rc11-c068-debug.apk
          echo '068 APK identity: PASS' >> 068-verification-report.txt

      - name: Stage verified 068 full source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/068-source
          mkdir -p /tmp/068-source
          rsync -a --exclude='.git' --exclude='.github' --exclude='app/build' ./ /tmp/068-source/
          test -f /tmp/068-source/068-postpatch-source-manifest.json
          echo '068 staged source directory: PASS' >> 068-verification-report.txt

      - name: Upload 068 verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 068-ClosePaw-RC11-verification-proof
          if-no-files-found: error
