name: 068 - ClosePaw RC11 Latest-Only Manager Cursor
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 066 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='066-ClosePaw-RC11-verified-full-source'
          EXPECTED_ARTIFACT_DIGEST='sha256:4b620cc3296279d96a05d31fcb08a98601e4ac7e221572b79ee99cfa8499f7cd'
          EXPECTED_MANIFEST_SHA='f1eb4141a966f6ab37330d68e17a0b9a3b2f06b8c96ff572a2f673ae1e257523'
          export ARTIFACT_NAME EXPECTED_ARTIFACT_DIGEST EXPECTED_MANIFEST_SHA
          rm -rf /tmp/066-source /tmp/066-normalized /tmp/066-artifact.zip /tmp/066-list.json
          mkdir -p /tmp/066-source
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/066-list.json
          python3 - <<'PYMETA'
          import json,os
          d=json.load(open('/tmp/066-list.json'))
          name=os.environ['ARTIFACT_NAME']
          expected=os.environ['EXPECTED_ARTIFACT_DIGEST']
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches: raise SystemExit('verified 066 full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          if chosen.get('digest') != expected:
              raise SystemExit(f'066 artifact digest mismatch: {chosen.get("digest")} != {expected}')
          open('/tmp/066-artifact-id','w').write(str(chosen['id']))
          open('/tmp/066-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('066 artifact identity PASS', chosen['id'], chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/066-artifact-id)"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/066-artifact.zip
          # GitHub upload-artifact always returns an artifact ZIP. The verified 066 artifact
          # itself contains a source ZIP, so unwrap at most one additional trusted nested layer.
          rm -rf /tmp/066-stage1 /tmp/066-stage2
          mkdir -p /tmp/066-stage1
          unzip -q /tmp/066-artifact.zip -d /tmp/066-stage1
          MANIFEST="$(find /tmp/066-stage1 -type f -name '066-postpatch-source-manifest.json' -print -quit)"
          if [ -z "$MANIFEST" ]; then
            mapfile -t NESTED_ZIPS < <(find /tmp/066-stage1 -type f -name '*.zip' -print)
            [ "${#NESTED_ZIPS[@]}" -eq 1 ] || {
              printf '066 source manifest missing after outer unzip; nested zip count=%s\n' "${#NESTED_ZIPS[@]}" >&2
              exit 1
            }
            mkdir -p /tmp/066-stage2
            unzip -q "${NESTED_ZIPS[0]}" -d /tmp/066-stage2
            MANIFEST="$(find /tmp/066-stage2 -type f -name '066-postpatch-source-manifest.json' -print -quit)"
          fi
          [ -n "$MANIFEST" ] || { echo '066 source manifest missing after nested artifact unwrap' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/066-source' ]; then
            mkdir -p /tmp/066-normalized
            cp -a "$ROOT"/. /tmp/066-normalized/
            rm -rf /tmp/066-source
            mv /tmp/066-normalized /tmp/066-source
          fi
          ACTUAL_MANIFEST_SHA="$(sha256sum /tmp/066-source/066-postpatch-source-manifest.json | awk '{print $1}')"
          [ "$ACTUAL_MANIFEST_SHA" = "$EXPECTED_MANIFEST_SHA" ] || { echo "066 manifest SHA mismatch: $ACTUAL_MANIFEST_SHA" >&2; exit 1; }
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/066-source')
          manifest=json.loads((root/'066-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current))
              added=sorted(set(current)-set(manifest))
              changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'066 source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          assert 'versionNameSuffix = "-rc11-c066"' in (root/'app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 066' in (root/'app/src/main/res/values/strings.xml').read_text()
          print('verified 066 source identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/066-source/ ./
          cp 066-postpatch-source-manifest.json 068-baseline-source-manifest.json
          cat > 068-verification-report.txt <<'REPORT'
          ClosePaw RC11 068 verification report
          Baseline: exact verified 066 full-source artifact, pinned by GitHub artifact digest and source-manifest SHA-256.
          Device evidence from c066: the manager visibly produced CP066-E2E-04-001. The router detected a changed/latest candidate but repeatedly failed to prove the old durable cursor in bounded virtualized history, emitting MANAGER_CURSOR_GAP and fail-closing before ROUTE_DISCOVERED.
          068 design: latest structurally-grounded assistant turn is the sole manager authority boundary. Manager history is never walked to rediscover an old cursor. Fresh installs baseline the newest existing turn; upgrades with an existing cursor compare that cursor only to the newest turn. A changed newest turn is parsed exactly once and then committed. Route/control IDs and durable route state preserve idempotency/no-blind-replay.
          065 route-transaction ownership and whitespace-tolerant correlation-marker verification remain unchanged.
          REPORT
          cat /tmp/066-artifact-meta.txt >> 068-verification-report.txt

      - name: Baseline 066 clean compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 066 clean compile: PASS' >> 068-verification-report.txt

