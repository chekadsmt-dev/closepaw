name: Build ClosePaw Hybrid Agent v5.5

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply v5.4 base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-hybrid-agent-v5-4.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name: str):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []

              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  if not line.strip():
                      body.append('')
                  else:
                      body.append(line[body_indent:])

              script = '\n'.join(body) + '\n'
              subprocess.run(['bash'], input=script, text=True, check=True)

          run_step('Apply v5.2 base files')
          run_step('Install Hybrid Agent v5.4 engine')
          print('v5.4 base applied: PASS')
          PY

      - name: Fix Brain verification regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt')
          text = path.read_text(encoding='utf-8')

          marker = 'private suspend fun waitForDedicatedBrainConversation'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('waitForDedicatedBrainConversation not found')

          open_brace = text.find('{', start)
          if open_brace < 0:
              raise SystemExit('Function opening brace not found')

          # Balanced-brace scan; this function does not contain raw triple-quoted Kotlin strings.
          i = open_brace
          depth = 0
          state = 'code'
          escape = False
          end = None

          while i < len(text):
              ch = text[i]
              nxt = text[i + 1] if i + 1 < len(text) else ''

              if state == 'code':
                  if ch == '"':
                      state = 'string'
                  elif ch == "'":
                      state = 'char'
                  elif ch == '/' and nxt == '/':
                      state = 'line_comment'
                      i += 1
                  elif ch == '/' and nxt == '*':
                      state = 'block_comment'
                      i += 1
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              elif state == 'string':
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == '"':
                      state = 'code'

              elif state == 'char':
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == "'":
                      state = 'code'

              elif state == 'line_comment':
                  if ch == '\n':
                      state = 'code'

              elif state == 'block_comment':
                  if ch == '*' and nxt == '/':
                      state = 'code'
                      i += 1

              i += 1

          if end is None:
              raise SystemExit('Function closing brace not found')

          header = text[start:open_brace].rstrip()

          new_body = ''' {
              repeat(10) {
                  runCatching {
                      verifyChatGptForeground(platform, "verifying dedicated Brain")
                  }.getOrElse {
                      return@repeat
                  }

                  val snapshot = platform.captureScreen()
                  val combined = snapshot.elements.joinToString(" ") { element ->
                      "${element.text} ${element.description} ${element.hintText} ${element.className}"
                  }
                  val normalized = normalizeForMatch(combined)

                  val hasBrainMarker =
                      normalized.contains("closepaw brain anchor 71d4") ||
                      normalized.contains("closepaw_brain_anchor_71d4") ||
                      normalized.contains("brain ready") ||
                      normalized.contains("brain_ready") ||
                      normalized.contains("brain plan") ||
                      normalized.contains("brain_plan") ||
                      normalized.contains("closepaw brain")

                  val hasComposer =
                      normalized.contains("follow up") ||
                      normalized.contains("reply to chatgpt") ||
                      normalized.contains("message chatgpt") ||
                      normalized.contains("ask chatgpt") ||
                      normalized.contains("edittext")

                  if (hasBrainMarker && hasComposer) {
                      return true
                  }

                  delay(250)
              }

              return false
          }'''

          patched = text[:start] + header + new_body + text[end:]

          required = [
              'brainRequestId = "${task.id}-T${turnIndex + 1}"',
              'waitForMatchingBrainResponse',
              'extractLatestPlanForTask',
              'plan.taskId != brainRequestId',
              'NO_UI_CHANGE',
              'SessionRecordingService',
              'VirtualDisplayPlatform',
          ]
          missing = [item for item in required if item not in patched]
          if missing:
              raise SystemExit('v5.5 safety check failed; missing: ' + ', '.join(missing))

          path.write_text(patched, encoding='utf-8')
          print('Brain verification regression fix: PASS')
          PY

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Hybrid-Agent-v5.5-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
