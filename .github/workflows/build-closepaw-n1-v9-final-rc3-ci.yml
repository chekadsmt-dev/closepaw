name: Build ClosePaw General v9 RC3 CI

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply General v8 source
        shell: bash
        run: |
          python3 - <<'PYBASE'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-closepaw-general-v8.yml')
          if not workflow.exists():
              raise SystemExit('Missing required base workflow: build-closepaw-general-v8.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []
              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  body.append('' if not line.strip() else line[body_indent:])
              result = subprocess.run(
                  ['bash'], input='\n'.join(body) + '\n', text=True, check=False
              )
              if result.returncode != 0:
                  raise SystemExit(f'Base step failed: {step_name}')

          run_step('Apply Adaptive v7.3 source')
          run_step('Apply General Execution Engine v8')
          print('GENERAL V8 SOURCE: PASS')
          PYBASE

      - name: Apply consolidated v9 execution and Brain patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/closepaw_v9_patch.py
          python3 -m py_compile /tmp/closepaw_v9_patch.py
          python3 /tmp/closepaw_v9_patch.py

      - name: Patch side-by-side identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text(encoding='utf-8')
          old = 'applicationIdSuffix = ".smt"'
          if old not in s:
              raise SystemExit('applicationIdSuffix anchor missing')
          s = s.replace(old, 'applicationIdSuffix = ".generalv9rc"', 1)
          if 'versionNameSuffix = "-smt"' in s:
              s = s.replace('versionNameSuffix = "-smt"', 'versionNameSuffix = "-general-v9-rc"', 1)
          gradle.write_text(s, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s, count = re.subn(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">ClosePaw General v9 RC</string>',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('app_name anchor missing')
          strings.write_text(s, encoding='utf-8')
          print('IDENTITY: PASS')
          PY

      - name: Gate 1 - frozen architecture invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          protocol = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt').read_text(encoding='utf-8')
          settings = Path('app/src/main/kotlin/ai/closepaw/app/ChatBrainSettingsStore.kt').read_text(encoding='utf-8')

          required_engine = [
              'V9DispatchState { PREPARED, ATTEMPTED }',
              'V9RiskClass { SAFE_TO_RETRY, CONDITIONALLY_RETRYABLE, NON_REPLAYABLE }',
              'persistPendingV9(task.id, sequence, action, V9DispatchState.PREPARED',
              'persistPendingV9(task.id, sequence, action, V9DispatchState.ATTEMPTED',
              'Could not atomically commit receipt / clear pending action',
              'skeletonFingerprintV9',
              'contentFingerprintV9',
              'evidenceRevisionAfter',
              'receiptCompletesNavigationGoalV9',
              'BRAIN_AWAITING_RESPONSE',
              'Persist BEFORE touching Send',
              'v9_pending_brain_plan',
              'ensureConfiguredBrainConversationV9',
              'sendConfiguredBrainMessageV9',
              'BRAIN_PARSE_INCOMPLETE',
              # Crash-recovery wiring: PendingAction / Brain excursion must be read back on
              # restart, not just written. A patch that only defines these functions without
              # calling them at the right point must fail this gate.
              'reconcileStalePendingActionV9',
              'reconcileStaleBrainExcursionV9',
              'hasAmbiguousIrreversibleStateV9',
              'pendingBrainPlanForTaskV9',
              'mayRetryV9',
              'V9SafetyModel.mayRetry',
          ]
          missing = [x for x in required_engine if x not in engine]
          if missing:
              raise SystemExit('V9 engine invariant missing: ' + ', '.join(missing))

          if 'normalizeForMatch(targetChat) == normalizeForMatch(declaredCurrentChat)' in engine:
              raise SystemExit('Prompt-declared current-chat false-completion shortcut remains')

          # A separate "modeled" retry rule reimplemented inline (rather than delegating to
          # V9SafetyModel) is exactly the disconnected-model problem this gate exists to catch.
          if 'if (risk == SAFE)' in engine or 'if (risk == CONDITIONAL)' in engine:
              raise SystemExit('mayRetryV9 must delegate to V9SafetyModel, not reimplement the rule inline')

          pending_attempt = engine.index('persistPendingV9(task.id, sequence, action, V9DispatchState.ATTEMPTED')
          android_dispatch = engine.index('val outcome = executeAction(platform, action)', pending_attempt)
          if pending_attempt > android_dispatch:
              raise SystemExit('ATTEMPTED must be persisted before Android side effect')

          # Recovery must run BEFORE the next PendingAction / Brain excursion is persisted,
          # never after — otherwise a leftover crash record is silently ignored forever.
          reconcile_pending = engine.index('reconcileStalePendingActionV9()')
          next_prepared = engine.index(
              'persistPendingV9(task.id, sequence, action, V9DispatchState.PREPARED', reconcile_pending
          )
          if reconcile_pending > next_prepared:
              raise SystemExit('reconcileStalePendingActionV9 must run before the next PendingAction is persisted')

          reconcile_brain_call = "reconcileStaleBrainExcursionV9()\n        val frame = captureBrainExcursionFrame("
          if reconcile_brain_call not in engine:
              raise SystemExit('reconcileStaleBrainExcursionV9 must be called at the top of consultBrain')
          reconcile_brain = engine.index(reconcile_brain_call)
          next_entering = engine.index(
              'persistBrainExcursionV9(V9ExcursionState.BRAIN_ENTERING', reconcile_brain
          )
          if reconcile_brain > next_entering:
              raise SystemExit('reconcileStaleBrainExcursionV9 must run before the next Brain excursion is persisted')

          for token in ['val requestId: String?', 'REQUEST_ID', 'Brain footer REQUEST_ID mismatch']:
              if token not in protocol:
                  raise SystemExit('Protocol invariant missing: ' + token)

          for token in ['DEFAULT_APP_PACKAGE', 'DEFAULT_CHAT_TITLE', 'timeoutMs']:
              if token not in settings:
                  raise SystemExit('Chat Brain setting missing: ' + token)

          print('GATE 1 frozen architecture: PASS')
          PY

      - name: Gate 2 - modeled safety and loop rules (fast pre-compile sanity check only)
        shell: bash
        run: |
          # NOTE: this is a cheap, disconnected sanity check of the INTENDED policy shape,
          # run before Kotlin even compiles. It proves nothing about the shipped engine code.
          # The authoritative check is Gate 5, which compiles and runs
          # V9SafetyModelTest.kt against the real V9SafetyModel object that
          # HybridAgentEngine.mayRetryV9 actually delegates to (enforced by Gate 1).
          python3 - <<'PY'
          SAFE, CONDITIONAL, NON_REPLAYABLE = range(3)

          def may_retry(risk, attempted, postcondition_proven_false):
              if not attempted:
                  return True
              if risk == SAFE:
                  return True
              if risk == CONDITIONAL:
                  return postcondition_proven_false
              return False

          cases = {
              'safe action can retry after ambiguous attempt': may_retry(SAFE, True, False),
              'conditional requires fresh proof': not may_retry(CONDITIONAL, True, False),
              'conditional retries after proof precondition remains': may_retry(CONDITIONAL, True, True),
              'irreversible never auto retries after attempt': not may_retry(NON_REPLAYABLE, True, True),
          }
          failed = [name for name, ok in cases.items() if not ok]
          if failed:
              raise SystemExit('Safety model failed: ' + ', '.join(failed))

          def brain_key(task, subgoal, work_state, evidence_revision):
              return (task, subgoal, work_state, evidence_revision)
          a = brain_key('T', 'S', 'W', 4)
          b = brain_key('T', 'S', 'W', 4)
          c = brain_key('T', 'S', 'W', 5)
          if a != b or a == c:
              raise SystemExit('Brain loop-key model failed')

          print('GATE 2 modeled safety/loop rules: PASS')
          PY

      - name: Gate 3 - source contract checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt').read_text(encoding='utf-8')
          e = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          ui = Path('app/src/main/kotlin/ai/closepaw/ui/settings/ChatBrainSettingsPage.kt').read_text(encoding='utf-8')
          tester = Path('app/src/main/kotlin/ai/closepaw/app/ChatBrainConfigTester.kt').read_text(encoding='utf-8')

          checks = [
              # Protocol source uses a regex, so validate the actual REQUEST_ID parser contract
              # rather than requiring the unrelated literal substring "REQUEST_ID:".
              (p, 'REQUEST_ID\\\\s*:'),
              (p, 'val requestId = requestMatch'),
              (p, 'Brain footer REQUEST_ID mismatch'),
              (p, 'END_BRAIN_PLAN|$requestId'),
              (e, 'TASK_ID: ${task.id}'),
              (e, 'REQUEST_ID: $brainRequestId'),
              (e, 'END_BRAIN_PLAN|$requestId'),
              (ui, 'TEST BRAIN (no message sent)'),
              (tester, 'exact configured chat not verified'),
              # READBACK must be a real multi-line reconstruction probe, not "some text exists".
              (tester, 'stackedLines'),
              (tester, 'reconstructed.length'),
          ]
          missing = [needle for text, needle in checks if needle not in text]
          if missing:
              raise SystemExit('Source contract missing: ' + ', '.join(missing))

          # The old single-node READBACK heuristic must actually be gone, not just supplemented.
          if 'nodes.count { !it.text.isNullOrBlank() || !it.contentDescription.isNullOrBlank() }' in tester:
              raise SystemExit('ChatBrainConfigTester still uses the weak single-node READBACK heuristic')

          safety_model = Path('app/src/main/kotlin/ai/closepaw/app/V9SafetyModel.kt').read_text(encoding='utf-8')
          if 'fun mayRetry(' not in safety_model or 'fun brainLoopKey(' not in safety_model:
              raise SystemExit('V9SafetyModel.kt missing expected functions')

          safety_test = Path('app/src/test/kotlin/ai/closepaw/app/V9SafetyModelTest.kt').read_text(encoding='utf-8')
          if '@Test' not in safety_test or 'V9SafetyModel.mayRetry' not in safety_test:
              raise SystemExit('V9SafetyModelTest.kt missing or not exercising the real object')

          print('GATE 3 protocol/settings contracts: PASS')
          PY

      - name: Gate 4 - Kotlin compile
        run: ./gradlew :app:compileDebugKotlin

      - name: Gate 5 - unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Gate 6 - assemble APK
        run: ./gradlew assembleDebug

      - name: Gate 7 - APK integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not apk.exists():
              raise SystemExit('APK missing')
          if apk.stat().st_size < 1_000_000:
              raise SystemExit('APK unexpectedly small')
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for required in ['AndroidManifest.xml', 'classes.dex', 'resources.arsc']:
                  if required not in names:
                      raise SystemExit('APK missing ' + required)
              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)
          print(f'GATE 7 APK integrity: PASS ({apk.stat().st_size} bytes)')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-General-v9-RC-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
