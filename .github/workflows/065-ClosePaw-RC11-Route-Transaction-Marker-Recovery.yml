name: 065 - ClosePaw RC11 Route Transaction and Marker Recovery
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 064 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='064-ClosePaw-RC11-verified-full-source'
          rm -rf /tmp/064-source /tmp/064-normalized /tmp/064-artifact.zip /tmp/064-list.json
          mkdir -p /tmp/064-source
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/064-list.json
          python3 - <<'PYMETA'
          import json
          d=json.load(open('/tmp/064-list.json'))
          name='064-ClosePaw-RC11-verified-full-source'
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches:
              raise SystemExit('verified 064 full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          open('/tmp/064-artifact-id','w').write(str(chosen['id']))
          open('/tmp/064-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('064 artifact',chosen['id'],chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/064-artifact-id)"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/064-artifact.zip
          unzip -q /tmp/064-artifact.zip -d /tmp/064-source
          MANIFEST="$(find /tmp/064-source -type f -name '064-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '064 source manifest missing' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/064-source' ]; then
            mkdir -p /tmp/064-normalized
            cp -a "$ROOT"/. /tmp/064-normalized/
            rm -rf /tmp/064-source
            mv /tmp/064-normalized /tmp/064-source
          fi
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/064-source')
          manifest=json.loads((root/'064-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'064 source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          build=(root/'app/build.gradle.kts').read_text(); strings=(root/'app/src/main/res/values/strings.xml').read_text()
          assert 'versionNameSuffix = "-rc11-c064"' in build
          assert 'ClosePaw RC11 064' in strings
          print('verified 064 source identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/064-source/ ./
          cp 064-postpatch-source-manifest.json 065-baseline-source-manifest.json
          cat > 065-verification-report.txt <<'REPORT'
          ClosePaw RC11 065 verification report
          Baseline: verified 064 full-source artifact.
          c064 device evidence: manager route CP064-E2E-12-001 was discovered and physically sent to agent 12; agent 12 produced the expected correlated response. Send verification remained SEND_OUTCOME_UNKNOWN because the long unique marker was accessibility-wrapped/split, while manager scanning continued during the active route and eventually fail-closed after three navigation failures.
          065 scope: route transaction gets exclusive UI priority over manager polling; correlation-marker matching tolerates transport/UI whitespace wrapping without fuzzy token matching; existing no-blind-replay state is preserved so an in-place upgrade can reconcile the already-attempted c064 route instead of resending it.
          REPORT
          cat /tmp/064-artifact-meta.txt >> 065-verification-report.txt

      - name: Baseline 064 clean compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 064 clean compile: PASS' >> 065-verification-report.txt

      - name: Apply isolated 065 route-transaction patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path

          a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt')
          s=a.read_text()
          anchor='''internal data class AssistantResponseScanV58(\n    val responsesOldestFirst: List<String>,\n    val boundaryFound: Boolean,\n    val historyLimitReached: Boolean,\n)\n\n'''
          helper='''internal data class AssistantResponseScanV58(\n    val responsesOldestFirst: List<String>,\n    val boundaryFound: Boolean,\n    val historyLimitReached: Boolean,\n)\n\n/**\n * Correlation markers are immutable machine tokens, but ChatGPT/Android accessibility may\n * insert visual wrapping whitespace inside a long token. Ignore whitespace only; all other\n * characters must remain exact. This is not substring/fuzzy title or protocol matching.\n */\ninternal fun correlationMarkerMatchesV65(text: String, marker: String): Boolean {\n    if (marker.isBlank()) return false\n    val compactMarker = marker.filterNot { it.isWhitespace() }\n    if (compactMarker.isEmpty()) return false\n    val compactText = text.filterNot { it.isWhitespace() }\n    return compactText.contains(compactMarker)\n}\n\n'''
          if s.count(anchor)!=1: raise SystemExit(f'helper anchor mismatch count={s.count(anchor)}')
          s=s.replace(anchor,helper,1)

          old='''    suspend fun outgoingMarkerVisible(marker: String, maxBackwardScrolls: Int = 0): Boolean {\n        repeat(maxBackwardScrolls + 1) { pass ->\n            if (nonEditableVisibleTextContains(marker)) {\n                if (pass > 0) scrollToBottom(maxBackwardScrolls + 2)\n                return true\n            }\n            if (pass < maxBackwardScrolls && !scrollConversation(forward = false)) return@repeat\n            if (pass < maxBackwardScrolls) delay(250)\n        }\n        scrollToBottom(maxBackwardScrolls + 2)\n        return false\n    }\n'''
          new='''    suspend fun outgoingMarkerVisible(marker: String, maxBackwardScrolls: Int = 0): Boolean {\n        repeat(maxBackwardScrolls + 1) { pass ->\n            if (nonEditableVisibleTextContains(marker)) {\n                if (pass > 0) scrollToBottom(maxBackwardScrolls + 2)\n                return true\n            }\n            if (pass < maxBackwardScrolls && !scrollConversation(forward = false)) return@repeat\n            if (pass < maxBackwardScrolls) delay(250)\n        }\n        if (maxBackwardScrolls > 0) scrollToBottom(maxBackwardScrolls + 2)\n        return false\n    }\n'''
          if s.count(old)!=1: raise SystemExit(f'outgoing marker anchor mismatch count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''    private fun nonEditableVisibleTextContains(marker: String): Boolean {\n        val root = focusedRootOrNull() ?: return false\n        var found = false\n        walk(root) { node ->\n            if (found || !node.isVisibleToUser || node.isEditable || hasEditableAncestor(node)) return@walk\n            val values = listOfNotNull(node.text?.toString(), node.contentDescription?.toString())\n            if (values.any { it.contains(marker) }) found = true\n        }\n        return found\n    }\n'''
          new='''    private fun nonEditableVisibleTextContains(marker: String): Boolean {\n        val root = focusedRootOrNull() ?: return false\n        val visibleParts = mutableListOf<String>()\n        var exactFound = false\n        walk(root) { node ->\n            if (exactFound || !node.isVisibleToUser || node.isEditable || hasEditableAncestor(node)) return@walk\n            val values = listOfNotNull(node.text?.toString(), node.contentDescription?.toString())\n            if (values.any { correlationMarkerMatchesV65(it, marker) }) {\n                exactFound = true\n                return@walk\n            }\n            values.filter { it.isNotBlank() }.forEach(visibleParts::add)\n        }\n        if (exactFound) return true\n        // Some ChatGPT builds split a single long machine token across sibling accessibility\n        // nodes at visual line wraps. Rejoin only non-editable visible text and ignore whitespace.\n        return correlationMarkerMatchesV65(visibleParts.joinToString("\\n"), marker)\n    }\n'''
          if s.count(old)!=1: raise SystemExit(f'noneditable marker anchor mismatch count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''                    val candidate = messageTextForCopyControl(control) ?: continue\n                    if (!candidate.contains(marker)) continue\n                    val copied = copyResponseControl(control)?.trim()\n                    if (!copied.isNullOrBlank() && copied.contains(marker)) {\n                        lastAssistantCaptureSourceV63 = "clipboard"\n                        return copied\n                    }\n'''
          new='''                    val candidate = messageTextForCopyControl(control) ?: continue\n                    if (!correlationMarkerMatchesV65(candidate, marker)) continue\n                    val copied = copyResponseControl(control)?.trim()\n                    if (!copied.isNullOrBlank() && correlationMarkerMatchesV65(copied, marker)) {\n                        lastAssistantCaptureSourceV63 = "clipboard"\n                        return copied\n                    }\n'''
          if s.count(old)!=1: raise SystemExit(f'copy marker correlation anchor mismatch count={s.count(old)}')
          s=s.replace(old,new,1)
          a.write_text(s)

          o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt')
          t=o.read_text()
          old='''    private suspend fun mainLoop() {\n        ui.launch()\n        while (currentCoroutineContext().isActive && store.isRouterEnabled()) {\n            currentCoroutineContext().ensureActive()\n            // Scan at most one due manager per loop. This keeps project discovery scalable\n            // and prevents N projects from monopolizing the one physical Android UI before\n            // an already-durable route gets a chance to advance.\n            scanOneDueManager()\n            if (!store.isRouterEnabled()) return\n\n            var progressed = false\n            for (route in store.runnableRoutes(limit = 12)) {\n                currentCoroutineContext().ensureActive()\n                if (processOneStep(route)) {\n                    progressed = true\n                    break // one physical UI owner/action chain at a time\n                }\n            }\n            if (!progressed) delay(IDLE_POLL_MS)\n        }\n    }\n'''
          new='''    private suspend fun mainLoop() {\n        ui.launch()\n        while (currentCoroutineContext().isActive && store.isRouterEnabled()) {\n            currentCoroutineContext().ensureActive()\n\n            // A durable non-terminal route is one physical UI transaction. Once discovered, it\n            // owns ChatGPT until it reaches COMPLETED/FAILED/LEGACY_UNRESOLVED. Manager polling\n            // must never steal the UI between Send verification, specialist response capture and\n            // return-to-manager. This also preserves no-blind-replay recovery after a restart.\n            val runnable = store.runnableRoutes(limit = 12)\n            if (runnable.isNotEmpty()) {\n                var progressed = false\n                for (route in runnable) {\n                    currentCoroutineContext().ensureActive()\n                    if (processOneStep(route)) {\n                        progressed = true\n                        break\n                    }\n                }\n                if (!progressed) delay(IDLE_POLL_MS)\n                continue\n            }\n\n            // Only an idle router may observe a manager and discover new work.\n            scanOneDueManager()\n            if (!store.isRouterEnabled()) return\n            if (store.runnableRoutes(limit = 1).isEmpty()) delay(IDLE_POLL_MS)\n        }\n    }\n'''
          if t.count(old)!=1: raise SystemExit(f'mainLoop anchor mismatch count={t.count(old)}')
          t=t.replace(old,new,1)

          old='''            val newest = ui.assistantMessageTexts().asReversed().firstOrNull { text ->\n                ProjectOrchestratorProtocolV58.sha256(text) !in baseline &&\n                    text.contains(route.outboundMarker)\n            }\n'''
          new='''            val newest = ui.assistantMessageTexts().asReversed().firstOrNull { text ->\n                ProjectOrchestratorProtocolV58.sha256(text) !in baseline &&\n                    correlationMarkerMatchesV65(text, route.outboundMarker)\n            }\n'''
          if t.count(old)!=1: raise SystemExit(f'response candidate marker anchor mismatch count={t.count(old)}')
          t=t.replace(old,new,1)

          old='''                    val response = copied?.takeIf { it.contains(route.outboundMarker) }\n'''
          new='''                    val response = copied?.takeIf { correlationMarkerMatchesV65(it, route.outboundMarker) }\n'''
          if t.count(old)!=1: raise SystemExit(f'response verified marker anchor mismatch count={t.count(old)}')
          t=t.replace(old,new,1)
          o.write_text(t)

          test=Path('app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV65Test.kt')
          test.write_text('''package ai.closepaw.app\n\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass ChatGptProjectAdapterV65Test {\n    @Test\n    fun correlationMarkerSurvivesVisualWhitespaceWrapping() {\n        val marker = "CP58_ROUTE:SMT:CP064-E2E-12-001:dff51eec6015058b"\n        val wrapped = "CP58_ROUTE:SMT:CP064-E2E-12-001:dff51eec6\\n015058b ROUTER_E2E_12_PASS"\n        assertTrue(correlationMarkerMatchesV65(wrapped, marker))\n    }\n\n    @Test\n    fun correlationMarkerDoesNotAcceptCharacterMismatch() {\n        val marker = "CP58_ROUTE:SMT:CP064-E2E-12-001:dff51eec6015058b"\n        val wrong = "CP58_ROUTE:SMT:CP064-E2E-12-001:dff51eec6015058c"\n        assertFalse(correlationMarkerMatchesV65(wrong, marker))\n    }\n}\n''')

          build=Path('app/build.gradle.kts'); b=build.read_text()
          old='versionNameSuffix = "-rc11-c064"'; new='versionNameSuffix = "-rc11-c065"'
          if b.count(old)!=1: raise SystemExit(f'version anchor mismatch count={b.count(old)}')
          build.write_text(b.replace(old,new,1))

          strings=Path('app/src/main/res/values/strings.xml'); x=strings.read_text()
          old='ClosePaw RC11 064'; new='ClosePaw RC11 065'
          if x.count(old)!=1: raise SystemExit(f'label anchor mismatch count={x.count(old)}')
          strings.write_text(x.replace(old,new,1))
          print('065 route transaction + marker recovery patch: PASS')
          PYPATCH
          git diff --check
          echo '065 isolated route transaction + marker patch applied: PASS' >> 065-verification-report.txt

      - name: Verify 065 scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCOPE'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('065-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV65Test.kt',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'065 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')
          Path('065-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('065-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('065-postpatch-manifest-sha256.txt').write_text(sha+'  065-postpatch-source-manifest.json\n')

          o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          checks={
              'active route before manager scan': o.find('val runnable = store.runnableRoutes(limit = 12)') < o.find('scanOneDueManager()', o.find('private suspend fun mainLoop')),
              'active route loop continue': 'if (!progressed) delay(IDLE_POLL_MS)\n                continue' in o,
              'marker whitespace normalization': 'correlationMarkerMatchesV65' in a and 'filterNot { it.isWhitespace() }' in a,
              'outbound reconciliation uses normalized visibility': 'nonEditableVisibleTextContains(marker)' in a,
              'worker response candidate uses normalized marker': 'correlationMarkerMatchesV65(text, route.outboundMarker)' in o,
              'worker response authority uses normalized marker': 'correlationMarkerMatchesV65(it, route.outboundMarker)' in o,
              'no blind send replay retained': 'SEND_OUTCOME_UNKNOWN' in o and 'No proof of prior Send; no replay allowed' in o,
              '064 quiet manager poll retained': 'MANAGER_SCAN_UNCHANGED' in o and '|surface=true' in o,
              '063 grounded capture retained': 'responseCaptureDiagnosticsV63' in a and 'accessibility-grounded' in a,
              'version 065': 'versionNameSuffix = "-rc11-c065"' in Path('app/build.gradle.kts').read_text(),
              'label 065': 'ClosePaw RC11 065' in Path('app/src/main/res/values/strings.xml').read_text(),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f'065 invariant audit failed: {bad}')
          print('065 scope/invariant audit: PASS',sha)
          with Path('065-verification-report.txt').open('a') as f:
              f.write(f'065 postpatch source manifest SHA-256: {sha}\n')
          PYSCOPE

      - name: Full clean compile tests and assemble 065
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '065 clean compile + full unit tests + assemble: PASS' >> 065-verification-report.txt

      - name: Verify post-test source identity and APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('065-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected: raise SystemExit('065 production source changed during build/tests')
          print('065 post-test source identity: PASS')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '065 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 065-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 065-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c065'" 065-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 065'" 065-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 065-apksigner.txt
          sha256sum "$APK" > 065-apk-sha256.txt
          cat >> 065-verification-report.txt <<'REPORT'
          065 CI build/test/source/APK gates: PASS.
          Device acceptance recovery gate: install in-place over c064 without clearing app data, run ROUTER START, and do not author a new ROUTE_TASK. The durable CP064-E2E-12-001 SEND_OUTCOME_UNKNOWN record must reconcile from the already-visible marker/response, capture ROUTER_E2E_12_PASS, return RESULT_FROM_AGENT to 00, and reach ROUTE_COMPLETED without manager polling stealing the worker UI.
          REPORT

      - name: Prepare 065 verified full-source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/065-verified-source
          mkdir -p /tmp/065-verified-source
          rsync -a --exclude='.git' --exclude='.github' --exclude='app/build' ./ /tmp/065-verified-source/

      - name: Upload 065 verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 065-ClosePaw-RC11-verification-proof
          path: |
            065-verification-report.txt
            065-baseline-source-manifest.json
            065-postpatch-source-manifest.json
            065-postpatch-manifest-sha256.txt
            065-apk-badging.txt
            065-apksigner.txt
            065-apk-sha256.txt

      - name: Upload 065 verified full source
        uses: actions/upload-artifact@v4
        with:
          name: 065-ClosePaw-RC11-verified-full-source
          path: /tmp/065-verified-source

      - name: Upload 065 APK
        uses: actions/upload-artifact@v4
        with:
          name: 065-ClosePaw-RC11-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload 065 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 065-ClosePaw-RC11-failure-evidence
          if-no-files-found: ignore
          path: |
            065-verification-report.txt
            065-baseline-source-manifest.json
            065-postpatch-source-manifest.json
            app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt
            app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt
            app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV65Test.kt
