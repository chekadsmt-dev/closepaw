          +package ai.closepaw.app
          +
          +/**
          + * Request-scoped GBNF for the phone-local llama.cpp-compatible Primary endpoint.
          + *
          + * This constrains surface syntax only. The existing RC11/V33 parser remains the authority
          + * for lease identity, action semantics, target uniqueness, and one-action enforcement.
          + */
          +internal object PrimaryLocalGrammarV36 {
          +    fun build(requestId: String): String {
          +        require(requestId.isNotBlank()) { "Primary grammar requires a request lease" }
          +        val lease = gbnfLiteral("REQ|$requestId|")
          +        return """
          +            root ::= $lease action | escalate
          +            action ::= open-app | click-text | click-desc | click-node | set-text-node | scroll-node | scroll | wait | back | home | recents | verify-text | done
          +            open-app ::= "OPEN_APP|" arg
          +            click-text ::= "CLICK_TEXT|" arg
          +            click-desc ::= "CLICK_DESC|" arg
          +            click-node ::= "CLICK_NODE|" digits
          +            set-text-node ::= "SET_TEXT_NODE|" digits "|" arg
          +            scroll-node ::= "SCROLL_NODE|" digits "|" direction
          +            scroll ::= "SCROLL|" direction
          +            wait ::= "WAIT|" digits
          +            back ::= "BACK"
          +            home ::= "HOME"
          +            recents ::= "RECENTS"
          +            verify-text ::= "VERIFY_TEXT|" arg
          +            done ::= "DONE|" arg
          +            escalate ::= "PRIMARY_ESCALATE|" arg
          +            direction ::= "UP" | "DOWN"
          +            digits ::= [0-9]+
          +            arg ::= [^|\r\n]+
          +        """.trimIndent()
          +    }
          +
          +    private fun gbnfLiteral(value: String): String = buildString {
          +        append('"')
          +        value.forEach { ch ->
          +            when (ch) {
          +                '\\' -> append("\\\\")
          +                '"' -> append("\\\"")
          +                '\n' -> append("\\n")
          +                '\r' -> append("\\r")
          +                '\t' -> append("\\t")
          +                else -> append(ch)
          +            }
          +        }
          +        append('"')
          +    }
          +}
