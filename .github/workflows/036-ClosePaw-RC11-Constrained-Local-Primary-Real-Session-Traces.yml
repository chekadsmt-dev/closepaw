          echo '036 debug APK rebuild: PASS' >> 036-verification-report.txt

      - name: 036 APK identity integrity native-runtime and signature gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK, found ${#APKS[@]}" >&2
            exit 1
          fi
          APK="${APKS[0]}"
          unzip -tq "$APK" >/dev/null
          SIZE="$(stat -c %s "$APK")"
          if [ "$SIZE" -lt 50000000 ]; then
            echo "APK unexpectedly small: $SIZE bytes" >&2
            exit 1
          fi

          CONTENTS="$(zipinfo -1 "$APK")"
          for ENTRY in \
            AndroidManifest.xml \
            classes.dex \
            lib/arm64-v8a/libllama.so \
            lib/arm64-v8a/libggml.so \
            lib/arm64-v8a/libinference_engine.so \
            lib/arm64-v8a/libinference_engine_jni.so \
            lib/arm64-v8a/libinference_engine_llamacpp_backend.so
          do
            if ! grep -Fxq "$ENTRY" <<<"$CONTENTS"; then
              echo "Required APK entry missing: $ENTRY" >&2
              exit 1
            fi
          done

          # Same aapt gate that was proven by successful 032 and successful 035.
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING="$($AAPT dump badging "$APK")"
          if ! grep -Fq "package: name='ai.closepaw.rc11c036'" <<<"$BADGING"; then
            echo "036 APK package identity mismatch" >&2
            printf '%s\n' "$BADGING" | head -n 12 >&2
            exit 1
          fi
          if ! grep -Fq "application-label:'ClosePaw RC11 036'" <<<"$BADGING"; then
            echo "036 APK application label mismatch" >&2
            printf '%s\n' "$BADGING" | grep -E "^(package:|application-label|sdkVersion|targetSdkVersion)" >&2 || true
            exit 1
          fi
          if ! grep -Fq "sdkVersion:'31'" <<<"$BADGING"; then
            echo "036 APK minSdk mismatch" >&2
            exit 1
          fi
          if ! grep -Fq "targetSdkVersion:'36'" <<<"$BADGING"; then
            echo "036 APK targetSdk mismatch" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK" > 036-apksigner-verification.txt
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "APK path: $APK"
            echo "APK size bytes: $SIZE"
            echo "APK SHA256: $APK_SHA"
            echo 'APK ZIP integrity: PASS'
            echo 'APK package identity ai.closepaw.rc11c036: PASS'
            echo 'APK app label ClosePaw RC11 036: PASS'
            echo 'minSdk 31 / targetSdk 36: PASS'
            echo 'arm64 local-inference runtime libraries: PASS'
            echo 'APK signature verification: PASS'
          } >> 036-verification-report.txt
          echo "036 APK FULL INTEGRITY GATE: PASS | size=$SIZE | sha256=$APK_SHA"

