          +        val grammar = PrimaryLocalGrammarV36.build("REQ-1")
          +        for (op in listOf("OPEN_APP", "CLICK_TEXT", "CLICK_DESC", "CLICK_NODE", "SET_TEXT_NODE", "SCROLL_NODE", "SCROLL", "WAIT", "BACK", "HOME", "RECENTS", "VERIFY_TEXT", "DONE")) {
          +            assertTrue("missing $op", grammar.contains(op))
          +        }
          +        for (op in listOf("TAP|", "TYPE|", "SWIPE|", "LONG_PRESS|", "CONFIRM|", "FAIL|")) {
          +            assertFalse("unsafe op admitted: $op", grammar.contains("\"$op"))
          +        }
          +    }
