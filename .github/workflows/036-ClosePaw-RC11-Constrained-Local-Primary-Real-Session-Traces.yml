              'canonical_bridge_source': sha_file(Path('tools/termux-bridge/closepaw_bridge.py')),
          }
          if current != baseline:
              for key in sorted(baseline):
                  if current.get(key) != baseline.get(key):
                      print('CHANGED FROZEN REGION:', key)
              raise SystemExit('036 modified a frozen 035 correctness region')

          Path('036-postpatch-source-manifest.json').write_text(json.dumps(after, indent=2, sort_keys=True) + '\n')
          with Path('036-verification-report.txt').open('a') as f:
              f.write('Source isolation gate: PASS\n')
              f.write('Frozen 035 correctness regions/files: PASS\n')
              f.write('Changed app files: ' + ', '.join(sorted(changed)) + '\n')
          print('036 SOURCE ISOLATION + FROZEN CORRECTNESS: PASS')
          PYISO036

      - name: 036 constrained-output and trace contract audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT036'
          from pathlib import Path

          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          grammar = Path('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV36.kt').read_text(encoding='utf-8')
          test = Path('app/src/test/kotlin/ai/closepaw/app/PrimaryLocalGrammarV36Test.kt').read_text(encoding='utf-8')
          settings = Path('app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt').read_text(encoding='utf-8')
          gradle = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          strings = Path('app/src/main/res/values/strings.xml').read_text(encoding='utf-8')

          for token in [
              'val grammar = exactLease.takeIf { it.isNotBlank() }?.let(PrimaryLocalGrammarV36::build)',
              'payload.put("grammar", grammar)',
              'grammar=${grammar != null}',
              'PrimaryLocalHttpTransportV32.create(PRIMARY_CUSTOM_HTTP_TIMEOUT_MS)',
              'PRIMARY_CUSTOM_HTTP_TIMEOUT_MS = 180_000L',
              'PRIMARY_CUSTOM_MAX_OUTPUT_TOKENS = 64L',
          ]:
              if token not in engine:
                  raise SystemExit('036 constrained-local contract missing: ' + token)

          for token in [
              'root ::= $lease action | escalate',
              '"OPEN_APP|" arg',
              '"CLICK_TEXT|" arg',
              '"CLICK_NODE|" digits',
              '"SET_TEXT_NODE|" digits "|" arg',
              '"SCROLL_NODE|" digits "|" direction',
              '"VERIFY_TEXT|" arg',
              '"PRIMARY_ESCALATE|" arg',
              r'arg ::= [^|\r\n]+',
          ]:
              if token not in grammar:
                  raise SystemExit('036 grammar contract missing: ' + token)
          for forbidden in ['"TAP|"', '"TYPE|"', '"SWIPE|"', '"LONG_PRESS|"', '"CONFIRM|"', '"FAIL|"']:
              if forbidden in grammar:
                  raise SystemExit('036 grammar admits forbidden Primary op: ' + forbidden)
          for token in ['bindsGrammarToExactRequestLease', 'grammarAllowsOnlyPrimarySafeOps', 'escapesLeaseBeforeEmbeddingInGrammar']:
              if token not in test:
                  raise SystemExit('036 grammar regression test missing: ' + token)

          create_start = engine.index('private suspend fun createTaskPlatform(taskId: String): TaskPlatformRuntime')
          create_end = engine.index('private fun acquireTaskWakeLock()', create_start)
          create = engine[create_start:create_end]
          for token in [
              'debugMode = settings.debugMode',
              'traceEnabled = settings.traceEnabled',
              'traceRunId = taskId',
              'TraceRecorderFactory.create(service, config, SessionId(taskId))',
              'traceRecorder = recorder',
          ]:
              if token not in create:
                  raise SystemExit('036 trace wiring missing: ' + token)
          for forbidden in ['debugMode = false', 'traceEnabled = false', 'traceRecorder = NoopTraceRecorder']:
              if forbidden in create:
                  raise SystemExit('036 trace wiring still contains disabled hard-code: ' + forbidden)
          for token in ['traceRecorder.flush()', 'traceRecorder.close()']:
              if token not in engine:
                  raise SystemExit('036 trace lifecycle missing: ' + token)
          for token in ['closepaw-diagnostics', 'inspection-trace', 'Export Diagnostics ZIP', 'ClosePaw-036-diagnostics.zip']:
              if token not in settings:
                  raise SystemExit('036 diagnostics export contract missing: ' + token)

          # V33 parser/repair remains present; 036 must not relax it.
          for token in [
              'PrimaryCompactPlanV33.parseOrNull(raw, taskId, requestId)',
              'val repairRequestId = requestId',
              'CP_PRIMARY_FORMAT_REPAIR_V33',
              'PLAN_RAW_V33',
              'PLAN_ACCEPT_V33',
              'PLAN_REJECT_V33',
          ]:
              if token not in engine:
                  raise SystemExit('036 lost V33 validation contract: ' + token)

          if 'applicationIdSuffix = ".rc11c036"' not in gradle or 'versionNameSuffix = "-rc11-c036"' not in gradle:
              raise SystemExit('036 package/version identity missing')
          if '<string name="app_name">ClosePaw RC11 036</string>' not in strings:
              raise SystemExit('036 app label missing')

          with Path('036-verification-report.txt').open('a') as f:
              f.write('Dynamic exact-lease GBNF attached to Local Server requests: PASS\n')
              f.write('GBNF safe-op surface excludes TAP/TYPE/SWIPE/LONG_PRESS/CONFIRM/FAIL: PASS\n')
              f.write('V33 strict parser/repair preserved byte-identically: PASS\n')
              f.write('Debug Mode + Session Traces are wired into Hybrid platform config: PASS\n')
              f.write('Trace recorder is flushed/closed and existing diagnostics ZIP includes inspection-trace: PASS\n')
          print('036 CONSTRAINED OUTPUT + REAL TRACE CONTRACT AUDIT: PASS')
          PYAUDIT036

