          +    fun parseOrNull(raw: String, taskId: String, requestId: String): HybridPlan? {
          +        val text = stripSimpleFence(raw).trim()
          +        if (text.isBlank() || text.length > 600) return null
          +        val nonBlank = text.lineSequence().map { it.trim() }.filter { it.isNotBlank() }.toList()
          +        if (nonBlank.size != 1) return null
          +        val line = nonBlank.single()
          +        if (line.startsWith("PRIMARY_ESCALATE", ignoreCase = true)) return null
          +        if (line.contains("BRAIN_PLAN", ignoreCase = true)) return null
          +        val leasePrefix = "REQ|$requestId|"
          +        if (!line.startsWith(leasePrefix)) return null
          +        val actionLine = line.removePrefix(leasePrefix).trim()
          +        val op = actionLine.substringBefore('|').trim().uppercase()
          +        if (op !in allowedOps) return null
          +
          +        val wrapped = buildString {
          +            appendLine("BRAIN_PLAN")
          +            appendLine("TASK_ID: $taskId")
          +            appendLine("REQUEST_ID: $requestId")
          +            appendLine(actionLine)
          +            appendLine("END_BRAIN_PLAN|$requestId")
          +        }
          +        return runCatching { HybridPlanParser.parse(wrapped) }
          +            .getOrNull()
          +            ?.takeIf { it.taskId == taskId && it.requestId == requestId && it.actions.size == 1 }
          +    }
          +
          +    private fun stripSimpleFence(value: String): String {
          +        val trimmed = value.trim()
          +        if (!trimmed.startsWith("```")) return trimmed
          +        val firstNewline = trimmed.indexOf('\n')
          +        val lastFence = trimmed.lastIndexOf("```")
          +        if (firstNewline < 0 || lastFence <= firstNewline) return trimmed
          +        return trimmed.substring(firstNewline + 1, lastFence).trim()
          +    }
          +}
