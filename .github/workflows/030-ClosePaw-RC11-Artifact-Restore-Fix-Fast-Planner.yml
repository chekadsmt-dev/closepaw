name: 030 - ClosePaw RC11 Local Server Fast Planner

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 028 source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYRESTORE030'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          run_id = 34566959965
          artifact_name = '028-ClosePaw-RC11-verified-sources'
          api = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?name={artifact_name}&per_page=100'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ClosePaw-030-source-restore',
          }

          with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=60) as response:
              data = json.load(response)
          artifacts = [a for a in data.get('artifacts', []) if a.get('name') == artifact_name and not a.get('expired')]
          if len(artifacts) != 1:
              raise SystemExit(f'030 expected exactly one live 028 verified-source artifact, found {len(artifacts)}')
          artifact = artifacts[0]

          # GitHub's artifact download endpoint returns a cross-host signed redirect.
          # Resolve that redirect WITH GitHub auth, then download the signed URL WITHOUT
          # forwarding Authorization. This prevents the 401 seen in workflow 029.
          import urllib.error
          from urllib.parse import urlparse

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None

          download_request = urllib.request.Request(artifact['archive_download_url'], headers=headers)
          no_redirect = urllib.request.build_opener(NoRedirect)
          signed_url = None
          try:
              response = no_redirect.open(download_request, timeout=60)
          except urllib.error.HTTPError as exc:
              if exc.code not in (301, 302, 303, 307, 308):
                  raise
              signed_url = exc.headers.get('Location')
              exc.close()
          else:
              # Defensive fallback if GitHub ever returns the ZIP directly.
              direct_bytes = response.read()
              response.close()
              zip_path = Path('/tmp/028-verified-sources.zip')
              zip_path.write_bytes(direct_bytes)

          zip_path = Path('/tmp/028-verified-sources.zip')
          if signed_url is not None:
              parsed = urlparse(signed_url)
              if parsed.scheme != 'https' or not parsed.netloc:
                  raise SystemExit('030 GitHub artifact redirect is not a valid HTTPS URL')
              # Deliberately omit Authorization on the signed storage request.
              storage_headers = {'User-Agent': 'ClosePaw-030-source-restore'}
              with urllib.request.urlopen(urllib.request.Request(signed_url, headers=storage_headers), timeout=120) as response:
                  zip_path.write_bytes(response.read())

          if not zip_path.exists() or zip_path.stat().st_size < 10_000:
              size = zip_path.stat().st_size if zip_path.exists() else 0
              raise SystemExit(f'030 028 source artifact unexpectedly small: {size}')

          extract = Path('/tmp/028-verified-sources')
          shutil.rmtree(extract, ignore_errors=True)
          extract.mkdir(parents=True)
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit('030 corrupt 028 source artifact entry: ' + bad)
              zf.extractall(extract)

          expected = {
              'src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt': '4c19fdf1aa6d6deae586f78ecac721c08e94765afb334dea8c11ec0a5fc3bfb5',
              'src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt': 'e3516c3b3dd1362c71bb3976641c96f3af0f6a2689c91bd39d924978fe4abcbf',
              'src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt': '6d2069354b970927dc4729a00355a74e8139f60efadb866e3f9e9b2c020e67b6',
              'src/test/kotlin/ai/closepaw/app/RC11CorrectnessPolicyTest.kt': '4d45484499513b3308478289c9d0a87f1302c70ee314e95df9bf611917900b8e',
              'build.gradle.kts': 'ec23432c51b97e4fcee6a6b4f8df5eba1fa886c368a42b19861e7e9010ba0e2e',
              'src/main/res/values/strings.xml': 'cca22847674611753ca94de070b3e74ba610ac5d6cf7a2c82a61b8d21427e5c8',
          }

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for rel, wanted in expected.items():
              src = extract / rel
              if not src.exists():
                  raise SystemExit('030 missing file in 028 verified source artifact: ' + rel)
              actual = sha(src)
              if actual != wanted:
                  raise SystemExit(f'030 028 provenance hash mismatch for {rel}: {actual} != {wanted}')
              dst = Path('app') / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          report = Path('030-verification-report.txt')
          report.write_text(
              'ClosePaw RC11 030 verification report\n'
              '=====================================\n'
              f'Base source: 028 verified-sources artifact from GitHub run {run_id}\n'
              f'Artifact ID: {artifact.get("id")}\n'
              f'Artifact digest: {artifact.get("digest", "unknown")}\n'
              'All six 028 source hashes: VERIFIED\n'
              '030 restore method: authenticated no-follow GitHub API request -> unauthenticated signed storage URL\n',
              encoding='utf-8',
          )
          print('030 VERIFIED 028 SOURCE RESTORE: PASS', flush=True)
          PYRESTORE030

