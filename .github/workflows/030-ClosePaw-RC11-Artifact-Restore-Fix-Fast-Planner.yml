          +internal object PrimaryCompactPlanV29 {
          +    private val allowedOps = setOf(
          +        "OPEN_APP", "CLICK_TEXT", "CLICK_DESC", "CLICK_NODE", "SET_TEXT_NODE",
          +        "SCROLL_NODE", "SCROLL", "WAIT", "BACK", "HOME", "RECENTS",
