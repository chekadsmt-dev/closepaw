      - name: 030 frozen RC11 correctness and performance audit
        shell: bash
        run: |
          python3 - <<'PYAUDIT030'
          from pathlib import Path
          import re

          engine_path = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt')
          protocol_path = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt')
          policy_path = Path('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt')
          test_path = Path('app/src/test/kotlin/ai/closepaw/app/RC11CorrectnessPolicyTest.kt')
          gradle_path = Path('app/build.gradle.kts')
          strings_path = Path('app/src/main/res/values/strings.xml')
          report_path = Path('030-verification-report.txt')

          e = engine_path.read_text(encoding='utf-8')
          proto = protocol_path.read_text(encoding='utf-8')
          p = policy_path.read_text(encoding='utf-8')
          t = test_path.read_text(encoding='utf-8')
          g = gradle_path.read_text(encoding='utf-8')
          s = strings_path.read_text(encoding='utf-8')

          # Identity / side-by-side install.
          for token in [
              'applicationIdSuffix = ".rc11c030"',
              'versionNameSuffix = "-rc11-c030"',
          ]:
              if g.count(token) != 1:
                  raise SystemExit('030 identity contract failed: ' + token)
          if s.count('<string name="app_name">ClosePaw RC11 030</string>') != 1:
              raise SystemExit('030 app label contract failed')

          # Frozen RC11 correctness: no performance optimization may weaken these.
          required_engine = [
              'val runEpochV11 = executionEpochV11.incrementAndGet()',
              'executionEpochV11.incrementAndGet()',
              'Plan lease expired because work UI changed during model call',
              'RC11CorrectnessPolicy.admitSingleObservationAction(plan.actions)',
              'RC11CorrectnessPolicy.modelActionAllowed(action)',
              'MODEL_DONE_NOT_AUTHORITY',
              'MODEL_FAIL_NOT_AUTHORITY',
              'confirmationKeyV11',
              'exact app not found',
              'ambiguous exact click text',
              'return native is ActionResult.Success',
              'STALE_ACTION_REVALIDATION_FAILED',
              'is HybridAction.TypeText, is HybridAction.SetTextNode -> inputVerified',
              'RC11 provenance mismatch is non-repairable',
              'RECOVERY_REQUIRED: could not preserve ambiguous Brain-send state',
              'Configured Brain conversation lease changed before Send',
              'primaryContextScoreV11',
              'isSensitiveElement',
              'PREPARED',
              'ATTEMPTED',
          ]
          missing = [x for x in required_engine if x not in e]
          if missing:
              raise SystemExit('030 missing frozen RC11 invariant(s): ' + ', '.join(missing))

          forbidden = [
              'task.goal.take(600)',
              'task.goal.take(',
              'currentPlanSource',
              'HybridAction.Notifications',
              'planQueue.addAll(plan.actions)',
              'return performTap(platform, element.center.x, element.center.y)',
              'categoryMatch || c == wanted',
              'finishFailure(action.reason, impossible = true)',
              'inputVerified || (executorSuccess && contentChanged)',
          ]
          present = [x for x in forbidden if x in e or x in p]
          if present:
              raise SystemExit('030 forbidden legacy/unsafe behavior remains: ' + ', '.join(present))

          # Full user constraints are preserved; only controller-generated context is compacted.
          if 'appendLine(task.goal)' not in e:
              raise SystemExit('030 full user goal is not serialized verbatim')
          if 'GOAL_BEGIN' not in e or 'GOAL_END' not in e:
              raise SystemExit('030 full-goal framing missing')

          # Semantic Primary context budget: ranked nodes, whole lines, no tail slicing.
          perf_required = [
              'MAX_PRIMARY_UI_NODES = 16',
              'MAX_PRIMARY_UI_CHARS = 2_000',
              'MAX_PRIMARY_HISTORY = 2',
              'PRIMARY_CUSTOM_HTTP_TIMEOUT_MS = 180_000L',
              'PRIMARY_CUSTOM_MAX_OUTPUT_TOKENS = 64L',
              '.put("stop", JSONArray().put("\\n"))',
              'if (sb.length + line.length > MAX_PRIMARY_UI_CHARS) break',
              'PRIMARY_LOCAL_REQUEST_V29',
              'PRIMARY_LOCAL_RESPONSE_V29',
              'estimatedInputTokens',
              'nodeCount',
          ]
          missing_perf = [x for x in perf_required if x not in e]
          if missing_perf:
              raise SystemExit('030 Local Server performance contract missing: ' + ', '.join(missing_perf))
          if 'return sb.toString().take(MAX_PRIMARY_UI_CHARS)' in e:
              raise SystemExit('030 still tail-cuts Primary snapshot mid-node')

          # Compact Primary wire format is request-lease bound and exactly one safe action.
          compact_required = [
              'internal object PrimaryCompactPlanV29',
              'val leasePrefix = "REQ|$requestId|"',
              'if (!line.startsWith(leasePrefix)) return null',
              'it.actions.size == 1',
              '"OPEN_APP", "CLICK_TEXT", "CLICK_DESC", "CLICK_NODE", "SET_TEXT_NODE"',
          ]
          missing_compact = [x for x in compact_required if x not in proto]
          if missing_compact:
              raise SystemExit('030 compact Primary protocol incomplete: ' + ', '.join(missing_compact))
          for unsafe in ['"TAP"', '"LONG_PRESS"', '"SWIPE"', '"TYPE"', '"CONFIRM"', '"FAIL"']:
              region = proto[proto.find('internal object PrimaryCompactPlanV29'):proto.find('internal object HybridDirectCommandParser')]
              if unsafe in region:
                  raise SystemExit('030 unsafe raw operation entered compact Primary allowlist: ' + unsafe)

          # Primary legacy output is also accepted only when it contains exactly one action.
          if e.count('it.actions.size == 1') < 2:
              raise SystemExit('030 Primary legacy parser does not strictly enforce exactly one action')
          if 'REQ|$requestId|<ACTION>' not in e:
              raise SystemExit('030 compact output is not visibly request-lease bound in the model request')

          # Primary still precedes Brain; full Brain snapshot remains unchanged fallback context.
          planning = e.find('if (planQueue.isEmpty())')
          primary = e.find('requestPrimaryPlanV9(', planning)
          brain = e.find('consultBrain(', primary)
          if planning < 0 or primary < 0 or brain < 0 or not (planning < primary < brain):
              raise SystemExit('030 Primary -> External Chat Brain fallback ordering invalid')
          brain_build = e.find('val request = buildBrainRequest(', primary)
          if brain_build < 0 or e.find('snapshot = snapshotText,', brain_build) < 0:
              raise SystemExit('030 External Chat Brain no longer receives full snapshot')

          # Provenance mismatch remains non-repairable on Brain path.
          m = re.search(r'(?s)private suspend fun parseWithSingleRepair\(.*?\n    private ', e)
          if not m:
              raise SystemExit('030 parseWithSingleRepair region not found')
          region = m.group(0)
          mismatch = region.find('provenance mismatch is non-repairable')
          repair_id = region.find('repairRequestId')
          if mismatch < 0 or repair_id < 0 or mismatch > repair_id:
              raise SystemExit('030 Brain provenance mismatch can still flow into repair')

          # Core policy source must remain byte-identical to verified 028.
          import hashlib
          policy_sha = hashlib.sha256(policy_path.read_bytes()).hexdigest()
          if policy_sha != '6d2069354b970927dc4729a00355a74e8139f60efadb866e3f9e9b2c020e67b6':
              raise SystemExit('030 unexpectedly changed frozen RC11CorrectnessPolicy.kt')

          # Added behavioral tests: compact success, verbose/multi-line reject, unsafe reject, stale lease reject.
          if t.count('@Test') < 7:
              raise SystemExit('030 behavioral unit test count < 7')
          for test_name in [
              'compactPrimaryBindsExactlyOneActionToCurrentLease',
              'compactPrimaryRejectsVerboseOrMultipleLines',
              'compactPrimaryRejectsUnsafeRawModelActions',
              'compactPrimaryRejectsStaleRequestLease',
          ]:
              if test_name not in t:
                  raise SystemExit('030 missing compact Primary test: ' + test_name)

          with report_path.open('a', encoding='utf-8') as f:
              f.write('Frozen RC11 correctness audit: PASS\n')
              f.write('Full user-goal preservation: PASS\n')
              f.write('Semantic whole-node context compaction: PASS\n')
              f.write('Local Server 180s timeout + 64-token/newline-stop budget: PASS\n')
              f.write('REQ-bound one-line Primary protocol: PASS\n')
              f.write('Strict one-action Primary parsing: PASS\n')
              f.write('Primary -> Brain fallback ordering: PASS\n')
              f.write('Frozen RC11CorrectnessPolicy hash: PASS\n')
              f.write('030 behavioral compact-protocol tests present: PASS\n')

          print('030 FROZEN RC11 + PERFORMANCE AUDIT: PASS', flush=True)
          PYAUDIT030

