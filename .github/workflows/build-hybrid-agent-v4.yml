name: Build ClosePaw Hybrid Agent v4

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Hybrid Agent v3 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          ROOT = Path('.')
          APP = ROOT / 'app/src/main/kotlin/ai/closepaw/app'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          protocol = base64.b64decode('').decode('utf-8')
          engine = base64.b64decode('').decode('utf-8')
          (APP / 'HybridAgentProtocol.kt').write_text(protocol, encoding='utf-8')
          (APP / 'HybridAgentEngine.kt').write_text(engine, encoding='utf-8')

          agent_path = APP / 'AgentService.kt'
          agent = agent_path.read_text(encoding='utf-8')

          if 'private val hybridAgent by lazy { HybridAgentEngine(this) }' not in agent:
              anchor = '    private val smtRouter by lazy { SmtRouter(this) }\n'
              insert = anchor + '''
              private val hybridAgent by lazy { HybridAgentEngine(this) }

              internal fun handleHybridInput(text: String): Boolean {
                  if (!isServiceActive) return false
                  return hybridAgent.handleInput(text)
              }

              internal fun publishHybridStatus(status: String) {
                  updateStatus(status)
              }

              internal fun publishHybridPlatformMode(mode: PlatformMode?) {
                  _effectivePlatformMode.value = mode
                  if (mode != null) {
                      currentPlatformMode = mode
                      overlayController?.setPlatformMode(mode)
                  }
              }
          '''
              agent = replace_once(agent, anchor, insert, 'AgentService hybrid integration')

          if 'hybridAgent.stop(clearQueue = true)' not in agent:
              anchor = '        if (smtRouter.isRunning) smtRouter.stop()\n'
              agent = replace_once(agent, anchor, anchor + '        hybridAgent.stop(clearQueue = true)\n', 'AgentService onDestroy stop')

          stop_anchor = '''    fun stopAgent() {
                  smtRouter.stop()
          '''
          stop_with_hybrid = '''    fun stopAgent() {
                  smtRouter.stop()
                  hybridAgent.stop(clearQueue = true)
          '''
          if stop_with_hybrid not in agent:
              agent = replace_once(agent, stop_anchor, stop_with_hybrid, 'AgentService stopAgent')

          agent_path.write_text(agent, encoding='utf-8')

          main_path = APP / 'MainActivity.kt'
          main = main_path.read_text(encoding='utf-8')

          if 'HYBRID AGENT V3 INTERCEPT' not in main:
              anchor = '        if (!validateCloudKeysForSelectedModels()) return\n'
              hybrid_block = '''        /*
                   * HYBRID AGENT V3 INTERCEPT
                   * Deterministic executor + dedicated ChatGPT Brain.
                   * Bypasses ClosePaw cloud/local LLM backends.
                   */
                  val hybridShouldHandle =
                      HybridAgentEngine.isEnabled(this) ||
                          HybridAgentEngine.isControlCommand(text)

                  if (hybridShouldHandle) {
                      val hybridService = AgentService.instance
                      if (hybridService == null) {
                          pendingAutoStartGoal = text
                          Toast.makeText(
                              this,
                              "Please enable the Accessibility Service",
                              Toast.LENGTH_LONG
                          ).show()
                          openAccessibilitySettings(this)
                          return
                      }
                      if (hybridService.handleHybridInput(text)) return
                  }

          '''
              main = replace_once(main, anchor, hybrid_block + anchor, 'MainActivity hybrid intercept')

          if 'val hybridPending =' not in main:
              old_overlay = '''        if (
                      !Settings.canDrawOverlays(
                          this
                      )
                  ) {
                      return
                  }

                  /*
                   * SMT Router commands do not need cloud credentials.
                   */
          '''
              new_overlay = '''        val hybridPending =
                      HybridAgentEngine.isEnabled(this) ||
                          HybridAgentEngine.isControlCommand(pendingGoal)

                  if (
                      !hybridPending &&
                      !Settings.canDrawOverlays(
                          this
                      )
                  ) {
                      return
                  }

                  /*
                   * SMT Router and Hybrid Agent commands do not need cloud credentials.
                   */
          '''
              main = replace_once(main, old_overlay, new_overlay, 'MainActivity pending overlay gate')

          old_condition = '''        if (
                      !isSmtRouterCommand &&
                      findMissingCloudKeys(
          '''
          new_condition = '''        if (
                      !isSmtRouterCommand &&
                      !hybridPending &&
                      findMissingCloudKeys(
          '''
          if old_condition in main:
              main = replace_once(main, old_condition, new_condition, 'MainActivity pending credential gate')

          main_path.write_text(main, encoding='utf-8')

          manifest_path = ROOT / 'app/src/main/AndroidManifest.xml'
          manifest = manifest_path.read_text(encoding='utf-8')
          if 'android.permission.WAKE_LOCK' not in manifest:
              anchor = '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n'
              manifest = replace_once(manifest, anchor, anchor + '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n', 'AndroidManifest WAKE_LOCK')
          manifest_path.write_text(manifest, encoding='utf-8')

          agent_check = agent_path.read_text(encoding='utf-8')
          main_check = main_path.read_text(encoding='utf-8')
          manifest_check = manifest_path.read_text(encoding='utf-8')
          engine_check = (APP / 'HybridAgentEngine.kt').read_text(encoding='utf-8')
          protocol_check = (APP / 'HybridAgentProtocol.kt').read_text(encoding='utf-8')
          checks = [
              (agent_check.count('private val hybridAgent by lazy { HybridAgentEngine(this) }') == 1, 'hybridAgent field'),
              (agent_check.count('publishHybridPlatformMode') == 1, 'platform mode publisher'),
              (main_check.count('HYBRID AGENT V3 INTERCEPT') == 1, 'MainActivity intercept'),
              (manifest_check.count('android.permission.WAKE_LOCK') == 1, 'WAKE_LOCK permission'),
              ('CLOSEPAW_BRAIN_ANCHOR_71D4' in engine_check, 'Brain anchor'),
              ('VirtualDisplayPlatform' in engine_check, 'Virtual Display executor'),
              ('resolveChatGptPackage' in engine_check, 'dynamic ChatGPT package resolver'),
              ('awaitPackage' in engine_check, 'package transition retry guard'),
              ('NonCancellable' in engine_check, 'cancel-safe cleanup'),
              ('HybridPlanParser' in protocol_check, 'tolerant Brain parser'),
          ]
          failed = [name for ok, name in checks if not ok]
          if failed:
              raise SystemExit('Hybrid v4 self-check failed: ' + ', '.join(failed))
          print('Hybrid Agent v4 patch self-check: PASS')
          PY

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Hybrid-Agent-v4-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
