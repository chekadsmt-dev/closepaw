name: 031 - ClosePaw RC11 Full-028 Safe Fast Planner

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct exact full 028 candidate from proven workflow chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRECON031'
          from pathlib import Path
          import hashlib
          import subprocess

          workflow_path = Path('.github/workflows/028-ClosePaw-RC11-Full-Release-Verification.yml')
          if not workflow_path.exists():
              raise SystemExit('031 missing proven 028 workflow')

          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          step_starts = [i for i, line in enumerate(lines) if line.startswith('      - name: ')]

          def run_step(wanted: str):
              for pos, start_i in enumerate(step_starts):
                  end_i = step_starts[pos + 1] if pos + 1 < len(step_starts) else len(lines)
                  name = lines[start_i].split('- name:', 1)[1].strip()
                  if name != wanted:
                      continue

                  run_i = None
                  inline = None
                  for rel_i, line in enumerate(lines[start_i + 1:end_i], start=1):
                      stripped = line.strip()
                      if stripped == 'run: |':
                          run_i = start_i + rel_i
                          break
                      if stripped.startswith('run: '):
                          run_i = start_i + rel_i
                          inline = stripped[len('run: '):]
                          break
                  if run_i is None:
                      raise SystemExit(f'031 source step has no run body: {wanted}')

                  if inline is not None:
                      body = inline
                  else:
                      body_indent = len(lines[run_i]) - len(lines[run_i].lstrip()) + 2
                      body_lines = []
                      for line in lines[run_i + 1:end_i]:
                          if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                              break
                          body_lines.append('' if not line.strip() else line[body_indent:])
                      body = '\n'.join(body_lines) + '\n'

                  print(f'::group::031 replay exact 028 step: {wanted}', flush=True)
                  result = subprocess.run(
                      ['bash', '-e', '-o', 'pipefail', '-c', body],
                      text=True,
                      check=False,
                  )
                  print('::endgroup::', flush=True)
                  if result.returncode != 0:
                      raise SystemExit(f'031 exact-028 replay failed in {wanted} (exit {result.returncode})')
                  return
              raise SystemExit(f'031 exact-028 step not found: {wanted}')

          # IMPORTANT: replay the same source-construction and audit steps that produced
          # the real GitHub-success 028 candidate. This restores support files that the
          # old 028 "verified-sources" artifact did not contain.
          run_step('Reconstruct exact 027 candidate and promote identity to 028')
          run_step('028 deep RC11 source and routing audit')

          expected_key_hashes = {
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt': '4c19fdf1aa6d6deae586f78ecac721c08e94765afb334dea8c11ec0a5fc3bfb5',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt': 'e3516c3b3dd1362c71bb3976641c96f3af0f6a2689c91bd39d924978fe4abcbf',
              'app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt': '6d2069354b970927dc4729a00355a74e8139f60efadb866e3f9e9b2c020e67b6',
              'app/src/test/kotlin/ai/closepaw/app/RC11CorrectnessPolicyTest.kt': '4d45484499513b3308478289c9d0a87f1302c70ee314e95df9bf611917900b8e',
              'app/build.gradle.kts': 'ec23432c51b97e4fcee6a6b4f8df5eba1fa886c368a42b19861e7e9010ba0e2e',
              'app/src/main/res/values/strings.xml': 'cca22847674611753ca94de070b3e74ba610ac5d6cf7a2c82a61b8d21427e5c8',
          }
          for rel, wanted in expected_key_hashes.items():
              path = Path(rel)
              if not path.exists():
                  raise SystemExit('031 reconstructed 028 missing key file: ' + rel)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'031 reconstructed 028 hash mismatch for {rel}: {actual} != {wanted}')

          # Make sure the reconstructed tree contains substantially more Kotlin support
          # than the six-file partial artifact that broke workflow 030.
          kotlin_files = list(Path('app/src/main/kotlin').rglob('*.kt'))
          if len(kotlin_files) < 10:
              raise SystemExit(f'031 reconstructed Kotlin tree unexpectedly incomplete: only {len(kotlin_files)} files')

          report = Path('031-verification-report.txt')
          report.write_text(
              'ClosePaw RC11 031 verification report\n'
              '=====================================\n'
              'Base: exact 028 source reconstructed through proven workflow chain\n'
              '028 key-file hashes: VERIFIED\n'
              f'Reconstructed Kotlin file count: {len(kotlin_files)}\n'
              'No performance patch applied yet.\n',
              encoding='utf-8',
          )
          print('031 EXACT FULL 028 RECONSTRUCTION + KEY HASH GATE: PASS', flush=True)
          PYRECON031

      - name: Baseline exact 028 clean compile before any 031 change
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline exact-028 clean Kotlin compile BEFORE patch: PASS' >> 031-verification-report.txt

      - name: Freeze full 028 source manifest and critical regions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE031'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          def sha_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def sha_file(path: Path) -> str:
              return sha_bytes(path.read_bytes())

          def collect_app_source():
              items = {}
              root = Path('app')
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  rel = path.as_posix()
                  if rel.startswith('app/build/'):
                      continue
                  items[rel] = sha_file(path)
              return items

          manifest = collect_app_source()
          if len(manifest) < 20:
              raise SystemExit(f'031 baseline manifest unexpectedly small: {len(manifest)} files')

          # Re-check the known 028 key hashes AFTER the baseline compile. Build tasks are
          # not allowed to silently rewrite any of the frozen key sources.
          expected_key_hashes = {
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt': '4c19fdf1aa6d6deae586f78ecac721c08e94765afb334dea8c11ec0a5fc3bfb5',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt': 'e3516c3b3dd1362c71bb3976641c96f3af0f6a2689c91bd39d924978fe4abcbf',
              'app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt': '6d2069354b970927dc4729a00355a74e8139f60efadb866e3f9e9b2c020e67b6',
              'app/src/test/kotlin/ai/closepaw/app/RC11CorrectnessPolicyTest.kt': '4d45484499513b3308478289c9d0a87f1302c70ee314e95df9bf611917900b8e',
              'app/build.gradle.kts': 'ec23432c51b97e4fcee6a6b4f8df5eba1fa886c368a42b19861e7e9010ba0e2e',
              'app/src/main/res/values/strings.xml': 'cca22847674611753ca94de070b3e74ba610ac5d6cf7a2c82a61b8d21427e5c8',
          }
          for rel, wanted in expected_key_hashes.items():
              actual = sha_file(Path(rel))
              if actual != wanted:
                  raise SystemExit(f'031 baseline compile rewrote frozen 028 key file {rel}: {actual} != {wanted}')

          Path('031-baseline-source-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          # Preserve exact baseline copies of every file the patch is allowed to change.
          allowed = [
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt',
              'app/src/test/kotlin/ai/closepaw/app/RC11CorrectnessPolicyTest.kt',
              'app/build.gradle.kts',
              'app/src/main/res/values/strings.xml',
          ]
          expected_root = Path('/tmp/031-expected')
          shutil.rmtree(expected_root, ignore_errors=True)
          for rel in allowed:
              src = Path(rel)
              dst = expected_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          engine = Path(allowed[0]).read_text(encoding='utf-8')

          def anchored_region(start_token: str, end_token: str) -> str:
              start = engine.find(start_token)
              if start < 0:
                  raise SystemExit('031 critical baseline start anchor missing: ' + start_token)
              end = engine.find(end_token, start)
              if end < 0:
                  raise SystemExit('031 critical baseline end anchor missing: ' + end_token)
              return engine[start:end]

          critical = {
              # Primary->Brain routing, exact confirmation gate, transaction dispatch path.
              'routing_execution': sha_bytes(anchored_region(
                  'val planQueue = mutableListOf<HybridAction>()',
                  'finishFailure("Bounded recovery stopped after',
              ).encode()),
              # RC8 exact Work restore region. Performance work must never touch it.
              'rc8_restore': sha_bytes(anchored_region(
                  '// RC8: only strong identity evidence may authorize a restore-side navigation.',
                  'private suspend fun restoreSidebarShapeIfNeeded(',
              ).encode()),
              # Durable PREPARED -> ATTEMPTED transaction function.
              'durable_transaction': sha_bytes(anchored_region(
                  'private suspend fun executeActionTransactionV9(',
                  'private fun receiptHistoryLineV9(',
              ).encode()),
              'rc11_policy_file': sha_file(Path('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt')),
          }
          Path('031-baseline-critical-hashes.json').write_text(
              json.dumps(critical, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          with Path('031-verification-report.txt').open('a', encoding='utf-8') as f:
              f.write(f'Baseline app source/config manifest files: {len(manifest)}\n')
              f.write('Baseline critical RC8/RC11/routing regions frozen: PASS\n')
          print('031 FULL BASELINE MANIFEST + CRITICAL REGION FREEZE: PASS', flush=True)
          PYFREEZE031

