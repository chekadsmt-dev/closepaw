          after_keys = set(after)
          added = after_keys - before_keys
          removed = before_keys - after_keys
          changed = {p for p in before_keys & after_keys if before[p] != after[p]}

          if added or removed:
              raise SystemExit(f'031 patch added/removed unexpected app files: added={sorted(added)} removed={sorted(removed)}')
