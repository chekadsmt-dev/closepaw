      - name: Verify 075 scope and architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('075-baseline-source-manifest.json').read_text())
          cur={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  cur[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed={k for k in set(base)|set(cur) if base.get(k)!=cur.get(k)}
          expected={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
              'app/src/main/kotlin/ai/closepaw/app/ControlPlaneLeaseV72.kt',
              'app/src/main/kotlin/ai/closepaw/app/LocalControlSurfaceRegistryV75.kt',
              'app/src/main/kotlin/ai/closepaw/app/MainActivity.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ControlPlaneLeaseV72Test.kt',
              'app/src/test/kotlin/ai/closepaw/app/LocalControlSurfaceRegistryV75Test.kt',
          }
          assert changed==expected, (sorted(changed-expected), sorted(expected-changed))
          out=json.dumps(cur,indent=2,sort_keys=True)+'\n'
          Path('075-postpatch-source-manifest.json').write_text(out)
          assert hashlib.sha256(out.encode()).hexdigest()=='e87c8285801b3cefa16f6f740113823afd5278c68270f6206acc300662da57ab'
          service=Path('app/src/main/kotlin/ai/closepaw/app/AgentService.kt').read_text()
          orch=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          registry=Path('app/src/main/kotlin/ai/closepaw/app/LocalControlSurfaceRegistryV75.kt').read_text()
          activity=Path('app/src/main/kotlin/ai/closepaw/app/MainActivity.kt').read_text()
          test=Path('app/src/test/kotlin/ai/closepaw/app/LocalControlSurfaceRegistryV75Test.kt').read_text()
          assert 'LocalControlSurfaceRegistryV75.isProtected()' in service
          assert 'LocalControlSurfaceRegistryV75.markLaunching()' in activity
          assert 'LocalControlSurfaceRegistryV75.onStarted()' in activity
          assert 'LocalControlSurfaceRegistryV75.onStopped()' in activity
          assert 'LOCAL_CONTROL_LEASE_HELD_V75' in orch and 'LOCAL_CONTROL_LEASE_RELEASED_V75' in orch
          assert 'launchGraceProtectsBeforeServiceOrOnStartCanRun' in test
          assert 'activityRestartDuringStopGraceKeepsLeaseContinuous' in test
          assert 'SMT' not in registry and '00 —' not in registry and 'Finance' not in registry
          assert 'versionNameSuffix = "-rc11-c075"' in Path('app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 075' in Path('app/src/main/res/values/strings.xml').read_text()
          print('075 scope/invariants: PASS')
          PYAUDIT
          echo '075 scope/invariants: PASS' >> 075-verification-report.txt

      - name: Full clean compile tests and assemble 075
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '075 compile + unit tests + assemble: PASS' >> 075-verification-report.txt

      - name: Verify APK and source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('075-postpatch-source-manifest.json').read_text()); actual={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  actual[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==expected
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK" > 075-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 075-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c075'" 075-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 075'" 075-apk-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > 075-apksigner.txt
          sha256sum "$APK" > 075-apk-sha256.txt
          mkdir -p /tmp/075-apk /tmp/075-source
          cp "$APK" /tmp/075-apk/ClosePaw-0.1.0-rc11-c075-debug.apk
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gradle' --exclude='app/build' --exclude='build' ./ /tmp/075-source/
          echo '075 APK/source identity: PASS' >> 075-verification-report.txt

      - name: Upload 075 verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 075-ClosePaw-RC11-verification-proof
          path: |
            075-verification-report.txt
            075-baseline-source-manifest.json
            075-postpatch-source-manifest.json
            075-apk-badging.txt
            075-apksigner.txt
            075-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload 075 verified full source
        uses: actions/upload-artifact@v4
        with:
          name: 075-ClosePaw-RC11-verified-full-source
          path: /tmp/075-source/
          if-no-files-found: error
          retention-days: 30

      - name: Upload 075 APK
        uses: actions/upload-artifact@v4
        with:
          name: 075-ClosePaw-RC11-APK
          path: /tmp/075-apk/ClosePaw-0.1.0-rc11-c075-debug.apk
          if-no-files-found: error
          retention-days: 30
