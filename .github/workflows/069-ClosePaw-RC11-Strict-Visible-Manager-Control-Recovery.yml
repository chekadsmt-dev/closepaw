name: 069 - ClosePaw RC11 Strict Visible Manager Control Recovery
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 068 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='068-ClosePaw-RC11-verified-full-source'
          EXPECTED_ARTIFACT_DIGEST='sha256:49763a9484559f33ed2ca99cd0f143fecf2b28c5a8bfbf56330c942a39310f42'
          EXPECTED_MANIFEST_SHA='8a74b9ad27220b144647d195713afe120866381c52663675a48be5388e6cf3d6'
          export ARTIFACT_NAME EXPECTED_ARTIFACT_DIGEST EXPECTED_MANIFEST_SHA
          rm -rf /tmp/068-source /tmp/068-stage1 /tmp/068-stage2 /tmp/068-normalized /tmp/068-artifact.zip /tmp/068-list.json
          mkdir -p /tmp/068-stage1
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/068-list.json
          python3 - <<'PYMETA'
          import json,os
          d=json.load(open('/tmp/068-list.json'))
          name=os.environ['ARTIFACT_NAME']; expected=os.environ['EXPECTED_ARTIFACT_DIGEST']
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches: raise SystemExit('verified 068 full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          if chosen.get('digest') != expected:
              raise SystemExit(f'068 artifact digest mismatch: {chosen.get("digest")} != {expected}')
          open('/tmp/068-artifact-id','w').write(str(chosen['id']))
          open('/tmp/068-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('068 artifact identity PASS',chosen['id'],chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/068-artifact-id)"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/068-artifact.zip
          unzip -q /tmp/068-artifact.zip -d /tmp/068-stage1
          MANIFEST="$(find /tmp/068-stage1 -type f -name '068-postpatch-source-manifest.json' -print -quit)"
          if [ -z "$MANIFEST" ]; then
            mapfile -t NESTED_ZIPS < <(find /tmp/068-stage1 -type f -name '*.zip' -print)
            [ "${#NESTED_ZIPS[@]}" -eq 1 ] || {
              printf '068 source manifest missing after outer unzip; nested zip count=%s\n' "${#NESTED_ZIPS[@]}" >&2
              exit 1
            }
            mkdir -p /tmp/068-stage2
            unzip -q "${NESTED_ZIPS[0]}" -d /tmp/068-stage2
            MANIFEST="$(find /tmp/068-stage2 -type f -name '068-postpatch-source-manifest.json' -print -quit)"
          fi
          [ -n "$MANIFEST" ] || { echo '068 source manifest missing after artifact unwrap' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          mkdir -p /tmp/068-normalized
          cp -a "$ROOT"/. /tmp/068-normalized/
          mv /tmp/068-normalized /tmp/068-source
          ACTUAL_MANIFEST_SHA="$(sha256sum /tmp/068-source/068-postpatch-source-manifest.json | awk '{print $1}')"
          [ "$ACTUAL_MANIFEST_SHA" = "$EXPECTED_MANIFEST_SHA" ] || { echo "068 manifest SHA mismatch: $ACTUAL_MANIFEST_SHA" >&2; exit 1; }
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/068-source')
          manifest=json.loads((root/'068-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest))
              changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'068 source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          assert 'versionNameSuffix = "-rc11-c068"' in (root/'app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 068' in (root/'app/src/main/res/values/strings.xml').read_text()
          print('verified 068 source identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/068-source/ ./
          cp 068-postpatch-source-manifest.json 069-baseline-source-manifest.json
          cat > 069-verification-report.txt <<'REPORT'
          ClosePaw RC11 069 verification report
          Baseline: exact verified 068 full-source artifact, pinned by GitHub artifact digest and source-manifest SHA-256.
          Device evidence from c068: manager navigation remained valid, but current ChatGPT Android intermittently exposed no Copy/response-toolbar semantics at conversation bottom (explicit=0;generic=0;accepted=0;capture=none). c068 treated that UI-role absence as a fatal manager scan error and stopped after three identical failures. Earlier scans could also keep an old toolbar-grounded assistant snapshot while a newer control response was visible.
          069 design: strict whole-response ROUTE_TASK/PROJECT_MANIFEST/PROJECT_UPDATE text can be recovered directly from a visible left/full-width assistant-lane text node when response chrome is absent. User-bubble controls are rejected by conservative geometry and surrounding prose is rejected by the existing strict whole-response parser. Missing response chrome becomes a non-fatal defer instead of a three-strike router stop. Existing V65 route transaction ownership, no-blind-replay state, exact protocol parser, and whitespace-tolerant correlation-marker verification remain intact.
          REPORT
          cat /tmp/068-artifact-meta.txt >> 069-verification-report.txt

      - name: Baseline 068 clean compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 068 clean compile: PASS' >> 069-verification-report.txt

