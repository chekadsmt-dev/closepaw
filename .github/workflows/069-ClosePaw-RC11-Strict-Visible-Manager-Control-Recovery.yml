      - name: Verify 069 scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCOPE'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('069-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV69Test.kt',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'069 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')
          a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          checks={
              'assistant geometry gate': 'assistantLikeControlGeometryV69' in a,
              'strict control classifier': 'classifyManagerControlTextV69' in a,
              'visible strict control fallback': 'latestManagerControlCandidateAtBottomV69' in a,
              'user surrounding prose still strict': 'ProjectOrchestratorProtocolV58.routes(text)' in a,
              'missing chrome is deferred': 'MANAGER_SCAN_DEFERRED_V69' in o and 'Newest manager assistant response is structurally unavailable' not in o,
              'route transaction priority retained': 'val runnable = store.runnableRoutes(limit = 12)' in o and 'Only an idle router may observe a manager' in o,
              'marker wrap recovery retained': 'correlationMarkerMatchesV65' in a,
              'version 069': 'versionNameSuffix = "-rc11-c069"' in Path('app/build.gradle.kts').read_text(),
              'label 069': 'ClosePaw RC11 069' in Path('app/src/main/res/values/strings.xml').read_text(),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f'069 invariant audit failed: {bad}')
          Path('069-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('069-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('069-postpatch-manifest-sha256.txt').write_text(sha+'  069-postpatch-source-manifest.json\n')
          print('069 scope/invariant audit: PASS',sha)
          with Path('069-verification-report.txt').open('a') as f: f.write(f'069 postpatch source manifest SHA-256: {sha}\n')
          PYSCOPE

      - name: Full clean compile tests and assemble 069
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '069 clean compile + full unit tests + assemble: PASS' >> 069-verification-report.txt

      - name: Verify post-test source identity and APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('069-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected: raise SystemExit('069 production source changed during build/tests')
          print('069 post-test source identity: PASS')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '069 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 069-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 069-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c069'" 069-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 069'" 069-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 069-apksigner.txt
          sha256sum "$APK" > 069-apk-sha256.txt
          cp "$APK" ClosePaw-0.1.0-rc11-c069-debug.apk
          echo '069 APK identity/signature: PASS' >> 069-verification-report.txt

      - name: Package verified 069 full source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/069-full-source
          mkdir -p /tmp/069-full-source
          rsync -a --exclude='.git' --exclude='.github' --exclude='app/build' --exclude='*.apk' ./ /tmp/069-full-source/
          test -f /tmp/069-full-source/069-postpatch-source-manifest.json
          echo '069 full source package prepared: PASS' >> 069-verification-report.txt

      - name: Upload 069 verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 069-ClosePaw-RC11-verification-proof
          path: |
            069-verification-report.txt
            069-postpatch-source-manifest.json
            069-postpatch-manifest-sha256.txt
            069-apk-badging.txt
            069-apksigner.txt
            069-apk-sha256.txt
          if-no-files-found: error

      - name: Upload 069 verified full source
        uses: actions/upload-artifact@v4
        with:
          name: 069-ClosePaw-RC11-verified-full-source
          path: /tmp/069-full-source/
          if-no-files-found: error
          retention-days: 90

      - name: Upload 069 APK
        uses: actions/upload-artifact@v4
        with:
          name: 069-ClosePaw-RC11-APK
          path: ClosePaw-0.1.0-rc11-c069-debug.apk
          if-no-files-found: error
