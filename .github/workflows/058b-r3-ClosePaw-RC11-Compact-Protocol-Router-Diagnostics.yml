    - name: Verify exact 058b-r3 scope and source manifest
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSCOPE'
        from pathlib import Path
        import hashlib,json
        allowed={
          'app/build.gradle.kts',
          'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
          'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
          'app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt',
          'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
          'app/src/main/kotlin/ai/closepaw/app/MainActivity.kt',
          'app/src/main/kotlin/ai/closepaw/app/PostPlanGuardV58A.kt',
          'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58.kt',
          'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt',
          'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
          'app/src/main/kotlin/ai/closepaw/app/SmtRouteLedger.kt',
          'app/src/main/kotlin/ai/closepaw/app/SmtRouter.kt',
          'app/src/main/res/values/strings.xml',
          'app/src/test/kotlin/ai/closepaw/app/GoalPostconditionV41Test.kt',
          'app/src/test/kotlin/ai/closepaw/app/PostPlanGuardV58ATest.kt',
          'app/src/test/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58Test.kt',
        }
        base=json.loads(Path('057a-baseline-source-manifest.json').read_text())
        current={}
        for p in sorted(Path('app').rglob('*')):
            if p.is_file() and not p.as_posix().startswith('app/build/'):
                current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
        changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
        if changed != allowed:
            raise SystemExit(f'058b isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')
        Path('058b-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
        sha=hashlib.sha256(Path('058b-postpatch-source-manifest.json').read_bytes()).hexdigest()
        if sha != '4b28bf0b632d89a86386b1f13c38ddccb1a7f66693cf2c3f89f59b79d2b8c7d7':
            raise SystemExit(f'058b manifest sha mismatch {sha}')
        print('058b scope + manifest: PASS (manifest-diff isolation, includes untracked/new files)')
        PYSCOPE
        echo '058b exact isolation/source manifest: PASS (manifest diff)' >> 058b-verification-report.txt
    - name: Multidimensional frozen-invariant and 058b-r3 safety audit
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYAUDIT'
        from pathlib import Path
        import json
        base=json.loads(Path('057a-baseline-source-manifest.json').read_text())
        post=json.loads(Path('058b-postpatch-source-manifest.json').read_text())
        allowed={
          'app/build.gradle.kts','app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
          'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
          'app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt',
          'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
          'app/src/main/kotlin/ai/closepaw/app/MainActivity.kt',
          'app/src/main/kotlin/ai/closepaw/app/PostPlanGuardV58A.kt',
          'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58.kt',
          'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt',
          'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
          'app/src/main/kotlin/ai/closepaw/app/SmtRouteLedger.kt','app/src/main/kotlin/ai/closepaw/app/SmtRouter.kt',
          'app/src/main/res/values/strings.xml','app/src/test/kotlin/ai/closepaw/app/GoalPostconditionV41Test.kt',
          'app/src/test/kotlin/ai/closepaw/app/PostPlanGuardV58ATest.kt',
          'app/src/test/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58Test.kt',
        }
        changed_unexpected=[]
        for k,v in base.items():
            if k in allowed: continue
            if post.get(k)!=v: changed_unexpected.append(k)
        if changed_unexpected: raise SystemExit(f'frozen 057a files changed: {changed_unexpected[:20]}')

        h=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
        g=Path('app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt').read_text()
        pg=Path('app/src/main/kotlin/ai/closepaw/app/PostPlanGuardV58A.kt').read_text()
        o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
        a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
        s=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt').read_text()
        p=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58.kt').read_text()
        b=Path('app/build.gradle.kts').read_text()
        strings=Path('app/src/main/res/values/strings.xml').read_text()
        tests=Path('app/src/test/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58Test.kt').read_text()

        # General-purpose dynamic project/agent topology, no fixed SMT table in runtime core.
        assert 'TARGET_TITLES' not in o+a+s+p
        assert 'Project topology is data' in o
        assert 'Generic V58 ROUTE_TASK must include PROJECT_ID' in s
        assert 'seedLegacySmt(db' in s and '12 — SMT Execution Management' in s
        assert 'ROUTE_ID ${parsed.routeId} was reused with a different payload' in s
        assert 'CONTROL_PLANE: CLOSEPAW_V58' in o
        assert 'quoteData(response)' in o
        assert 'SEND_OUTCOME_UNKNOWN -> to == RouteStateV58.SENT_VERIFIED' in p
        assert 'RETURN_OUTCOME_UNKNOWN -> to == RouteStateV58.RETURN_VERIFIED' in p
        assert 'No proof of prior Send; no replay allowed' in o
        assert 'No proof of prior return; no replay allowed' in o
        assert 'currentCoroutineContext().ensureActive()' in o
        assert not Path('app/src/main/kotlin/ai/closepaw/app/SmtRouter.kt').exists()
