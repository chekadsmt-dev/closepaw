name: 058b-r3 - ClosePaw RC11 Compact ChatGPT Protocol + Router Diagnostics
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout workflow host repository
      uses: actions/checkout@v5
    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Restore exact verified 057a Source of Truth
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        ARTIFACT_NAME='057a-ClosePaw-RC11-verified-full-source'
        EXPECTED_DIGEST='sha256:d81273e27cb2a205312d8debcbaa412885559bdd3078f764e768ce75c0a5cd49'
        EXPECTED_ZIP_SHA='d81273e27cb2a205312d8debcbaa412885559bdd3078f764e768ce75c0a5cd49'
        EXPECTED_MANIFEST_SHA='ca82f407f33f9954a6f6ce69fa61c9efbec68305a892b4751b6df4b3bb1d5f69'
        rm -rf /tmp/057a-source /tmp/057a-normalized /tmp/057a-artifact.zip /tmp/057a-list.json
        mkdir -p /tmp/057a-source
        curl -fsSL \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
          -o /tmp/057a-list.json
        python3 - <<'PYMETA'
        import json
        d=json.load(open('/tmp/057a-list.json'))
        expected='sha256:d81273e27cb2a205312d8debcbaa412885559bdd3078f764e768ce75c0a5cd49'
        matches=[a for a in d.get('artifacts',[]) if a.get('name')=='057a-ClosePaw-RC11-verified-full-source' and not a.get('expired') and a.get('digest')==expected]
        if not matches:
            available=[(a.get('id'),a.get('name'),a.get('expired'),a.get('digest')) for a in d.get('artifacts',[])[:20]]
            raise SystemExit(f'exact 057a artifact not found; candidates={available}')
        matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
        chosen=matches[0]
        open('/tmp/057a-artifact-id','w').write(str(chosen['id']))
        open('/tmp/057a-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
        print('057a artifact',chosen['id'],chosen.get('digest'))
        PYMETA
        ARTIFACT_ID="$(cat /tmp/057a-artifact-id)"
        curl -fsSL -L \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
          -o /tmp/057a-artifact.zip
        test "$(sha256sum /tmp/057a-artifact.zip | awk '{print $1}')" = "$EXPECTED_ZIP_SHA"
        unzip -q /tmp/057a-artifact.zip -d /tmp/057a-source
        MANIFEST="$(find /tmp/057a-source -type f -name '057a-postpatch-source-manifest.json' -print -quit)"
        [ -n "$MANIFEST" ] || { echo '057a source manifest missing' >&2; exit 1; }
        test "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA"
        ROOT="$(dirname "$MANIFEST")"
        if [ "$ROOT" != '/tmp/057a-source' ]; then
          mkdir -p /tmp/057a-normalized
          cp -a "$ROOT"/. /tmp/057a-normalized/
          rm -rf /tmp/057a-source
          mv /tmp/057a-normalized /tmp/057a-source
        fi
        python3 - <<'PYBASE'
        from pathlib import Path
        import hashlib,json
        root=Path('/tmp/057a-source')
        manifest=json.loads((root/'057a-postpatch-source-manifest.json').read_text())
        current={}
        for p in sorted((root/'app').rglob('*')):
            if p.is_file() and '/build/' not in p.as_posix():
                current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
        if current != manifest:
            missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
            raise SystemExit(f'057a source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
        print('exact verified 057a source manifest: PASS')
        PYBASE
        find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
        rsync -a --exclude='.git' --exclude='.github' /tmp/057a-source/ ./
        cp 057a-postpatch-source-manifest.json 057a-baseline-source-manifest.json
        cat > 058b-verification-report.txt <<'REPORT'
        ClosePaw RC11 058b-r3 verification report
        Baseline: exact verified 057a GitHub artifact.
        058 Generic Runtime Project Orchestrator retained.
        058a scope: inline Stop-clause parsing, terminal-before-dispatch guard, bounded post-PLAN_ACCEPT gate.
        Package id intentionally remains ai.closepaw.rc11c058 for in-place upgrade and permission/settings continuity.
        REPORT
        cat /tmp/057a-artifact-meta.txt >> 058b-verification-report.txt
    - name: Baseline 057a clean compile gate
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
        echo 'Baseline 057a clean compile: PASS' >> 058b-verification-report.txt
