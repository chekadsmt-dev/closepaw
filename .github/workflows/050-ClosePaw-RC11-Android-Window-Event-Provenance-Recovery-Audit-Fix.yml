          [ "$SIZE" -gt 50000000 ] || { echo 'APK too small' >&2; exit 1; }
          CONTENTS="$(zipinfo -1 "$APK")"
          for E in AndroidManifest.xml classes.dex lib/arm64-v8a/libllama.so lib/arm64-v8a/libggml.so lib/arm64-v8a/libinference_engine.so lib/arm64-v8a/libinference_engine_jni.so lib/arm64-v8a/libinference_engine_llamacpp_backend.so; do
            grep -Fxq "$E" <<<"$CONTENTS" || { echo "missing $E" >&2; exit 1; }
          done
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='ai.closepaw.rc11c050'" <<<"$BADGING"
          grep -Fq "application-label:'ClosePaw RC11 050'" <<<"$BADGING"
          grep -Fq "sdkVersion:'31'" <<<"$BADGING"
          grep -Fq "targetSdkVersion:'36'" <<<"$BADGING"
          "$APKSIGNER" verify --verbose "$APK" > 050-apksigner-verification.txt
          echo "050 APK gate PASS sha256=$(sha256sum "$APK" | awk '{print $1}') size=$SIZE" | tee -a 050-verification-report.txt

      - name: Prepare 050 full verified source snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 050-full-source
          mkdir -p 050-full-source
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.gradle/' --exclude='app/build/' --exclude='050-full-source/' ./ 050-full-source/
          test -f 050-full-source/app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt
          test -f 050-full-source/050-postpatch-source-manifest.json

      - name: Upload 050 verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 050-ClosePaw-RC11-verification-proof
          if-no-files-found: warn
          path: |
            050-verification-report.txt
            050-isolated.patch
            050-baseline-source-manifest.json
            050-postpatch-source-manifest.json
            050-baseline-critical-hashes.json
            050-apksigner-verification.txt

      - name: Upload 050 full verified source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 050-ClosePaw-RC11-verified-full-source
          if-no-files-found: error
          path: 050-full-source/

      - name: Upload 050 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 050-ClosePaw-RC11-APK
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload 050 failure sources
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 050-ClosePaw-RC11-failure-sources
          if-no-files-found: warn
          path: |
            app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt
            app/src/main/kotlin/ai/closepaw/app/AgentService.kt
            app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
            app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt
            050-verification-report.txt
            050-isolated.patch
