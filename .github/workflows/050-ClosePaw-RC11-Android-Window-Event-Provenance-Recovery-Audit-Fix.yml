name: 050 - ClosePaw RC11 Android Window-Event Provenance Recovery (Audit Fix)

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 049 Source of Truth by manifest identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_NAME='049-ClosePaw-RC11-verified-full-source'
          EXPECTED_MANIFEST_SHA='d3a833e99d33f220db678051e540358b3b6d2f5e97cf4916047171f95fb8503b'
          rm -rf /tmp/049-source /tmp/049-candidate /tmp/049-artifacts.json
          mkdir -p /tmp/049-source

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${EXPECTED_NAME}&per_page=100" \
            -o /tmp/049-artifacts.json

          python3 - <<'PYIDS' > /tmp/049-artifact-ids.txt
          import json
          d=json.load(open('/tmp/049-artifacts.json'))
          rows=[a for a in d.get('artifacts',[]) if not a.get('expired',False) and a.get('name')=='049-ClosePaw-RC11-verified-full-source']
          rows.sort(key=lambda a:a.get('created_at',''), reverse=True)
          for a in rows:
              print(f"{a['id']}|{(a.get('workflow_run') or {}).get('id','')}")
          PYIDS

          FOUND=''
          FOUND_RUN=''
          while IFS='|' read -r ARTIFACT_ID RUN_ID; do
            [ -n "$ARTIFACT_ID" ] || continue
            rm -rf /tmp/049-candidate /tmp/049-candidate.zip
            mkdir -p /tmp/049-candidate
            curl -fsSL -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o /tmp/049-candidate.zip
            unzip -q /tmp/049-candidate.zip -d /tmp/049-candidate
            MANIFEST="$(find /tmp/049-candidate -type f -name '049-postpatch-source-manifest.json' -print -quit)"
            [ -n "$MANIFEST" ] || continue
            SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
            if [ "$SHA" = "$EXPECTED_MANIFEST_SHA" ]; then
              ROOT="$(dirname "$MANIFEST")"
              cp -a "$ROOT"/. /tmp/049-source/
              FOUND="$ARTIFACT_ID"
              FOUND_RUN="$RUN_ID"
              break
            fi
          done < /tmp/049-artifact-ids.txt

          [ -n "$FOUND" ] || { echo 'Exact verified 049 artifact not found by manifest identity' >&2; exit 1; }
          echo "BASELINE_ARTIFACT_ID=$FOUND" >> "$GITHUB_ENV"
          echo "BASELINE_RUN_ID=$FOUND_RUN" >> "$GITHUB_ENV"
          echo "Exact 049 artifact id=$FOUND run=$FOUND_RUN"

      - name: Verify and activate exact 049 Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/049-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/049-source/app/src/main/kotlin/ai/closepaw/app/AgentService.kt
          test -f /tmp/049-source/049-postpatch-source-manifest.json
          test "$(sha256sum /tmp/049-source/049-postpatch-source-manifest.json | awk '{print $1}')" = "d3a833e99d33f220db678051e540358b3b6d2f5e97cf4916047171f95fb8503b"

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/049-source/. ./

          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json,os
          def sf(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads(Path('049-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sf(p)
          if current != expected:
              missing=sorted(set(expected)-set(current))
              added=sorted(set(current)-set(expected))
              changed=sorted(k for k in set(expected)&set(current) if expected[k]!=current[k])
              raise SystemExit(f'049 full-source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          critical={
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'d48624f801a644c78d782b9362ef7bfa77f192a4b83334a2f3238d310c1ba290',
            'app/src/main/kotlin/ai/closepaw/app/AgentService.kt':'c745c25b1597843bf228398d8098a7fd5ebc19824f56324af706270fb432e8a3',
            'app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt':'683a9f6d8b5c8a676ba00bb9cda4cf954314470afae4a9b2bf1ab3862f6ea47e',
            'app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt':'eed7423a080b1d8b8b8a40ac943f88a62db658c5eb12f9a638fc3974cc938e73',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt':'945670dd4f8818b10933245a27298dfe0de4b9da590c54f06a9ba4657e11301f',
            'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt':'fdfdae46f9fd865336e2f57e65c6f62684fc1b7ffd909eba1d1b49ad8937dab3',
            'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt':'b1be3b8953bc0620a921d6e639e68ee1ae4a61952d20a52943da148a3edbee37',
            'app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt':'d9595d75a141c5c843195878fb13c0f32ab2121cabab65903026fd3b2a189a25',
            'app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt':'062336a6f34de4c630f5554bea3793de52696486e00d7abb893cbd9d984b79b6',
            'app/build.gradle.kts':'fbe1496be99e0e435f0c07eafbcbc81043930a79380363ca7c946404334d1444',
            'app/src/main/res/values/strings.xml':'e35c736d501447cc09cc495ee4d0230f8c0f247ca090c872c38ef0d4061123ba',
          }
          for p,w in critical.items():
              got=sf(p)
              if got!=w: raise SystemExit(f'049 critical baseline mismatch {p}: {got} != {w}')
          Path('050-verification-report.txt').write_text(
              'ClosePaw RC11 050 verification report\n'
              f'Base: exact verified 049 full-source artifact id={os.getenv("BASELINE_ARTIFACT_ID","")} run={os.getenv("BASELINE_RUN_ID","")} matched by 049 postpatch manifest identity.\n'
              'Runtime evidence: Samsung exposes an active/focused TYPE_APPLICATION window while its root/package is temporarily null, so V47 exact package proof blocks the already-proven V43 navigator.\n'
              'Fix scope: framework AccessibilityEvent package + windowId provenance, bounded by age/current active window/conflict checks; causal event title fallback only after a grounded receipt-accepted click; dynamic diagnostics filename.\n'
              'Explicitly frozen: V43 navigator, V45 prerequisite ordering, V37/V43 grammar, WorkSurfaceV47 helper semantics, V46 causal alias rules, RC11 transaction safety, RC8 restore, V32 transport, AccessibilityPlatform and exact OPEN_APP behavior.\n',
              encoding='utf-8')
          print('050 EXACT VERIFIED 049 BASELINE: PASS')
          PYBASE

      - name: Baseline 049 clean compile before 050 patch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 049 clean compile: PASS' >> 050-verification-report.txt

      - name: Freeze protected correctness surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE'
          from pathlib import Path
          import hashlib,json
          def h(b): return hashlib.sha256(b).hexdigest()
          def sf(p): return h(Path(p).read_bytes())
          base={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  base[p.as_posix()]=sf(p)
          Path('050-baseline-source-manifest.json').write_text(json.dumps(base,indent=2,sort_keys=True)+'\n')
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          def reg(a,b):
              s=eng.find(a); e=eng.find(b,s)
              if s<0 or e<0: raise SystemExit(f'protected region missing: {a} -> {b}')
              return h(eng[s:e].encode())
          frozen={
            'rc8_restore':reg('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded('),
            'durable_transaction':reg('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9('),
            'v33_validation':reg('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest('),
            'brain_restore':reg('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings'),
            'brain_send':reg('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9('),
            'open_app_exact':reg('private suspend fun openApp(platform: AndroidPlatform, name: String): ActionOutcome {','private suspend fun clickByText('),
            'navigator_v43':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt'),
            'grammar_v43':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt'),
            'prereq_v45':sf('app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt'),
            'goal_v41':sf('app/src/main/kotlin/ai/closepaw/app/GoalPostconditionV41.kt'),
            'causal_v46':sf('app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt'),
            'brain_recovery_v46':sf('app/src/main/kotlin/ai/closepaw/app/BrainExcursionRecoveryV46.kt'),
            'foreground_v46':sf('app/src/main/kotlin/ai/closepaw/app/ForegroundPackageV46.kt'),
            'work_surface_v47':sf('app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt'),
            'protocol':sf('app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt'),
            'rc11':sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
            'transport':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
            'brain_target':sf('app/src/main/kotlin/ai/closepaw/app/ConfiguredBrainTargetResolverV40.kt'),
            'accessibility_platform':sf('app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt'),
            'bridge':sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          Path('050-baseline-critical-hashes.json').write_text(json.dumps(frozen,indent=2,sort_keys=True)+'\n')
          print('050 FREEZE: PASS')
          PYFREEZE

