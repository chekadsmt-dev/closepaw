          +/**
          + * Bounded package provenance recovered from AccessibilityEvent metadata when an OEM exposes an
          + * active/focused TYPE_APPLICATION window but temporarily withholds that window's root/package.
          + *
          + * This is deliberately fail-closed: event evidence is accepted only when it is recent, names a
          + * package, carries a real window id, and correlates to the currently active/focused application
          + * window with the same id. Any conflicting active/focused application package rejects recovery.
          + */
          +internal object AccessibilityEventProvenanceV50 {
          +    internal const val MAX_EVENT_AGE_MS: Long = 8_000L
          +
          +    internal data class EventEvidence(
          +        val packageName: String,
          +        val windowId: Int,
          +        val revision: Long,
          +        val observedAtUptimeMs: Long,
          +        val eventType: Int,
          +        val className: String?,
          +        val textCandidates: List<String>,
          +    )
          +
          +    internal data class WindowEvidence(
          +        val windowId: Int,
          +        val packageName: String?,
          +        val applicationWindow: Boolean,
          +        val layer: Int,
          +        val active: Boolean,
          +        val focused: Boolean,
          +    )
          +
          +    internal data class Match(
          +        val packageName: String,
          +        val windowId: Int,
          +        val revision: Long,
          +        val textCandidates: List<String>,
          +    )
          +
          +    internal fun recover(
          +        event: EventEvidence?,
          +        windows: List<WindowEvidence>,
          +        nowUptimeMs: Long,
          +        expectedPackage: String? = null,
          +        maxAgeMs: Long = MAX_EVENT_AGE_MS,
          +    ): Match? {
          +        val e = event ?: return null
          +        val pkg = e.packageName.trim().takeIf { it.isNotBlank() } ?: return null
          +        if (e.windowId < 0) return null
          +        if (expectedPackage != null && pkg != expectedPackage) return null
          +
          +        val age = nowUptimeMs - e.observedAtUptimeMs
          +        if (age < 0L || age > maxAgeMs) return null
          +
          +        val activeAppWindows = windows.filter { it.applicationWindow && (it.active || it.focused) }
          +        if (activeAppWindows.isEmpty()) return null
          +        if (activeAppWindows.any { row ->
          +                val observed = row.packageName?.trim().orEmpty()
          +                observed.isNotBlank() && observed != pkg
          +            }
          +        ) {
          +            return null
          +        }
          +
          +        val correlated = activeAppWindows.filter { it.windowId == e.windowId }
          +        if (correlated.size != 1) return null
          +        val correlatedPackage = correlated.single().packageName?.trim().orEmpty()
          +        if (correlatedPackage.isNotBlank() && correlatedPackage != pkg) return null
          +
          +        return Match(
          +            packageName = pkg,
          +            windowId = e.windowId,
          +            revision = e.revision,
          +            textCandidates = e.textCandidates.map(String::trim).filter(String::isNotBlank).distinct(),
          +        )
          +    }
          +}
