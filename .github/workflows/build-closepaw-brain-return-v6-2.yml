name: Build ClosePaw Brain Return v6.2

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Brain Return v6.1 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-closepaw-brain-return-v6-1.yml')
          if not workflow.exists():
              raise SystemExit('Missing required base workflow: build-closepaw-brain-return-v6-1.yml')

          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []

              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  body.append('' if not line.strip() else line[body_indent:])

              result = subprocess.run(
                  ['bash'],
                  input='\n'.join(body) + '\n',
                  text=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f'Base step failed: {step_name}')

          run_step('Apply Brain Return v6 base')
          run_step('Apply Brain Return v6.1 fix')
          print('V6.1 SOURCE: PASS')
          PY

      - name: Fix Kotlin compile regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt')
          text = path.read_text(encoding='utf-8')

          old = '''                    val after = raw.substringAfter(':', "")
                        .ifBlank { raw.substringAfter(label, "", ignoreCase = true) }
                        .trim()
          '''

          new = '''                    val after = raw.substringAfter(':', "")
                        .ifBlank {
                            val labelIndex = raw.indexOf(label, ignoreCase = true)
                            if (labelIndex >= 0) {
                                raw.substring(labelIndex + label.length)
                            } else {
                                ""
                            }
                        }
                        .trim()
          '''

          if old not in text:
              raise SystemExit('Expected v6.1 compile-regression anchor not found')

          text = text.replace(old, new, 1)

          forbidden = 'substringAfter(label, "", ignoreCase = true)'
          if forbidden in text:
              raise SystemExit('Invalid substringAfter(ignoreCase=...) call still present')

          required = [
              'inferWorkChatTitleFromGoal',
              'raw.indexOf(label, ignoreCase = true)',
              'If we know the exact work chat, restore it BEFORE any similarity shortcut.',
              'if (!frame.originWasBrain && isDedicatedBrainSnapshot(current)) return false',
              'MAX_BRAIN_TURNS = 80',
              'BRAIN_TIMEOUT_MS = 240_000L',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('v6.2 invariant missing: ' + ', '.join(missing))

          path.write_text(text, encoding='utf-8')
          print('KOTLIN COMPILE REGRESSION FIX: PASS')
          PY

      - name: Patch side-by-side identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')

          old = 'applicationIdSuffix = ".smt"'
          if old not in text:
              raise SystemExit('applicationIdSuffix anchor missing')

          text = text.replace(
              old,
              'applicationIdSuffix = ".brainreturn62"',
              1,
          )

          if 'versionNameSuffix = "-smt"' in text:
              text = text.replace(
                  'versionNameSuffix = "-smt"',
                  'versionNameSuffix = "-brain-return-v6.2"',
                  1,
              )

          gradle.write_text(text, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s, count = re.subn(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">ClosePaw Brain Return v6.2</string>',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('app_name anchor missing')

          strings.write_text(s, encoding='utf-8')
          print('IDENTITY: PASS')
          PY

      - name: Gate 1 - regression checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          forbidden = [
              'substringAfter(label, "", ignoreCase = true)',
              'normalized.contains("closepaw brain") ||',
          ]

          bad = [x for x in forbidden if x in s]
          if bad:
              raise SystemExit('Regression still present: ' + ', '.join(bad))

          checks = [
              'raw.indexOf(label, ignoreCase = true)',
              'inferWorkChatTitleFromGoal(activeTask?.goal.orEmpty())',
              'openConversationDeterministically(platform, exactOrigin)',
              'if (!frame.originWasBrain && isDedicatedBrainSnapshot(current)) return false',
              'closepaw brain anchor 71d4',
              'val hasComposer',
          ]

          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('Regression gate missing: ' + ', '.join(missing))

          print('GATE 1 regression checks: PASS')
          PY

      - name: Gate 2 - compile Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Gate 3 - assemble APK
        run: ./gradlew assembleDebug

      - name: Gate 4 - APK integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not apk.exists() or apk.stat().st_size < 1_000_000:
              raise SystemExit('APK missing or unexpectedly small')

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())

              for required in [
                  'AndroidManifest.xml',
                  'classes.dex',
                  'resources.arsc',
              ]:
                  if required not in names:
                      raise SystemExit('APK missing ' + required)

              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)

          print(f'GATE 4 APK integrity: PASS ({apk.stat().st_size} bytes)')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Brain-Return-v6.2-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
