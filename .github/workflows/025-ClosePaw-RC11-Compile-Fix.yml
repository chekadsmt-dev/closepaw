name: 025 - ClosePaw RC11 Compile Fix

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct 024 and apply compile-only fix
        shell: bash
        run: |
          python3 - <<'PY025'
          from pathlib import Path
          import subprocess

          workflow_path = Path('.github/workflows/024-ClosePaw-RC11-Correctness-Anchor-Fix.yml')
          if not workflow_path.exists():
              raise SystemExit('025 missing required 024 workflow')

          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          step_starts = [i for i, line in enumerate(lines) if line.startswith('      - name: ')]

          def run_step(wanted: str):
              for pos, start_i in enumerate(step_starts):
                  end_i = step_starts[pos + 1] if pos + 1 < len(step_starts) else len(lines)
                  name = lines[start_i].split('- name:', 1)[1].strip()
                  if name != wanted:
                      continue

                  run_i = None
                  inline = None
                  for rel_i, line in enumerate(lines[start_i + 1:end_i], start=1):
                      stripped = line.strip()
                      if stripped == 'run: |':
                          run_i = start_i + rel_i
                          break
                      if stripped.startswith('run: '):
                          run_i = start_i + rel_i
                          inline = stripped[len('run: '):]
                          break
                  if run_i is None:
                      raise SystemExit(f'025 source step has no run body: {wanted}')

                  if inline is not None:
                      body = inline
                  else:
                      body_indent = len(lines[run_i]) - len(lines[run_i].lstrip()) + 2
                      body_lines = []
                      for line in lines[run_i + 1:end_i]:
                          if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                              break
                          body_lines.append('' if not line.strip() else line[body_indent:])
                      body = '\n'.join(body_lines) + '\n'

                  print(f'::group::025 replay: {wanted}', flush=True)
                  result = subprocess.run(
                      ['bash', '-e', '-o', 'pipefail', '-c', body],
                      text=True,
                      check=False,
                  )
                  print('::endgroup::', flush=True)
                  if result.returncode != 0:
                      raise SystemExit(f'025 replay failed in {wanted} (exit {result.returncode})')
                  return
              raise SystemExit(f'025 source step not found: {wanted}')

          # Rebuild the exact 024 candidate up to, but not including, its final failing compile.
          run_step('Run proven 022 source pipeline')
          run_step('Apply RC11 correctness consolidation')

          engine_path = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt')
          policy_path = Path('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt')
          gradle_path = Path('app/build.gradle.kts')
          strings_path = Path('app/src/main/res/values/strings.xml')

          e = engine_path.read_text(encoding='utf-8')
          p = policy_path.read_text(encoding='utf-8')

          # 024 compile failure #1/#2: currentPlanSource does not exist in this scope.
          old_log = 'history += "PLAN_TRUNCATED_TO_ONE_ACTION|source=${currentPlanSource.name}|original=${plan.actions.size}"'
          new_log = 'history += "PLAN_TRUNCATED_TO_ONE_ACTION|source=$selectedPlanSource|original=${plan.actions.size}"'
          if e.count(old_log) != 1:
              raise SystemExit(f'025 expected one currentPlanSource history anchor, found {e.count(old_log)}')
          e = e.replace(old_log, new_log, 1)

          old_id = 'val actionId = "${task.id}-v9-${currentPlanSource.name.lowercase()}-${primaryCalls + brainCalls}-${history.size + 1}"'
          new_id = 'val actionId = "${task.id}-v9-${selectedPlanSource.lowercase()}-${primaryCalls + brainCalls}-${history.size + 1}"'
          if e.count(old_id) != 1:
              raise SystemExit(f'025 expected one currentPlanSource actionId anchor, found {e.count(old_id)}')
          e = e.replace(old_id, new_id, 1)

          # 024 compile failure #3/#4: HybridAction has no Notifications subtype.
          engine_notifications = '            HybridAction.Notifications -> executorSuccess && changed && !interrupted\n'
          if e.count(engine_notifications) != 1:
              raise SystemExit(f'025 expected one engine Notifications anchor, found {e.count(engine_notifications)}')
          e = e.replace(engine_notifications, '', 1)

          policy_notifications = '        HybridAction.Notifications,\n'
          if p.count(policy_notifications) != 1:
              raise SystemExit(f'025 expected one policy Notifications anchor, found {p.count(policy_notifications)}')
          p = p.replace(policy_notifications, '', 1)

          engine_path.write_text(e, encoding='utf-8')
          policy_path.write_text(p, encoding='utf-8')

          # Side-by-side candidate identity only; no architecture change.
          g = gradle_path.read_text(encoding='utf-8')
          if 'applicationIdSuffix = ".rc11c024"' not in g:
              raise SystemExit('025 expected 024 applicationIdSuffix anchor missing')
          g = g.replace('applicationIdSuffix = ".rc11c024"', 'applicationIdSuffix = ".rc11c025"', 1)
          g = g.replace('versionNameSuffix = "-rc11-c024"', 'versionNameSuffix = "-rc11-c025"', 1)
          gradle_path.write_text(g, encoding='utf-8')

          s = strings_path.read_text(encoding='utf-8')
          if '<string name="app_name">ClosePaw RC11 024</string>' not in s:
              raise SystemExit('025 expected 024 app_name anchor missing')
          s = s.replace(
              '<string name="app_name">ClosePaw RC11 024</string>',
              '<string name="app_name">ClosePaw RC11 025</string>',
              1,
          )
          strings_path.write_text(s, encoding='utf-8')

          # Compile-fix invariants: remove only the four invalid references.
          e = engine_path.read_text(encoding='utf-8')
          p = policy_path.read_text(encoding='utf-8')
          forbidden = [
              'currentPlanSource',
              'HybridAction.Notifications',
          ]
          for token in forbidden:
              if token in e or token in p:
                  raise SystemExit('025 invalid compile token remains: ' + token)
          for token in [
              'source=$selectedPlanSource',
              '${selectedPlanSource.lowercase()}',
              'RC11CorrectnessPolicy.admitSingleObservationAction(plan.actions)',
              'RC11CorrectnessPolicy.modelActionAllowed(action)',
          ]:
              if token not in e:
                  raise SystemExit('025 required RC11 contract missing: ' + token)

          print('025 COMPILE-ONLY RC11 FIX: PASS', flush=True)

          # Re-run 024's frozen correctness gate against the repaired candidate.
          run_step('RC11 frozen correctness gates')
          PY025

      - name: 025 compile gate
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: 025 unit tests and rebuild
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Upload generated sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 025-ClosePaw-RC11-failure-sources
          path: |
            app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
            app/src/main/kotlin/ai/closepaw/app/HybridAgentProtocol.kt
            app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt
            app/src/test/kotlin/ai/closepaw/app/RC11CorrectnessPolicyTest.kt
            app/build.gradle.kts
            app/src/main/res/values/strings.xml
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 025-ClosePaw-RC11-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
