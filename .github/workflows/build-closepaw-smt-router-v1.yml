name: Build ClosePaw SMT Router v1

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply stable Hybrid Agent v5.5
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-hybrid-agent-v5-5.yml')
          if not workflow.exists():
              raise SystemExit('Missing base workflow: build-hybrid-agent-v5-5.yml')

          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []

              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  body.append('' if not line.strip() else line[body_indent:])

              subprocess.run(
                  ['bash'],
                  input='\n'.join(body) + '\n',
                  text=True,
                  check=True,
              )

          run_step('Apply v5.4 base')
          run_step('Fix Brain verification regression')
          print('v5.5 base applied: PASS')
          PY

      - name: Patch SMT Router v1
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_smt_router_v1.py
          python3 -m py_compile /tmp/patch_smt_router_v1.py
          python3 /tmp/patch_smt_router_v1.py

      - name: Build self-check
        shell: bash
        run: |
          grep -q 'SMT_AUTOPILOT_START' app/src/main/kotlin/ai/closepaw/app/SmtRouter.kt
          grep -q 'ROUTER_ERROR' app/src/main/kotlin/ai/closepaw/app/SmtRouter.kt
          grep -q 'SMT AUTOPILOT START' app/src/main/kotlin/ai/closepaw/app/AgentService.kt
          grep -q 'MAX_BRAIN_TURNS = 80' app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          grep -q 'BRAIN_TIMEOUT_MS = 240_000L' app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          grep -q 'applicationIdSuffix = ".smtrouter"' app/build.gradle.kts

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-SMT-Router-v1-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
