name: 058 - ClosePaw RC11 Generic Runtime Project Orchestrator
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout workflow host repository
      uses: actions/checkout@v5
    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Restore exact verified 057a Source of Truth
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nARTIFACT_NAME='057a-ClosePaw-RC11-verified-full-source'\nEXPECTED_DIGEST='sha256:d81273e27cb2a205312d8debcbaa412885559bdd3078f764e768ce75c0a5cd49'\nEXPECTED_ZIP_SHA='d81273e27cb2a205312d8debcbaa412885559bdd3078f764e768ce75c0a5cd49'\nEXPECTED_MANIFEST_SHA='ca82f407f33f9954a6f6ce69fa61c9efbec68305a892b4751b6df4b3bb1d5f69'\nrm -rf /tmp/057a-source /tmp/057a-normalized /tmp/057a-artifact.zip /tmp/057a-list.json\nmkdir -p /tmp/057a-source\ncurl -fsSL             -H \"Authorization: Bearer $GH_TOKEN\"             -H 'Accept: application/vnd.github+json'             \"https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100\"             -o /tmp/057a-list.json\npython3 - <<'PYMETA'\nimport json\nd=json.load(open('/tmp/057a-list.json'))\nexpected='sha256:d81273e27cb2a205312d8debcbaa412885559bdd3078f764e768ce75c0a5cd49'\nmatches=[a for a in d.get('artifacts',[]) if a.get('name')=='057a-ClosePaw-RC11-verified-full-source' and not a.get('expired') and a.get('digest')==expected]\nif not matches:\n    available=[(a.get('id'),a.get('name'),a.get('expired'),a.get('digest')) for a in d.get('artifacts',[])[:20]]\n    raise SystemExit(f'exact 057a artifact not found; candidates={available}')\nmatches.sort(key=lambda a: a.get('created_at',''), reverse=True)\nchosen=matches[0]\nopen('/tmp/057a-artifact-id','w').write(str(chosen['id']))\nopen('/tmp/057a-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\\n')\nprint(f\"057a artifact id={chosen['id']} digest={chosen.get('digest')}\")\nPYMETA\nARTIFACT_ID=\"$(cat /tmp/057a-artifact-id)\"\ncurl -fsSL -L             -H \"Authorization: Bearer $GH_TOKEN\"             -H 'Accept: application/vnd.github+json'             \"https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip\"             -o /tmp/057a-artifact.zip\ntest \"$(sha256sum /tmp/057a-artifact.zip | awk '{print $1}')\" = \"$EXPECTED_ZIP_SHA\"\nunzip -q /tmp/057a-artifact.zip -d /tmp/057a-source\nMANIFEST=\"$(find /tmp/057a-source -type f -name '057a-postpatch-source-manifest.json' -print -quit)\"\n[ -n \"$MANIFEST\" ] || { echo '057a source manifest missing' >&2; exit 1; }\ntest \"$(sha256sum \"$MANIFEST\" | awk '{print $1}')\" = \"$EXPECTED_MANIFEST_SHA\"\nROOT=\"$(dirname \"$MANIFEST\")\"\nif [ \"$ROOT\" != '/tmp/057a-source' ]; then\n  mkdir -p /tmp/057a-normalized\n  cp -a \"$ROOT\"/. /tmp/057a-normalized/\n  rm -rf /tmp/057a-source\n  mv /tmp/057a-normalized /tmp/057a-source\nfi\npython3 - <<'PYBASE'\nfrom pathlib import Path\nimport hashlib,json\nroot=Path('/tmp/057a-source')\nmanifest=json.loads((root/'057a-postpatch-source-manifest.json').read_text())\ncurrent={}\nfor p in sorted((root/'app').rglob('*')):\n    if p.is_file() and '/build/' not in p.as_posix():\n        current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()\nif current != manifest:\n    missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])\n    raise SystemExit(f'057a source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')\nprint('exact verified 057a source manifest: PASS')\nPYBASE\nfind . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +\nrsync -a --exclude='.git' --exclude='.github' /tmp/057a-source/ ./\ncp 057a-postpatch-source-manifest.json 057a-baseline-source-manifest.json\ncat > 058-verification-report.txt <<'REPORT'\nClosePaw RC11 058 verification report\nBaseline: exact GitHub artifact 057a-ClosePaw-RC11-verified-full-source.\nExpected artifact SHA-256: d81273e27cb2a205312d8debcbaa412885559bdd3078f764e768ce75c0a5cd49.\nExpected 057a source manifest SHA-256: ca82f407f33f9954a6f6ce69fa61c9efbec68305a892b4751b6df4b3bb1d5f69.\nScope: Generic Runtime Project Orchestrator; SMT is migration seed/configuration only.\nREPORT\ncat /tmp/057a-artifact-meta.txt >> 058-verification-report.txt\n"
