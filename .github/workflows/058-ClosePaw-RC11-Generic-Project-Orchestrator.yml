/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt',\n    'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt',\n    'app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt',\n    'app/src/main/kotlin/ai/closepaw/memory/MemoryRecaller.kt',\n    'app/src/main/kotlin/ai/closepaw/memory/MemorySchema.kt',\n    'app/src/main/kotlin/ai/closepaw/memory/MemoryStore.kt',\n    'app/src/main/kotlin/ai/closepaw/tool/impl/RememberExperienceTool.kt',\n]\nfor path in frozen:\n    if baseline.get(path) != final.get(path):\n        raise SystemExit(f'frozen 057a surface changed: {path}')\nprint('058 exact isolation + frozen 057a invariants: PASS')\nPYISO\necho '058 exact isolation + frozen 057a invariants: PASS' >> 058-verification-report.txt\n"
    - name: Audit generic orchestration safety and scalability invariants
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYAUDIT'\nfrom pathlib import Path\np=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58.kt').read_text()\ns=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt').read_text()\na=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()\no=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()\nsvc=Path('app/src/main/kotlin/ai/closepaw/app/AgentService.kt').read_text()\nmain=Path('app/src/main/kotlin/ai/closepaw/app/MainActivity.kt').read_text()\nallv=p+s+a+o+svc+main\n# Generic/dynamic topology: no fixed routing table; SMT is seed compatibility only.\nassert 'TARGET_TITLES' not in allv\nassert 'Project topology is data' in o\nassert 'Generic V58 ROUTE_TASK must include PROJECT_ID' in s\nassert 'seedLegacySmt(db' in s\nassert '11 \u2014 SMT Systems & Automation' in s and '12 \u2014 SMT Execution Management' in s\n# Registry/version/control-plane safety.\nassert 'ROUTE_ID ${parsed.routeId} was reused with a different payload' in s\nassert 'Cannot disable current manager agent' in s\nassert 'Manager may not route a delegated task back to itself' in s\nassert 'V58 manager-style orchestration requires RETURN_TO' in s\nassert 'manifest.version > current.version' in s\nassert 'update.newVersion == update.baseVersion + 1L' in s\nassert 'target_chat_title' in s and 'return_chat_title' in s\nassert 'CONTROL_PLANE: CLOSEPAW_V58' in o\nassert 'message.lineSequence().firstOrNull()?.trim() == CONTROL_PLANE_MARKER' in o\nassert '!message.contains(\"RESULT_FROM_AGENT\")' in o\nassert 'isManagerCursorInitialized' in s and 'managerResponseCursor' in s\nassert 'MANAGER_BASELINE_PRIMED' in o and 'MANAGER_CURSOR_GAP' in o\nassert 'MANAGER_CURSOR_REBOUND' in o\nassert 'MANAGER_SCAN_REBIND_AFTER_CONTROL' in o\nassert 'sameAuthorityBoundary' in o\n# Untrusted specialist output is data, never a new control command.\nassert 'quoteData(parsed.originalBlock)' in s\nassert 'quoteData(response)' in o\nassert 'RESULT_BODY_QUOTED' in o\n# Exact/fail-closed ChatGPT UI adapter.\nassert 'copyAssistantResponsesAfter' in a\nassert 'copyAssistantResponseContaining' in a\nassert 'Positive copy receipt' in a\nassert 'clipboard.setPrimaryClip(ClipData.newPlainText(\"ClosePaw copy probe\", sentinel))' in a\nassert 'node.text?.toString()?.trim() == text' in a\nassert 'uniqueActionNearComposer' in a\nassert 'dispatchGesture' not in a and 'GestureDescription' not in a\nassert 'contains(exactTitle)' not in a\n# Durable non-replayable boundaries.\nassert 'SEND_ATTEMPTED -> to == RouteStateV58.SENT_VERIFIED || to == RouteStateV58.SEND_OUTCOME_UNKNOWN' in p\nassert 'SEND_OUTCOME_UNKNOWN -> to == RouteStateV58.SENT_VERIFIED' in p\nassert 'RETURN_ATTEMPTED -> to == RouteStateV58.RETURN_VERIFIED || to == RouteStateV58.RETURN_OUTCOME_UNKNOWN' in p\nassert 'RETURN_OUTCOME_UNKNOWN -> to == RouteStateV58.RETURN_VERIFIED' in p\nassert 'No proof of prior Send; no replay allowed' in o\nassert 'No proof of prior return; no replay allowed' in o\n# Cancellation/ownership integration; do not swallow parent cancellation.\nassert o.count('catch (cancel: CancellationException)') >= 3\nassert 'currentCoroutineContext().ensureActive()' in o\nassert 'owner?.join()' in o and 'workerJob = null' in o\nassert 'projectOrchestrator.stopAndJoin(\"hybrid_takeover\")' in svc\nassert 'projectOrchestrator.stopAndJoin(\"agent_session_takeover\")' in svc\nassert 'projectOrchestrator.resumeIfEnabled()' in svc\nassert 'ProjectOrchestratorV58.isControlCommand' in svc and 'ProjectOrchestratorV58.isControlCommand' in main\n# Old dedicated SMT execution path is removed.\nassert not Path('app/src/main/kotlin/ai/closepaw/app/SmtRouter.kt').exists()\nassert not Path('app/src/main/kotlin/ai/closepaw/app/SmtRouteLedger.kt').exists()\nprint('058 generic orchestration safety/scalability/control-plane audit: PASS')\nPYAUDIT\necho '058 generic orchestration safety/scalability/control-plane audit: PASS' >> 058-verification-report.txt\n"
