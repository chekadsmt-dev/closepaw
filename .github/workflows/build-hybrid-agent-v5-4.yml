name: Build ClosePaw Hybrid Agent v5.4

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply v5.2 base files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-hybrid-agent-v5-3.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()

          marker = '- name: Apply v5.2 base'
          start = next(i for i, line in enumerate(lines) if line.strip() == marker)
          run_idx = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
          body = []

          for line in lines[run_idx + 1:]:
              if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                  break
              if not line.strip():
                  body.append('')
              else:
                  body.append(line[body_indent:])

          script = '\n'.join(body) + '\n'
          subprocess.run(['bash'], input=script, text=True, check=True)
          print('v5.2 base files: PASS')
          PY

      - name: Install Hybrid Agent v5.4 engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          engine = base64.b64decode('').decode('utf-8')
          path = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt')
          path.write_text(engine, encoding='utf-8')

          checks = [
              ('brainRequestId = "${task.id}-T${turnIndex + 1}"' in engine, 'per-turn Brain token'),
              ('waitForDedicatedBrainConversation' in engine, 'positive Brain verification'),
              ('waitForMatchingBrainResponse' in engine, 'matching response wait'),
              ('extractLatestPlanForTask' in engine, 'stale response filter'),
              ('plan.taskId != brainRequestId' in engine, 'strict token validation'),
              ('NO_UI_CHANGE' in engine, 'UI no-change loop guard'),
              ('SessionRecordingService' in engine, 'session persistence'),
              ('VirtualDisplayPlatform' in engine, 'background virtual display'),
          ]
          failed = [name for ok, name in checks if not ok]
          if failed:
              raise SystemExit('v5.4 self-check failed: ' + ', '.join(failed))

          print('Hybrid Agent v5.4 engine: PASS')
          PY

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Hybrid-Agent-v5.4-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
