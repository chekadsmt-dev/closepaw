              raise SystemExit('Legacy CLICK_NODE first-match dispatch remains after semantic re-resolution patch')
          if 'clickConfiguredBrainTitleV9' not in e or 'requireTitle = false' not in e:
              raise SystemExit('Generic Brain transport lost causal exact-title selection verification')
          if 'if (configuredBrainChatVerifiedV9(platform, requireTitle = true)) return' in e:
              raise SystemExit('Title visible somewhere + composer must not authorize exact Brain chat')
          if 'scrollAny(platform, HybridAction.Direction.DOWN)' not in e:
              raise SystemExit('Brain parser is missing bounded near-bottom stabilization')

          safety_model = Path('app/src/main/kotlin/ai/closepaw/app/V9SafetyModel.kt').read_text(encoding='utf-8')
          if 'fun mayRetry(' not in safety_model or 'fun brainLoopKey(' not in safety_model:
              raise SystemExit('V9SafetyModel.kt missing expected functions')
          safety_test = Path('app/src/test/kotlin/ai/closepaw/app/V9SafetyModelTest.kt').read_text(encoding='utf-8')
          if '@Test' not in safety_test or 'V9SafetyModel.mayRetry' not in safety_test:
              raise SystemExit('V9SafetyModelTest.kt missing or not exercising real object')

          print('GATE 3 protocol/settings/compile contracts: PASS')
          PY

      - name: Gate 3B - RC8 restore safety contracts
        shell: bash
        run: |
          python3 - <<'PYRC8GATE'
          from pathlib import Path
          import re

          e = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')

          def function_region(name: str) -> str:
              m = re.search(r'(?m)^    private\s+(?:suspend\s+)?fun\s+' + re.escape(name) + r'\s*\(', e)
              if not m:
                  raise SystemExit('RC8 function missing: ' + name)
              next_m = re.search(r'(?m)^    private\s+(?:suspend\s+)?fun\s+\w+\s*\(', e[m.end():])
              end = m.end() + next_m.start() if next_m else len(e)
              return e[m.start():end]

          capture = function_region('captureBrainExcursionFrame')
          restore = function_region('restoreAfterBrainExcursion')
          opener = function_region('openConversationDeterministically')
          origin = function_region('originLooksRestored')

          for forbidden in [
              'taskKnownWorkChatTitle?.let(::add)',
              'recentSemanticAnchors',
              'topScreenTitleCandidates',
          ]:
              if forbidden in capture:
                  raise SystemExit('Weak restore evidence leaked into capture authority: ' + forbidden)
          for required in [
              'val goalAnchor = inferWorkChatTitleFromGoal',
              'selectedConversationCandidates(sidebar).firstOrNull()',
              'val strongOriginTitle = goalAnchor ?: selectedAnchor',
              'originChatTitle = strongOriginTitle',
              'returnCandidates = strongCandidates',
          ]:
              if required not in capture:
                  raise SystemExit('Strong-evidence capture contract missing: ' + required)

          if 'frame.returnCandidates' in restore:
              raise SystemExit('restoreAfterBrainExcursion must not navigate by candidate lists')
          if 'openConversationDeterministically(platform, exactOrigin)' not in restore:
              raise SystemExit('RC8 exact-origin bounded restore path missing')
          if 'Unknown chat identity: do not guess' not in restore:
              raise SystemExit('RC8 unknown-origin fail-closed path missing')

          for forbidden in ['setEditableText(', 'clickByLabels(', 'preferSearch', 'Search']:
              if forbidden in opener:
                  raise SystemExit('Brain-return opener still contains Search/TYPE behavior: ' + forbidden)
          if 'isExactChatActiveV7(platform, title)' not in opener:
              raise SystemExit('Brain-return opener success is not exact-selected-chat verified')
          if '!isDedicatedBrainSnapshot' in opener:
              raise SystemExit('Not-Brain is insufficient restore success proof')

          # Reject the executable fuzzy-acceptance logic from the old implementation,
          # not harmless words in comments (for example: "Historical anchor overlap").
          for forbidden in [
              'frame.originAnchors.isEmpty()',
              'frame.originAnchors.intersect(now).size',
              'val overlap =',
              'val similarity =',
              'return overlap >=',
          ]:
              if forbidden in origin:
                  raise SystemExit('Fuzzy origin restore acceptance remains: ' + forbidden)
          for required in [
              'observedPackage(platform) != originPackage',
              'isExactChatActiveV7(platform, exactOrigin)',
              'interactionFingerprint(current, originPackage) == frame.originFingerprint',
          ]:
              if required not in origin:
                  raise SystemExit('Strict origin restore contract missing: ' + required)

          print('GATE 3B RC8 restore safety: PASS')
          PYRC8GATE

      - name: Gate 3C - RC9 Primary-first provider routing contracts
        shell: bash
        run: |
          python3 - <<'PYRC9GATE'
          from pathlib import Path

          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          llm_ui = Path('app/src/main/kotlin/ai/closepaw/ui/settings/LlmAuthSettingsPage.kt').read_text(encoding='utf-8')
          brain_ui = Path('app/src/main/kotlin/ai/closepaw/ui/settings/ChatBrainSettingsPage.kt').read_text(encoding='utf-8')
          providers = Path('app/src/main/kotlin/ai/closepaw/llm/LLMProvider.kt').read_text(encoding='utf-8')

          required_engine = [
              'service.notifyHybridPlanning("Primary Model turn $primaryCalls")',
              'requestPrimaryPlanV9(task.id, primaryRequestId, primaryRequest)',
              'service.notifyHybridPlanning("External Chat Brain turn $brainCalls")',
              'SessionLlmBootstrapper.create(',
              'configuredPrimaryRuntimeV9()',
              'tools = emptyList()',
              'PRIMARY_ESCALATE|reason',
              'MAX_PRIMARY_PER_WORK_STATE = 1',
              'primaryStateConsults[workStateKey]',
              'if (selectedPlan == null) {',
              'val externalCfg = configuredBrainV9()',
              'if (!externalCfg.enabled)',
              'LLMBackendType.LOCAL',
              'settings.selectedModel',
              'settings.localModel.modelSlug',
          ]
          for token in required_engine:
              if token not in engine:
                  raise SystemExit('RC9 Primary-first contract missing: ' + token)

          # Prove ordering in the ordinary planning path: Primary invocation must occur before
          # the External Chat Brain consult. Explicit BRAIN-ROUNDTRIP diagnostics are exempt.
          planning = engine.index('if (planQueue.isEmpty())')
          primary = engine.index('requestPrimaryPlanV9(task.id, primaryRequestId, primaryRequest)', planning)
          external_notice = engine.index('service.notifyHybridPlanning("External Chat Brain turn $brainCalls")', primary)
          external_call = engine.index('consultBrain(', external_notice)
          if not (planning < primary < external_notice < external_call):
              raise SystemExit('RC9 routing order is not Deterministic -> Primary -> External Chat Brain')

          # Primary must be planner-only. No AndroidPlatform is passed into the Primary call and
          # no tools are exposed to the LLM client.
          primary_fn = engine.index('private suspend fun callPrimaryModelRawV9')
          primary_end = engine.index('private fun primaryEscalationReasonV9', primary_fn)
          primary_body = engine[primary_fn:primary_end]
          for forbidden in ['AndroidPlatform', 'executeAction(', 'platform.', 'consultBrain(']:
              if forbidden in primary_body:
                  raise SystemExit('Primary planner gained side-effect/escalation capability: ' + forbidden)
          if 'tools = emptyList()' not in primary_body:
              raise SystemExit('Primary planner must expose zero tools')

          # Local provider must be visible again; cloud and arbitrary compatible provider support
          # remain the existing ClosePaw settings stack rather than a new parallel provider chain.
          if 'private const val LOCAL_TAB_ENABLED = true' not in llm_ui:
              raise SystemExit('Local Primary Model tab is not enabled')
          if 'Primary Model / Provider' not in llm_ui:
              raise SystemExit('Primary Model settings are not clearly labeled')
          for provider in ['OPENAI_API', 'OPENAI_CODEX', 'OPENROUTER', 'OTHER', 'LOCAL_LFM']:
              if provider not in providers:
                  raise SystemExit('Existing provider missing: ' + provider)

          # External Brain remains independently configurable as an installed app + exact chat.
          for token in [
              'External Chat Brain',
              'Brain App:',
              'Exact Brain Chat title',
              'TEST BRAIN (no message sent)',
              'any installed AI app',
          ]:
              if token not in brain_ui:
                  raise SystemExit('External Chat Brain setting contract missing: ' + token)

          print('GATE 3C RC9 Primary-first provider routing: PASS')
          PYRC9GATE

      - name: Gate 3D - RC10 configurable Primary and fallback Brain contracts
        shell: bash
        run: |
          python3 - <<'PYRC10GATE'
          from pathlib import Path

          engine = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text(encoding='utf-8')
          llm_ui = Path('app/src/main/kotlin/ai/closepaw/ui/settings/LlmAuthSettingsPage.kt').read_text(encoding='utf-8')
