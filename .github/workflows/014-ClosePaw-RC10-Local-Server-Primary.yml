              ): PrimaryPlanDecision {
                  val raw = callPrimaryModelRawV9(request)
                  primaryEscalationReasonV9(raw)?.let { return PrimaryPlanDecision(null, it) }

                  val first = runCatching { HybridPlanParser.parse(raw) }
                      .getOrNull()
                      ?.takeIf { it.taskId == taskId && it.requestId == requestId }
                  if (first != null) {
                      val primaryFail = first.actions.filterIsInstance<HybridAction.Fail>().firstOrNull()
                      if (primaryFail != null) {
                          return PrimaryPlanDecision(null, "Primary declared unresolved: ${primaryFail.reason}")
                      }
                      return PrimaryPlanDecision(first, "")
                  }

                  // One format-repair call is allowed. It is still the Primary Model, never Chat Brain.
                  val parseError = runCatching { HybridPlanParser.parse(raw) }
                      .exceptionOrNull()?.message.orEmpty()
                  val repairRequestId = newPrimaryRequestIdV9(taskId, 99)
                  val repair = buildString {
                      appendLine("CLOSEPAW_PRIMARY_MODEL_FORMAT_REPAIR")
                      appendLine("TASK_ID: $taskId")
                      appendLine("REQUEST_ID: $repairRequestId")
                      appendLine("PARSER_ERROR: ${parseError.ifBlank { "TASK_ID/REQUEST_ID mismatch" }}")
                      appendLine("BAD_OUTPUT:")
                      appendLine(raw.take(4_000))
                      appendLine("Return exactly one of:")
                      appendLine("PRIMARY_ESCALATE|reason")
                      appendLine("OR")
                      appendLine("BRAIN_PLAN")
                      appendLine("TASK_ID: $taskId")
                      appendLine("REQUEST_ID: $repairRequestId")
                      appendLine("<valid action lines>")
                      appendLine("END_BRAIN_PLAN|$repairRequestId")
                      appendLine("Nothing else.")
                  }
                  val repaired = runCatching { callPrimaryModelRawV9(repair) }
                      .getOrElse { return PrimaryPlanDecision(null, "Primary format repair failed: ${it.message}") }
                  primaryEscalationReasonV9(repaired)?.let { return PrimaryPlanDecision(null, it) }
                  val parsed = runCatching { HybridPlanParser.parse(repaired) }
                      .getOrNull()
                      ?.takeIf { it.taskId == taskId && it.requestId == repairRequestId }
                      ?: return PrimaryPlanDecision(null, "Primary plan invalid after one format repair")
                  val primaryFail = parsed.actions.filterIsInstance<HybridAction.Fail>().firstOrNull()
                  if (primaryFail != null) {
                      return PrimaryPlanDecision(null, "Primary declared unresolved: ${primaryFail.reason}")
                  }
                  return PrimaryPlanDecision(parsed, "")
              }

