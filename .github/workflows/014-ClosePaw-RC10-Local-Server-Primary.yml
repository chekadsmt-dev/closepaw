name: 014 - ClosePaw RC10 Local Server Primary

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gate 0 - pin reconstructed base workflow chain
        shell: bash
        run: |
          python3 - <<'PYPIN'
          from pathlib import Path
          import subprocess

          expected = {
              '.github/workflows/build-closepaw-general-v8.yml': '7a6f783de2da84b18677d3824d36dbf76c9441e3',
              '.github/workflows/build-closepaw-adaptive-v7-3.yml': 'df992c8e96f5db9b2ec75c7ab19f12ca5760fa6b',
              '.github/workflows/build-closepaw-adaptive-v7-2.yml': '6b4c4cde90f828195e3d00fa1d40df7d1e60de2c',
              '.github/workflows/build-closepaw-adaptive-v7-1.yml': '7e2a47380d03ae9e307c3816bc35d471c154f7db',
              '.github/workflows/build-closepaw-adaptive-v7.yml': '050184d2b97395a90c8c98154b585ae3d37319d6',
          }
          for path, wanted in expected.items():
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f'Missing pinned base workflow: {path}')
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != wanted:
                  raise SystemExit(
                      f'Base workflow drifted: {path} expected={wanted} actual={actual}'
                  )
          print('PINNED BASE WORKFLOW CHAIN: PASS')
          PYPIN

      - name: Apply General v8 source
        shell: bash
        run: |
          python3 - <<'PYBASE'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-closepaw-general-v8.yml')
          if not workflow.exists():
              raise SystemExit('Missing required base workflow: build-closepaw-general-v8.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []
              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  body.append('' if not line.strip() else line[body_indent:])
              result = subprocess.run(
                  ['bash'], input='\n'.join(body) + '\n', text=True, check=False
              )
              if result.returncode != 0:
                  raise SystemExit(f'Base step failed: {step_name}')

          run_step('Apply Adaptive v7.3 source')
          run_step('Apply General Execution Engine v8')
          print('GENERAL V8 SOURCE: PASS')
          PYBASE

      - name: Apply consolidated v9 execution and Brain patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/closepaw_v9_patch.py
          python3 -m py_compile /tmp/closepaw_v9_patch.py
          python3 /tmp/closepaw_v9_patch.py

      - name: Apply RC8 restore-safety hardening
        shell: bash
        run: |
          cat > /tmp/rc8_restore_safety_patch.py <<'PYRC8'
          from pathlib import Path
          import re
          
          ENGINE = Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt')
          e = ENGINE.read_text(encoding='utf-8')
          
          
          def replace_kotlin_function(source: str, name: str, replacement: str) -> str:
              # Find a private Kotlin function by semantic name, independent of whether it is suspend.
              m = re.search(r'(?m)^    private\s+(?:suspend\s+)?fun\s+' + re.escape(name) + r'\s*\(', source)
              if not m:
                  raise SystemExit(f'RC8 function anchor missing: {name}')
              start = m.start()
              brace = source.find('{', m.end())
              if brace < 0:
                  raise SystemExit(f'RC8 opening brace missing: {name}')
          
              i = brace
              depth = 0
              state = 'code'
              block_depth = 0
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  tri = source[i:i+3]
          
                  if state == 'code':
                      if tri == '"""':
                          state = 'triple'
                          i += 3
                          continue
                      if ch == '"':
                          state = 'double'
                          i += 1
                          continue
                      if ch == "'":
                          state = 'single'
                          i += 1
                          continue
                      if ch == '/' and nxt == '/':
                          state = 'line_comment'
                          i += 2
                          continue
                      if ch == '/' and nxt == '*':
                          state = 'block_comment'
                          block_depth = 1
                          i += 2
                          continue
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              return source[:start] + replacement.rstrip() + '\n' + source[end:]
                      i += 1
                      continue
          
                  if state == 'double':
                      if ch == '\\':
                          i += 2
                          continue
                      if ch == '"':
                          state = 'code'
                      i += 1
                      continue
          
                  if state == 'single':
                      if ch == '\\':
                          i += 2
                          continue
                      if ch == "'":
                          state = 'code'
                      i += 1
                      continue
          
                  if state == 'triple':
                      if tri == '"""':
                          state = 'code'
                          i += 3
                      else:
                          i += 1
                      continue
          
                  if state == 'line_comment':
                      if ch == '\n':
                          state = 'code'
                      i += 1
                      continue
          
                  if state == 'block_comment':
                      if ch == '/' and nxt == '*':
                          block_depth += 1
                          i += 2
                          continue
                      if ch == '*' and nxt == '/':
                          block_depth -= 1
                          i += 2
                          if block_depth == 0:
                              state = 'code'
                          continue
                      i += 1
                      continue
          
              raise SystemExit(f'RC8 closing brace missing: {name}')
          
          
          capture = r'''    private suspend fun captureBrainExcursionFrame(
                  platform: AndroidPlatform,
                  fallbackPackage: String?,
              ): BrainExcursionFrame {
                  val originPackage = observedPackage(platform) ?: fallbackPackage
                  val originSnapshot = platform.captureScreen()
                  val originWasBrain = isDedicatedBrainSnapshot(originSnapshot)
                  val originSidebarVisible = isSidebarSnapshot(originSnapshot)
                  val originFingerprint = interactionFingerprint(originSnapshot, originPackage)
                  val originAnchors = stableScreenAnchors(originSnapshot)
          
                  // RC8: only strong identity evidence may authorize a restore-side navigation.
                  // 1) task/GoalSpec scope anchor, or 2) an actually selected conversation row.
                  val goalAnchor = inferWorkChatTitleFromGoal(activeTask?.goal.orEmpty())
                      ?.takeIf(::isUsefulReturnAnchor)
                  var selectedAnchor: String? = null
          
                  if (!goalAnchor.isNullOrBlank()) {
                      Log.i(TAG, "Brain excursion strong goal work-chat anchor: $goalAnchor")
                  }
          
                  if (isChatGptPackage(originPackage) && !originWasBrain) {
                      runCatching {
                          if (openSidebarSafely(platform)) {
                              delay(300)
                              val sidebar = platform.captureScreen()
                              selectedAnchor = selectedConversationCandidates(sidebar).firstOrNull()
          
                              if (!originSidebarVisible) {
                                  performSystemBack(platform)
                                  delay(350)
                              }
                          }
                      }.onFailure {
                          Log.w(TAG, "Could not probe selected ChatGPT conversation before Brain", it)
                      }
                  }
          
                  val strongOriginTitle = goalAnchor ?: selectedAnchor
                  if (!strongOriginTitle.isNullOrBlank()) {
                      // A cache may be refreshed FROM strong evidence, but is never itself used as restore authority.
                      taskKnownWorkChatTitle = strongOriginTitle
                      rememberSemanticAnchor(strongOriginTitle)
                  }
          
                  val strongCandidates = listOfNotNull(goalAnchor, selectedAnchor)
                      .map(::cleanText)
                      .filter(::isUsefulReturnAnchor)
                      .distinctBy(::normalizeForMatch)
                      .take(2)
          
                  Log.i(
                      TAG,
                      "Brain excursion saved: pkg=$originPackage " +
                          "strongChat=${strongOriginTitle ?: "unknown"} " +
                          "sidebar=$originSidebarVisible strongCandidates=${strongCandidates.size}",
                  )
          
                  return BrainExcursionFrame(
                      originPackage = originPackage,
                      originFingerprint = originFingerprint,
                      originAnchors = originAnchors,
                      originChatTitle = strongOriginTitle,
                      originSidebarVisible = originSidebarVisible,
                      originWasBrain = originWasBrain,
                      returnCandidates = strongCandidates,
                  )
              }'''
          
          restore = r'''    private suspend fun restoreAfterBrainExcursion(
                  platform: AndroidPlatform,
                  frame: BrainExcursionFrame,
              ): Boolean {
                  val originPackage = frame.originPackage ?: return true
          
                  if (!isChatGptPackage(originPackage)) {
                      val restored = resumePackage(platform, originPackage)
                      if (restored) delay(UI_SETTLE_MS)
                      return restored
                  }
          
                  if (frame.originWasBrain) {
                      ensureChatGptForeground(platform, "restoring original Brain context")
                      return true
                  }
          
                  ensureChatGptForeground(platform, "automatic return from Brain")
          
                  // Strict current-state proof first. This never consumes weak historical/scraped labels.
                  if (originLooksRestored(platform, frame)) {
                      restoreSidebarShapeIfNeeded(platform, frame)
                      return true
                  }
          
                  val exactOrigin = frame.originChatTitle?.takeIf(::isUsefulReturnAnchor)
          
                  // If we have a strong chat identity, only click that identity. No Search/TYPE is permitted
                  // in Brain-return recovery. Two bounded attempts are enough; every success is re-verified.
                  if (exactOrigin != null) {
                      repeat(2) { attempt ->
                          if (openConversationDeterministically(platform, exactOrigin)) {
                              taskKnownWorkChatTitle = exactOrigin
                              delay(UI_SETTLE_MS)
                              restoreSidebarShapeIfNeeded(platform, frame)
                              return true
                          }
          
                          if (attempt == 0) {
                              performSystemBack(platform)
                              delay(400)
                              if (originLooksRestored(platform, frame)) {
                                  restoreSidebarShapeIfNeeded(platform, frame)
                                  return true
                              }
                          }
                      }
                  } else {
                      // Unknown chat identity: do not guess. Only bounded Back/package/fingerprint recovery.
                      repeat(2) {
                          performSystemBack(platform)
                          delay(400)
                          if (originLooksRestored(platform, frame)) {
                              restoreSidebarShapeIfNeeded(platform, frame)
                              return true
                          }
                      }
                  }
          
                  ensureChatGptForeground(platform, "final automatic Brain-return recovery")
                  if (originLooksRestored(platform, frame)) {
                      restoreSidebarShapeIfNeeded(platform, frame)
                      return true
                  }
                  return false
              }'''
          
          open_conv = r'''    private suspend fun openConversationDeterministically(
                  platform: AndroidPlatform,
                  title: String,
              ): Boolean {
                  ensureChatGptForeground(platform, "restoring work conversation")
                  closeChatOptionsPopupIfOpen(platform)
          
                  var sidebarReady = openSidebarSafely(platform)
                  if (!sidebarReady) {
                      performSystemBack(platform)
                      delay(300)
                      sidebarReady = openSidebarSafely(platform)
                  }
                  if (!sidebarReady) return false
          
                  delay(350)
          
                  if (clickTextExact(platform, title, excludeEditable = true)) {
                      delay(650)
                      if (isExactChatActiveV7(platform, title)) return true
                  }
          
                  // Contains is only a locator fallback for the SAME strong title; it is never success proof.
                  // Success still requires exact selected-conversation verification after the click.
                  if (clickTextContains(platform, title, excludeEditable = true)) {
                      delay(650)
                      if (isExactChatActiveV7(platform, title)) return true
                  }
          
                  return false
              }'''
          
          origin_strict = r'''    private suspend fun originLooksRestored(
                  platform: AndroidPlatform,
                  frame: BrainExcursionFrame,
              ): Boolean {
                  val originPackage = frame.originPackage ?: return false
                  if (observedPackage(platform) != originPackage) return false
          
                  if (frame.originWasBrain) {
                      return isDedicatedBrainSnapshot(platform.captureScreen())
                  }
          
                  val exactOrigin = frame.originChatTitle?.takeIf(::isUsefulReturnAnchor)
                  if (exactOrigin != null) {
                      // Authoritative chat proof: the exact conversation is selected in the current UI.
                      return isExactChatActiveV7(platform, exactOrigin)
                  }
          
                  // No strong chat identity was captured. Fail closed unless the exact pre-excursion
                  // interaction fingerprint is back in the same package. Historical anchor overlap is
                  // intentionally NOT authoritative here.
                  val current = platform.captureScreen()
                  if (isDedicatedBrainSnapshot(current)) return false
                  return interactionFingerprint(current, originPackage) == frame.originFingerprint
              }'''
          
          for name, replacement in [
              ('captureBrainExcursionFrame', capture),
              ('restoreAfterBrainExcursion', restore),
              ('openConversationDeterministically', open_conv),
              ('originLooksRestored', origin_strict),
          ]:
              e = replace_kotlin_function(e, name, replacement)
          
          ENGINE.write_text(e, encoding='utf-8')
          print('RC8 restore-safety patch: PASS')
          PYRC8
          python3 -m py_compile /tmp/rc8_restore_safety_patch.py
          python3 /tmp/rc8_restore_safety_patch.py

      - name: Apply RC9 Primary-first model routing
        shell: bash
        run: |
          cat > /tmp/rc9_primary_first_patch.py <<'PYRC9'
          from pathlib import Path

          ROOT = Path('.')

          def read(path):
              p = ROOT / path
              if not p.exists():
                  raise SystemExit(f'RC9 missing source: {path}')
              return p.read_text(encoding='utf-8')

          def write(path, text):
              p = ROOT / path
              p.write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'RC9 patch anchor missing: {label}')
              return text.replace(old, new, 1)

          engine_path = 'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          e = read(engine_path)

          # 1) Imports for existing ClosePaw Primary Model/provider infrastructure.
          anchor = 'import ai.closepaw.history.storage.SessionStorage\n'
          imports = '''import ai.closepaw.history.storage.SessionStorage
          import ai.closepaw.llm.LLMClient
          import ai.closepaw.llm.LLMProvider
          import ai.closepaw.llm.LocalLLMConfig
          import ai.closepaw.llm.ModelCatalogRepositoryHolder
          '''
          e = replace_once(e, anchor, imports, 'primary LLM imports')

          anchor = 'import ai.closepaw.protocol.PlatformMode\nimport ai.closepaw.protocol.SessionConfig\n'
          imports = '''import ai.closepaw.protocol.LLMBackendType
          import ai.closepaw.protocol.PlatformMode
          import ai.closepaw.protocol.SessionConfig
          import ai.closepaw.protocol.SessionLlmConfig
          import ai.closepaw.session.SessionLlmBootstrapper
          '''
          e = replace_once(e, anchor, imports, 'session primary imports')

          anchor = 'import kotlinx.coroutines.CancellationException\n'
          imports = '''import com.openai.models.responses.EasyInputMessage
          import com.openai.models.responses.ResponseInputItem
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          '''
          e = replace_once(e, anchor, imports, 'primary request imports')

          # 2) Architecture comment and bounds.
          e = replace_once(
              e,
              ''' * The executor is deterministic. It only asks the user's dedicated ChatGPT Brain conversation
           * when planning/recovery is required. UI work is routed through ClosePaw's AndroidPlatform
          ''',
              ''' * The executor is deterministic first. When planning/recovery is required it asks the
           * configured ClosePaw Primary Model first (local or cloud/provider selected in Settings).
           * Only when Primary cannot produce a valid plan does it escalate to the separately configured
           * External Chat Brain app/chat. UI work is routed through ClosePaw's AndroidPlatform
          ''',
              'architecture comment',
          )

          e = replace_once(
              e,
              '        private const val V7_MAX_BRAIN_CALLS = 16\n',
              '''        private const val V7_MAX_BRAIN_CALLS = 16
                  private const val MAX_TOTAL_MODEL_TURNS = 24
                  private const val MAX_PRIMARY_PER_WORK_STATE = 1
          ''',
              'primary bounds',
          )

          # 3) Primary runtime/result types.
          anchor = '''    private data class PendingConfirmation(
                  val task: HybridTask,
                  val description: String,
              )

          '''
          replacement = anchor + '''    private data class PrimaryRuntime(
                  val client: LLMClient,
                  val modelId: String,
                  val signature: String,
              )

              private data class PrimaryPlanDecision(
                  val plan: HybridPlan?,
                  val reason: String,
              )

          '''
          e = replace_once(e, anchor, replacement, 'primary runtime types')

          # 4) Cache the configured Primary Model so on-device models stay warm across turns/tasks.
          anchor = '''    private val recentSemanticAnchors = mutableListOf<String>()
              private var taskKnownWorkChatTitle: String? = null
          '''
          replacement = '''    private val recentSemanticAnchors = mutableListOf<String>()
              private var taskKnownWorkChatTitle: String? = null
              private var cachedPrimaryRuntime: PrimaryRuntime? = null
          '''
          e = replace_once(e, anchor, replacement, 'primary runtime cache')

          # 5) Per-task model counters/state.
          anchor = '''            val noChangeCounts = mutableMapOf<String, Int>()
                      val brainStateConsults = mutableMapOf<String, Int>()
                      var lastError = ""
                      var brainCalls = 0
          '''
          replacement = '''            val noChangeCounts = mutableMapOf<String, Int>()
                      val brainStateConsults = mutableMapOf<String, Int>()
                      val primaryStateConsults = mutableMapOf<String, Int>()
                      var lastError = ""
                      var primaryCalls = 0
                      var brainCalls = 0
                      var totalModelTurns = 0
          '''
          e = replace_once(e, anchor, replacement, 'primary counters')

          # Bound total Primary+External planning turns, not just external Brain turns.
          e = replace_once(
              e,
              '            while (brainCalls < V7_MAX_BRAIN_CALLS) {\n',
              '            while (totalModelTurns < MAX_TOTAL_MODEL_TURNS && brainCalls < V7_MAX_BRAIN_CALLS) {\n',
              'total model turn bound',
          )

          # 6) Replace the model-planning section: Primary first; External Chat Brain second.
          plan_empty = e.index('                if (planQueue.isEmpty()) {')
          start = e.index('                    val ui = platform.captureScreen()', plan_empty)
          end = e.index('                while (planQueue.isNotEmpty()) {', start)
          old_block = e[start:end]
          new_block = '''                    val ui = platform.captureScreen()
                              val snapshotText = buildUiSnapshot(platform, ui)
                              val currentPackage = observedPackage(platform)
                              val skeleton = skeletonFingerprintV9(ui, currentPackage)
                              val scopeKey = inferScopeKeyV9(task.goal)
                              // WorkStateKey excludes receipt sequence and evidence revision. Model consult
                              // keys add task/subgoal/evidenceRevision so Primary gets at most one attempt
                              // on unchanged evidence; External Chat Brain is the bounded second stage.
                              val structuralWorkStateKey = sha256(
                                  currentPackage.orEmpty() + "|" + scopeKey + "|" +
                                      normalizeForMatch(targetChat.orEmpty()) + "|" + skeleton
                              )
                              val workStateKey = V9SafetyModel.brainLoopKey(
                                  task.id, normalizeForMatch(targetChat.orEmpty()), structuralWorkStateKey, evidenceRevision
                              )

                              val resumableBrainPlan = pendingBrainPlanForTaskV9(
                                  task.id,
                                  currentPackage,
                                  interactionFingerprint(ui, currentPackage),
                              )

                              var selectedPlan: HybridPlan? = null
                              var selectedPlanSource = ""

                              // A persisted BRAIN_RETURNING plan may have been sent before a crash. Resume
                              // that exact validated plan; never create a second Primary/Brain dispatch first.
                              if (resumableBrainPlan != null) {
                                  selectedPlan = runCatching { HybridPlanParser.parse(resumableBrainPlan) }
                                      .getOrNull()
                                      ?.takeIf { it.taskId == task.id && !it.requestId.isNullOrBlank() }
                                  if (selectedPlan == null) {
                                      finishFailure("Persisted Chat Brain plan is invalid/stale; recovery required")
                                      return
                                  }
                                  selectedPlanSource = "CHAT_BRAIN_RESUME"
                                  history += "MODEL_ROUTE|CHAT_BRAIN_RESUME|$workStateKey"
                              } else {
                                  // PRIMARY MODEL FIRST. This uses the user's existing ClosePaw model/provider
                                  // settings (Local LFM, OpenAI sign-in/API, OpenRouter, or Other compatible).
                                  // Primary is planner-only: zero tools are exposed and it cannot execute UI.
                                  val primarySeen = primaryStateConsults[workStateKey] ?: 0
                                  if (primarySeen < MAX_PRIMARY_PER_WORK_STATE) {
                                      primaryStateConsults[workStateKey] = primarySeen + 1
                                      primaryCalls++
                                      totalModelTurns++
                                      val primaryRequestId = newPrimaryRequestIdV9(task.id, primaryCalls)
                                      val primaryRequest = buildPrimaryModelRequest(
                                          task = task,
                                          requestId = primaryRequestId,
                                          turn = primaryCalls,
                                          snapshot = snapshotText,
                                          history = history.takeLast(MAX_HISTORY),
                                          lastError = lastError,
                                      )

                                      service.notifyHybridPlanning("Primary Model turn $primaryCalls")
                                      val primaryDecision = runCatching {
                                          requestPrimaryPlanV9(task.id, primaryRequestId, primaryRequest)
                                      }.getOrElse { error ->
                                          Log.w(TAG, "Primary Model unavailable; escalating", error)
                                          PrimaryPlanDecision(null, "unavailable: ${error.message ?: error.javaClass.simpleName}")
                                      }

                                      if (primaryDecision.plan != null) {
                                          selectedPlan = primaryDecision.plan
                                          selectedPlanSource = "PRIMARY"
                                          history += "MODEL_ROUTE|PRIMARY|turn=$primaryCalls|$workStateKey"
                                      } else {
                                          history += "PRIMARY_ESCALATE|${primaryDecision.reason.take(500)}|$workStateKey"
                                          lastError = primaryDecision.reason.ifBlank { "Primary Model requested escalation" }
                                      }
                                  } else {
                                      history += "PRIMARY_SKIP|unchanged WorkStateKey/evidenceRevision|$workStateKey"
                                  }

                                  // Only if Primary did not provide a valid plan do we visit the separately
                                  // configured external AI chat. No prompt wording can bypass this ordering.
                                  if (selectedPlan == null) {
                                      val externalCfg = configuredBrainV9()
                                      if (!externalCfg.enabled) {
                                          finishFailure(
                                              "Primary Model could not resolve the current work state and External Chat Brain is disabled: $lastError"
                                          )
                                          return
                                      }

                                      if (brainConsultSeenV9(task.id, workStateKey)) {
                                          finishFailure(
                                              "Primary Model could not resolve and External Chat Brain was already consulted for unchanged WorkStateKey/evidenceRevision"
                                          )
                                          return
                                      }
                                      val seen = brainStateConsults[workStateKey] ?: 0
                                      if (seen >= V7_MAX_BRAIN_PER_STATE) {
                                          finishFailure(
                                              "Bounded recovery stopped: External Chat Brain was already consulted for the same work state"
                                          )
                                          return
                                      }
                                      brainStateConsults[workStateKey] = seen + 1

                                      brainCalls++
                                      totalModelTurns++
                                      val requestId = newBrainRequestIdV9(task.id, brainCalls)
                                      val request = buildBrainRequest(
                                          task = task,
                                          brainRequestId = requestId,
                                          turn = brainCalls,
                                          snapshot = snapshotText,
                                          history = history.takeLast(MAX_HISTORY),
                                          lastError = lastError,
                                          stagnationCount = 0,
                                      )

                                      service.notifyHybridPlanning("External Chat Brain turn $brainCalls")
                                      val rawPlan = try {
                                          consultBrain(
                                              platform,
                                              request,
                                              bestReturnPackage(platform),
                                              task.id,
                                              requestId,
                                              workStateKey,
                                          )
                                      } catch (error: Throwable) {
                                          finishFailure("External Chat Brain unavailable after Primary escalation: ${error.message}")
                                          return
                                      }

                                      selectedPlan = parseWithSingleRepair(
                                          platform,
                                          task.id,
                                          requestId,
                                          rawPlan,
                                          bestReturnPackage(platform),
                                      ) ?: run {
                                          finishFailure("External Chat Brain plan could not be parsed for the current work state")
                                          return
                                      }
                                      selectedPlanSource = "CHAT_BRAIN"
                                      history += "MODEL_ROUTE|CHAT_BRAIN|turn=$brainCalls|$workStateKey"
                                  }
                              }

                              val plan = selectedPlan ?: run {
                                  finishFailure("No valid plan after Primary/External routing")
                                  return
                              }

                              if (plan.taskId != task.id || plan.requestId.isNullOrBlank()) {
                                  finishFailure("Model TASK_ID/REQUEST_ID mismatch; stale response rejected")
                                  return
                              }

                              // External Brain physically leaves Work; Primary does not. The same local
                              // terminal check is safe for either source and can end without stale actions.
                              if (targetChat != null && isExactChatActiveV7(platform, targetChat)) {
                                  history += "MODEL_RETURN_LOCAL_COMPLETION|$selectedPlanSource|$targetChat"
                                  finishSuccess(v7SuccessSummary(task.goal, targetChat, brainCalls))
                                  return
                              }

                              val signature = plan.actions.joinToString(";") { actionSignature(it) }
                              if (lastError.isNotBlank() && signature == lastFailedPlanSignature) {
                                  identicalFailedPlanCount++
                              } else {
                                  identicalFailedPlanCount = 0
                              }

                              if (identicalFailedPlanCount >= MAX_IDENTICAL_FAILED_PLANS) {
                                  finishFailure("Bounded recovery stopped: identical failed model plan repeated")
                                  return
                              }

