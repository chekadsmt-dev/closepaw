      - name: Verify exact 060 scope and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('060-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'060 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')
          a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          b=Path('app/build.gradle.kts').read_text()
          strings=Path('app/src/main/res/values/strings.xml').read_text()
          checks={
              'baseline probe': 'probeManagerBaseline' in a and 'historyStartProven' in a and 'historyLimitReached' in a,
              'no false empty baseline': 'empty-history-proven' in o and 'MANAGER_BASELINE_DEFERRED' in o,
              'conversation lease': 'leasedConversationConfiguredTitle' in a and 'leasedConversationResolvedTitle' in a,
              'cursor gap counted': 'error("Manager exact response cursor boundary unavailable")' in o,
              'failure reset not on navigation': 'val navigationReceipt = ui.openConversation(manager.chatTitle)\n                trace("MANAGER_NAV_OK"' in o,
              'failure reset on success': o.count('managerFailureByProject.remove(project.projectId)') >= 3,
              'bounded scan failure': 'MAX_CONSECUTIVE_MANAGER_SCAN_FAILURES = 3' in o and 'MANAGER_SCAN_FAIL_CLOSED' in o,
              'generic topology frozen': 'Project topology is data' in o and not Path('app/src/main/kotlin/ai/closepaw/app/SmtRouter.kt').exists(),
              'package continuity': 'applicationIdSuffix = ".rc11c058"' in b,
              'version 060': 'versionNameSuffix = "-rc11-c060"' in b,
              'label 060': 'ClosePaw RC11 060' in strings,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f'060 invariant audit failed: {bad}')
          Path('060-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('060-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('060-postpatch-manifest-sha256.txt').write_text(sha+'  060-postpatch-source-manifest.json\n')
          print('060 scope/safety audit: PASS',sha)
          with Path('060-verification-report.txt').open('a') as f: f.write(f'060 postpatch source manifest SHA-256: {sha}\n')
          PYAUDIT

      - name: Targeted frozen router/terminal gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests 'ai.closepaw.app.ChatGptProjectAdapterV59Test' \
            --tests 'ai.closepaw.app.ProjectOrchestratorProtocolV58Test' \
            --tests 'ai.closepaw.app.GoalPostconditionV41Test' \
            --tests 'ai.closepaw.app.PostPlanGuardV58ATest' \
            --stacktrace --no-daemon --no-configuration-cache
          echo '060 targeted frozen gates: PASS' >> 060-verification-report.txt

      - name: Full clean compile tests and assemble 060
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '060 full compile/tests/assemble: PASS' >> 060-verification-report.txt

      - name: Verify source and APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('060-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected: raise SystemExit('060 source changed during tests')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '060 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 060-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 060-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c060'" 060-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 060'" 060-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 060-apksigner.txt
          sha256sum "$APK" > 060-apk-sha256.txt
          echo "APK=$APK" >> "$GITHUB_ENV"
          cat >> 060-verification-report.txt <<'REPORT'
          060 CI build/test/source/APK gates: PASS.
          Device acceptance: one ROUTER START should establish a non-empty exact manager baseline for the existing SMT HQ chat, then remain visually quiet while unchanged; next run one 00 -> 12 -> 00 route; then 00 -> 04 -> 00; then duplicate/no-replay and runtime agent add.
          REPORT

