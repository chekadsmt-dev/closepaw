name: 060 - ClosePaw RC11 Manager Baseline Cursor + Quiet Router Polling
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 059 source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='059-ClosePaw-RC11-verified-full-source'
          rm -rf /tmp/059-source /tmp/059-artifact.zip /tmp/059-list.json /tmp/059-normalized
          mkdir -p /tmp/059-source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/059-list.json
          python3 - <<'PYMETA'
          import json
          d=json.load(open('/tmp/059-list.json'))
          name='059-ClosePaw-RC11-verified-full-source'
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches:
              raise SystemExit('059 verified full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          open('/tmp/059-artifact-id','w').write(str(chosen['id']))
          open('/tmp/059-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('059 artifact', chosen['id'], chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/059-artifact-id)"
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/059-artifact.zip
          unzip -q /tmp/059-artifact.zip -d /tmp/059-source
          MANIFEST="$(find /tmp/059-source -type f -name '059-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '059 source manifest missing' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/059-source' ]; then
            mkdir -p /tmp/059-normalized
            cp -a "$ROOT"/. /tmp/059-normalized/
            rm -rf /tmp/059-source
            mv /tmp/059-normalized /tmp/059-source
          fi
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/059-source')
          manifest=json.loads((root/'059-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'059 artifact/source mismatch missing={missing[:8]} added={added[:8]} changed={changed[:8]}')
          print('059 self-manifest identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/059-source/ ./
          cp 059-postpatch-source-manifest.json 060-baseline-source-manifest.json
          cat > 060-verification-report.txt <<'REPORT'
          ClosePaw RC11 060 verification report
          Baseline: verified 059 full-source artifact, self-manifest checked.
          Device defect: 059 manager navigation PASS, but baseline falsely primed empty and null cursor repeatedly hit bounded history limit.
          060 scope: exact manager baseline probe; repeated cursor gaps become counted scan failures; failure counter resets only after successful scan; verified conversation lease suppresses redundant reopen polling while router owns UI.
          REPORT
          cat /tmp/059-artifact-meta.txt >> 060-verification-report.txt

      - name: Baseline 059 compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 059 compile: PASS' >> 060-verification-report.txt

