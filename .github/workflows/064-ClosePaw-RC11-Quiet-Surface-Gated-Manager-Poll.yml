name: 064 - ClosePaw RC11 Quiet Surface-Gated Manager Poll
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 063 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='063-ClosePaw-RC11-verified-full-source'
          rm -rf /tmp/063-source /tmp/063-normalized /tmp/063-artifact.zip /tmp/063-list.json
          mkdir -p /tmp/063-source
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/063-list.json
          python3 - <<'PYMETA'
          import json
          d=json.load(open('/tmp/063-list.json'))
          name='063-ClosePaw-RC11-verified-full-source'
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches:
              raise SystemExit('verified 063 full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          open('/tmp/063-artifact-id','w').write(str(chosen['id']))
          open('/tmp/063-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('063 artifact',chosen['id'],chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/063-artifact-id)"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/063-artifact.zip
          unzip -q /tmp/063-artifact.zip -d /tmp/063-source
          MANIFEST="$(find /tmp/063-source -type f -name '063-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '063 source manifest missing' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/063-source' ]; then
            mkdir -p /tmp/063-normalized
            cp -a "$ROOT"/. /tmp/063-normalized/
            rm -rf /tmp/063-source
            mv /tmp/063-normalized /tmp/063-source
          fi
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/063-source')
          manifest=json.loads((root/'063-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'063 source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          build=(root/'app/build.gradle.kts').read_text(); strings=(root/'app/src/main/res/values/strings.xml').read_text()
          assert 'versionNameSuffix = "-rc11-c063"' in build
          assert 'ClosePaw RC11 063' in strings
          print('verified 063 source identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/063-source/ ./
          cp 063-postpatch-source-manifest.json 064-baseline-source-manifest.json
          cat > 064-verification-report.txt <<'REPORT'
          ClosePaw RC11 064 verification report
          Baseline: verified 063 full-source artifact.
          c063 device evidence: baseline capture PASS using accessibility-grounded response; unchanged scans initially PASS; later repeated polling re-entered exact-copy/history machinery and produced a cursor gap. No route had yet been dispatched.
          064 scope: make steady-state manager polling observational and visually quiet: stable surface fingerprint short-circuit before Copy/history scan, generation/unstable-surface deferral, and no scroll-to-bottom when exact cursor was found without any backward scroll.
          REPORT
          cat /tmp/063-artifact-meta.txt >> 064-verification-report.txt

      - name: Baseline 063 clean compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 063 clean compile: PASS' >> 064-verification-report.txt

      - name: Apply isolated 064 quiet-poll patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path

          o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt')
          s=o.read_text()
          old='''                // Accessibility fingerprints are only a cheap change detector. Exact command\n                // authority always comes from a positive ChatGPT Copy-response receipt.\n                val surfaceHash = ui.assistantMessageFingerprints().lastOrNull()\n\n                // First sight of a manager chat establishes a baseline and NEVER executes old\n'''
          new='''                // Accessibility fingerprints are a non-authoritative change detector only.\n                // They may suppress work when unchanged, but can never authorize a command.\n                // This keeps the steady-state router visually quiet: no Copy click and no history\n                // scrolling every poll when the manager surface has not changed.\n                if (ui.isGenerating()) {\n                    trace("MANAGER_SCAN_DEFER_GENERATING", "project=${project.projectId}")\n                    return\n                }\n                val surfaceHashA = ui.assistantMessageFingerprints().lastOrNull()\n                delay(300)\n                if (ui.isGenerating()) {\n                    trace("MANAGER_SCAN_DEFER_GENERATING", "project=${project.projectId}")\n                    return\n                }\n                val surfaceHashB = ui.assistantMessageFingerprints().lastOrNull()\n                if (surfaceHashA != surfaceHashB) {\n                    trace("MANAGER_SURFACE_UNSTABLE", "project=${project.projectId}")\n                    return\n                }\n                val surfaceHash = surfaceHashB\n\n                if (store.isManagerCursorInitialized(project.projectId)) {\n                    val priorSurfaceHash = store.managerSurfaceCursor(project.projectId)\n                    if (surfaceHash == null) {\n                        error("Manager surface fingerprint unavailable")\n                    }\n                    if (priorSurfaceHash != null && surfaceHash == priorSurfaceHash) {\n                        managerFailureByProject.remove(project.projectId)\n                        trace("MANAGER_SCAN_UNCHANGED", "project=${project.projectId}|surface=true")\n                        return\n                    }\n                }\n\n                // First sight of a manager chat establishes a baseline and NEVER executes old\n'''
          if s.count(old)!=1:
              raise SystemExit(f'orchestrator surface anchor mismatch count={s.count(old)}')
          s=s.replace(old,new,1)
          o.write_text(s)

          a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt')
          t=a.read_text()
          old='''        } finally {\n            // Manager scanning is observational. Restore the normal latest-message surface\n            // before any route execution takes physical UI ownership.\n            scrollToBottom(maxBackwardScrolls + 3)\n        }\n    }\n\n    fun isGenerating(): Boolean'''
          new='''        } finally {\n            // Do not synthesize scrolls in the common case where the exact cursor was already\n            // visible. Restore the latest-message surface only if this scan actually moved back.\n            if (scrolls > 0) scrollToBottom(maxBackwardScrolls + 3)\n        }\n    }\n\n    fun isGenerating(): Boolean'''
          if t.count(old)!=1:
              raise SystemExit(f'copy-scan finally anchor mismatch count={t.count(old)}')
          t=t.replace(old,new,1)
          a.write_text(t)

          build=Path('app/build.gradle.kts'); b=build.read_text()
          old='versionNameSuffix = "-rc11-c063"'; new='versionNameSuffix = "-rc11-c064"'
          if b.count(old)!=1: raise SystemExit(f'version anchor mismatch count={b.count(old)}')
          build.write_text(b.replace(old,new,1))

          strings=Path('app/src/main/res/values/strings.xml'); x=strings.read_text()
          old='ClosePaw RC11 063'; new='ClosePaw RC11 064'
          if x.count(old)!=1: raise SystemExit(f'label anchor mismatch count={x.count(old)}')
          strings.write_text(x.replace(old,new,1))
          print('064 quiet surface-gated poll patch: PASS')
          PYPATCH
          git diff --check
          echo '064 isolated quiet-poll patch applied: PASS' >> 064-verification-report.txt

      - name: Verify 064 scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCOPE'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('064-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'064 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')
          Path('064-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('064-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('064-postpatch-manifest-sha256.txt').write_text(sha+'  064-postpatch-source-manifest.json\n')

          o=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          a=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          checks={
              'surface cursor read exists': 'store.managerSurfaceCursor(project.projectId)' in o,
              'surface unchanged fast path': 'MANAGER_SCAN_UNCHANGED' in o and '|surface=true' in o,
              'generation defer': 'MANAGER_SCAN_DEFER_GENERATING' in o,
              'surface stability double sample': 'surfaceHashA' in o and 'surfaceHashB' in o and 'MANAGER_SURFACE_UNSTABLE' in o,
              'exact protocol authority retained': 'copyAssistantResponsesAfter(cursorHash = cursor)' in o,
              'bounded failure retained': 'MAX_CONSECUTIVE_MANAGER_SCAN_FAILURES = 3' in o and 'MANAGER_SCAN_FAIL_CLOSED' in o,
              'no unnecessary scan restore scroll': 'if (scrolls > 0) scrollToBottom(maxBackwardScrolls + 3)' in a,
              '063 grounded capture retained': 'responseCaptureDiagnosticsV63' in a and 'accessibility-grounded' in a,
              'version 064': 'versionNameSuffix = "-rc11-c064"' in Path('app/build.gradle.kts').read_text(),
              'label 064': 'ClosePaw RC11 064' in Path('app/src/main/res/values/strings.xml').read_text(),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f'064 invariant audit failed: {bad}')
          print('064 scope/invariant audit: PASS',sha)
          with Path('064-verification-report.txt').open('a') as f:
              f.write(f'064 postpatch source manifest SHA-256: {sha}\n')
          PYSCOPE

      - name: Full clean compile tests and assemble 064
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '064 clean compile + full unit tests + assemble: PASS' >> 064-verification-report.txt

      - name: Verify post-test source identity and APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('064-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected: raise SystemExit('064 production source changed during build/tests')
          print('064 post-test source identity: PASS')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '064 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 064-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 064-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c064'" 064-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 064'" 064-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 064-apksigner.txt
          sha256sum "$APK" > 064-apk-sha256.txt
          cat >> 064-verification-report.txt <<'REPORT'
          064 CI build/test/source/APK gates: PASS.
          Device acceptance first gate: ROUTER START -> baseline/lease -> at least 45 seconds visually quiet with repeated MANAGER_SCAN_UNCHANGED|surface=true and no Copy/history scroll loop. Then execute 00->12->00, 00->04->00, duplicate/no-replay, runtime agent add.
          REPORT

      - name: Prepare 064 verified full-source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/064-verified-source
          mkdir -p /tmp/064-verified-source
          rsync -a --exclude='.git' --exclude='.github' --exclude='app/build' ./ /tmp/064-verified-source/

      - name: Upload 064 verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 064-ClosePaw-RC11-verification-proof
          path: |
            064-verification-report.txt
            064-baseline-source-manifest.json
            064-postpatch-source-manifest.json
            064-postpatch-manifest-sha256.txt
            064-apk-badging.txt
            064-apksigner.txt
            064-apk-sha256.txt

      - name: Upload 064 verified full source
        uses: actions/upload-artifact@v4
        with:
          name: 064-ClosePaw-RC11-verified-full-source
          path: /tmp/064-verified-source

      - name: Upload 064 APK
        uses: actions/upload-artifact@v4
        with:
          name: 064-ClosePaw-RC11-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload 064 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 064-ClosePaw-RC11-failure-evidence
          if-no-files-found: ignore
          path: |
            064-verification-report.txt
            064-baseline-source-manifest.json
            064-postpatch-source-manifest.json
            app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt
            app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt
