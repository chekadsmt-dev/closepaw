name: Build ClosePaw Adaptive Engine v7.1

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Adaptive v7 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-closepaw-adaptive-v7.yml')
          if not workflow.exists():
              raise SystemExit(
                  'Missing required base workflow: build-closepaw-adaptive-v7.yml'
              )

          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == marker
              )
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []
              for line in lines[run_idx + 1:]:
                  if line.strip() and (
                      len(line) - len(line.lstrip())
                  ) < body_indent:
                      break
                  body.append(
                      '' if not line.strip()
                      else line[body_indent:]
                  )

              result = subprocess.run(
                  ['bash'],
                  input='\n'.join(body) + '\n',
                  text=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f'Base step failed: {step_name}'
                  )

          run_step('Apply Brain Return v6.4 source')
          run_step('Apply Adaptive Execution Engine v7')
          print('ADAPTIVE V7 SOURCE: PASS')
          PY

      - name: Apply v7.1 deterministic chat-search fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v71_patch.py
          python3 -m py_compile /tmp/v71_patch.py
          python3 /tmp/v71_patch.py

      - name: Patch side-by-side identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text(encoding='utf-8')
          old = 'applicationIdSuffix = ".smt"'
          if old not in s:
              raise SystemExit('applicationIdSuffix anchor missing')
          s = s.replace(
              old,
              'applicationIdSuffix = ".adaptivev71"',
              1,
          )
          if 'versionNameSuffix = "-smt"' in s:
              s = s.replace(
                  'versionNameSuffix = "-smt"',
                  'versionNameSuffix = "-adaptive-v7.1"',
                  1,
              )
          gradle.write_text(s, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s, count = re.subn(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">ClosePaw Adaptive v7.1</string>',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('app_name anchor missing')
          strings.write_text(s, encoding='utf-8')
          print('IDENTITY: PASS')
          PY

      - name: Gate 1 - T5 deterministic navigation contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          start = s.index(
              '    private suspend fun searchExactChatV7('
          )
          end = s.index(
              '    private suspend fun navigateExactChatV7(',
              start,
          )
          body = s[start:end]

          checks = [
              'if (!isSidebarSnapshot(sidebar))',
              '"Search"',
              '"Chats"',
              'ensureChatSurfaceV7(platform)',
              'setDedicatedChatSearchTextV7(platform, title)',
              'clickTextExact(platform, title',
              'Exact target chat absent from bounded chat-search results',
          ]
          missing = [x for x in checks if x not in body]
          if missing:
              raise SystemExit(
                  'T5 contract missing: ' + ', '.join(missing)
              )

          if 'clickTextContains(platform, title' in body:
              raise SystemExit(
                  'Fuzzy target matching reintroduced'
              )

          print('GATE 1 T5 navigation contract: PASS')
          PY

      - name: Gate 2 - preserve v7 architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          checks = [
              'planQueue.addAll(plan.actions)',
              'V7_MAX_BRAIN_PER_STATE = 1',
              'rememberRouteStrategyV7',
              'Bounded recovery stopped',
              'captureBrainExcursionFrame',
              'restoreAfterBrainExcursion',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(
                  'v7 regression: ' + ', '.join(missing)
              )

          print('GATE 2 v7 architecture preserved: PASS')
          PY

      - name: Gate 3 - compile Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Gate 4 - assemble APK
        run: ./gradlew assembleDebug

      - name: Gate 5 - APK integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path(
              'app/build/outputs/apk/debug/app-debug.apk'
          )
          if not apk.exists():
              raise SystemExit('APK missing')
          if apk.stat().st_size < 1_000_000:
              raise SystemExit('APK unexpectedly small')

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for required in [
                  'AndroidManifest.xml',
                  'classes.dex',
                  'resources.arsc',
              ]:
                  if required not in names:
                      raise SystemExit('APK missing ' + required)
              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)

          print(
              f'GATE 5 APK integrity: PASS '
              f'({apk.stat().st_size} bytes)'
          )
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Adaptive-v7.1-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
