name: Build ClosePaw Adaptive Engine v7

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Brain Return v6.4 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-closepaw-brain-return-v6-4.yml')
          if not workflow.exists():
              raise SystemExit('Missing required base workflow: build-closepaw-brain-return-v6-4.yml')

          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []

              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  body.append('' if not line.strip() else line[body_indent:])

              result = subprocess.run(
                  ['bash'],
                  input='\n'.join(body) + '\n',
                  text=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f'Base step failed: {step_name}')

          run_step('Apply Brain Return v6.3 source')
          run_step('Apply Brain Return v6.4 runtime fix')
          print('V6.4 SOURCE: PASS')
          PY

      - name: Apply Adaptive Execution Engine v7
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/closepaw_v7_patch.py
          python3 -m py_compile /tmp/closepaw_v7_patch.py
          python3 /tmp/closepaw_v7_patch.py

      - name: Patch side-by-side identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')

          old = 'applicationIdSuffix = ".smt"'
          if old not in text:
              raise SystemExit('applicationIdSuffix anchor missing')

          text = text.replace(
              old,
              'applicationIdSuffix = ".adaptivev7"',
              1,
          )

          if 'versionNameSuffix = "-smt"' in text:
              text = text.replace(
                  'versionNameSuffix = "-smt"',
                  'versionNameSuffix = "-adaptive-v7"',
                  1,
              )

          gradle.write_text(text, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s, count = re.subn(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">ClosePaw Adaptive v7</string>',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('app_name anchor missing')

          strings.write_text(s, encoding='utf-8')
          print('IDENTITY: PASS')
          PY

      - name: Gate 1 - architecture invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          checks = [
              'V7_MAX_BRAIN_CALLS = 16',
              'V7_MAX_BRAIN_PER_STATE = 1',
              'planQueue.addAll(plan.actions)',
              'navigateExactChatV7',
              'setDedicatedChatSearchTextV7',
              'ensureChatSurfaceV7',
              'rememberRouteStrategyV7',
              'Bounded recovery stopped',
              'Brain roundtrip',
              'AUTO_RETURN_FAILURES: 0',
              'NEVER include actions for leaving Brain',
          ]

          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(
                  'Architecture invariant failure: ' +
                  ', '.join(missing)
              )

          start = s.index('    private suspend fun processTask(')
          end = s.index('    private fun inferGoalValueV7', start)
          process = s[start:end]

          forbidden = [
              'repeat(MAX_BRAIN_TURNS)',
              'turnIndex + 1',
          ]
          bad = [x for x in forbidden if x in process]
          if bad:
              raise SystemExit(
                  'Old Brain-first loop remains: ' +
                  ', '.join(bad)
              )

          print('GATE 1 architecture invariants: PASS')
          PY

      - name: Gate 2 - test contract invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          contracts = {
              'T1 local completion':
                  'declaredCurrentChat != null',
              'T2 Brain roundtrip':
                  'isBrainRoundTripOnlyV7',
              'T3 exact checkpoint':
                  'captureBrainExcursionFrame',
              'T4 plan queue':
                  'planQueue.removeAt(0)',
              'T5 motor memory':
                  'rememberedRouteStrategyV7',
              'T6 bounded not-found':
                  'Exact target chat absent from bounded chat-search results',
              'T7 Chat/Work guard':
                  'selectedLabels.any { it == "work" }',
          }

          failed = [
              name for name, needle in contracts.items()
              if needle not in s
          ]
          if failed:
              raise SystemExit(
                  'Test-contract invariant failure: ' +
                  ', '.join(failed)
              )

          print('GATE 2 test contracts: PASS')
          PY

      - name: Gate 3 - Kotlin lexical structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          triple = '"' * 3
          state = 'code'
          escape = False
          stack = []
          pairs = {'}':'{', ')':'(', ']':'['}
          i = 0

          while i < len(s):
              c = s[i]
              n = s[i + 1] if i + 1 < len(s) else ''

              if state == 'code':
                  if s[i:i+3] == triple:
                      state = 'triple'
                      i += 2
                  elif c == '"':
                      state = 'string'
                  elif c == "'":
                      state = 'char'
                  elif c == '/' and n == '/':
                      state = 'line'
                      i += 1
                  elif c == '/' and n == '*':
                      state = 'block'
                      i += 1
                  elif c in '{([':
                      stack.append(c)
                  elif c in '})]':
                      if not stack or stack[-1] != pairs[c]:
                          raise SystemExit(f'Bracket mismatch at {i}')
                      stack.pop()

              elif state == 'triple':
                  if s[i:i+3] == triple:
                      state = 'code'
                      i += 2

              elif state == 'string':
                  if escape:
                      escape = False
                  elif c == '\\':
                      escape = True
                  elif c == '"':
                      state = 'code'

              elif state == 'char':
                  if escape:
                      escape = False
                  elif c == '\\':
                      escape = True
                  elif c == "'":
                      state = 'code'

              elif state == 'line':
                  if c == '\n':
                      state = 'code'

              elif state == 'block':
                  if c == '*' and n == '/':
                      state = 'code'
                      i += 1

              i += 1

          if state != 'code' or stack:
              raise SystemExit(
                  f'Lexical invalid: state={state} stack={stack[-8:]}'
              )

          print('GATE 3 Kotlin lexical structure: PASS')
          PY

      - name: Gate 4 - compile Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Gate 5 - assemble APK
        run: ./gradlew assembleDebug

      - name: Gate 6 - APK integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('app/build/outputs/apk/debug/app-debug.apk')

          if not apk.exists():
              raise SystemExit('APK missing')

          if apk.stat().st_size < 1_000_000:
              raise SystemExit('APK unexpectedly small')

          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())

              for required in [
                  'AndroidManifest.xml',
                  'classes.dex',
                  'resources.arsc',
              ]:
                  if required not in names:
                      raise SystemExit('APK missing ' + required)

              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)

          print(
              'GATE 6 APK integrity: PASS '
              f'({apk.stat().st_size} bytes)'
          )
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Adaptive-v7-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
