name: 056 - ClosePaw RC11 Authoritative Stop + Cancellation Barrier

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 054 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID='10344837628'
          EXPECTED_RUN='34836436419'
          EXPECTED_DIGEST='sha256:00e6c0241b5ac3a8623eebaf5cd352901b9f43edc073f9b8fa80df8c0b15a7b2'
          EXPECTED_MANIFEST_SHA='9790dc574c1c7c9ee7fd9276559f3d8e8275ad04080051819252e5c9505c9508'
          rm -rf /tmp/054-source /tmp/054-artifact.zip /tmp/054-meta.json
          mkdir -p /tmp/054-source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            -o /tmp/054-meta.json
          python3 - <<'PYMETA'
          import json
          d=json.load(open('/tmp/054-meta.json'))
          if d.get('expired'): raise SystemExit('054 Source of Truth artifact expired')
          if d.get('name')!='054-ClosePaw-RC11-verified-full-source': raise SystemExit(f"wrong artifact name: {d.get('name')}")
          if d.get('digest')!='sha256:00e6c0241b5ac3a8623eebaf5cd352901b9f43edc073f9b8fa80df8c0b15a7b2': raise SystemExit(f"wrong artifact digest: {d.get('digest')}")
          if str((d.get('workflow_run') or {}).get('id'))!='34836436419': raise SystemExit('wrong source run')
          print('054 artifact identity: PASS')
          PYMETA
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/054-artifact.zip
          test "$(sha256sum /tmp/054-artifact.zip | awk '{print $1}')" = '00e6c0241b5ac3a8623eebaf5cd352901b9f43edc073f9b8fa80df8c0b15a7b2'
          unzip -q /tmp/054-artifact.zip -d /tmp/054-source
          MANIFEST="$(find /tmp/054-source -type f -name '054-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '054 manifest missing' >&2; exit 1; }
          [ "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA" ] || { echo '054 manifest identity mismatch' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/054-source' ]; then
            rm -rf /tmp/054-normalized && mkdir -p /tmp/054-normalized
            cp -a "$ROOT"/. /tmp/054-normalized/
            rm -rf /tmp/054-source
            mv /tmp/054-normalized /tmp/054-source
          fi
          echo 'Exact verified 054 Source of Truth restored: PASS'

      - name: Verify and activate exact 054 Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/054-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test "$(sha256sum /tmp/054-source/054-postpatch-source-manifest.json | awk '{print $1}')" = '9790dc574c1c7c9ee7fd9276559f3d8e8275ad04080051819252e5c9505c9508'
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/054-source/. ./
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads(Path('054-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sha(p)
          if current != expected:
              missing=sorted(set(expected)-set(current)); added=sorted(set(current)-set(expected)); changed=sorted(k for k in set(expected)&set(current) if expected[k]!=current[k])
              raise SystemExit(f'054 manifest mismatch missing={missing[:8]} added={added[:8]} changed={changed[:8]}')
          Path('056-verification-report.txt').write_text(
              'ClosePaw RC11 056 verification report\n'
              'Base: exact verified 054 full-source artifact id=10344837628 run=34836436419.\n'
              'Observed c055 runtime: visible red Close during an in-flight Primary turn produced no USER_STOP diagnostic and model requests continued to normal HTTP 200 completion.\n'
              'Root route defect: Error-mode Close is routed through onDismissError, not onStop; previous 055 stop-only routing could never catch that surface.\n'
              'V56 scope: authoritative Main/Overlay Stop plus Error/Close Hybrid-first routing, execution-epoch invalidation, queue drain, single-owner cancellation barrier, and restart only after cancelled-worker cleanup.\n'
              'Frozen: V43/V45/V46/V47/V50/V51/V52/V53, RC8, RC11 action transaction, V32 transport/timeouts, V54 cancellable OkHttp bridge, AccessibilityPlatform, Brain path, Memory, Capsule render/state semantics.\n', encoding='utf-8')
          print('054 exact baseline: PASS')
          PYBASE

      - name: Baseline 054 clean compile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 054 clean compile: PASS' >> 056-verification-report.txt

      - name: Freeze protected correctness, HTTP cancellation, Brain, Memory, and capsule semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE'
          from pathlib import Path
          import hashlib,json
          def h(b): return hashlib.sha256(b).hexdigest()
          def sf(p): return h(Path(p).read_bytes())
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          def reg(a,b):
              s=eng.find(a); e=eng.find(b,s)
              if s<0 or e<0: raise SystemExit(f'protected region missing: {a} -> {b}')
              return h(eng[s:e].encode())
          protected={
            'rc8_restore':reg('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded('),
            'durable_transaction':reg('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9('),
            'v33_validation':reg('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest('),
            'brain_restore':reg('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings'),
            'brain_send':reg('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9('),
            'navigator_v43':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt'),
            'grammar_v43':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt'),
            'prereq_v45':sf('app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt'),
            'causal_v46':sf('app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt'),
            'work_surface_v47':sf('app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt'),
            'event_v50':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt'),
            'event_v51':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt'),
            'causal_title_v52':sf('app/src/main/kotlin/ai/closepaw/app/CausalWindowTitleV52.kt'),
            'overflow_v53':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicOverflowNavigatorV53.kt'),
            'cancellable_primary_v54':sf('app/src/main/kotlin/ai/closepaw/app/CancellablePrimaryCallV54.kt'),
            'rc11':sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
            'transport_v32':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
            'accessibility_platform':sf('app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt'),
            'capsule_control_bar':sf('app/src/main/kotlin/ai/closepaw/ui/capsule/surface/CapsuleControlBar.kt'),
            'capsule_render_spec':sf('app/src/main/kotlin/ai/closepaw/ui/overlay/model/CapsuleRenderSpec.kt'),
            'capsule_state_holder':sf('app/src/main/kotlin/ai/closepaw/ui/overlay/CapsuleStateHolder.kt'),
            'memory_recaller':sf('app/src/main/kotlin/ai/closepaw/memory/MemoryRecaller.kt'),
            'memory_schema':sf('app/src/main/kotlin/ai/closepaw/memory/MemorySchema.kt'),
            'memory_store':sf('app/src/main/kotlin/ai/closepaw/memory/MemoryStore.kt'),
            'remember_tool':sf('app/src/main/kotlin/ai/closepaw/tool/impl/RememberExperienceTool.kt'),
          }
          Path('056-baseline-critical-hashes.json').write_text(json.dumps(protected,indent=2,sort_keys=True)+'\n')
          print('056 frozen surfaces captured: PASS')
          PYFREEZE

