      - name: Verify isolation and architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import hashlib,json
          allowed={
            'app/build.gradle.kts',
            'app/src/main/kotlin/ai/closepaw/app/ClosePawKernelBridgeV72.kt',
            'app/src/main/kotlin/ai/closepaw/kernel/DelegationGatewayV73.kt',
            'app/src/main/kotlin/ai/closepaw/kernel/ExecutionPolicyV72.kt',
            'app/src/main/kotlin/ai/closepaw/kernel/NodeGatewayContractV72.kt',
            'app/src/main/kotlin/ai/closepaw/kernel/OperationJournalV72.kt',
            'app/src/main/kotlin/ai/closepaw/kernel/TaskConstellationV72.kt',
            'app/src/main/kotlin/ai/closepaw/kernel/UfoGalaxyInteropV73.kt',
            'app/src/main/kotlin/ai/closepaw/kernel/UnifiedAgentKernelV72.kt',
            'app/src/main/res/values/strings.xml',
            'app/src/test/kotlin/ai/closepaw/app/ClosePawKernelBridgeV72Test.kt',
            'app/src/test/kotlin/ai/closepaw/kernel/DelegationGatewayV73Test.kt',
            'app/src/test/kotlin/ai/closepaw/kernel/ExecutionPolicyV72Test.kt',
            'app/src/test/kotlin/ai/closepaw/kernel/NodeGatewayContractV72Test.kt',
            'app/src/test/kotlin/ai/closepaw/kernel/OperationJournalV72Test.kt',
            'app/src/test/kotlin/ai/closepaw/kernel/TaskConstellationV72Test.kt',
            'app/src/test/kotlin/ai/closepaw/kernel/UfoGalaxyInteropV73Test.kt',
            'app/src/test/kotlin/ai/closepaw/kernel/UnifiedAgentKernelV72Test.kt',
          }
          base=json.loads(Path('073-baseline-source-manifest.json').read_text()); cur={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  cur[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed={k for k in set(base)|set(cur) if base.get(k)!=cur.get(k)}
          assert changed==allowed, (sorted(changed-allowed),sorted(allowed-changed))
          Path('073-postpatch-source-manifest.json').write_text(json.dumps(cur,indent=2,sort_keys=True)+'\n')
          assert hashlib.sha256(Path('073-postpatch-source-manifest.json').read_bytes()).hexdigest()=='578c3ebfef244a8ea0598f8df1497793987d311d518fa3fc2fffcb34c95a93ea'
          assert hashlib.sha256(Path('docs/MERGE_PROVENANCE_073.md').read_bytes()).hexdigest()=='44fc0dd5508512719dcc236eac6635efdb68071a331b08b6885035ff358c5d8a'

          kernel=Path('app/src/main/kotlin/ai/closepaw/kernel/UnifiedAgentKernelV72.kt').read_text()
          journal=Path('app/src/main/kotlin/ai/closepaw/kernel/OperationJournalV72.kt').read_text()
          dag=Path('app/src/main/kotlin/ai/closepaw/kernel/TaskConstellationV72.kt').read_text()
          gateway=Path('app/src/main/kotlin/ai/closepaw/kernel/NodeGatewayContractV72.kt').read_text()
          delegation=Path('app/src/main/kotlin/ai/closepaw/kernel/DelegationGatewayV73.kt').read_text()
          galaxy=Path('app/src/main/kotlin/ai/closepaw/kernel/UfoGalaxyInteropV73.kt').read_text()
          bridge=Path('app/src/main/kotlin/ai/closepaw/app/ClosePawKernelBridgeV72.kt').read_text()
          assert all(x in kernel for x in ('fun read(','fun act(','fun delegate(','exactly one action is allowed per observation boundary'))
          assert 'canBlindReplay(): Boolean = false' in journal
          assert all(x in gateway for x in ('ExecutionChannelV72.API','ExecutionChannelV72.SHELL','ExecutionChannelV72.DOM','ExecutionChannelV72.ACCESSIBILITY','ExecutionChannelV72.VISION'))
          assert all(x in delegation for x in ('previousAcceptedSequence','FRESH_OBSERVATION_REQUIRED','fun revalidate('))
          assert all(x in galaxy for x in ('GalaxyConstellationSnapshotV73','fun export(','fun import(','identityMatches'))
          assert all(x in dag for x in ('dependenciesSnapshot','would create a cycle'))
          assert 'FreshUiObservationProofV72' in bridge
          merged='\n'.join((kernel,journal,dag,gateway,delegation,galaxy,bridge))
          assert 'import microsoft' not in merged.lower()
          assert 'import opencyvis' not in merged.lower()
          assert 'SMT' not in merged and '00 —' not in merged

          for p in (
            'app/src/main/kotlin/ai/closepaw/app/AgentService.kt',
            'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt',
            'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorProtocolV58.kt',
            'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
            'app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt',
            'app/src/main/kotlin/ai/closepaw/app/ActionLifecycleV57.kt'):
              assert base.get(p)==cur.get(p), f'frozen physical surface changed: {p}'
          PYAUDIT
          echo '073 isolation + architecture invariants: PASS' >> 073-verification-report.txt

      - name: Compile, unit test and assemble
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin testDebugUnitTest assembleDebug --stacktrace --no-daemon --no-configuration-cache
          echo '073 compile + unit tests + assemble: PASS' >> 073-verification-report.txt

      - name: Verify APK and source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          e=json.loads(Path('073-postpatch-source-manifest.json').read_text()); a={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  a[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert a==e
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK" > 073-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 073-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c073'" 073-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 073'" 073-apk-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > 073-apksigner.txt
          sha256sum "$APK" > 073-apk-sha256.txt
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo '073 APK/source identity: PASS' >> 073-verification-report.txt

      - name: Prepare verified full source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/073-source && mkdir /tmp/073-source
          rsync -a --exclude='.git' --exclude='.github' --exclude='app/build' ./ /tmp/073-source/
          test "$(sha256sum /tmp/073-source/073-postpatch-source-manifest.json | awk '{print $1}')" = '578c3ebfef244a8ea0598f8df1497793987d311d518fa3fc2fffcb34c95a93ea'

      - name: Upload verification proof
        uses: actions/upload-artifact@v4
        with:
          name: 073-ClosePaw-RC11-verification-proof
          path: |
            073-verification-report.txt
            073-baseline-source-manifest.json
            073-postpatch-source-manifest.json
            073-apk-badging.txt
            073-apksigner.txt
            073-apk-sha256.txt
            073-REQUIREMENTS-AUDIT.txt
            docs/MERGE_PROVENANCE_072.md
            docs/MERGE_PROVENANCE_073.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified full source
        uses: actions/upload-artifact@v4
        with:
          name: 073-ClosePaw-RC11-verified-full-source
          path: /tmp/073-source/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 073-ClosePaw-RC11-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
