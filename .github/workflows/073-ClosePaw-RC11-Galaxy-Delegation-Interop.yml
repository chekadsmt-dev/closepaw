name: 073 - ClosePaw RC11 Galaxy Delegation Interop
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 071 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=10455999924
          DIGEST='sha256:23b398438cb26f57169c5442d2ffcbbfd37408ed6d7bb732e90ce9eb47fa5c12'
          MANIFEST_SHA='a20d7991518748f38b45e7dc8f3fbc42feb958f1cb7446e97603a67a1ea495b0'
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" -o /tmp/a.json
          python3 - <<'PYMETA'
          import json
          a=json.load(open('/tmp/a.json'))
          assert a['name']=='071-ClosePaw-RC11-verified-full-source'
          assert not a['expired']
          assert a['digest']=='sha256:23b398438cb26f57169c5442d2ffcbbfd37408ed6d7bb732e90ce9eb47fa5c12'
          PYMETA
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" -o /tmp/071.zip
          rm -rf /tmp/src071 && mkdir /tmp/src071 && unzip -q /tmp/071.zip -d /tmp/src071
          test "$(sha256sum /tmp/src071/071-postpatch-source-manifest.json | awk '{print $1}')" = "$MANIFEST_SHA"
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          r=Path('/tmp/src071'); expected=json.loads((r/'071-postpatch-source-manifest.json').read_text())
          actual={}
          for p in sorted((r/'app').rglob('*')):
              if p.is_file() and not p.relative_to(r).as_posix().startswith('app/build/'):
                  actual[p.relative_to(r).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==expected
          assert 'versionNameSuffix = "-rc11-c071"' in (r/'app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 071' in (r/'app/src/main/res/values/strings.xml').read_text()
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/src071/ ./
          cp 071-postpatch-source-manifest.json 073-baseline-source-manifest.json
          cat > 073-verification-report.txt <<'REPORT'
          ClosePaw RC11 073 Galaxy Delegation Interop
          Baseline: exact verified 071 full-source artifact.
          Includes corrected V72 kernel plus V73 deterministic node delegation and clean-room UFO Galaxy DAG interop.
          Verified 071 physical Android execution surfaces are frozen.
          REPORT

