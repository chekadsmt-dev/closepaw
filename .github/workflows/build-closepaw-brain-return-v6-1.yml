name: Build ClosePaw Brain Return v6.1

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Brain Return v6 base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/build-closepaw-brain-return-v6.yml')
          if not workflow.exists():
              raise SystemExit('Missing required base workflow: build-closepaw-brain-return-v6.yml')

          lines = workflow.read_text(encoding='utf-8').splitlines()

          def run_step(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(lines) if line.strip() == marker)
              run_idx = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == 'run: |'
              )
              body_indent = len(lines[run_idx]) - len(lines[run_idx].lstrip()) + 2
              body = []
              for line in lines[run_idx + 1:]:
                  if line.strip() and (len(line) - len(line.lstrip())) < body_indent:
                      break
                  body.append('' if not line.strip() else line[body_indent:])
              result = subprocess.run(
                  ['bash'],
                  input='\n'.join(body) + '\n',
                  text=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f'Base step failed: {step_name}')

          run_step('Apply stable Hybrid Agent v5.5')
          run_step('Apply Brain Excursion Manager v6')
          print('V6 BASE: PASS')
          PY

      - name: Apply Brain Return v6.1 fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_v61.py
          python3 -m py_compile /tmp/patch_v61.py
          python3 /tmp/patch_v61.py

      - name: Patch side-by-side identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          old = 'applicationIdSuffix = ".smt"'
          if old not in text:
              raise SystemExit('applicationIdSuffix anchor missing')
          text = text.replace(old, 'applicationIdSuffix = ".brainreturn61"', 1)
          if 'versionNameSuffix = "-smt"' in text:
              text = text.replace(
                  'versionNameSuffix = "-smt"',
                  'versionNameSuffix = "-brain-return-v6.1"',
                  1,
              )
          gradle.write_text(text, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text(encoding='utf-8')
          s, n = re.subn(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">ClosePaw Brain Return v6.1</string>',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('app_name anchor missing')
          strings.write_text(s, encoding='utf-8')
          print('IDENTITY: PASS')
          PY

      - name: Gate 1 - false Brain detector regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          brain = s[
              s.index('    private fun isDedicatedBrainSnapshot'):
              s.index('    private fun inferWorkChatTitleFromGoal')
          ]

          forbidden = [
              'normalized.contains("closepaw brain") ||',
              'return normalized.contains("closepaw brain")',
          ]
          bad = [x for x in forbidden if x in brain]
          if bad:
              raise SystemExit('False Brain detector regression: ' + ', '.join(bad))

          for required in [
              'closepaw brain anchor 71d4',
              'closepaw_brain_anchor_71d4',
              'val hasComposer',
              'return hasComposer',
          ]:
              if required not in brain:
                  raise SystemExit('Missing strict Brain detector component: ' + required)

          print('GATE 1 false Brain detector: PASS')
          PY

      - name: Gate 2 - checkpoint restore ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          restore = s[
              s.index('    private suspend fun restoreAfterBrainExcursion'):
              s.index('    private suspend fun restoreSidebarShapeIfNeeded')
          ]

          exact = restore.index('frame.originChatTitle')
          similarity = restore.index('originLooksRestored(platform, frame)')
          if exact >= similarity:
              raise SystemExit('Exact-origin restore is not before similarity restore')

          if 'openConversationDeterministically(platform, exactOrigin)' not in restore:
              raise SystemExit('Exact-origin deterministic reopen missing')

          print('GATE 2 checkpoint restore ordering: PASS')
          PY

      - name: Gate 3 - goal anchor and Brain rejection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path(
              'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt'
          ).read_text(encoding='utf-8')

          checks = [
              'inferWorkChatTitleFromGoal(activeTask?.goal.orEmpty())',
              'current work chat',
              'چت فعلی',
              'if (!frame.originWasBrain && isDedicatedBrainSnapshot(current)) return false',
              'clickTextContains(platform, title, excludeEditable = true)',
              'MAX_BRAIN_TURNS = 80',
              'BRAIN_TIMEOUT_MS = 240_000L',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('Gate 3 missing: ' + ', '.join(missing))

          print('GATE 3 checkpoint semantics: PASS')
          PY

      - name: Gate 4 - compile Kotlin
        run: ./gradlew :app:compileDebugKotlin

      - name: Gate 5 - assemble APK
        run: ./gradlew assembleDebug

      - name: Gate 6 - APK integrity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          if not apk.exists() or apk.stat().st_size < 1_000_000:
              raise SystemExit('APK missing or unexpectedly small')

          with zipfile.ZipFile(apk) as z:
              for required in ['AndroidManifest.xml', 'classes.dex', 'resources.arsc']:
                  if required not in z.namelist():
                      raise SystemExit('APK missing ' + required)
              bad = z.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)

          print('GATE 6 APK integrity: PASS')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-Brain-Return-v6.1-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
