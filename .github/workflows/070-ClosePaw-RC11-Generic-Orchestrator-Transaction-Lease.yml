name: 070 - ClosePaw RC11 Generic Orchestrator Transaction Lease
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 069 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='069-ClosePaw-RC11-verified-full-source'
          EXPECTED_ARTIFACT_DIGEST='sha256:18dbe93b67660985518f2b440ad0b75623b79eb8c0799f7e24db4485053adb2d'
          EXPECTED_MANIFEST_SHA='3f015c11e94ee0e5e463142b19655c50a997151d668c9cbc8feda5a080ea058a'
          export ARTIFACT_NAME EXPECTED_ARTIFACT_DIGEST EXPECTED_MANIFEST_SHA
          rm -rf /tmp/069-source /tmp/069-stage1 /tmp/069-stage2 /tmp/069-artifact.zip /tmp/069-list.json
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/069-list.json
          python3 - <<'PYMETA'
          import json,os
          d=json.load(open('/tmp/069-list.json'))
          name=os.environ['ARTIFACT_NAME']; expected=os.environ['EXPECTED_ARTIFACT_DIGEST']
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches: raise SystemExit('verified 069 full-source artifact not found')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          if chosen.get('digest') != expected:
              raise SystemExit(f'069 artifact digest mismatch: {chosen.get("digest")} != {expected}')
          open('/tmp/069-artifact-id','w').write(str(chosen['id']))
          open('/tmp/069-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('069 artifact identity PASS', chosen['id'], chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/069-artifact-id)"
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/069-artifact.zip
          mkdir -p /tmp/069-stage1
          unzip -q /tmp/069-artifact.zip -d /tmp/069-stage1
          MANIFEST="$(find /tmp/069-stage1 -type f -name '069-postpatch-source-manifest.json' -print -quit)"
          if [ -z "$MANIFEST" ]; then
            mapfile -t NESTED_ZIPS < <(find /tmp/069-stage1 -type f -name '*.zip' -print)
            [ "${#NESTED_ZIPS[@]}" -eq 1 ] || { echo '069 source manifest missing' >&2; exit 1; }
            mkdir -p /tmp/069-stage2
            unzip -q "${NESTED_ZIPS[0]}" -d /tmp/069-stage2
            MANIFEST="$(find /tmp/069-stage2 -type f -name '069-postpatch-source-manifest.json' -print -quit)"
          fi
          [ -n "$MANIFEST" ] || { echo '069 source manifest missing after trusted unwrap' >&2; exit 1; }
          ROOT="$(dirname "$MANIFEST")"
          mkdir -p /tmp/069-source
          cp -a "$ROOT"/. /tmp/069-source/
          ACTUAL_MANIFEST_SHA="$(sha256sum /tmp/069-source/069-postpatch-source-manifest.json | awk '{print $1}')"
          [ "$ACTUAL_MANIFEST_SHA" = "$EXPECTED_MANIFEST_SHA" ] || { echo "069 manifest SHA mismatch: $ACTUAL_MANIFEST_SHA" >&2; exit 1; }
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/069-source')
          manifest=json.loads((root/'069-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current)); added=sorted(set(current)-set(manifest)); changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'069 source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          assert 'versionNameSuffix = "-rc11-c069"' in (root/'app/build.gradle.kts').read_text()
          assert 'ClosePaw RC11 069' in (root/'app/src/main/res/values/strings.xml').read_text()
          print('verified 069 source identity: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/069-source/ ./
          cp 069-postpatch-source-manifest.json 070-baseline-source-manifest.json
          cat > 070-verification-report.txt <<'REPORT'
          ClosePaw RC11 070 verification report
          Baseline: exact verified 069 source, pinned by GitHub artifact digest and source-manifest SHA-256.
          Device evidence from c069: CP068-E2E-04-001 was discovered and physically attempted to agent 04. The route entered SEND_OUTCOME_UNKNOWN. During the durable retry cooldown runnableRoutes() became empty, so the old main loop incorrectly resumed manager scans and stole the ChatGPT UI three times until fail-close.
          070 execution fix: every non-terminal route retains the physical UI transaction lease even while temporarily not runnable. Immediate Send verification uses a deterministic post-send receipt (immutable marker OR cleared exact draft + observed generation). Recovery can prove an earlier send by an already-correlated worker response and capture that response without replay. Worker response capture supports immutable marker + conservative assistant-lane geometry when ChatGPT omits toolbar semantics.
          070 architecture foundation: GenericOrchestrationV70 defines project-agnostic MANAGER/WORKER/EXECUTOR authority and UI_DECISION_REQUEST/UI_DECISION contracts. SMT remains only a runtime seed; no SMT/00 identifier is allowed in the generic orchestration core.
          REPORT
          cat /tmp/069-artifact-meta.txt >> 070-verification-report.txt

      - name: Baseline 069 clean compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 069 clean compile: PASS' >> 070-verification-report.txt

