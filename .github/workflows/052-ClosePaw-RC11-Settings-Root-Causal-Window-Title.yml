name: 052 - ClosePaw RC11 Settings Root and Causal Window Title

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 051 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_NAME='051-ClosePaw-RC11-verified-full-source'
          EXPECTED_ARTIFACT_DIGEST='sha256:0145e6a2b05c89cfe133e29b4f29d3742ac17f70ed8d2c09bef3e89b27853c77'
          EXPECTED_MANIFEST_SHA='844d593a8b4feb051fba17a2ce2ed874c5a36e1b3c63c1d6f6b23dd17ca142fd'
          rm -rf /tmp/051-source /tmp/051-candidate /tmp/051-artifacts.json /tmp/051-candidate.zip
          mkdir -p /tmp/051-source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${EXPECTED_NAME}&per_page=100" \
            -o /tmp/051-artifacts.json
          python3 - <<'PYIDS' > /tmp/051-artifact-ids.txt
          import json
          d=json.load(open('/tmp/051-artifacts.json'))
          expected='sha256:0145e6a2b05c89cfe133e29b4f29d3742ac17f70ed8d2c09bef3e89b27853c77'
          rows=[a for a in d.get('artifacts',[]) if not a.get('expired',False)
                and a.get('name')=='051-ClosePaw-RC11-verified-full-source'
                and a.get('digest')==expected]
          rows.sort(key=lambda a:a.get('created_at',''), reverse=True)
          for a in rows:
              print(f"{a['id']}|{(a.get('workflow_run') or {}).get('id','')}|{a.get('digest','')}")
          PYIDS
          FOUND=''
          FOUND_RUN=''
          while IFS='|' read -r ARTIFACT_ID RUN_ID DIGEST; do
            [ -n "$ARTIFACT_ID" ] || continue
            rm -rf /tmp/051-candidate /tmp/051-candidate.zip
            mkdir -p /tmp/051-candidate
            curl -fsSL -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o /tmp/051-candidate.zip
            unzip -q /tmp/051-candidate.zip -d /tmp/051-candidate
            MANIFEST="$(find /tmp/051-candidate -type f -name '051-postpatch-source-manifest.json' -print -quit)"
            [ -n "$MANIFEST" ] || continue
            SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
            if [ "$SHA" = "$EXPECTED_MANIFEST_SHA" ]; then
              ROOT="$(dirname "$MANIFEST")"
              cp -a "$ROOT"/. /tmp/051-source/
              FOUND="$ARTIFACT_ID"
              FOUND_RUN="$RUN_ID"
              break
            fi
          done < /tmp/051-artifact-ids.txt
          [ -n "$FOUND" ] || { echo 'Exact verified 051 artifact not found' >&2; exit 1; }
          echo "BASELINE_ARTIFACT_ID=$FOUND" >> "$GITHUB_ENV"
          echo "BASELINE_RUN_ID=$FOUND_RUN" >> "$GITHUB_ENV"
          echo "Exact verified 051 artifact id=$FOUND run=$FOUND_RUN"

      - name: Verify and activate exact 051 Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/051-source/app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt
          test -f /tmp/051-source/051-postpatch-source-manifest.json
          test "$(sha256sum /tmp/051-source/051-postpatch-source-manifest.json | awk '{print $1}')" =             '844d593a8b4feb051fba17a2ce2ed874c5a36e1b3c63c1d6f6b23dd17ca142fd'
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/051-source/. ./
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json,os
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected=json.loads(Path('051-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=sha(p)
          if current != expected:
              missing=sorted(set(expected)-set(current))
              added=sorted(set(current)-set(expected))
              changed=sorted(k for k in set(expected)&set(current) if expected[k]!=current[k])
              raise SystemExit(f'051 manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          critical={
            'app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt':'6426c09db272280180bcf4e5d4a794dfa2ea7dacdcae6ee17f2eb3ea23b15c2c',
            'app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt':'d9595d75a141c5c843195878fb13c0f32ab2121cabab65903026fd3b2a189a25',
            'app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt':'945670dd4f8818b10933245a27298dfe0de4b9da590c54f06a9ba4657e11301f',
            'app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt':'b1be3b8953bc0620a921d6e639e68ee1ae4a61952d20a52943da148a3edbee37',
            'app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt':'eed7423a080b1d8b8b8a40ac943f88a62db658c5eb12f9a638fc3974cc938e73',
            'app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt':'683a9f6d8b5c8a676ba00bb9cda4cf954314470afae4a9b2bf1ab3862f6ea47e',
            'app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt':'a75c7ea133c1100e229debf071e0d4063a1c9cb1c3cee3191d2ca4f37f2a5894',
            'app/src/main/kotlin/ai/closepaw/app/AgentService.kt':'db757da5567dd2ccde200291ce7a7c5f0b116a20c75b455a22afcecedea3691d',
            'app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt':'6d2069354b970927dc4729a00355a74e8139f60efadb866e3f9e9b2c020e67b6',
            'app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt':'1e9e9dc2e4625277eb8eecd08792d4ed1e7c2952e374f20745808ba1bbfb7739',
          }
          for p,want in critical.items():
              got=sha(p)
              if got!=want: raise SystemExit(f'051 critical mismatch {p}: {got} != {want}')
          Path('052-verification-report.txt').write_text(
              'ClosePaw RC11 052 verification report\n'
              f'Base: exact verified 051 full-source artifact id={os.getenv("BASELINE_ARTIFACT_ID","")} run={os.getenv("BASELINE_RUN_ID","")}.\n'
              'Runtime evidence: Samsung Default apps can remain the visible active TYPE_APPLICATION window while its accessibility root/package is null and no Settings package-bearing event is emitted. V51 history therefore cannot recover package identity.\n'
              'V52 scope: explicit OPEN_APP com.android.settings uses Android ACTION_SETTINGS to establish top-level Settings before V43 navigation; receipt-continuous active application window title is a narrow null-root causal destination proof after an accepted grounded click.\n'
              'Frozen: V43 navigator, V45 prerequisite ordering, V46 alias rules, V47 WorkSurface, V50/V51 event provenance, RC11 transaction safety, RC8 restore, V32 transport, AccessibilityPlatform, AgentService and all non-Settings generic app launch behavior.\n',
              encoding='utf-8')
          print('052 exact verified 051 baseline: PASS')
          PYBASE

      - name: Baseline 051 clean compile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 051 clean compile: PASS' >> 052-verification-report.txt

      - name: Freeze protected correctness surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFREEZE'
          from pathlib import Path
          import hashlib,json
          def h(b): return hashlib.sha256(b).hexdigest()
          def sf(p): return h(Path(p).read_bytes())
          eng=Path('app/src/main/kotlin/ai/closepaw/app/HybridAgentEngine.kt').read_text()
          def reg(a,b):
              s=eng.find(a); e=eng.find(b,s)
              if s<0 or e<0: raise SystemExit(f'protected region missing: {a} -> {b}')
              return h(eng[s:e].encode())
          protected={
            'rc8_restore':reg('// RC8: only strong identity evidence may authorize a restore-side navigation.','private suspend fun restoreSidebarShapeIfNeeded('),
            'durable_transaction':reg('private suspend fun executeActionTransactionV9(','private fun receiptHistoryLineV9('),
            'v33_validation':reg('private suspend fun requestPrimaryPlanV9(','private fun buildBrainRequest('),
            'brain_restore':reg('private suspend fun restoreAfterBrainExcursion(','private fun configuredBrainV9(): ChatBrainSettings'),
            'brain_send':reg('private suspend fun sendConfiguredBrainMessageV9(','private suspend fun waitForMatchingBrainResponseV9('),
            'navigator_v43':sf('app/src/main/kotlin/ai/closepaw/app/DeterministicUiNavigatorV43.kt'),
            'grammar_v43':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalGrammarV43.kt'),
            'prereq_v45':sf('app/src/main/kotlin/ai/closepaw/app/GoalAppPrerequisiteV45.kt'),
            'causal_v46':sf('app/src/main/kotlin/ai/closepaw/app/CausalDestinationV46.kt'),
            'work_surface_v47':sf('app/src/main/kotlin/ai/closepaw/app/WorkSurfaceV47.kt'),
            'event_v50':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventProvenanceV50.kt'),
            'event_v51':sf('app/src/main/kotlin/ai/closepaw/app/AccessibilityEventHistoryV51.kt'),
            'agent_service':sf('app/src/main/kotlin/ai/closepaw/app/AgentService.kt'),
            'rc11':sf('app/src/main/kotlin/ai/closepaw/app/RC11CorrectnessPolicy.kt'),
            'transport':sf('app/src/main/kotlin/ai/closepaw/app/PrimaryLocalHttpTransportV32.kt'),
            'accessibility_platform':sf('app/src/main/kotlin/ai/closepaw/platform/AccessibilityPlatform.kt'),
            'diagnostics_page':sf('app/src/main/kotlin/ai/closepaw/ui/settings/PermissionsAdvancedSettingsPage.kt'),
            'bridge':sf('tools/termux-bridge/closepaw_bridge.py'),
          }
          Path('052-baseline-critical-hashes.json').write_text(json.dumps(protected,indent=2,sort_keys=True)+'\n')
          print('052 freeze: PASS')
          PYFREEZE

