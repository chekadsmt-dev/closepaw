          echo '059 clean compile + full unit tests + assemble: PASS' >> 059-verification-report.txt

      - name: Verify post-test source identity and APK identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('059-postpatch-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != expected:
              raise SystemExit('059 production source changed during build/tests')
          print('059 post-test source identity: PASS')
          PYPOST
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          [ -n "$APK" ] || { echo '059 APK missing' >&2; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > 059-apk-badging.txt
          grep -q "package: name='ai.closepaw.rc11c058'" 059-apk-badging.txt
          grep -q "versionName='0.1.0-rc11-c059'" 059-apk-badging.txt
          grep -q "application-label:'ClosePaw RC11 059'" 059-apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > 059-apksigner.txt
          sha256sum "$APK" > 059-apk-sha256.txt
          echo "APK=$APK" >> "$GITHUB_ENV"
          cat >> 059-verification-report.txt <<'REPORT'
          059 CI build/test/source/APK gates: PASS.
          Runtime acceptance next: Router START -> manager 00 navigation/baseline only. No ROUTE_TASK is required for the first device test.
          After manager navigation passes: execute one flattened 00 -> worker -> 00 route, then dynamic runtime agent add and duplicate/no-blind-replay.
          REPORT

