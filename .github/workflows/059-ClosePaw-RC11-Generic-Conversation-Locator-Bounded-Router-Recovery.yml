name: 059 - ClosePaw RC11 Generic Conversation Locator + Bounded Router Recovery
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow host repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified 058b-r3 Source of Truth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME='058b-r3-ClosePaw-RC11-verified-full-source'
          EXPECTED_MANIFEST_SHA='4b28bf0b632d89a86386b1f13c38ddccb1a7f66693cf2c3f89f59b79d2b8c7d7'
          rm -rf /tmp/058b-r3-source /tmp/058b-r3-normalized /tmp/058b-r3-artifact.zip /tmp/058b-r3-list.json
          mkdir -p /tmp/058b-r3-source
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            -o /tmp/058b-r3-list.json
          python3 - <<'PYMETA'
          import json
          d=json.load(open('/tmp/058b-r3-list.json'))
          name='058b-r3-ClosePaw-RC11-verified-full-source'
          matches=[a for a in d.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          if not matches:
              available=[(a.get('id'),a.get('name'),a.get('expired'),a.get('digest')) for a in d.get('artifacts',[])[:30]]
              raise SystemExit(f'058b-r3 verified source artifact not found; candidates={available}')
          matches.sort(key=lambda a:a.get('created_at',''), reverse=True)
          chosen=matches[0]
          open('/tmp/058b-r3-artifact-id','w').write(str(chosen['id']))
          open('/tmp/058b-r3-artifact-meta.txt','w').write(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          print('058b-r3 artifact',chosen['id'],chosen.get('digest'))
          PYMETA
          ARTIFACT_ID="$(cat /tmp/058b-r3-artifact-id)"
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/058b-r3-artifact.zip
          unzip -q /tmp/058b-r3-artifact.zip -d /tmp/058b-r3-source
          MANIFEST="$(find /tmp/058b-r3-source -type f -name '058b-postpatch-source-manifest.json' -print -quit)"
          [ -n "$MANIFEST" ] || { echo '058b-r3 source manifest missing' >&2; exit 1; }
          test "$(sha256sum "$MANIFEST" | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA"
          ROOT="$(dirname "$MANIFEST")"
          if [ "$ROOT" != '/tmp/058b-r3-source' ]; then
            mkdir -p /tmp/058b-r3-normalized
            cp -a "$ROOT"/. /tmp/058b-r3-normalized/
            rm -rf /tmp/058b-r3-source
            mv /tmp/058b-r3-normalized /tmp/058b-r3-source
          fi
          python3 - <<'PYBASE'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/058b-r3-source')
          manifest_path=root/'058b-postpatch-source-manifest.json'
          manifest=json.loads(manifest_path.read_text())
          current={}
          for p in sorted((root/'app').rglob('*')):
              if p.is_file() and '/build/' not in p.as_posix():
                  current[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if current != manifest:
              missing=sorted(set(manifest)-set(current))
              added=sorted(set(current)-set(manifest))
              changed=sorted(k for k in set(manifest)&set(current) if manifest[k]!=current[k])
              raise SystemExit(f'058b-r3 source manifest mismatch missing={missing[:10]} added={added[:10]} changed={changed[:10]}')
          print('exact verified 058b-r3 source manifest: PASS')
          PYBASE
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/058b-r3-source/ ./
          cp 058b-postpatch-source-manifest.json 059-baseline-source-manifest.json
          cat > 059-verification-report.txt <<'REPORT'
          ClosePaw RC11 059 verification report
          Baseline: exact verified 058b-r3 full-source artifact, manifest-pinned.
          Runtime defect evidence: repeated MANAGER_SCAN_ERROR on ChatGPT Search field grounding before manager ROUTE_TASK parsing.
          Scope: generic ChatGPT conversation locator + bounded project-router manager scan recovery only.
          SMT remains a runtime seed, not hard-coded routing logic.
          Package id remains ai.closepaw.rc11c058 for in-place settings/accessibility continuity.
          REPORT
          cat /tmp/058b-r3-artifact-meta.txt >> 059-verification-report.txt

      - name: Baseline 058b-r3 clean compile gate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --no-daemon --no-configuration-cache
          echo 'Baseline 058b-r3 clean compile: PASS' >> 059-verification-report.txt

