      - name: Verify exact 059 scope and source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSCOPE'
          from pathlib import Path
          import hashlib,json
          base=json.loads(Path('059-baseline-source-manifest.json').read_text())
          current={}
          for p in sorted(Path('app').rglob('*')):
              if p.is_file() and not p.as_posix().startswith('app/build/'):
                  current[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV59Test.kt',
          }
          changed={k for k in set(base)|set(current) if base.get(k)!=current.get(k)}
          if changed != allowed:
              raise SystemExit(f'059 isolation mismatch unexpected={sorted(changed-allowed)} missing={sorted(allowed-changed)}')
          Path('059-postpatch-source-manifest.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          sha=hashlib.sha256(Path('059-postpatch-source-manifest.json').read_bytes()).hexdigest()
          Path('059-postpatch-manifest-sha256.txt').write_text(sha+'  059-postpatch-source-manifest.json\n')
          print('059 scope + manifest: PASS',sha)
          with Path('059-verification-report.txt').open('a') as f:
              f.write(f'059 postpatch source manifest SHA-256: {sha}\n')
          PYSCOPE

      - name: Audit 059 generic locator and bounded recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import json
          base=json.loads(Path('059-baseline-source-manifest.json').read_text())
          post=json.loads(Path('059-postpatch-source-manifest.json').read_text())
          allowed={
              'app/build.gradle.kts',
              'app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt',
              'app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt',
              'app/src/main/res/values/strings.xml',
              'app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV59Test.kt',
          }
          frozen=[k for k,v in base.items() if k not in allowed and post.get(k)!=v]
          if frozen:
              raise SystemExit(f'059 frozen baseline files changed: {frozen[:20]}')

          adapter=Path('app/src/main/kotlin/ai/closepaw/app/ChatGptProjectAdapterV58.kt').read_text()
          orch=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorV58.kt').read_text()
          store=Path('app/src/main/kotlin/ai/closepaw/app/ProjectOrchestratorStoreV58.kt').read_text()
          build=Path('app/build.gradle.kts').read_text()
          strings=Path('app/src/main/res/values/strings.xml').read_text()
          test=Path('app/src/test/kotlin/ai/closepaw/app/ChatGptProjectAdapterV59Test.kt').read_text()

          checks={
              'generic topology remains data': 'Project topology is data' in orch and 'seedLegacySmt(db' in store,
              'no legacy SMT router source': not Path('app/src/main/kotlin/ai/closepaw/app/SmtRouter.kt').exists(),
              'canonical alias only': 'configuredConversationTitleMatchesV59' in adapter and 'actual.startsWith("$configured | ")' in adapter,
              'search SET_TEXT grounding': 'AccessibilityNodeInfo.ACTION_SET_TEXT' in adapter and 'collectSetTextCandidates' in adapter,
              'search single fallback gated': 'allowSingleSearchFallback' in adapter,
              'idempotent search surface': 'If Search is already open, do not click Search again' in adapter,
              'unique deterministic result': 'resultTargets.size != 1' in adapter,
              'composer post-click proof': 'requireUniqueComposer()' in adapter,
              'manager nav receipt': 'MANAGER_NAV_OK' in orch and 'navigationReceipt.compact()' in orch,
              'bounded consecutive failures': 'MAX_CONSECUTIVE_MANAGER_SCAN_FAILURES = 3' in orch and 'MANAGER_SCAN_FAIL_CLOSED' in orch,
              'fail closed disables router': 'store.setRouterEnabled(false)' in orch,
              'no action after fail-close scan': 'if (!store.isRouterEnabled()) return' in orch,
              'package continuity': 'applicationIdSuffix = ".rc11c058"' in build,
              'version 059': 'versionNameSuffix = "-rc11-c059"' in build,
              'label 059': 'ClosePaw RC11 059' in strings,
              'title matcher tests': 'configuredTitleNormalizesWhitespaceButRejectsFuzzyMatches' in test,
          }
          bad=[name for name,ok in checks.items() if not ok]
          if bad:
              raise SystemExit(f'059 invariant audit failed: {bad}')
          print('059 generic locator/bounded-recovery audit: PASS')
          PYAUDIT
          echo '059 generic locator/bounded-recovery audit: PASS' >> 059-verification-report.txt

